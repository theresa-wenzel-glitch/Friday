/* ==========================================================================
   JobFlow - Quellcode zum Durchblättern

   Die Identität stammt aus packages/config/src/theme.ts (Violett #5B4CF0,

:root {

  --panel: #FFFFFF;
  --panel-soft: #F5F6FC;
  --code-bg: #FBFBFE;
  --ink: #131A34;
  --ink-muted: #5A6284;
  --ink-faint: #8A91B0;
  --rule: #E1E4F0;
  --rule-soft: #EDEFF7;
  --accent: #5B4CF0;
  --accent-deep: #4438C7;
  --accent-soft: #EDEBFE;
  --shadow: 0 1px 2px rgba(19, 26, 52, .05), 0 8px 24px -18px rgba(19, 26, 52, .3);

  /* Syntax. Bewusst wenige Rollen - mehr Farben machen Code nicht lesbarer. */
  --tok-keyword: #7A3FD8;
  --tok-string: #17835A;
  --tok-number: #A85D14;
  --tok-comment: #858CAD;
  --tok-title: #2A4FC8;
  --tok-attr: #0F6F8C;
  --tok-meta: #8A91B0;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E1124;
    --panel: #161B33;
    --panel-soft: #1D2340;
    --code-bg: #11152A;
    --ink: #E6E9F7;
    --ink-muted: #98A0C0;
    --ink-faint: #737B9E;
    --rule: #272E52;
    --rule-soft: #1F2544;
    --accent: #A99BFF;
    --accent-deep: #C4BAFF;
    --accent-soft: #262C4E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -18px rgba(0, 0, 0, .8);

    --tok-keyword: #B79CFF;
    --tok-string: #5ED9A4;
    --tok-number: #F0A94C;
    --tok-comment: #6F779B;
    --tok-title: #79A6FF;
    --tok-attr: #6FD3E8;

  }
}

  --ground: #0E1124;
  --panel: #161B33;
  --panel-soft: #1D2340;
  --code-bg: #11152A;
  --ink: #E6E9F7;
  --ink-muted: #98A0C0;
  --ink-faint: #737B9E;

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}

/* --- Kopfzeile ------------------------------------------------------------ */

.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  padding: 14px 22px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 9px; margin-right: auto; }
.brand__dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  flex: none;
}
.brand__name {
  font-family: "Poppins", system-ui, sans-serif;
  font-weight: 600; font-size: 17px; letter-spacing: -.015em;
  color: var(--ink); margin: 0;
}
.brand__sub { font-size: 12.5px; color: var(--ink-faint); }

.stat {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px; color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}

.btn {
  appearance: none; font: inherit; font-size: 12.5px;
  border: 1px solid var(--rule); background: var(--panel-soft);
  color: var(--ink-muted); border-radius: 8px;
  padding: 7px 13px; cursor: pointer;
  transition: color .14s, border-color .14s, background .14s;
  text-decoration: none; display: inline-block;
}
.btn:hover { color: var(--ink); border-color: var(--ink-faint); }
.btn--accent { color: var(--accent-deep); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }

/* --- Grundraster ---------------------------------------------------------- */

.layout {
  display: grid;
  grid-template-columns: 306px minmax(0, 1fr);
  align-items: start;
  gap: 0;
}

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tree { position: static; max-height: 46vh; border-right: none; border-bottom: 1px solid var(--rule); }
}

/* --- Dateibaum ------------------------------------------------------------ */

.tree {
  position: sticky; top: 57px;
  height: calc(100vh - 57px);
  overflow-y: auto;
  background: var(--panel);
  border-right: 1px solid var(--rule);
  padding: 16px 12px 40px;
  scrollbar-width: thin;
}

.filter {
  width: 100%;
  font: inherit; font-size: 13px;
  background: var(--panel-soft);
  border: 1px solid var(--rule);
  color: var(--ink);
  border-radius: 9px;
  padding: 9px 12px;
  margin-bottom: 6px;
}
.filter::placeholder { color: var(--ink-faint); }

.group { margin-top: 18px; }
.group:first-of-type { margin-top: 10px; }

.group__head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 0 8px 3px;
}
.group__name {
  font-family: "Poppins", system-ui, sans-serif;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .085em;
  color: var(--ink-muted);
}
.group__count {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px; color: var(--ink-faint);
  margin-left: auto; font-variant-numeric: tabular-nums;
}
.group__hint {
  font-size: 11.5px; color: var(--ink-faint);
  padding: 0 8px 7px; line-height: 1.45;
  text-wrap: pretty;
}

.file {
  display: block; width: 100%; text-align: left;
  border: none; background: none; cursor: pointer;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px; color: var(--ink-muted);
  padding: 5px 8px; border-radius: 7px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .12s, color .12s;
}
.file:hover { background: var(--panel-soft); color: var(--ink); }
.file.is-active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 500; }
.file__dir { color: var(--ink-faint); }
.file.is-active .file__dir { color: color-mix(in srgb, var(--accent-deep) 65%, transparent); }

.tree__empty { padding: 20px 8px; font-size: 12.5px; color: var(--ink-faint); }

/* --- Codebereich ---------------------------------------------------------- */

.pane { min-width: 0; }

.filehead {
  position: sticky; top: 57px; z-index: 10;
  background: var(--ground);
  border-bottom: 1px solid var(--rule);
  padding: 13px 22px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.filehead__path {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 13px; color: var(--ink); font-weight: 500;
  overflow-wrap: anywhere;
}
.filehead__path .file__dir { color: var(--ink-faint); font-weight: 400; }
.filehead__meta {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11.5px; color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  margin-left: auto; white-space: nowrap;
}

.codewrap {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  background: var(--code-bg);
  border-bottom: 1px solid var(--rule);
}

.gutter {
  padding: 18px 0 40px;
  background: var(--panel-soft);
  border-right: 1px solid var(--rule-soft);
  user-select: none;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12.5px; line-height: 1.65;
  color: var(--ink-faint);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.gutter span { display: block; padding: 0 12px 0 16px; }

.codescroll { overflow-x: auto; scrollbar-width: thin; }

pre.code {
  margin: 0; padding: 18px 22px 40px;
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12.5px; line-height: 1.65;
  color: var(--ink);
  white-space: pre;
  tab-size: 2;
}

/* Syntax. Bewusst wenige Rollen - mehr Farben machen Code nicht lesbarer. */
.t-key  { color: var(--tok-keyword); }
.t-str  { color: var(--tok-string); }
.t-num  { color: var(--tok-number); }
.t-com  { color: var(--tok-comment); font-style: italic; }
.t-fn   { color: var(--tok-title); }
.t-typ  { color: var(--tok-title); }
.t-attr { color: var(--tok-attr); }
.t-meta { color: var(--tok-meta); }
.t-strong { font-weight: 700; color: var(--ink); }
.t-em   { font-style: italic; }
.t-link { color: var(--accent); }

.notice {
  margin: 0; padding: 10px 22px;
  background: var(--panel-soft);
  border-bottom: 1px solid var(--rule-soft);
  font-size: 12px; color: var(--ink-faint);
}

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 40;
  background: var(--ink); color: var(--ground);
  padding: 10px 18px; border-radius: 10px;
  font-size: 13px; box-shadow: var(--shadow);
}

<script id="quellcode" type="application/json">[{"pfad": "README.md", "bereich": "Projekt", "sprache": "markdown", "zeilen": 165, "bytes": 6312, "inhalt": "# JobFlow\n\n> **Von der Anfrage zum Auftrag.**\n\nDer Kunde beschreibt sein Problem in einem Satz. Die KI versteht es, fragt nur\ndas Nötige nach und macht daraus eine strukturierte Anfrage. JobFlow findet\npassende Anbieter, der Kunde vergleicht Angebote, wählt einen Termin — fertig.\n\n```\nAnfrage → KI → Rückfragen → Matching → Angebot → Termin → Auftrag → Bewertung\n```\n\nDieser komplette Weg funktioniert und ist als End-to-End-Test abgesichert\n(`services/api/test/flow.test.ts`).\n\n## Erst einmal ansehen\n\nOhne Installation: [`docs/vorschau/jobflow-vorschau.html`](docs/vorschau/jobflow-vorschau.html)\nim Browser öffnen. Eine einzelne Datei, die den gesamten Ablauf klickbar macht —\nKundenseite und Unternehmensseite, vom Willkommensbildschirm bis zur Bewertung.\n\nDie Regel-KI und die Matching-Berechnung darin sind aus dem Backend übernommen:\nbeschreib ein anderes Problem, und beides rechnet neu. Die Steuerleiste zeigt zu\njeder Aktion den API-Aufruf, den die echte App absetzen würde.\n\n## Schnellstart\n\nVoraussetzungen: **Node ≥ 22.6**, **pnpm**, **PostgreSQL ≥ 14**.\n\n```bash\ncd jobflow\npnpm install\npnpm build                      # die geteilten Pakete bauen (dist/)\n\ncp .env.example .env            # DATABASE_URL und SESSION_SECRET anpassen\ncreatedb jobflow\npnpm db:migrate\npnpm db:seed                    # 6 Ober- und 22 Unterkategorien\n\npnpm api:dev                    # API auf http://localhost:4000\npnpm mobile:start               # Expo in einem zweiten Terminal\n```\n\nEin sicheres `SESSION_SECRET` erzeugen:\n\n```bash\nnode -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\"\n```\n\nDie API startet nicht, wenn das Geheimnis fehlt oder zu kurz ist. Ein Backend,\ndas mit einem Standardgeheimnis hochfährt, ist gefährlicher als eines, das\nsich weigert.\n\n### Ausprobieren ohne App\n\n```bash\nTOKEN=$(curl -s -X POST localhost:4000/auth/register \\\n  -H 'content-type: application/json' \\\n  -d '{\"email\":\"max@example.de\",\"name\":\"Max Mustermann\",\"password\":\"ein-langes-passwort\"}' \\\n  | python3 -c \"import sys,json; print(json.load(sys.stdin)['data']['token'])\")\n\nREQ=$(curl -s -X POST localhost:4000/requests \\\n  -H \"authorization: Bearer $TOKEN\" -H 'content-type: application/json' \\\n  -d '{\"description\":\"Meine Heizung wird nicht mehr richtig warm.\",\"locationLabel\":\"45127 Essen\"}' \\\n  | python3 -c \"import sys,json; print(json.load(sys.stdin)['data']['id'])\")\n\ncurl -s -X POST \"localhost:4000/requests/$REQ/analyze\" \\\n  -H \"authorization: Bearer $TOKEN\" | python3 -m json.tool\n```\n\nDie Analyse erkennt die Kategorie „Heizung\" und stellt zwei bis drei gezielte\nRückfragen — ohne dass ein externer KI-Dienst konfiguriert sein muss.\n\n## Aufbau\n\n```\njobflow/\n├── apps/\n│   ├── mobile/        React Native + Expo Router   ← gebaut\n│   ├── web/           Next.js, Unternehmen         ← Phase 5\n│   └── admin/         Administration               ← Phase 5\n├── services/\n│   └── api/           Node + TypeScript            ← gebaut\n├── packages/\n│   ├── types/         gemeinsame Domänentypen\n│   ├── validation/    gemeinsame Validierung, ohne Abhängigkeiten\n│   ├── config/        Design-Tokens\n│   └── ui/            geteilte Komponenten         ← sobald es zwei Oberflächen gibt\n├── database/          Migrationen und Seeds\n└── docs/\n    ├── product/       Konzept und Entwicklungsplan\n    ├── architecture/  Aufbau und die Entscheidungen dahinter\n    └── api/           alle Endpunkte\n```\n\nDie nicht gebauten Teile haben eine README, die erklärt, warum — und was\nbereits für sie vorbereitet ist.\n\n## Die Entscheidungen, auf die es ankommt\n\n**Die KI schreibt nie in die Datenbank.** Ihr Ergebnis wird gegen dasselbe\nSchema geprüft wie eine Eingabe aus der App; eine erfundene Kategorie wird\nverworfen. Der Provider steckt hinter einer Schnittstelle — mitgeliefert ist\nein regelbasierter, der denselben Vertrag erfüllt. So lässt sich die ganze\nPlattform ohne externen Dienst entwickeln, und der Wechsel auf ein\nSprachmodell ist eine Zeile in der Konfiguration.\n\n**Die KI entscheidet nichts Verbindliches.** Sie schlägt einen Angebotstext\nvor — über Preis und Inhalt entscheidet das Unternehmen. KI-Inhalte sind in\nder Oberfläche als solche gekennzeichnet.\n\n**Berechtigungen prüft ausschließlich der Server.** Fremde Objekte antworten\nmit 404 statt 403: ein 403 würde bestätigen, dass es das Objekt gibt.\n\n**Wichtige Regeln stehen im Schema.** Die Angebotssumme ist eine generierte\nSpalte, „höchstens ein angenommenes Angebot je Anfrage\" ein Teilindex, und\nohne abgeschlossenen Auftrag gibt es keine Bewertung. Anwendungslogik hat\nFehler; eine Datenbankzusicherung nicht.\n\n**Kategorien sind Daten.** Eine neue Branche ist eine Zeile in `categories`,\nkein Umbau.\n\nAusführlich: [`docs/architecture/übersicht.md`](docs/architecture/übersicht.md)\n\n## Tests\n\n```bash\npnpm test\n```\n\n104 Tests. 82 laufen überall; 22 brauchen eine PostgreSQL-Datenbank und\nüberspringen sich sonst, statt fehlzuschlagen:\n\n```bash\ncreatedb jobflow_test\nTEST_DATABASE_URL=postgres://localhost/jobflow_test pnpm test\n```\n\nDie Integrationstests laufen gegen eine **echte** Datenbank. Ein Nachbau wäre\nhier wertlos: die interessanten Zusicherungen stecken im Schema selbst, und\nohne Datenbank wäre keine davon getestet. Jeder Lauf baut das Schema neu auf —\ndeshalb laufen die Testdateien nacheinander.\n\n```bash\npnpm typecheck    # alle sechs Pakete, inklusive Tests und Mobile-App\n```\n\n## Umgebungsvariablen\n\nSiehe [`.env.example`](.env.example). Die wichtigsten:\n\n| Variable | Zweck |\n|---|---|\n| `DATABASE_URL` | PostgreSQL-Verbindung |\n| `SESSION_SECRET` | Signiert die Session-Token, mindestens 32 Zeichen |\n| `AI_PROVIDER` | `rules` (eingebaut) oder `remote` (externer Dienst) |\n| `CORS_ORIGINS` | Erlaubte Web-Oberflächen, kommagetrennt |\n\n## Weiterlesen\n\n- [Produktkonzept](docs/product/konzept.md) — die Idee, das Geschäftsmodell, die Kennzahlen\n- [Entwicklungsplan](docs/product/entwicklungsplan.md) — was fertig ist, was fehlt, was als Nächstes sinnvoll ist\n- [Architektur](docs/architecture/übersicht.md) — der Aufbau und die Begründungen\n- [API](docs/api/endpunkte.md) — alle Endpunkte, Fehlercodes, Rate Limits\n"}, {"pfad": ".env.example", "bereich": "Projekt", "sprache": "bash", "zeilen": 37, "bytes": 1487, "inhalt": "# JobFlow - Beispielkonfiguration.\n# Kopiere diese Datei nach .env und passe die Werte an.\n# .env gehoert NICHT ins Repository.\n\n# --- Datenbank -------------------------------------------------------------\n# Verbindungszeichenfolge fuer PostgreSQL.\nDATABASE_URL=postgres://postgres@127.0.0.1:5432/jobflow\n\n# --- API -------------------------------------------------------------------\n# Port, auf dem die API lauscht.\nPORT=4000\n\n# Geheimnis zum Signieren der Session-Token.\n# Erzeugen mit:  node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\"\n# Muss mindestens 32 Zeichen lang sein, sonst startet die API nicht.\nSESSION_SECRET=bitte-aendern-mindestens-32-zeichen-lang\n\n# Lebensdauer einer Session in Sekunden (Standard: 30 Tage).\nSESSION_TTL_SECONDS=2592000\n\n# Erlaubte Origins fuer CORS, kommagetrennt. Leer = keine Browser-Clients.\nCORS_ORIGINS=http://localhost:3000,http://localhost:19006\n\n# --- KI --------------------------------------------------------------------\n# Welcher AI-Provider die Anfragen analysiert.\n#   rules  = eingebauter, deterministischer Provider ohne externen Dienst\n#   remote = externer Dienst (AI_BASE_URL + AI_API_KEY erforderlich)\nAI_PROVIDER=rules\n# AI_BASE_URL=https://ai.example/v1\n# AI_API_KEY=\n# AI_TIMEOUT_MS=15000\n\n# --- Uploads ---------------------------------------------------------------\n# Ablage fuer Fotos einer Anfrage. Fuer die Produktion durch Object Storage ersetzen.\nUPLOAD_DIR=./var/uploads\nUPLOAD_MAX_BYTES=8388608\n"}, {"pfad": ".gitignore", "bereich": "Projekt", "sprache": "bash", "zeilen": 15, "bytes": 121, "inhalt": "node_modules/\ndist/\nbuild/\n.expo/\n.tsbuildinfo\n*.tsbuildinfo\n\n# Laufzeitdaten\nvar/\nuploads/\n\n.env\n.env.local\n.env*.local\n"}, {"pfad": "package.json", "bereich": "Projekt", "sprache": "json", "zeilen": 24, "bytes": 743, "inhalt": "{\n  \"name\": \"jobflow\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"description\": \"JobFlow - von der Anfrage zum Auftrag. Marktplatz und KI-Assistent für Dienstleistungen.\",\n  \"engines\": {\n    \"node\": \">=22.6.0\"\n  },\n  \"packageManager\": \"pnpm@9.12.0\",\n  \"scripts\": {\n    \"build\": \"pnpm -r --if-present build\",\n    \"typecheck\": \"pnpm -r --if-present typecheck\",\n    \"test\": \"pnpm -r --if-present test\",\n    \"db:migrate\": \"pnpm --filter @jobflow/database migrate\",\n    \"db:seed\": \"pnpm --filter @jobflow/database seed\",\n    \"db:reset\": \"pnpm --filter @jobflow/database reset\",\n    \"api:dev\": \"pnpm --filter @jobflow/api dev\",\n    \"mobile:start\": \"pnpm --filter @jobflow/mobile start\"\n  },\n  \"devDependencies\": {\n    \"typescript\": \"^5.9.3\"\n  }\n}\n"}, {"pfad": "pnpm-workspace.yaml", "bereich": "Projekt", "sprache": "yaml", "zeilen": 6, "bytes": 72, "inhalt": "packages:\n  - \"apps/*\"\n  - \"services/*\"\n  - \"packages/*\"\n  - \"database\"\n"}, {"pfad": "tsconfig.base.json", "bereich": "Projekt", "sprache": "json", "zeilen": 22, "bytes": 535, "inhalt": "{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"lib\": [\"ES2022\"],\n    \"module\": \"NodeNext\",\n    \"moduleResolution\": \"NodeNext\",\n    \"strict\": true,\n    \"noUncheckedIndexedAccess\": true,\n    \"noImplicitOverride\": true,\n    \"exactOptionalPropertyTypes\": false,\n    \"verbatimModuleSyntax\": false,\n    \"esModuleInterop\": true,\n    \"forceConsistentCasingInFileNames\": true,\n    \"skipLibCheck\": true,\n    \"declaration\": true,\n    \"declarationMap\": true,\n    \"sourceMap\": true,\n    \"composite\": false,\n    \"isolatedModules\": true\n  }\n}\n"}, {"pfad": "database/migrations/0001_foundation.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 51, "bytes": 2097, "inhalt": "-- 0001 Fundament: Hilfsfunktionen und Benutzer.\n--\n-- gen_random_uuid() ist seit PostgreSQL 13 im Kern enthalten, daher braucht\n-- JobFlow keine zusätzliche Extension.\n\n-- Hält updated_at aktuell, ohne dass jede Abfrage daran denken muss.\nCREATE OR REPLACE FUNCTION jobflow_touch_updated_at() RETURNS trigger AS $$\nBEGIN\n  NEW.updated_at = now();\n  RETURN NEW;\nEND;\n$$ LANGUAGE plpgsql;\n\nCREATE TABLE users (\n  id            uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  -- E-Mail-Adressen werden immer klein geschrieben gespeichert; der\n  -- UNIQUE-Index arbeitet deshalb direkt auf der Spalte.\n  email         text NOT NULL UNIQUE,\n  name          text NOT NULL,\n  -- scrypt-Hash inklusive Salt und Parametern. Nie das Klartextpasswort.\n  password_hash text NOT NULL,\n  role          text NOT NULL CHECK (role IN ('CUSTOMER', 'BUSINESS', 'BUSINESS_EMPLOYEE', 'ADMIN')),\n  phone         text,\n  -- Gesetzt, sobald ein Konto gesperrt wurde. Gesperrte Konten können sich\n  -- nicht anmelden und bestehende Sessions werden verworfen.\n  blocked_at    timestamptz,\n  created_at    timestamptz NOT NULL DEFAULT now(),\n  updated_at    timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT users_email_not_empty CHECK (length(email) > 0),\n  CONSTRAINT users_name_not_empty CHECK (length(name) > 0)\n);\n\nCREATE TRIGGER users_touch_updated_at\n  BEFORE UPDATE ON users\n  FOR EACH ROW EXECUTE FUNCTION jobflow_touch_updated_at();\n\n-- Sessions liegen in der Datenbank, damit eine Abmeldung sofort wirkt und\n-- gesperrte Konten wirklich ausgesperrt sind. Ein reines JWT könnte das nicht.\nCREATE TABLE sessions (\n  id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id    uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  -- SHA-256 des Tokens. Wer die Datenbank liest, kann sich damit nicht anmelden.\n  token_hash text NOT NULL UNIQUE,\n  expires_at timestamptz NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  last_seen_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX sessions_user_id_idx ON sessions (user_id);\nCREATE INDEX sessions_expires_at_idx ON sessions (expires_at);\n"}, {"pfad": "database/migrations/0002_categories.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 22, "bytes": 905, "inhalt": "-- 0002 Kategorien.\n--\n-- Kategorien sind Daten, keine fest einprogrammierte Handwerkerliste. Neue\n-- Branchen (Auto, Haushalt, Garten, Freelancer ...) kommen über Zeilen in\n-- dieser Tabelle dazu, nicht über ein Deployment.\n\nCREATE TABLE categories (\n  id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  slug       text NOT NULL UNIQUE CHECK (slug ~ '^[a-z0-9-]+$'),\n  name       text NOT NULL,\n  icon       text,\n  parent_id  uuid REFERENCES categories(id) ON DELETE RESTRICT,\n  position   integer NOT NULL DEFAULT 0,\n  active     boolean NOT NULL DEFAULT true,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  -- Zwei Ebenen reichen für den Start (Handwerk > Sanitär). Tiefer wird die\n  -- Auswahl in der App unübersichtlich.\n  CONSTRAINT categories_no_self_parent CHECK (parent_id IS NULL OR parent_id <> id)\n);\n\nCREATE INDEX categories_parent_id_idx ON categories (parent_id, position);\n"}, {"pfad": "database/migrations/0003_businesses.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 80, "bytes": 4184, "inhalt": "-- 0003 Unternehmen, Leistungen, Mitarbeiter und Verfügbarkeit.\n\nCREATE TABLE businesses (\n  id                   uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  owner_id             uuid NOT NULL UNIQUE REFERENCES users(id) ON DELETE CASCADE,\n  name                 text NOT NULL CHECK (length(name) > 0),\n  description          text,\n  verified             boolean NOT NULL DEFAULT false,\n  verified_at          timestamptz,\n  -- Aggregat aus reviews. Wird beim Anlegen einer Bewertung fortgeschrieben,\n  -- damit das Matching nicht bei jeder Anfrage alle Bewertungen lesen muss.\n  rating               numeric(3, 2) CHECK (rating IS NULL OR (rating >= 1 AND rating <= 5)),\n  review_count         integer NOT NULL DEFAULT 0 CHECK (review_count >= 0),\n  latitude             double precision CHECK (latitude BETWEEN -90 AND 90),\n  longitude            double precision CHECK (longitude BETWEEN -180 AND 180),\n  service_radius_km    integer NOT NULL DEFAULT 30 CHECK (service_radius_km BETWEEN 1 AND 300),\n  avg_response_minutes integer CHECK (avg_response_minutes IS NULL OR avg_response_minutes >= 0),\n  completed_job_count  integer NOT NULL DEFAULT 0 CHECK (completed_job_count >= 0),\n  created_at           timestamptz NOT NULL DEFAULT now(),\n  updated_at           timestamptz NOT NULL DEFAULT now(),\n  -- Eine halbe Koordinate ist wertlos.\n  CONSTRAINT businesses_coordinates_complete\n    CHECK ((latitude IS NULL) = (longitude IS NULL)),\n  CONSTRAINT businesses_verified_at_consistent\n    CHECK ((verified = false AND verified_at IS NULL) OR (verified = true AND verified_at IS NOT NULL))\n);\n\nCREATE TRIGGER businesses_touch_updated_at\n  BEFORE UPDATE ON businesses\n  FOR EACH ROW EXECUTE FUNCTION jobflow_touch_updated_at();\n\n-- Grobfilter für das Matching: erst über das Rechteck vorselektieren,\n-- danach die genaue Entfernung berechnen.\nCREATE INDEX businesses_location_idx ON businesses (latitude, longitude)\n  WHERE latitude IS NOT NULL;\n\nCREATE TABLE business_services (\n  id               uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  business_id      uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  category_id      uuid NOT NULL REFERENCES categories(id) ON DELETE RESTRICT,\n  name             text NOT NULL CHECK (length(name) > 0),\n  description      text,\n  -- Preise in Cent. Geld gehört nie in eine Gleitkommazahl.\n  price_min_cents  integer CHECK (price_min_cents IS NULL OR price_min_cents >= 0),\n  price_max_cents  integer CHECK (price_max_cents IS NULL OR price_max_cents >= 0),\n  active           boolean NOT NULL DEFAULT true,\n  created_at       timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT business_services_price_range\n    CHECK (price_min_cents IS NULL OR price_max_cents IS NULL OR price_min_cents <= price_max_cents),\n  -- Ein Unternehmen bietet eine Kategorie genau einmal an.\n  CONSTRAINT business_services_unique_category UNIQUE (business_id, category_id)\n);\n\nCREATE INDEX business_services_category_idx ON business_services (category_id) WHERE active;\n\nCREATE TABLE business_members (\n  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  business_id uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  user_id     uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  role        text NOT NULL CHECK (role IN ('OWNER', 'MEMBER')),\n  created_at  timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT business_members_unique UNIQUE (business_id, user_id)\n);\n\nCREATE INDEX business_members_user_idx ON business_members (user_id);\n\n-- Wöchentlich wiederkehrende Verfügbarkeit. Der Kunde bekommt später nur\n-- Zeitfenster angeboten, die hier hinterlegt sind.\nCREATE TABLE business_availability (\n  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  business_id uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  weekday     smallint NOT NULL CHECK (weekday BETWEEN 0 AND 6),\n  start_time  time NOT NULL,\n  end_time    time NOT NULL,\n  CONSTRAINT business_availability_order CHECK (start_time < end_time),\n  CONSTRAINT business_availability_unique UNIQUE (business_id, weekday, start_time, end_time)\n);\n\nCREATE INDEX business_availability_business_idx ON business_availability (business_id, weekday);\n"}, {"pfad": "database/migrations/0004_requests.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 47, "bytes": 2443, "inhalt": "-- 0004 Anfragen und ihre Fotos.\n\nCREATE TABLE requests (\n  id             uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  customer_id    uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  -- Anfangs null: die KI schlägt die Kategorie erst nach der Analyse vor.\n  category_id    uuid REFERENCES categories(id) ON DELETE SET NULL,\n  title          text,\n  description    text NOT NULL CHECK (length(description) >= 10),\n  urgency        text NOT NULL DEFAULT 'NORMAL' CHECK (urgency IN ('LOW', 'NORMAL', 'HIGH')),\n  latitude       double precision CHECK (latitude BETWEEN -90 AND 90),\n  longitude      double precision CHECK (longitude BETWEEN -180 AND 180),\n  -- Grobe Ortsangabe für die Anzeige (\"45127 Essen\"). Die genaue Adresse\n  -- braucht erst das Unternehmen, das den Auftrag bekommt.\n  location_label text,\n  desired_from   timestamptz,\n  desired_to     timestamptz,\n  status         text NOT NULL DEFAULT 'DRAFT'\n    CHECK (status IN ('DRAFT', 'ANALYZING', 'OPEN', 'MATCHING', 'OFFERED', 'ACCEPTED', 'COMPLETED', 'CANCELLED')),\n  created_at     timestamptz NOT NULL DEFAULT now(),\n  updated_at     timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT requests_coordinates_complete CHECK ((latitude IS NULL) = (longitude IS NULL)),\n  CONSTRAINT requests_desired_range CHECK (desired_from IS NULL OR desired_to IS NULL OR desired_from <= desired_to)\n);\n\nCREATE TRIGGER requests_touch_updated_at\n  BEFORE UPDATE ON requests\n  FOR EACH ROW EXECUTE FUNCTION jobflow_touch_updated_at();\n\n-- \"Meine Anfragen\" ist der häufigste Zugriff der Kunden-App.\nCREATE INDEX requests_customer_idx ON requests (customer_id, created_at DESC);\nCREATE INDEX requests_status_idx ON requests (status, created_at DESC);\nCREATE INDEX requests_category_idx ON requests (category_id) WHERE category_id IS NOT NULL;\n\nCREATE TABLE request_photos (\n  id           uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  request_id   uuid NOT NULL REFERENCES requests(id) ON DELETE CASCADE,\n  -- Schluessel im Object Storage, nie eine öffentliche URL. Der Zugriff laeuft\n  -- immer über die API, die vorher die Berechtigung prüft.\n  storage_key  text NOT NULL UNIQUE,\n  content_type text NOT NULL CHECK (content_type IN ('image/jpeg', 'image/png', 'image/webp', 'image/heic')),\n  byte_size    integer NOT NULL CHECK (byte_size > 0),\n  created_at   timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX request_photos_request_idx ON request_photos (request_id, created_at);\n"}, {"pfad": "database/migrations/0005_ai.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 36, "bytes": 1663, "inhalt": "-- 0005 KI-Analysen und Rückfragen.\n--\n-- Die KI schreibt nie direkt in die Datenbank. Ihr Ergebnis geht durch die\n-- Validierung im Backend und landet erst danach hier.\n\nCREATE TABLE ai_analyses (\n  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  request_id  uuid NOT NULL REFERENCES requests(id) ON DELETE CASCADE,\n  category_id uuid REFERENCES categories(id) ON DELETE SET NULL,\n  summary     text NOT NULL CHECK (length(summary) > 0),\n  urgency     text NOT NULL CHECK (urgency IN ('LOW', 'NORMAL', 'HIGH')),\n  confidence  numeric(4, 3) NOT NULL CHECK (confidence >= 0 AND confidence <= 1),\n  -- Welcher Provider das Ergebnis erzeugt hat, z. B. \"rules@1\". Damit lässt\n  -- sich später nachvollziehen, welches Modell welche Qualität geliefert hat.\n  provider    text NOT NULL,\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\n\n-- Eine Anfrage kann mehrfach analysiert werden (z. B. nach Rückfragen);\n-- die jüngste Analyse zählt.\nCREATE INDEX ai_analyses_request_idx ON ai_analyses (request_id, created_at DESC);\n\nCREATE TABLE ai_questions (\n  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  analysis_id uuid NOT NULL REFERENCES ai_analyses(id) ON DELETE CASCADE,\n  position    integer NOT NULL CHECK (position >= 0),\n  question    text NOT NULL CHECK (length(question) > 0),\n  answer      text,\n  answered_at timestamptz,\n  CONSTRAINT ai_questions_unique_position UNIQUE (analysis_id, position),\n  CONSTRAINT ai_questions_answer_consistent\n    CHECK ((answer IS NULL AND answered_at IS NULL) OR (answer IS NOT NULL AND answered_at IS NOT NULL))\n);\n\nCREATE INDEX ai_questions_analysis_idx ON ai_questions (analysis_id, position);\n"}, {"pfad": "database/migrations/0006_matching.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 47, "bytes": 1927, "inhalt": "-- 0006 Matching.\n\n-- Entfernung zwischen zwei Koordinaten in Kilometern (Haversine).\n-- Bewusst als eigene Funktion statt als Extension: JobFlow soll auf jeder\n-- normalen PostgreSQL-Installation laufen, auch ohne PostGIS oder earthdistance.\nCREATE OR REPLACE FUNCTION jobflow_distance_km(\n  lat1 double precision,\n  lon1 double precision,\n  lat2 double precision,\n  lon2 double precision\n) RETURNS double precision AS $$\nDECLARE\n  earth_radius_km constant double precision := 6371.0088;\n  d_lat double precision;\n  d_lon double precision;\n  a double precision;\nBEGIN\n  IF lat1 IS NULL OR lon1 IS NULL OR lat2 IS NULL OR lon2 IS NULL THEN\n    RETURN NULL;\n  END IF;\n  d_lat := radians(lat2 - lat1);\n  d_lon := radians(lon2 - lon1);\n  a := sin(d_lat / 2) ^ 2\n     + cos(radians(lat1)) * cos(radians(lat2)) * sin(d_lon / 2) ^ 2;\n  RETURN earth_radius_km * 2 * asin(least(1, sqrt(a)));\nEND;\n$$ LANGUAGE plpgsql IMMUTABLE;\n\nCREATE TABLE matches (\n  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  request_id  uuid NOT NULL REFERENCES requests(id) ON DELETE CASCADE,\n  business_id uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  score       integer NOT NULL CHECK (score BETWEEN 0 AND 100),\n  -- Warum dieses Unternehmen vorgeschlagen wird. Als JSON, weil sich die\n  -- Faktoren mit den Gewichten weiterentwickeln werden.\n  reasons     jsonb NOT NULL DEFAULT '[]'::jsonb,\n  distance_km double precision CHECK (distance_km IS NULL OR distance_km >= 0),\n  status      text NOT NULL DEFAULT 'PENDING'\n    CHECK (status IN ('PENDING', 'NOTIFIED', 'ACCEPTED', 'DECLINED', 'EXPIRED')),\n  created_at  timestamptz NOT NULL DEFAULT now(),\n  -- Ein Unternehmen wird pro Anfrage genau einmal vorgeschlagen.\n  CONSTRAINT matches_unique UNIQUE (request_id, business_id)\n);\n\nCREATE INDEX matches_request_idx ON matches (request_id, score DESC);\nCREATE INDEX matches_business_idx ON matches (business_id, created_at DESC);\n"}, {"pfad": "database/migrations/0007_offers_appointments_jobs.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 88, "bytes": 4281, "inhalt": "-- 0007 Angebote, Termine, Aufträge.\n\nCREATE TABLE offers (\n  id                      uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  request_id              uuid NOT NULL REFERENCES requests(id) ON DELETE CASCADE,\n  business_id             uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  -- Alle Beträge in Cent.\n  labor_cents             integer NOT NULL CHECK (labor_cents >= 0),\n  material_cents          integer NOT NULL DEFAULT 0 CHECK (material_cents >= 0),\n  travel_cents            integer NOT NULL DEFAULT 0 CHECK (travel_cents >= 0),\n  -- Immer die Summe der drei Positionen. Als generierte Spalte, damit die\n  -- Summe gar nicht erst von der Anwendung abweichen kann.\n  total_cents             integer GENERATED ALWAYS AS (labor_cents + material_cents + travel_cents) STORED,\n  description             text NOT NULL CHECK (length(description) > 0),\n  -- Kennzeichnet, ob der Text aus einem KI-Vorschlag stammt. Über Preis und\n  -- Inhalt entscheidet immer das Unternehmen, nie die KI.\n  description_ai_assisted boolean NOT NULL DEFAULT false,\n  valid_until             timestamptz NOT NULL,\n  status                  text NOT NULL DEFAULT 'PENDING'\n    CHECK (status IN ('PENDING', 'ACCEPTED', 'DECLINED', 'WITHDRAWN', 'EXPIRED')),\n  created_at              timestamptz NOT NULL DEFAULT now(),\n  updated_at              timestamptz NOT NULL DEFAULT now(),\n  -- Ein Unternehmen gibt pro Anfrage ein Angebot ab.\n  CONSTRAINT offers_unique UNIQUE (request_id, business_id)\n);\n\nCREATE TRIGGER offers_touch_updated_at\n  BEFORE UPDATE ON offers\n  FOR EACH ROW EXECUTE FUNCTION jobflow_touch_updated_at();\n\nCREATE INDEX offers_request_idx ON offers (request_id, created_at DESC);\nCREATE INDEX offers_business_idx ON offers (business_id, created_at DESC);\n\n-- Pro Anfrage darf höchstens ein Angebot angenommen sein. Der Teilindex\n-- erzwingt das in der Datenbank statt nur in der Anwendungslogik.\nCREATE UNIQUE INDEX offers_one_accepted_per_request\n  ON offers (request_id) WHERE status = 'ACCEPTED';\n\nCREATE TABLE appointments (\n  id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  offer_id   uuid NOT NULL REFERENCES offers(id) ON DELETE CASCADE,\n  start_time timestamptz NOT NULL,\n  end_time   timestamptz NOT NULL,\n  status     text NOT NULL DEFAULT 'PROPOSED'\n    CHECK (status IN ('PROPOSED', 'CONFIRMED', 'CANCELLED', 'COMPLETED')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT appointments_order CHECK (start_time < end_time)\n);\n\nCREATE TRIGGER appointments_touch_updated_at\n  BEFORE UPDATE ON appointments\n  FOR EACH ROW EXECUTE FUNCTION jobflow_touch_updated_at();\n\nCREATE INDEX appointments_offer_idx ON appointments (offer_id);\nCREATE INDEX appointments_start_idx ON appointments (start_time);\n\n-- Ein aktiver Termin pro Angebot; abgesagte bleiben zur Nachvollziehbarkeit stehen.\nCREATE UNIQUE INDEX appointments_one_active_per_offer\n  ON appointments (offer_id) WHERE status IN ('PROPOSED', 'CONFIRMED');\n\nCREATE TABLE jobs (\n  id           uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  offer_id     uuid NOT NULL UNIQUE REFERENCES offers(id) ON DELETE CASCADE,\n  -- request_id, business_id und customer_id wären über offer herleitbar.\n  -- Sie stehen hier trotzdem, weil praktisch jede Abfrage auf Aufträge nach\n  -- genau diesen drei Feldern filtert.\n  request_id   uuid NOT NULL REFERENCES requests(id) ON DELETE CASCADE,\n  business_id  uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  customer_id  uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  status       text NOT NULL DEFAULT 'SCHEDULED'\n    CHECK (status IN ('SCHEDULED', 'IN_PROGRESS', 'COMPLETED', 'CANCELLED')),\n  started_at   timestamptz,\n  completed_at timestamptz,\n  created_at   timestamptz NOT NULL DEFAULT now(),\n  updated_at   timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT jobs_completed_consistent\n    CHECK (status <> 'COMPLETED' OR completed_at IS NOT NULL)\n);\n\nCREATE TRIGGER jobs_touch_updated_at\n  BEFORE UPDATE ON jobs\n  FOR EACH ROW EXECUTE FUNCTION jobflow_touch_updated_at();\n\nCREATE INDEX jobs_customer_idx ON jobs (customer_id, created_at DESC);\nCREATE INDEX jobs_business_idx ON jobs (business_id, created_at DESC);\nCREATE INDEX jobs_request_idx ON jobs (request_id);\n"}, {"pfad": "database/migrations/0008_messaging.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 31, "bytes": 1469, "inhalt": "-- 0008 Chat.\n--\n-- Jede Kombination aus Anfrage und Unternehmen bekommt genau eine Konversation.\n-- So bleibt der Verlauf am Auftrag hängen und nicht an zwei Personen.\n\nCREATE TABLE conversations (\n  id              uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  request_id      uuid NOT NULL REFERENCES requests(id) ON DELETE CASCADE,\n  business_id     uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  customer_id     uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  last_message_at timestamptz,\n  created_at      timestamptz NOT NULL DEFAULT now(),\n  CONSTRAINT conversations_unique UNIQUE (request_id, business_id)\n);\n\nCREATE INDEX conversations_customer_idx ON conversations (customer_id, last_message_at DESC NULLS LAST);\nCREATE INDEX conversations_business_idx ON conversations (business_id, last_message_at DESC NULLS LAST);\n\nCREATE TABLE messages (\n  id              uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  conversation_id uuid NOT NULL REFERENCES conversations(id) ON DELETE CASCADE,\n  sender_id       uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  body            text NOT NULL CHECK (length(body) > 0),\n  -- Muss in der Oberfläche sichtbar gemacht werden: KI-Texte dürfen nicht\n  -- aussehen, als hätte sie ein Mensch geschrieben.\n  is_ai_generated boolean NOT NULL DEFAULT false,\n  created_at      timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX messages_conversation_idx ON messages (conversation_id, created_at);\n"}, {"pfad": "database/migrations/0009_reviews.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 16, "bytes": 686, "inhalt": "-- 0009 Bewertungen.\n\nCREATE TABLE reviews (\n  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  -- Genau eine Bewertung pro Auftrag. Ohne abgeschlossenen Auftrag keine\n  -- Bewertung - das ist der einfachste wirksame Schutz gegen Fake-Rezensionen.\n  job_id      uuid NOT NULL UNIQUE REFERENCES jobs(id) ON DELETE CASCADE,\n  customer_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n  business_id uuid NOT NULL REFERENCES businesses(id) ON DELETE CASCADE,\n  rating      smallint NOT NULL CHECK (rating BETWEEN 1 AND 5),\n  text        text,\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX reviews_business_idx ON reviews (business_id, created_at DESC);\n"}, {"pfad": "database/migrations/0010_events_and_audit.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 35, "bytes": 1502, "inhalt": "-- 0010 Produktereignisse und Protokoll.\n\n-- Funnel-Ereignisse. Bewusst ohne personenbezogene Freitexte: wir wollen\n-- wissen, wo Nutzer abspringen, nicht was sie geschrieben haben.\nCREATE TABLE analytics_events (\n  id          bigserial PRIMARY KEY,\n  name        text NOT NULL,\n  user_id     uuid REFERENCES users(id) ON DELETE SET NULL,\n  request_id  uuid REFERENCES requests(id) ON DELETE SET NULL,\n  business_id uuid REFERENCES businesses(id) ON DELETE SET NULL,\n  properties  jsonb NOT NULL DEFAULT '{}'::jsonb,\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX analytics_events_name_idx ON analytics_events (name, created_at DESC);\nCREATE INDEX analytics_events_request_idx ON analytics_events (request_id) WHERE request_id IS NOT NULL;\n\n-- Protokoll sicherheitsrelevanter Aktionen (Anmeldung, Sperrung, Verifizierung,\n-- Angebotsannahme). Wird nur geschrieben, nie geändert.\nCREATE TABLE audit_log (\n  id          bigserial PRIMARY KEY,\n  actor_id    uuid REFERENCES users(id) ON DELETE SET NULL,\n  action      text NOT NULL,\n  entity_type text,\n  entity_id   uuid,\n  -- Auf /24 bzw. /48 gekürzte IP-Adresse: genug für Missbrauchserkennung,\n  -- ohne einen vollständigen Bewegungsverlauf zu speichern.\n  ip_prefix   text,\n  detail      jsonb NOT NULL DEFAULT '{}'::jsonb,\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX audit_log_actor_idx ON audit_log (actor_id, created_at DESC);\nCREATE INDEX audit_log_action_idx ON audit_log (action, created_at DESC);\n"}, {"pfad": "database/package.json", "bereich": "Datenbank", "sprache": "json", "zeilen": 35, "bytes": 883, "inhalt": "{\n  \"name\": \"@jobflow/database\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"PostgreSQL-Schema von JobFlow: Migrationen, Seeds und der Migrationslauf.\",\n  \"main\": \"./dist/index.js\",\n  \"types\": \"./dist/index.d.ts\",\n  \"exports\": {\n    \".\": {\n      \"types\": \"./dist/index.d.ts\",\n      \"default\": \"./dist/index.js\"\n    }\n  },\n  \"files\": [\"dist\", \"src\", \"migrations\", \"seeds\"],\n  \"scripts\": {\n    \"build\": \"tsc -p tsconfig.build.json\",\n    \"typecheck\": \"tsc -p tsconfig.json --noEmit\",\n    \"migrate\": \"tsx src/cli.ts migrate\",\n    \"seed\": \"tsx src/cli.ts seed\",\n    \"reset\": \"tsx src/cli.ts reset\",\n    \"status\": \"tsx src/cli.ts status\",\n    \"clean\": \"rm -rf dist\"\n  },\n  \"dependencies\": {\n    \"pg\": \"^8.13.1\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"^22.15.0\",\n    \"@types/pg\": \"^8.11.10\",\n    \"tsx\": \"^4.23.1\",\n    \"typescript\": \"^5.9.3\"\n  }\n}\n"}, {"pfad": "database/seeds/0001_categories.sql", "bereich": "Datenbank", "sprache": "sql", "zeilen": 49, "bytes": 2420, "inhalt": "-- Startkategorien.\n--\n-- Das sind Ausgangsdaten, keine feste Struktur: später werden Kategorien\n-- über die Administration gepflegt. Die Seeds sind idempotent, ein zweiter\n-- Lauf ändert nichts.\n\nINSERT INTO categories (slug, name, icon, parent_id, position) VALUES\n  ('handwerk',         'Handwerk',           '🔨', NULL, 10),\n  ('auto',             'Auto',               '🚗', NULL, 20),\n  ('haushalt',         'Haushalt',           '🏠', NULL, 30),\n  ('garten',           'Garten',             '🌳', NULL, 40),\n  ('dienstleistungen', 'Dienstleistungen',   '📸', NULL, 50),\n  ('lernen',           'Lernen',             '📚', NULL, 60)\nON CONFLICT (slug) DO NOTHING;\n\nINSERT INTO categories (slug, name, icon, parent_id, position)\nSELECT v.slug, v.name, v.icon, p.id, v.position\nFROM (VALUES\n  ('sanitaer',     'Sanitär',            '🚿', 'handwerk', 10),\n  ('elektrik',     'Elektrik',            '💡', 'handwerk', 20),\n  ('heizung',      'Heizung',             '🔥', 'handwerk', 30),\n  ('maler',        'Maler',               '🎨', 'handwerk', 40),\n  ('dach',         'Dach',                '🏘️', 'handwerk', 50),\n  ('schreiner',    'Schreiner',           '🪚', 'handwerk', 60),\n  ('schluessel',   'Schlüsseldienst',    '🔑', 'handwerk', 70),\n\n  ('kfz-reparatur', 'Reparatur',          '🔧', 'auto', 10),\n  ('kfz-reifen',    'Reifen',             '🛞', 'auto', 20),\n  ('kfz-inspektion','Inspektion',         '📋', 'auto', 30),\n\n  ('reinigung',    'Reinigung',           '🧽', 'haushalt', 10),\n  ('umzug',        'Umzug',               '📦', 'haushalt', 20),\n  ('montage',      'Möbelmontage',       '🪛', 'haushalt', 30),\n\n  ('gartenpflege', 'Gartenpflege',        '✂️', 'garten', 10),\n  ('gartenbau',    'Gartengestaltung',    '🌱', 'garten', 20),\n  ('baumpflege',   'Baumpflege',          '🌲', 'garten', 30),\n\n  ('fotografie',   'Fotografie',          '📷', 'dienstleistungen', 10),\n  ('tierbetreuung','Tierbetreuung',       '🐕', 'dienstleistungen', 20),\n  ('veranstaltung','Veranstaltung',       '🎪', 'dienstleistungen', 30),\n\n  ('nachhilfe',    'Nachhilfe',           '✏️', 'lernen', 10),\n  ('musik',        'Musikunterricht',     '🎸', 'lernen', 20),\n  ('sprachen',     'Sprachen',            '🗣️', 'lernen', 30)\n) AS v(slug, name, icon, parent_slug, position)\nJOIN categories p ON p.slug = v.parent_slug\nON CONFLICT (slug) DO NOTHING;\n"}, {"pfad": "database/src/cli.ts", "bereich": "Datenbank", "sprache": "typescript", "zeilen": 75, "bytes": 2264, "inhalt": "/**\n * Kommandozeile für das Datenbank-Schema.\n *\n *   pnpm --filter @jobflow/database migrate\n *   pnpm --filter @jobflow/database seed\n *   pnpm --filter @jobflow/database status\n *   pnpm --filter @jobflow/database reset -- --yes\n */\nimport pg from \"pg\";\nimport { listApplied, migrate, reset, seed } from \"./migrator.js\";\n\nconst { Pool } = pg;\n\nfunction requireDatabaseUrl(): string {\n  const url = process.env[\"DATABASE_URL\"];\n  if (!url) {\n    throw new Error(\"DATABASE_URL ist nicht gesetzt. Siehe .env.example im Projektstamm.\");\n  }\n  return url;\n}\n\nasync function main(): Promise<void> {\n  const command = process.argv[2] ?? \"migrate\";\n  const pool = new Pool({ connectionString: requireDatabaseUrl() });\n  const log = (message: string) => console.log(`  ${message}`);\n\n  try {\n    switch (command) {\n      case \"migrate\": {\n        const applied = await migrate(pool, log);\n        console.log(applied.length === 0 ? \"Keine offenen Migrationen.\" : `${applied.length} Migration(en) angewendet.`);\n        break;\n      }\n      case \"seed\": {\n        const applied = await seed(pool, log);\n        console.log(`${applied.length} Seed-Datei(en) eingespielt.`);\n        break;\n      }\n      case \"status\": {\n        const applied = await listApplied(pool);\n        if (applied.length === 0) {\n          console.log(\"Noch keine Migration angewendet.\");\n        } else {\n          for (const entry of applied) {\n            console.log(`  ${entry.appliedAt.toISOString()}  ${entry.filename}`);\n          }\n        }\n        break;\n      }\n      case \"reset\": {\n        if (process.env[\"NODE_ENV\"] === \"production\") {\n          throw new Error(\"reset ist in der Produktion gesperrt.\");\n        }\n        if (!process.argv.includes(\"--yes\")) {\n          throw new Error(\n            \"reset löscht das gesamte Schema. Zum Bestätigen mit --yes aufrufen.\",\n          );\n        }\n        await reset(pool, log);\n        console.log(\"Schema neu aufgebaut.\");\n        break;\n      }\n      default:\n        throw new Error(`Unbekannter Befehl: ${command}. Erlaubt: migrate, seed, status, reset.`);\n    }\n  } finally {\n    await pool.end();\n  }\n}\n\nmain().catch((error: unknown) => {\n  console.error(`Fehler: ${(error as Error).message}`);\n  process.exitCode = 1;\n});\n"}, {"pfad": "database/src/index.ts", "bereich": "Datenbank", "sprache": "typescript", "zeilen": 3, "bytes": 149, "inhalt": "export { migrate, seed, reset, listApplied, MIGRATIONS_DIR, SEEDS_DIR } from \"./migrator.js\";\nexport type { AppliedMigration } from \"./migrator.js\";\n"}, {"pfad": "database/src/migrator.ts", "bereich": "Datenbank", "sprache": "typescript", "zeilen": 166, "bytes": 5253, "inhalt": "import { createHash } from \"node:crypto\";\nimport { readdir, readFile } from \"node:fs/promises\";\nimport path from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport type { Pool, PoolClient } from \"pg\";\n\nconst packageRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), \"..\");\n\nexport const MIGRATIONS_DIR = path.join(packageRoot, \"migrations\");\nexport const SEEDS_DIR = path.join(packageRoot, \"seeds\");\n\nexport interface AppliedMigration {\n  filename: string;\n  checksum: string;\n  appliedAt: Date;\n}\n\ninterface SqlFile {\n  filename: string;\n  sql: string;\n  checksum: string;\n}\n\nasync function readSqlFiles(dir: string): Promise<SqlFile[]> {\n  const entries = (await readdir(dir)).filter((name) => name.endsWith(\".sql\")).sort();\n  const files: SqlFile[] = [];\n  for (const filename of entries) {\n    const sql = await readFile(path.join(dir, filename), \"utf8\");\n    files.push({ filename, sql, checksum: createHash(\"sha256\").update(sql).digest(\"hex\") });\n  }\n  return files;\n}\n\nasync function ensureMigrationsTable(client: PoolClient): Promise<void> {\n  await client.query(`\n    CREATE TABLE IF NOT EXISTS schema_migrations (\n      filename   text PRIMARY KEY,\n      checksum   text NOT NULL,\n      applied_at timestamptz NOT NULL DEFAULT now()\n    )\n  `);\n}\n\nexport async function listApplied(pool: Pool): Promise<AppliedMigration[]> {\n  const client = await pool.connect();\n  try {\n    await ensureMigrationsTable(client);\n    const result = await client.query<{ filename: string; checksum: string; applied_at: Date }>(\n      \"SELECT filename, checksum, applied_at FROM schema_migrations ORDER BY filename\",\n    );\n    return result.rows.map((row) => ({\n      filename: row.filename,\n      checksum: row.checksum,\n      appliedAt: row.applied_at,\n    }));\n  } finally {\n    client.release();\n  }\n}\n\n/**\n * Wendet alle noch offenen Migrationen an.\n *\n * Jede Migration laeuft in ihrer eigenen Transaktion: entweder sie geht\n * vollständig durch oder gar nicht. Bereits angewendete Dateien werden über\n * ihre Prüfsumme verglichen - wird eine Migration nachträglich verändert,\n * bricht der Lauf ab, statt zwei Umgebungen auseinanderlaufen zu lassen.\n */\nexport async function migrate(pool: Pool, log: (message: string) => void = () => {}): Promise<string[]> {\n  const files = await readSqlFiles(MIGRATIONS_DIR);\n  const client = await pool.connect();\n  const applied: string[] = [];\n  try {\n    await ensureMigrationsTable(client);\n    const known = new Map(\n      (\n        await client.query<{ filename: string; checksum: string }>(\n          \"SELECT filename, checksum FROM schema_migrations\",\n        )\n      ).rows.map((row) => [row.filename, row.checksum] as const),\n    );\n\n    for (const file of files) {\n      const knownChecksum = known.get(file.filename);\n      if (knownChecksum !== undefined) {\n        if (knownChecksum !== file.checksum) {\n          throw new Error(\n            `Migration ${file.filename} wurde nachträglich verändert. ` +\n              \"Bereits angewendete Migrationen dürfen nicht bearbeitet werden - \" +\n              \"bitte stattdessen eine neue Migration anlegen.\",\n          );\n        }\n        continue;\n      }\n\n      await client.query(\"BEGIN\");\n      try {\n        await client.query(file.sql);\n        await client.query(\"INSERT INTO schema_migrations (filename, checksum) VALUES ($1, $2)\", [\n          file.filename,\n          file.checksum,\n        ]);\n        await client.query(\"COMMIT\");\n      } catch (error) {\n        await client.query(\"ROLLBACK\");\n        throw new Error(`Migration ${file.filename} fehlgeschlagen: ${(error as Error).message}`, {\n          cause: error,\n        });\n      }\n      applied.push(file.filename);\n      log(`angewendet: ${file.filename}`);\n    }\n  } finally {\n    client.release();\n  }\n  return applied;\n}\n\n/**\n * Spielt die Seed-Dateien ein. Sie sind idempotent formuliert, ein zweiter\n * Lauf ändert also nichts.\n */\nexport async function seed(pool: Pool, log: (message: string) => void = () => {}): Promise<string[]> {\n  const files = await readSqlFiles(SEEDS_DIR);\n  const client = await pool.connect();\n  const applied: string[] = [];\n  try {\n    for (const file of files) {\n      await client.query(\"BEGIN\");\n      try {\n        await client.query(file.sql);\n        await client.query(\"COMMIT\");\n      } catch (error) {\n        await client.query(\"ROLLBACK\");\n        throw new Error(`Seed ${file.filename} fehlgeschlagen: ${(error as Error).message}`, {\n          cause: error,\n        });\n      }\n      applied.push(file.filename);\n      log(`eingespielt: ${file.filename}`);\n    }\n  } finally {\n    client.release();\n  }\n  return applied;\n}\n\n/**\n * Leert das Schema vollständig und baut es neu auf.\n *\n * Nur für Entwicklung und Tests gedacht - deshalb die ausdrückliche\n * Bestätigung im CLI und die Sperre gegen NODE_ENV=production.\n */\nexport async function reset(pool: Pool, log: (message: string) => void = () => {}): Promise<void> {\n  const client = await pool.connect();\n  try {\n    await client.query(\"DROP SCHEMA IF EXISTS public CASCADE\");\n    await client.query(\"CREATE SCHEMA public\");\n    log(\"Schema geleert.\");\n  } finally {\n    client.release();\n  }\n  await migrate(pool, log);\n  await seed(pool, log);\n}\n"}, {"pfad": "database/tsconfig.build.json", "bereich": "Datenbank", "sprache": "json", "zeilen": 6, "bytes": 151, "inhalt": "{\n  \"extends\": \"../tsconfig.base.json\",\n  \"compilerOptions\": { \"rootDir\": \"src\", \"outDir\": \"dist\", \"types\": [\"node\"] },\n  \"include\": [\"src/**/*.ts\"]\n}\n"}, {"pfad": "database/tsconfig.json", "bereich": "Datenbank", "sprache": "json", "zeilen": 6, "bytes": 131, "inhalt": "{\n  \"extends\": \"../tsconfig.base.json\",\n  \"compilerOptions\": { \"noEmit\": true, \"types\": [\"node\"] },\n  \"include\": [\"src/**/*.ts\"]\n}\n"}, {"pfad": "services/api/package.json", "bereich": "Backend", "sprache": "json", "zeilen": 28, "bytes": 781, "inhalt": "{\n  \"name\": \"@jobflow/api\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"JobFlow-Backend: modularer Monolith. Eine Anwendung, innen sauber nach Fachbereichen getrennt.\",\n  \"main\": \"./dist/index.js\",\n  \"scripts\": {\n    \"dev\": \"tsx watch src/index.ts\",\n    \"start\": \"node dist/index.js\",\n    \"build\": \"tsc -p tsconfig.build.json\",\n    \"typecheck\": \"tsc -p tsconfig.json --noEmit\",\n    \"test\": \"tsx --test --test-concurrency=1 test/*.test.ts\"\n  },\n  \"dependencies\": {\n    \"@jobflow/database\": \"workspace:*\",\n    \"@jobflow/types\": \"workspace:*\",\n    \"@jobflow/validation\": \"workspace:*\",\n    \"pg\": \"^8.13.1\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"^22.15.0\",\n    \"@types/pg\": \"^8.11.10\",\n    \"tsx\": \"^4.23.1\",\n    \"typescript\": \"^5.9.3\"\n  }\n}\n"}, {"pfad": "services/api/src/config.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 105, "bytes": 3455, "inhalt": "/**\n * Konfiguration aus Umgebungsvariablen.\n *\n * Wird beim Start einmal gelesen und geprüft. Fehlt etwas Sicherheitsrelevantes,\n * startet die API gar nicht erst - ein Backend, das mit einem Standardgeheimnis\n * hochfährt, ist gefährlicher als eines, das sich weigert.\n */\n\nexport type AiProviderName = \"rules\" | \"remote\";\n\nexport interface Config {\n  port: number;\n  databaseUrl: string;\n  sessionSecret: string;\n  sessionTtlSeconds: number;\n  corsOrigins: string[];\n  ai: {\n    provider: AiProviderName;\n    baseUrl: string | null;\n    apiKey: string | null;\n    timeoutMs: number;\n  };\n  upload: {\n    dir: string;\n    maxBytes: number;\n  };\n  isProduction: boolean;\n}\n\nconst SESSION_SECRET_MIN_LENGTH = 32;\n\nclass ConfigError extends Error {}\n\nfunction required(env: NodeJS.ProcessEnv, key: string): string {\n  const value = env[key];\n  if (value === undefined || value.trim() === \"\") {\n    throw new ConfigError(`${key} ist nicht gesetzt. Siehe .env.example im Projektstamm.`);\n  }\n  return value.trim();\n}\n\nfunction optionalString(env: NodeJS.ProcessEnv, key: string): string | null {\n  const value = env[key];\n  return value === undefined || value.trim() === \"\" ? null : value.trim();\n}\n\nfunction integer(env: NodeJS.ProcessEnv, key: string, fallback: number, min = 1): number {\n  const raw = optionalString(env, key);\n  if (raw === null) return fallback;\n  const value = Number(raw);\n  if (!Number.isInteger(value) || value < min) {\n    throw new ConfigError(`${key} muss eine ganze Zahl ab ${min} sein, ist aber \"${raw}\".`);\n  }\n  return value;\n}\n\nexport function loadConfig(env: NodeJS.ProcessEnv = process.env): Config {\n  const isProduction = env[\"NODE_ENV\"] === \"production\";\n\n  const sessionSecret = required(env, \"SESSION_SECRET\");\n  if (sessionSecret.length < SESSION_SECRET_MIN_LENGTH) {\n    throw new ConfigError(\n      `SESSION_SECRET muss mindestens ${SESSION_SECRET_MIN_LENGTH} Zeichen lang sein.`,\n    );\n  }\n  if (isProduction && sessionSecret.startsWith(\"bitte-ändern\")) {\n    throw new ConfigError(\"SESSION_SECRET steht noch auf dem Beispielwert.\");\n  }\n\n  const providerRaw = optionalString(env, \"AI_PROVIDER\") ?? \"rules\";\n  if (providerRaw !== \"rules\" && providerRaw !== \"remote\") {\n    throw new ConfigError(`AI_PROVIDER muss \"rules\" oder \"remote\" sein, ist aber \"${providerRaw}\".`);\n  }\n\n  const aiBaseUrl = optionalString(env, \"AI_BASE_URL\");\n  const aiApiKey = optionalString(env, \"AI_API_KEY\");\n  if (providerRaw === \"remote\" && (aiBaseUrl === null || aiApiKey === null)) {\n    throw new ConfigError('AI_PROVIDER=\"remote\" benötigt AI_BASE_URL und AI_API_KEY.');\n  }\n\n  return {\n    // PORT=0 ist zulässig: das Betriebssystem sucht dann einen freien Port.\n    // Genau das brauchen die Tests, damit mehrere Läufe sich nicht behindern.\n    port: integer(env, \"PORT\", 4000, 0),\n    databaseUrl: required(env, \"DATABASE_URL\"),\n    sessionSecret,\n    sessionTtlSeconds: integer(env, \"SESSION_TTL_SECONDS\", 60 * 60 * 24 * 30),\n    corsOrigins: (optionalString(env, \"CORS_ORIGINS\") ?? \"\")\n      .split(\",\")\n      .map((origin) => origin.trim())\n      .filter((origin) => origin.length > 0),\n    ai: {\n      provider: providerRaw,\n      baseUrl: aiBaseUrl,\n      apiKey: aiApiKey,\n      timeoutMs: integer(env, \"AI_TIMEOUT_MS\", 15_000),\n    },\n    upload: {\n      dir: optionalString(env, \"UPLOAD_DIR\") ?? \"./var/uploads\",\n      maxBytes: integer(env, \"UPLOAD_MAX_BYTES\", 8 * 1024 * 1024),\n    },\n    isProduction,\n  };\n}\n"}, {"pfad": "services/api/src/db/pool.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 53, "bytes": 1657, "inhalt": "import pg from \"pg\";\n\nconst { Pool, types } = pg;\n\nexport type Db = pg.Pool;\nexport type DbClient = pg.PoolClient;\n/** Pool und Client teilen sich query() - Services nehmen beides entgegen. */\nexport type Queryable = Pick<pg.Pool, \"query\">;\n\n// numeric kommt sonst als String zurück. JobFlow verwendet numeric nur für\n// Bewertungen und Konfidenzwerte - beides sind echte Zahlen.\nconst NUMERIC_OID = 1700;\ntypes.setTypeParser(NUMERIC_OID, (value) => Number(value));\n\n// int8 (bigint) bleibt bewusst ein String: die Werte könnten Number.MAX_SAFE_INTEGER\n// überschreiten. Betroffen sind nur die fortlaufenden IDs der Ereignistabellen.\n\nexport function createPool(connectionString: string): Db {\n  return new Pool({\n    connectionString,\n    max: 10,\n    idleTimeoutMillis: 30_000,\n    connectionTimeoutMillis: 5_000,\n  });\n}\n\n/**\n * Führt eine Funktion in einer Transaktion aus.\n *\n * Alles, was mehrere Tabellen zugleich verändert - ein Angebot annehmen legt\n * einen Auftrag an, aktualisiert die Anfrage und lehnt die übrigen Angebote ab -\n * gehört hier hinein. Halb ausgeführte Zustandswechsel wären in einem\n * Marktplatz besonders unangenehm.\n */\nexport async function withTransaction<T>(db: Db, fn: (client: DbClient) => Promise<T>): Promise<T> {\n  const client = await db.connect();\n  try {\n    await client.query(\"BEGIN\");\n    const result = await fn(client);\n    await client.query(\"COMMIT\");\n    return result;\n  } catch (error) {\n    try {\n      await client.query(\"ROLLBACK\");\n    } catch {\n      // Die Verbindung ist bereits kaputt - der ursprüngliche Fehler zählt.\n    }\n    throw error;\n  } finally {\n    client.release();\n  }\n}\n"}, {"pfad": "services/api/src/http/body.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 54, "bytes": 1737, "inhalt": "import type { IncomingMessage } from \"node:http\";\nimport { ApiError } from \"./errors.js\";\n\n/** Größe, die ein JSON-Rumpf höchstens haben darf. Fotos gehen einen eigenen Weg. */\nconst MAX_JSON_BYTES = 256 * 1024;\n\n/**\n * Liest den Rumpf einer Anfrage als JSON.\n *\n * Die Größe wird während des Lesens geprüft, nicht danach: sonst könnte\n * ein Client den Speicher des Servers füllen, bevor die Prüfung greift.\n */\nexport async function readJsonBody(req: IncomingMessage): Promise<unknown> {\n  const contentType = req.headers[\"content-type\"] ?? \"\";\n  if (contentType !== \"\" && !contentType.toLowerCase().startsWith(\"application/json\")) {\n    throw new ApiError(415, \"UNSUPPORTED_MEDIA_TYPE\", \"Es wird application/json erwartet.\");\n  }\n\n  const chunks: Buffer[] = [];\n  let total = 0;\n\n  for await (const chunk of req) {\n    const buffer = chunk as Buffer;\n    total += buffer.length;\n    if (total > MAX_JSON_BYTES) {\n      throw new ApiError(413, \"PAYLOAD_TOO_LARGE\", \"Die Anfrage ist zu groß.\");\n    }\n    chunks.push(buffer);\n  }\n\n  if (total === 0) return {};\n\n  try {\n    return JSON.parse(Buffer.concat(chunks).toString(\"utf8\"));\n  } catch {\n    throw ApiError.validation({}, \"Der Anfragetext ist kein gültiges JSON.\");\n  }\n}\n\n/** Liest einen binären Rumpf (Foto-Upload) mit harter Größengrenze. */\nexport async function readBinaryBody(req: IncomingMessage, maxBytes: number): Promise<Buffer> {\n  const chunks: Buffer[] = [];\n  let total = 0;\n  for await (const chunk of req) {\n    const buffer = chunk as Buffer;\n    total += buffer.length;\n    if (total > maxBytes) {\n      throw new ApiError(413, \"PAYLOAD_TOO_LARGE\", \"Die Datei ist zu groß.\");\n    }\n    chunks.push(buffer);\n  }\n  return Buffer.concat(chunks);\n}\n"}, {"pfad": "services/api/src/http/context.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 108, "bytes": 3478, "inhalt": "import type { IncomingMessage, ServerResponse } from \"node:http\";\nimport type { User, UserRole } from \"@jobflow/types\";\nimport type { Validator } from \"@jobflow/validation\";\nimport { validate } from \"@jobflow/validation\";\nimport { readJsonBody } from \"./body.js\";\nimport { ApiError } from \"./errors.js\";\nimport type { AppServices } from \"../services.js\";\n\n/** Der angemeldete Nutzer samt Session, die ihn ausgewiesen hat. */\nexport interface Principal {\n  user: User;\n  sessionId: string;\n}\n\n/**\n * Alles, was ein Handler über die laufende Anfrage wissen muss.\n *\n * Die Berechtigungsprüfung laeuft ausschließlich hier und in den Services -\n * niemals im Client. Ein Handler, der `ctx.requireUser()` nicht aufruft, ist\n * öffentlich, und das soll man ihm ansehen.\n */\nexport class RequestContext {\n  readonly req: IncomingMessage;\n  readonly res: ServerResponse;\n  readonly params: Record<string, string>;\n  readonly query: URLSearchParams;\n  readonly app: AppServices;\n  /** Auf /24 bzw. /48 gekürzte Client-Adresse - für Rate Limiting und Protokoll. */\n  readonly ipPrefix: string;\n\n  private cachedBody: unknown;\n  private bodyRead = false;\n  private principal: Principal | null = null;\n  private principalResolved = false;\n\n  constructor(init: {\n    req: IncomingMessage;\n    res: ServerResponse;\n    params: Record<string, string>;\n    query: URLSearchParams;\n    app: AppServices;\n    ipPrefix: string;\n  }) {\n    this.req = init.req;\n    this.res = init.res;\n    this.params = init.params;\n    this.query = init.query;\n    this.app = init.app;\n    this.ipPrefix = init.ipPrefix;\n  }\n\n  /** Pfadparameter, der vorhanden sein muss. */\n  param(name: string): string {\n    const value = this.params[name];\n    if (value === undefined) throw ApiError.notFound();\n    return value;\n  }\n\n  async body(): Promise<unknown> {\n    if (!this.bodyRead) {\n      this.cachedBody = await readJsonBody(this.req);\n      this.bodyRead = true;\n    }\n    return this.cachedBody;\n  }\n\n  /** Liest den Rumpf und prüft ihn gegen ein Schema. */\n  async input<T>(schema: Validator<T>): Promise<T> {\n    const result = validate(schema, await this.body());\n    if (!result.ok) throw ApiError.validation(result.fields);\n    return result.value;\n  }\n\n  /** Prüft die Query-Parameter gegen ein Schema. */\n  queryInput<T>(schema: Validator<T>): T {\n    const raw: Record<string, string> = {};\n    for (const [key, value] of this.query.entries()) raw[key] = value;\n    const result = validate(schema, raw);\n    if (!result.ok) throw ApiError.validation(result.fields);\n    return result.value;\n  }\n\n  /** Angemeldeter Nutzer oder null. Für Endpunkte, die beides erlauben. */\n  async currentUser(): Promise<Principal | null> {\n    if (!this.principalResolved) {\n      this.principal = await this.app.authenticate(this.req);\n      this.principalResolved = true;\n    }\n    return this.principal;\n  }\n\n  /** Angemeldeter Nutzer - wirft, wenn kein gültiges Token vorliegt. */\n  async requireUser(): Promise<Principal> {\n    const principal = await this.currentUser();\n    if (principal === null) throw ApiError.unauthenticated();\n    return principal;\n  }\n\n  /** Angemeldeter Nutzer mit einer der genannten Rollen. */\n  async requireRole(...roles: UserRole[]): Promise<Principal> {\n    const principal = await this.requireUser();\n    if (!roles.includes(principal.user.role)) {\n      throw ApiError.forbidden(\"Diese Aktion ist für deine Rolle nicht vorgesehen.\");\n    }\n    return principal;\n  }\n}\n"}, {"pfad": "services/api/src/http/cors.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 23, "bytes": 983, "inhalt": "import type { IncomingMessage, ServerResponse } from \"node:http\";\n\n/**\n * CORS nur für ausdrücklich erlaubte Origins.\n *\n * Kein \"*\": die API antwortet mit nutzerbezogenen Daten und muss wissen,\n * welche Web-Oberflächen sie ansprechen dürfen. Die Mobile-App ist von CORS\n * ohnehin nicht betroffen.\n */\nexport function applyCors(req: IncomingMessage, res: ServerResponse, allowed: string[]): void {\n  const origin = req.headers.origin;\n  if (typeof origin !== \"string\" || !allowed.includes(origin)) return;\n\n  res.setHeader(\"access-control-allow-origin\", origin);\n  res.setHeader(\"access-control-allow-credentials\", \"true\");\n  res.setHeader(\"access-control-allow-headers\", \"content-type, authorization\");\n  res.setHeader(\"access-control-allow-methods\", \"GET, POST, PATCH, DELETE, OPTIONS\");\n  res.setHeader(\"access-control-max-age\", \"600\");\n  // Antworten unterscheiden sich je Origin - sonst liefert ein Cache die\n  // falschen Header aus.\n  res.setHeader(\"vary\", \"origin\");\n}\n"}, {"pfad": "services/api/src/http/errors.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 56, "bytes": 1849, "inhalt": "import type { ApiErrorCode } from \"@jobflow/types\";\n\n/**\n * Fehler, die bewusst nach außen gehen.\n *\n * Alles andere (Programmierfehler, Datenbankausfälle) wird zu einem\n * INTERNAL_ERROR ohne Details - interne Meldungen gehören ins Log, nicht\n * in die Antwort an einen fremden Client.\n */\nexport class ApiError extends Error {\n  readonly status: number;\n  readonly code: ApiErrorCode;\n  readonly fields: Record<string, string> | undefined;\n\n  constructor(status: number, code: ApiErrorCode, message: string, fields?: Record<string, string>) {\n    super(message);\n    this.name = \"ApiError\";\n    this.status = status;\n    this.code = code;\n    this.fields = fields;\n  }\n\n  static validation(fields: Record<string, string>, message = \"Bitte prüfe deine Eingaben.\"): ApiError {\n    return new ApiError(422, \"VALIDATION_FAILED\", message, fields);\n  }\n\n  static unauthenticated(message = \"Bitte melde dich an.\"): ApiError {\n    return new ApiError(401, \"UNAUTHENTICATED\", message);\n  }\n\n  /**\n   * Bewusst auch dann, wenn ein Objekt existiert, aber jemand anderem gehört:\n   * ein 404 verrät weniger als ein 403. Ausnahme sind Fälle, in denen der\n   * Nutzer das Objekt sehen darf, nur die Aktion nicht ausführen.\n   */\n  static forbidden(message = \"Dazu fehlt dir die Berechtigung.\"): ApiError {\n    return new ApiError(403, \"FORBIDDEN\", message);\n  }\n\n  static notFound(message = \"Nicht gefunden.\"): ApiError {\n    return new ApiError(404, \"NOT_FOUND\", message);\n  }\n\n  static conflict(message: string): ApiError {\n    return new ApiError(409, \"CONFLICT\", message);\n  }\n\n  static rateLimited(message = \"Zu viele Anfragen. Bitte kurz warten.\"): ApiError {\n    return new ApiError(429, \"RATE_LIMITED\", message);\n  }\n\n  static internal(message = \"Unerwarteter Fehler.\"): ApiError {\n    return new ApiError(500, \"INTERNAL_ERROR\", message);\n  }\n}\n"}, {"pfad": "services/api/src/http/rate-limit.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 67, "bytes": 2028, "inhalt": "/**\n * Rate Limiting mit einem gleitenden Zählfenster im Arbeitsspeicher.\n *\n * Für eine Instanz reicht das. Sobald mehrere Instanzen hinter einem Load\n * Balancer laufen, gehört der Zähler in einen gemeinsamen Speicher (Redis) -\n * bis dahin wäre das unnötige Infrastruktur.\n */\nexport interface RateLimitRule {\n  /** Erlaubte Anfragen je Fenster. */\n  limit: number;\n  windowMs: number;\n}\n\ninterface Bucket {\n  count: number;\n  resetAt: number;\n}\n\nexport class RateLimiter {\n  private readonly buckets = new Map<string, Bucket>();\n  private lastSweep = 0;\n\n  /** Liefert false, wenn das Kontingent erschöpft ist. */\n  check(key: string, rule: RateLimitRule, now: number = Date.now()): boolean {\n    this.sweep(now);\n    const bucket = this.buckets.get(key);\n    if (bucket === undefined || bucket.resetAt <= now) {\n      this.buckets.set(key, { count: 1, resetAt: now + rule.windowMs });\n      return true;\n    }\n    if (bucket.count >= rule.limit) return false;\n    bucket.count += 1;\n    return true;\n  }\n\n  /** Wie lange der Aufrufer warten muss, in Sekunden. */\n  retryAfterSeconds(key: string, now: number = Date.now()): number {\n    const bucket = this.buckets.get(key);\n    if (bucket === undefined) return 0;\n    return Math.max(1, Math.ceil((bucket.resetAt - now) / 1000));\n  }\n\n  /** Alte Einträge entfernen, damit die Map nicht unbegrenzt wächst. */\n  private sweep(now: number): void {\n    if (now - this.lastSweep < 60_000) return;\n    this.lastSweep = now;\n    for (const [key, bucket] of this.buckets) {\n      if (bucket.resetAt <= now) this.buckets.delete(key);\n    }\n  }\n\n  reset(): void {\n    this.buckets.clear();\n  }\n}\n\n/**\n * Anmeldung und Registrierung sind streng begrenzt: dort wird geraten und\n * ausprobiert. Der Rest ist großzügiger.\n */\nexport const RATE_LIMITS = {\n  auth: { limit: 10, windowMs: 15 * 60_000 },\n  write: { limit: 60, windowMs: 60_000 },\n  read: { limit: 300, windowMs: 60_000 },\n  ai: { limit: 20, windowMs: 60_000 },\n} as const satisfies Record<string, RateLimitRule>;\n"}, {"pfad": "services/api/src/http/response.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 37, "bytes": 1131, "inhalt": "import type { ServerResponse } from \"node:http\";\nimport type { ApiFailure, ApiSuccess, ApiErrorCode } from \"@jobflow/types\";\n\n/**\n * Jede Antwort hat dieselbe Hülle: { success, data, error }.\n * Die Frontends müssen so nie pro Endpunkt raten, wie eine Antwort aussieht.\n */\nexport function success<T>(data: T): ApiSuccess<T> {\n  return { success: true, data, error: null };\n}\n\nexport function failure(\n  code: ApiErrorCode,\n  message: string,\n  fields?: Record<string, string>,\n): ApiFailure {\n  return {\n    success: false,\n    data: null,\n    error: fields === undefined ? { code, message } : { code, message, fields },\n  };\n}\n\nexport function sendJson(res: ServerResponse, status: number, body: unknown): void {\n  const payload = JSON.stringify(body);\n  res.writeHead(status, {\n    \"content-type\": \"application/json; charset=utf-8\",\n    \"content-length\": Buffer.byteLength(payload),\n    // Antworten der API sind nutzerspezifisch und dürfen nirgends\n    // zwischengespeichert werden.\n    \"cache-control\": \"no-store\",\n    \"x-content-type-options\": \"nosniff\",\n    \"referrer-policy\": \"no-referrer\",\n  });\n  res.end(payload);\n}\n"}, {"pfad": "services/api/src/http/router.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 93, "bytes": 3033, "inhalt": "import type { IncomingMessage, ServerResponse } from \"node:http\";\nimport type { RequestContext } from \"./context.js\";\nimport { ApiError } from \"./errors.js\";\n\nexport type HttpMethod = \"GET\" | \"POST\" | \"PATCH\" | \"PUT\" | \"DELETE\";\n\nexport type Handler = (ctx: RequestContext) => Promise<unknown>;\n\ninterface Route {\n  method: HttpMethod;\n  /** Segmente des Pfads; \":name\" steht für einen Parameter. */\n  segments: string[];\n  handler: Handler;\n}\n\n/**\n * Ein sehr kleiner Router.\n *\n * Bewusst ohne Framework: JobFlow braucht Pfadparameter und sonst nichts.\n * Ein eigener Router in fünfzig Zeilen ist leichter zu prüfen als eine\n * Abhängigkeit, die zehnmal so viel kann.\n */\nexport class Router {\n  private readonly routes: Route[] = [];\n\n  add(method: HttpMethod, pattern: string, handler: Handler): this {\n    this.routes.push({ method, segments: splitPath(pattern), handler });\n    return this;\n  }\n\n  get(pattern: string, handler: Handler): this {\n    return this.add(\"GET\", pattern, handler);\n  }\n  post(pattern: string, handler: Handler): this {\n    return this.add(\"POST\", pattern, handler);\n  }\n  patch(pattern: string, handler: Handler): this {\n    return this.add(\"PATCH\", pattern, handler);\n  }\n  delete(pattern: string, handler: Handler): this {\n    return this.add(\"DELETE\", pattern, handler);\n  }\n\n  /** Hängt die Routen eines Moduls unter einem Präfix ein. */\n  mount(prefix: string, other: Router): this {\n    const prefixSegments = splitPath(prefix);\n    for (const route of other.routes) {\n      this.routes.push({ ...route, segments: [...prefixSegments, ...route.segments] });\n    }\n    return this;\n  }\n\n  match(method: string, pathname: string): { handler: Handler; params: Record<string, string> } | null {\n    const segments = splitPath(pathname);\n    let pathExists = false;\n\n    for (const route of this.routes) {\n      const params = matchSegments(route.segments, segments);\n      if (params === null) continue;\n      pathExists = true;\n      if (route.method === method) return { handler: route.handler, params };\n    }\n\n    // Der Pfad gibt es, nur nicht mit dieser Methode - das ist eine andere\n    // Aussage als \"gibt es nicht\" und hilft beim Debuggen der Clients.\n    if (pathExists) {\n      throw new ApiError(405, \"NOT_FOUND\", `Die Methode ${method} ist für diesen Pfad nicht erlaubt.`);\n    }\n    return null;\n  }\n}\n\nfunction splitPath(pathname: string): string[] {\n  return pathname.split(\"/\").filter((segment) => segment.length > 0);\n}\n\nfunction matchSegments(pattern: string[], actual: string[]): Record<string, string> | null {\n  if (pattern.length !== actual.length) return null;\n  const params: Record<string, string> = {};\n  for (let i = 0; i < pattern.length; i += 1) {\n    const expected = pattern[i] as string;\n    const value = actual[i] as string;\n    if (expected.startsWith(\":\")) {\n      params[expected.slice(1)] = decodeURIComponent(value);\n    } else if (expected !== value) {\n      return null;\n    }\n  }\n  return params;\n}\n\nexport type { IncomingMessage, ServerResponse };\n"}, {"pfad": "services/api/src/index.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 42, "bytes": 1164, "inhalt": "/**\n * Einstiegspunkt der API.\n */\nimport { loadConfig } from \"./config.js\";\nimport { createApiServer } from \"./server.js\";\nimport { buildServices } from \"./services.js\";\n\nfunction main(): void {\n  const config = loadConfig();\n  const app = buildServices({ config });\n  const server = createApiServer(app);\n\n  server.listen(config.port, () => {\n    app.logger.info(\"JobFlow-API gestartet\", {\n      port: config.port,\n      aiProvider: config.ai.provider,\n      environment: config.isProduction ? \"production\" : \"development\",\n    });\n  });\n\n  // Laufende Anfragen zu Ende bringen, statt sie mitten im Schreiben\n  // abzuschneiden.\n  const shutdown = (signal: string): void => {\n    app.logger.info(\"Herunterfahren\", { signal });\n    server.close(() => {\n      void app.shutdown().then(() => process.exit(0));\n    });\n    // Falls eine Verbindung hängt, nicht ewig warten.\n    setTimeout(() => process.exit(1), 10_000).unref();\n  };\n\n  process.on(\"SIGTERM\", () => shutdown(\"SIGTERM\"));\n  process.on(\"SIGINT\", () => shutdown(\"SIGINT\"));\n}\n\ntry {\n  main();\n} catch (error) {\n  console.error(`Start fehlgeschlagen: ${(error as Error).message}`);\n  process.exit(1);\n}\n"}, {"pfad": "services/api/src/lib/logger.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 49, "bytes": 1614, "inhalt": "/**\n * Strukturierte Logausgabe auf stdout.\n *\n * Keine Abhängigkeit nötig: eine Zeile JSON pro Ereignis lässt sich von\n * jedem Log-System einlesen. Personenbezogene Inhalte gehören nicht ins Log -\n * IDs ja, Beschreibungen und E-Mail-Adressen nein.\n */\nexport type LogLevel = \"debug\" | \"info\" | \"warn\" | \"error\";\n\nexport interface Logger {\n  debug(message: string, fields?: Record<string, unknown>): void;\n  info(message: string, fields?: Record<string, un
