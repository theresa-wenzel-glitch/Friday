Durchstich, der unter `jobflow/` liegt und mit\neinem End-to-End-Test gegen PostgreSQL abgesichert ist.\n\n## Verhältnis zum Code\n\nJeder Screen im Prototyp hat eine Entsprechung in `apps/mobile/app/`:\n\n| Prototyp | Code |\n|---|---|\n| Willkommen, Konto, Anmelden | `app/index.tsx`, `app/(auth)/` |\n| Startseite, Anfrage erstellen | `app/(app)/home.tsx`, `create-request.tsx` |\n| KI-Analyse, Rückfragen | `app/(app)/requests/[id].tsx` |\n| Anbieter, Angebote | `requests/[id].tsx`, `offers/[id].tsx` |\n| Termin | `appointment.tsx` |\n| Auftragsstatus, Bewertung | `jobs/[id].tsx`, `review.tsx` |\n| Chat | `chat.tsx` |\n| Dashboard, Statistik | `dashboard.tsx`, `statistics.tsx` |\n| Angebot erstellen | `create-offer.tsx` |\n| Unternehmensprofil | `business-profile.tsx` |\n"}, {"pfad": "docs/vorschau/jobflow-vorschau.html", "bereich": "Dokumentation", "sprache": "xml", "zeilen": 2501, "bytes": 106826, "inhalt": "<title>JobFlow Prototyp<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap\">\n\n<style>\n/* ==========================================================================\n   JobFlow - klickbare Vorschau\n\n   Zwei Farbwelten in einer Datei:\n\n   1. Die App selbst (Präfix --jf-). Sie folgt der Designrichtung aus dem\n      Konzept - Violett/Blau, sehr heller Grund, dunkles Navy - und bleibt\n      bewusst in einer Welt: sie stellt eine helle App dar, unabhängig davon,\n      in welchem Erscheinungsbild der Betrachter diese Seite öffnet. Alle\n      Farben sind trotzdem ausdrücklich gesetzt, nie geerbt.\n\n   2. Die Werkbank drumherum. Sie folgt dem Erscheinungsbild des Betrachters\n      und ist über Tokens in drei Zuständen definiert: hell, System-dunkel\n      und ausdrücklich gewählt.\n\n   Die Werte unter --jf- stimmen mit packages/config/src/theme.ts überein.\n   ========================================================================== */\n\n:root {\n  /* --- Werkbank, hell ---------------------------------------------------- */\n  --ground: #E9EBF4;\n  --ground-deep: #DFE2EF;\n  --panel: #FFFFFF;\n  --panel-soft: #F4F5FB;\n  --ink: #171C36;\n  --ink-muted: #5B6386;\n  --ink-faint: #868DAC;\n  --rule: #D6DAEA;\n  --accent: #4438C7;\n  --accent-soft: #EDEBFE;\n  --shadow-device: 0 40px 80px -24px rgba(23, 28, 54, .38), 0 8px 24px -8px rgba(23, 28, 54, .2);\n  --shadow-panel: 0 1px 3px rgba(23, 28, 54, .06), 0 8px 24px -16px rgba(23, 28, 54, .18);\n\n  /* --- Die App (in beiden Erscheinungsbildern gleich) --------------------- */\n  --jf-primary: #5B4CF0;\n  --jf-primary-dark: #4438C7;\n  --jf-primary-light: #EDEBFE;\n  --jf-bg: #F6F7FB;\n  --jf-surface: #FFFFFF;\n  --jf-surface-muted: #F0F1F7;\n  --jf-text: #131A34;\n  --jf-muted: #5A6284;\n  --jf-inverted: #FFFFFF;\n  --jf-border: #E3E5EF;\n  --jf-success: #1FA971;\n  --jf-success-light: #E4F7EF;\n  --jf-warning: #E08A1E;\n  --jf-warning-light: #FDF2E1;\n  --jf-error: #D8464F;\n  --jf-error-light: #FCEAEB;\n  --jf-ai: #7A5AF8;\n  --jf-ai-light: #F1EDFE;\n\n  --font-display: \"Poppins\", \"Segoe UI\", system-ui, sans-serif;\n  --font-body: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  color-scheme: light;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --ground: #0F1226;\n    --ground-deep: #090B1A;\n    --panel: #191E38;\n    --panel-soft: #222842;\n    --ink: #E9EBF7;\n    --ink-muted: #9AA2C4;\n    --ink-faint: #757D9F;\n    --rule: #2C3357;\n    --accent: #A99BFF;\n    --accent-soft: #262C4C;\n    --shadow-device: 0 40px 80px -24px rgba(0, 0, 0, .7), 0 8px 24px -8px rgba(0, 0, 0, .5);\n    --shadow-panel: 0 1px 3px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .5);\n    color-scheme: dark;\n  }\n}\n\n:root[data-theme=\"dark\"] {\n  --ground: #0F1226;\n  --ground-deep: #090B1A;\n  --panel: #191E38;\n  --panel-soft: #222842;\n  --ink: #E9EBF7;\n  --ink-muted: #9AA2C4;\n  --ink-faint: #757D9F;\n  --rule: #2C3357;\n  --accent: #A99BFF;\n  --accent-soft: #262C4C;\n  --shadow-device: 0 40px 80px -24px rgba(0, 0, 0, .7), 0 8px 24px -8px rgba(0, 0, 0, .5);\n  --shadow-panel: 0 1px 3px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .5);\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background:\n    radial-gradient(1200px 700px at 18% -10%, var(--ground) 0%, var(--ground-deep) 100%);\n  color: var(--ink);\n  font-family: var(--font-body);\n  font-size: 15px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  min-height: 100vh;\n}\n\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n  border-radius: 4px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .001ms !important;\n  }\n}\n\n/* ==========================================================================\n   Werkbank\n   ========================================================================== */\n\n.shell {\n  max-width: 1280px;\n  margin: 0 auto;\n  padding: 32px 24px 64px;\n}\n\n.masthead {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: flex-end;\n  justify-content: space-between;\n  gap: 20px;\n  padding-bottom: 24px;\n  border-bottom: 1px solid var(--rule);\n  margin-bottom: 32px;\n}\n\n.masthead__id { display: flex; flex-direction: column; gap: 6px; }\n\n.wordmark {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 30px;\n  letter-spacing: -.02em;\n  color: var(--ink);\n  margin: 0;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.wordmark__dot {\n  width: 12px; height: 12px; border-radius: 50%;\n  background: var(--jf-primary);\n  box-shadow: 0 0 0 4px color-mix(in srgb, var(--jf-primary) 22%, transparent);\n}\n\n.masthead__slogan {\n  margin: 0;\n  color: var(--ink-muted);\n  font-size: 14px;\n}\n\n.masthead__note {\n  margin: 0;\n  max-width: 46ch;\n  font-size: 13px;\n  color: var(--ink-faint);\n  text-wrap: pretty;\n}\n\n.theme-toggle {\n  appearance: none;\n  border: 1px solid var(--rule);\n  background: var(--panel);\n  color: var(--ink-muted);\n  border-radius: 999px;\n  padding: 7px 14px;\n  font: inherit;\n  font-size: 13px;\n  cursor: pointer;\n  transition: color .15s, border-color .15s;\n}\n.theme-toggle:hover { color: var(--ink); border-color: var(--ink-faint); }\n\n.workbench {\n  display: grid;\n  grid-template-columns: minmax(0, 420px) minmax(0, 1fr);\n  gap: 40px;\n  align-items: start;\n}\n\n@media (max-width: 940px) {\n  .workbench { grid-template-columns: minmax(0, 1fr); gap: 32px; justify-items: center; }\n  .console { width: 100%; max-width: 560px; }\n}\n\n/* --- Gerät --------------------------------------------------------------- */\n\n.stage { position: sticky; top: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; }\n@media (max-width: 940px) { .stage { position: static; } }\n\n.device {\n  width: 390px;\n  max-width: 100%;\n  /* Auf einem flachen Fenster soll das Gerät mitschrumpfen, statt unten\n     herauszulaufen - es klebt oben fest und muss vollständig sichtbar sein. */\n  height: min(800px, 82vh);\n  min-height: 520px;\n  border-radius: 46px;\n  padding: 12px;\n  background: linear-gradient(160deg, #3A4066 0%, #191D33 40%, #23283F 100%);\n  box-shadow: var(--shadow-device);\n  flex: none;\n}\n\n.device__screen {\n  position: relative;\n  height: 100%;\n  border-radius: 35px;\n  overflow: hidden;\n  background: var(--jf-bg);\n  display: flex;\n  flex-direction: column;\n  isolation: isolate;\n}\n\n.statusbar {\n  flex: none;\n  height: 44px;\n  padding: 0 26px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--jf-text);\n  background: var(--jf-bg);\n  letter-spacing: .01em;\n}\n.statusbar__icons { display: flex; gap: 5px; align-items: center; opacity: .8; font-size: 11px; }\n\n.viewport {\n  flex: 1;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  background: var(--jf-bg);\n  scrollbar-width: thin;\n  scrollbar-color: var(--jf-border) transparent;\n}\n.viewport::-webkit-scrollbar { width: 4px; }\n.viewport::-webkit-scrollbar-thumb { background: var(--jf-border); border-radius: 4px; }\n\n.screen {\n  padding: 20px 20px 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n  min-height: 100%;\n  animation: screen-in .26s cubic-bezier(.22, .9, .3, 1);\n}\n\n@keyframes screen-in {\n  from { opacity: 0; transform: translateY(8px); }\n  to { opacity: 1; transform: none; }\n}\n\n.device__caption {\n  font-size: 12.5px;\n  color: var(--ink-faint);\n  text-align: center;\n  font-variant-numeric: tabular-nums;\n}\n.device__caption b { color: var(--ink-muted); font-weight: 600; }\n\n/* ==========================================================================\n   Die App - Bausteine\n   Große runde Karten, klare Buttons, großzügige Abstände.\n   ========================================================================== */\n\n.jf-h1 {\n  font-family: var(--font-display);\n  font-size: 25px; font-weight: 700; line-height: 1.2;\n  color: var(--jf-text); margin: 0; letter-spacing: -.02em;\n  text-wrap: balance;\n}\n.jf-h2 {\n  font-family: var(--font-display);\n  font-size: 18px; font-weight: 600; color: var(--jf-text); margin: 0;\n  letter-spacing: -.01em;\n}\n.jf-greeting { font-size: 15px; color: var(--jf-muted); margin: 0 0 2px; }\n.jf-body { font-size: 14.5px; color: var(--jf-text); margin: 0; line-height: 1.6; }\n.jf-muted { font-size: 13.5px; color: var(--jf-muted); margin: 0; line-height: 1.55; }\n.jf-caption { font-size: 12px; color: var(--jf-muted); margin: 0; }\n.jf-label {\n  font-size: 12.5px; font-weight: 500; color: var(--jf-muted);\n  margin: 0 0 6px; display: block;\n}\n\n.jf-card {\n  background: var(--jf-surface);\n  border-radius: 20px;\n  padding: 18px;\n  box-shadow: 0 4px 12px rgba(19, 26, 52, .06);\n  display: flex; flex-direction: column; gap: 10px;\n  text-align: left; width: 100%; border: none;\n  font-family: inherit; color: inherit;\n}\nbutton.jf-card { cursor: pointer; transition: transform .12s, box-shadow .12s; }\nbutton.jf-card:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(19, 26, 52, .1); }\nbutton.jf-card:active { transform: translateY(0); }\n\n.jf-btn {\n  appearance: none; border: none; cursor: pointer;\n  font-family: var(--font-body);\n  font-size: 15px; font-weight: 600;\n  padding: 15px 20px; border-radius: 16px;\n  min-height: 52px;\n  display: flex; align-items: center; justify-content: center; gap: 9px;\n  width: 100%;\n  transition: filter .12s, transform .12s;\n}\n.jf-btn:hover { filter: brightness(1.06); }\n.jf-btn:active { transform: scale(.985); }\n.jf-btn--primary { background: var(--jf-primary); color: var(--jf-inverted); }\n.jf-btn--secondary { background: var(--jf-primary-light); color: var(--jf-primary-dark); }\n.jf-btn--ghost { background: transparent; color: var(--jf-primary); min-height: 44px; padding: 10px; }\n.jf-btn--danger { background: var(--jf-error-light); color: var(--jf-error); }\n.jf-btn--sm { min-height: 42px; padding: 10px 16px; font-size: 14px; border-radius: 13px; }\n.jf-btn[disabled] { opacity: .45; cursor: not-allowed; }\n.jf-btn__icon { font-size: 17px; line-height: 1; }\n\n.jf-row { display: flex; gap: 10px; }\n.jf-row--between { justify-content: space-between; align-items: center; }\n.jf-stack { display: flex; flex-direction: column; gap: 12px; }\n.jf-stack--tight { gap: 8px; }\n.jf-spacer { flex: 1; }\n\n/* Eingabefelder */\n.jf-input, .jf-textarea {\n  width: 100%;\n  background: var(--jf-surface);\n  border: 1px solid var(--jf-border);\n  border-radius: 13px;\n  padding: 13px 15px;\n  font-family: var(--font-body);\n  font-size: 15px;\n  color: var(--jf-text);\n  min-height: 50px;\n}\n.jf-textarea { min-height: 110px; resize: none; line-height: 1.55; }\n.jf-input:focus, .jf-textarea:focus { outline: 2px solid var(--jf-primary); outline-offset: -1px; border-color: transparent; }\n.jf-input::placeholder, .jf-textarea::placeholder { color: #98A0BC; }\n.jf-hint { font-size: 11.5px; color: var(--jf-muted); margin: 5px 0 0; }\n.jf-error-text { font-size: 11.5px; color: var(--jf-error); margin: 5px 0 0; }\n\n/* Abzeichen */\n.jf-badge {\n  display: inline-flex; align-items: center; gap: 4px;\n  padding: 4px 11px; border-radius: 999px;\n  font-size: 11.5px; font-weight: 600;\n  background: var(--jf-surface-muted); color: var(--jf-muted);\n  white-space: nowrap;\n}\n.jf-badge--success { background: var(--jf-success-light); color: var(--jf-success); }\n.jf-badge--warning { background: var(--jf-warning-light); color: var(--jf-warning); }\n.jf-badge--error { background: var(--jf-error-light); color: var(--jf-error); }\n.jf-badge--ai { background: var(--jf-ai-light); color: var(--jf-ai); }\n.jf-badge--primary { background: var(--jf-primary-light); color: var(--jf-primary-dark); }\n\n/* Ein Abzeichen als direktes Kind einer Flex-Spalte würde sonst auf die volle\n   Breite gestreckt. In einer Reihe soll es dagegen mittig ausgerichtet bleiben. */\n.jf-card > .jf-badge, .screen > .jf-badge { align-self: flex-start; }\n\n/* Kategorien */\n.jf-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n.jf-cat {\n  background: var(--jf-surface); border: none; border-radius: 17px;\n  padding: 15px 6px; cursor: pointer;\n  display: flex; flex-direction: column; align-items: center; gap: 7px;\n  box-shadow: 0 3px 10px rgba(19, 26, 52, .055);\n  font-family: inherit;\n  transition: transform .12s, box-shadow .12s;\n}\n.jf-cat:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(19, 26, 52, .1); }\n.jf-cat__icon { font-size: 25px; line-height: 1; }\n.jf-cat__name { font-size: 12px; font-weight: 500; color: var(--jf-text); text-align: center; }\n\n/* Auswahl in Reihe (Dringlichkeit, Rolle) */\n.jf-choice {\n  flex: 1; background: var(--jf-surface);\n  border: 2px solid var(--jf-border); border-radius: 13px;\n  padding: 11px 8px; cursor: pointer; font-family: inherit;\n  font-size: 13px; color: var(--jf-muted); text-align: center;\n  transition: border-color .12s, background .12s, color .12s;\n}\n.jf-choice[aria-pressed=\"true\"] {\n  border-color: var(--jf-primary); background: var(--jf-primary-light);\n  color: var(--jf-primary-dark); font-weight: 600;\n}\n\n.jf-option {\n  background: var(--jf-surface); border: 2px solid var(--jf-border);\n  border-radius: 17px; padding: 15px; cursor: pointer;\n  font-family: inherit; text-align: left; width: 100%;\n  display: flex; flex-direction: column; gap: 3px;\n  transition: border-color .12s, background .12s;\n}\n.jf-option[aria-pressed=\"true\"] { border-color: var(--jf-primary); background: var(--jf-primary-light); }\n.jf-option__title { font-size: 14.5px; font-weight: 600; color: var(--jf-text); }\n.jf-option[aria-pressed=\"true\"] .jf-option__title { color: var(--jf-primary-dark); }\n.jf-option__desc { font-size: 12.5px; color: var(--jf-muted); }\n\n/* KI-Bereich: eigene Farbe, damit KI-Inhalte erkennbar bleiben */\n.jf-ai {\n  background: var(--jf-ai-light);\n  border-radius: 18px; padding: 16px;\n  display: flex; flex-direction: column; gap: 9px;\n}\n.jf-ai__head { display: flex; align-items: center; gap: 8px; }\n.jf-ai__title { font-size: 12.5px; font-weight: 600; color: var(--jf-ai); }\n.jf-ai__disclaimer { font-size: 11.5px; color: var(--jf-muted); line-height: 1.5; }\n.jf-ai__field { display: flex; flex-direction: column; gap: 2px; }\n.jf-ai__field dt { font-size: 11.5px; color: var(--jf-muted); }\n.jf-ai__field dd { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--jf-text); }\n\n.jf-thinking { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 46px 0; }\n.jf-thinking__orb {\n  width: 76px; height: 76px; border-radius: 50%;\n  background: var(--jf-ai-light);\n  display: grid; place-items: center; font-size: 34px;\n  animation: pulse 1.5s ease-in-out infinite;\n}\n@keyframes pulse {\n  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--jf-ai) 32%, transparent); }\n  50% { box-shadow: 0 0 0 18px color-mix(in srgb, var(--jf-ai) 0%, transparent); }\n}\n.jf-thinking__steps { display: flex; flex-direction: column; gap: 9px; width: 100%; }\n.jf-thinking__step {\n  display: flex; align-items: center; gap: 10px;\n  font-size: 13.5px; color: var(--jf-muted);\n  opacity: .35; transition: opacity .3s, color .3s;\n}\n.jf-thinking__step.is-on { opacity: 1; color: var(--jf-text); }\n.jf-thinking__step.is-on .jf-thinking__tick { color: var(--jf-success); }\n.jf-thinking__tick { color: var(--jf-border); font-weight: 700; }\n\n/* Zeitstrahl des Auftragsstatus */\n.jf-timeline { display: flex; flex-direction: column; }\n.jf-tl { display: flex; gap: 12px; }\n.jf-tl__col { display: flex; flex-direction: column; align-items: center; width: 26px; flex: none; }\n.jf-tl__dot {\n  width: 24px; height: 24px; border-radius: 50%;\n  display: grid; place-items: center;\n  font-size: 11px; font-weight: 700;\n  background: var(--jf-surface-muted); color: var(--jf-muted);\n}\n.jf-tl__dot--done { background: var(--jf-success); color: #fff; }\n.jf-tl__dot--now { background: var(--jf-primary); color: #fff; }\n.jf-tl__line { width: 2px; flex: 1; min-height: 22px; background: var(--jf-border); }\n.jf-tl__line--done { background: var(--jf-success); }\n.jf-tl__label { flex: 1; font-size: 13.5px; color: var(--jf-muted); padding-bottom: 18px; }\n.jf-tl__label--reached { color: var(--jf-text); font-weight: 500; }\n.jf-tl:last-child .jf-tl__label { padding-bottom: 0; }\n\n/* Preisaufstellung */\n.jf-price { display: flex; flex-direction: column; gap: 7px; y: flex; align-items: center; gap: 10px;\n  padding: 7px 10px; border-radius: 9px;\n  border: none; background: none; cursor: pointer;\n  font-family: inherit; font-size: 13px; color: var(--ink-muted);\n  text-align: left; width: 100%;\n  transition: background .12s, color .12s;\n}\n.step:hover { background: var(--panel-soft); color: var(--ink); }\n.step.is-current { background: var(--accent-soft); color: var(--ink); font-weight: 600; }\n.step__no {\n  font-family: var(--font-mono); font-size: 10.5px;\n  color: var(--ink-faint); width: 20px; flex: none;\n  font-variant-numeric: tabular-nums;\n}\n.step.is-current .step__no { color: var(--accent); }\n.step__done { color: var(--jf-success); font-size: 11px; margin-left: auto; flex: none; }\n\n.log {\n  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.7;\n  max-height: 260px; overflow-y: auto;\n  display: flex; flex-direction: column-reverse; gap: 2px;\n  padding: 14px 18px;\n  scrollbar-width: thin;\n}\n.log__row { display: flex; gap: 9px; align-items: baseline; }\n.log__verb { font-weight: 500; flex: none; width: 46px; }\n.log__verb--POST { color: #2E9E6B; }\n.log__verb--GET { color: var(--accent); }\n.log__verb--PATCH { color: #C98520; }\n.log__path { color: var(--ink); word-break: break-all; }\n.log__status { margin-left: auto; color: var(--ink-faint); flex: none; }\n.log__empty { color: var(--ink-faint); font-style: italic; }\n\n.notes { font-size: 12.5px; color: var(--ink-muted); line-height: 1.6; display: flex; flex-direction: column; gap: 10px; }\n.notes p { margin: 0; text-wrap: pretty; }\n.notes strong { color: var(--ink); font-weight: 600; }\n.notes code {\n  font-family: var(--font-mono); font-size: 11.5px;\n  background: var(--panel-soft); padding: 1px 5px; border-radius: 4px;\n  border: 1px solid var(--rule);\n}\n\n.reset {\n  appearance: none; border: 1px solid var(--rule); background: var(--panel-soft);\n  color: var(--ink-muted); border-radius: 9px; padding: 8px 13px;\n  font: inherit; font-size: 12.5px; cursor: pointer; align-self: flex-start;\n}\n.reset:hover { color: var(--ink); border-color: var(--ink-faint); }\n<\/style>\n\n<div class=\"shell\">\n  <header class=\"masthead\">\n    <div class=\"masthead__id\">\n      <h1 class=\"wordmark\"><span class=\"wordmark__dot\"><\/span>JobFlow<\/h1>\n      <p class=\"masthead__slogan\">Von der Anfrage zum Auftrag.<\/p>\n    <\/div>\n    <p class=\"masthead__note\">\n      Klickbarer Prototyp mit Beispieldaten. Die Regel-KI und die\n      Matching-Berechnung sind aus dem echten Backend übernommen &mdash;\n      beschreib ein anderes Problem, und beides rechnet neu.\n    <\/p>\n    <button class=\"theme-toggle\" id=\"themeToggle\" type=\"button\">Dunkel<\/button>\n  <\/header>\n\n  <div class=\"workbench\">\n    <div class=\"stage\">\n      <div class=\"device\">\n        <div class=\"device__screen\">\n          <div class=\"statusbar\">\n            <span id=\"clock\">9:41<\/span>\n            <span class=\"statusbar__icons\"><span>&#9679;&#9679;&#9679;<\/span><span>&#9650;<\/span><span>&#9632;<\/span><\/span>\n          <\/div>\n          <div class=\"viewport\" id=\"viewport\"><\/div>\n          <nav class=\"jf-nav\" id=\"nav\"><\/nav>\n        <\/div>\n      <\/div>\n      <p class=\"device__caption\" id=\"caption\"><\/p>\n    <\/div>\n\n    <div class=\"console\">\n      <section class=\"panel\">\n        <div class=\"panel__head\">\n          <h2 class=\"panel__title\">Rolle<\/h2>\n          <span class=\"panel__meta\">eine Codebasis, zwei Oberflächen<\/span>\n        <\/div>\n        <div class=\"panel__body\">\n          <div class=\"roles\" id=\"roles\"><\/div>\n          <button class=\"reset\" id=\"reset\" type=\"button\">Prototyp zurücksetzen<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\">\n        <div class=\"panel__head\">\n          <h2 class=\"panel__title\">Ablauf<\/h2>\n          <span class=\"panel__meta\" id=\"progress\"><\/span>\n        <\/div>\n        <div class=\"panel__body\">\n          <div class=\"flowmap\" id=\"flowmap\"><\/div>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\">\n        <div class=\"panel__head\">\n          <h2 class=\"panel__title\">Was das Backend tut<\/h2>\n          <span class=\"panel__meta\">echte Endpunkte<\/span>\n        <\/div>\n        <div class=\"log\" id=\"log\"><\/div>\n      <\/section>\n\n      <section class=\"panel\">\n        <div class=\"panel__head\">\n          <h2 class=\"panel__title\">Zum Weiterlesen<\/h2>\n        <\/div>\n        <div class=\"panel__body notes\">\n          <p>\n            <strong>Die KI entscheidet nichts Verbindliches.<\/strong> Sie erkennt die\n            Kategorie und schlägt einen Angebotstext vor &mdash; über Preis und\n            Inhalt entscheidet das Unternehmen. Alles, was von ihr kommt, ist\n            violett hinterlegt und beschriftet.\n          <\/p>\n          <p>\n            <strong>Der Matching-Score wird gerechnet, nicht gesetzt.<\/strong>\n            Passende Leistung 35, Entfernung 20, Verfügbarkeit 15, Bewertung 10,\n            Preis 10, Erfahrung 5, Antwortzeit 5 &mdash; dieselbe Funktion wie in\n            <code>modules/matching/engine.ts<\/code>.\n          <\/p>\n          <p>\n            Diese Vorschau läuft ohne Server. Der echte Ablauf mit PostgreSQL\n            steht im Repository unter <code>jobflow/<\/code> und ist mit einem\n            End-to-End-Test abgesichert.\n          <\/p>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n\"use strict\";\n\n/* ==========================================================================\n   1. Daten\n   Beispieldaten, die im echten System aus PostgreSQL kämen.\n   ========================================================================== */\n\nconst CATEGORIES = [\n  { slug: \"handwerk\", name: \"Handwerk\", icon: \"\\u{1F528}\" },\n  { slug: \"auto\", name: \"Auto\", icon: \"\\u{1F697}\" },\n  { slug: \"haushalt\", name: \"Haushalt\", icon: \"\\u{1F3E0}\" },\n  { slug: \"garten\", name: \"Garten\", icon: \"\\u{1F333}\" },\n  { slug: \"dienstleistungen\", name: \"Service\", icon: \"\\u{1F4F8}\" },\n  { slug: \"lernen\", name: \"Lernen\", icon: \"\\u{1F4DA}\" }\n];\n\nconst SUBCATEGORIES = {\n  heizung: { name: \"Heizung\", parent: \"handwerk\", icon: \"\\u{1F525}\" },\n  sanitaer: { name: \"Sanitär\", parent: \"handwerk\", icon: \"\\u{1F6BF}\" },\n  elektrik: { name: \"Elektrik\", parent: \"handwerk\", icon: \"\\u{1F4A1}\" },\n  maler: { name: \"Maler\", parent: \"handwerk\", icon: \"\\u{1F3A8}\" },\n  dach: { name: \"Dach\", parent: \"handwerk\", icon: \"\\u{1F3D8}\" },\n  schluessel: { name: \"Schlüsseldienst\", parent: \"handwerk\", icon: \"\\u{1F511}\" },\n  \"kfz-reparatur\": { name: \"Reparatur\", parent: \"auto\", icon: \"\\u{1F527}\" },\n  \"kfz-reifen\": { name: \"Reifen\", parent: \"auto\", icon: \"\\u{1F6DE}\" },\n  reinigung: { name: \"Reinigung\", parent: \"haushalt\", icon: \"\\u{1F9FD}\" },\n  umzug: { name: \"Umzug\", parent: \"haushalt\", icon: \"\\u{1F4E6}\" },\n  montage: { name: \"Möbelmontage\", parent: \"haushalt\", icon: \"\\u{1FA9B}\" },\n  gartenpflege: { name: \"Gartenpflege\", parent: \"garten\", icon: \"✂️\" },\n  baumpflege: { name: \"Baumpflege\", parent: \"garten\", icon: \"\\u{1F332}\" },\n  fotografie: { name: \"Fotografie\", parent: \"dienstleistungen\", icon: \"\\u{1F4F7}\" },\n  nachhilfe: { name: \"Nachhilfe\", parent: \"lernen\", icon: \"✏️\" }\n};\n\n/* Betriebe mit den Kennzahlen, die ins Matching einfließen. */\nconst BUSINESSES = [\n  { id: \"b1\", name: \"HeizPro Essen\", categories: [\"heizung\", \"sanitaer\"], distanceKm: 3.2, radius: 40,\n    availability: true, rating: 4.9, reviews: 238, jobs: 412, responseMin: 18,\n    priceMin: 9000, priceMax: 15000, verified: true, blurb: \"Heizungsbau und Sanitär seit 1998.\" },\n  { id: \"b2\", name: \"WärmeFix\", categories: [\"heizung\"], distanceKm: 4.1, radius: 30,\n    availability: true, rating: 4.7, reviews: 96, jobs: 148, responseMin: 42,\n    priceMin: 11000, priceMax: 17000, verified: true, blurb: \"Schnelldienst für Heizungsstörungen.\" },\n  { id: \"b3\", name: \"Ruhr Haustechnik\", categories: [\"handwerk\"], distanceKm: 8.7, radius: 50,\n    availability: false, rating: 4.4, reviews: 41, jobs: 63, responseMin: 210,\n    priceMin: 8000, priceMax: 22000, verified: false, blurb: \"Haustechnik aus einer Hand - alle Gewerke.\" },\n  { id: \"b4\", name: \"Sanitär Kaya\", categories: [\"sanitaer\"], distanceKm: 2.4, radius: 25,\n    availability: true, rating: 4.8, reviews: 154, jobs: 289, responseMin: 25,\n    priceMin: 7000, priceMax: 13000, verified: true, blurb: \"Bad, Rohr und Abfluss.\" },\n  { id: \"b5\", name: \"Elektro Nowak\", categories: [\"elektrik\"], distanceKm: 5.5, radius: 35,\n    availability: true, rating: 4.6, reviews: 88, jobs: 176, responseMin: 55,\n    priceMin: 8500, priceMax: 16000, verified: true, blurb: \"Elektroinstallation und Störungssuche.\" },\n  { id: \"b6\", name: \"GartenWerk\", categories: [\"gartenpflege\", \"baumpflege\"], distanceKm: 6.1, radius: 30,\n    availability: true, rating: 4.8, reviews: 112, jobs: 203, responseMin: 33,\n    priceMin: 4000, priceMax: 9000, verified: true, blurb: \"Pflege, Schnitt und Gestaltung.\" },\n  { id: \"b7\", name: \"Umzugshelden\", categories: [\"umzug\", \"montage\"], distanceKm: 9.4, radius: 60,\n    availability: true, rating: 4.5, reviews: 67, jobs: 121, responseMin: 70,\n    priceMin: 25000, priceMax: 60000, verified: true, blurb: \"Umzüge im ganzen Ruhrgebiet.\" },\n  { id: \"b8\", name: \"Auto Service Bergmann\", categories: [\"kfz-reparatur\", \"kfz-reifen\"], distanceKm: 4.8, radius: 25,\n    availability: true, rating: 4.6, reviews: 201, jobs: 508, responseMin: 40,\n    priceMin: 6000, priceMax: 45000, verified: true, blurb: \"Freie Werkstatt, alle Marken.\" },\n  { id: \"b9\", name: \"Glanz Reinigung\", categories: [\"reinigung\"], categoriesAlt: [], distanceKm: 3.9, radius: 30,\n    availability: true, rating: 4.3, reviews: 29, jobs: 88, responseMin: 90,\n    priceMin: 3000, priceMax: 8000, verified: false, blurb: \"Unterhalts- und Grundreinigung.\" },\n  { id: \"b10\", name: \"Maler Schäfer\", categories: [\"maler\"], distanceKm: 7.2, radius: 40,\n    availability: true, rating: 4.9, reviews: 74, jobs: 139, responseMin: 28,\n    priceMin: 15000, priceMax: 40000, verified: true, blurb: \"Anstrich, Tapete, Fassade.\" }\n];\n\n/* ==========================================================================\n   2. Die Regel-KI\n   Übernommen aus services/api/src/modules/ai/rules-provider.ts.\n   Sie ist kein Sprachmodell, erfüllt aber denselben Vertrag - genau darum\n   lässt sich die Plattform ohne externen Dienst vorführen.\n   ========================================================================== */\n\nconst RULES = [\n  { slug: \"heizung\",\n    keywords: [\"heizung\", \"heizkörper\", \"heizkoerper\", \"thermostat\", \"warmwasser\", \"therme\", \"kessel\"],\n    summary: \"Die Heizung arbeitet nicht wie erwartet.\",\n    questions: [\"Sind mehrere Heizkörper betroffen oder nur einer?\", \"Seit wann besteht das Problem?\", \"Welche Heizungsanlage ist verbaut?\"] },\n  { slug: \"sanitaer\",\n    keywords: [\"waschbecken\", \"wasserhahn\", \"abfluss\", \"toilette\", \"wc\", \"dusche\", \"rohr\", \"tropft\", \"undicht\", \"verstopft\", \"spülkasten\"],\n    summary: \"An der Sanitärinstallation tritt ein Defekt auf.\",\n    questions: [\"Wo genau tritt das Wasser aus?\", \"Seit wann besteht das Problem?\", \"Lässt sich das Wasser abstellen?\"] },\n  { slug: \"elektrik\",\n    keywords: [\"strom\", \"steckdose\", \"sicherung\", \"lichtschalter\", \"kabel\", \"kurzschluss\", \"lampe\"],\n    summary: \"Es liegt eine Störung an der Elektroinstallation vor.\",\n    questions: [\"Ist nur ein Raum betroffen oder die ganze Wohnung?\", \"Hat die Sicherung ausgelöst?\"] },\n  { slug: \"maler\",\n    keywords: [\"streichen\", \"malern\", \"tapete\", \"wand\", \"anstrich\", \"lackieren\", \"farbe\"],\n    summary: \"Es werden Malerarbeiten benötigt.\",\n    questions: [\"Wie viele Quadratmeter sind es ungefähr?\", \"Sind die Wände vorbereitet?\"] },\n  { slug: \"dach\",\n    keywords: [\"dach\", \"ziegel\", \"dachrinne\", \"regenrinne\", \"dachfenster\"],\n    summary: \"Am Dach besteht ein Schaden.\",\n    questions: [\"Tritt bereits Wasser ins Gebäude ein?\", \"Wie viele Geschosse hat das Gebäude?\"] },\n  { slug: \"schluessel\",\n    keywords: [\"ausgesperrt\", \"schlüssel\", \"schluessel\", \"schloss\"],\n    summary: \"Es besteht ein Problem mit Schloss oder Zugang.\",\n    questions: [\"Befindet sich jemand in der Wohnung?\", \"Um welche Art von Tür handelt es sich?\"] },\n  { slug: \"kfz-reparatur\",\n    keywords: [\"auto\", \"motor\", \"bremse\", \"kupplung\", \"auspuff\", \"werkstatt\", \"fahrzeug\", \"pkw\"],\n    summary: \"Am Fahrzeug ist eine Reparatur nötig.\",\n    questions: [\"Welches Fahrzeugmodell und Baujahr?\", \"Ist das Fahrzeug noch fahrbereit?\"] },\n  { slug: \"kfz-reifen\",\n    keywords: [\"reifen\", \"felge\", \"reifenwechsel\", \"platten\", \"winterreifen\", \"sommerreifen\"],\n    summary: \"Es geht um Reifen oder einen Reifenwechsel.\",\n    questions: [\"Welche Reifengröße wird benötigt?\", \"Sind die Reifen bereits vorhanden?\"] },\n  { slug: \"reinigung\",\n    keywords: [\"putzen\", \"reinigung\", \"sauber\", \"fenster putzen\", \"grundreinigung\"],\n    summary: \"Es werden Reinigungsarbeiten benötigt.\",\n    questions: [\"Wie groß ist die zu reinigende Fläche?\", \"Einmalig oder regelmäßig?\"] },\n  { slug: \"umzug\",\n    keywords: [\"umzug\", \"umziehen\", \"transport\", \"kisten\", \"möbel transportieren\"],\n    summary: \"Es steht ein Umzug oder Transport an.\",\n    questions: [\"Von welchem in welches Stockwerk?\", \"Wie viele Zimmer sind es?\"] },\n  { slug: \"montage\",\n    keywords: [\"aufbauen\", \"montage\", \"schrank\", \"regal\", \"möbel aufbauen\", \"küche montieren\"],\n    summary: \"Es sollen Möbel montiert werden.\",\n    questions: [\"Um welche Möbelstücke geht es?\", \"Liegt eine Aufbauanleitung vor?\"] },\n  { slug: \"gartenpflege\",\n    keywords: [\"rasen\", \"hecke\", \"unkraut\", \"garten\", \"mähen\", \"maehen\", \"beet\"],\n    summary: \"Der Garten soll gepflegt werden.\",\n    questions: [\"Wie groß ist die Fläche ungefähr?\", \"Einmalig oder regelmäßig?\"] },\n  { slug: \"baumpflege\",\n    keywords: [\"baum\", \"baumfällung\", \"äste\", \"aeste\", \"stubben\"],\n    summary: \"An Bäumen sind Arbeiten nötig.\",\n    questions: [\"Wie hoch ist der Baum ungefähr?\", \"Steht er frei zugänglich?\"] },\n  { slug: \"nachhilfe\",\n    keywords: [\"nachhilfe\", \"mathe\", \"lernen\", \"schule\", \"hausaufgaben\", \"abitur\"],\n    summary: \"Es wird Unterstützung beim Lernen gesucht.\",\n    questions: [\"Um welches Fach und welche Klassenstufe geht es?\", \"Präsenz oder online?\"] },\n  { slug: \"fotografie\",\n    keywords: [\"foto\", \"fotograf\", \"shooting\", \"hochzeit\", \"portrait\", \"bilder\"],\n    summary: \"Es wird ein Fotograf gesucht.\",\n    questions: [\"Um welchen Anlass geht es?\", \"Wann soll der Termin stattfinden?\"] }\n];\n\nconst URGENT_WORDS = [\"notfall\", \"dringend\", \"sofort\", \"läuft aus\", \"laeuft aus\", \"überschwemmt\",\n  \"wasserschaden\", \"kein strom\", \"ausgesperrt\", \"gasgeruch\", \"brennt\", \"friert\"];\nconst RELAXED_WORDS = [\"irgendwann\", \"keine eile\", \"gelegentlich\", \"in den nächsten wochen\"];\n\nfunction analyze(description, photoCount, answered) {\n  const hay = String(description).toLowerCase().replace(/\\s+/g, \" \");\n  let best = null;\n  for (const rule of RULES) {\n    const hits = rule.keywords.filter((k) => hay.includes(k)).length;\n    if (hits > 0 && (best === null || hits > best.hits)) best = { rule, hits };\n  }\n\n  const urgency = URGENT_WORDS.some((w) => hay.includes(w)) ? \"HIGH\"\n    : RELAXED_WORDS.some((w) => hay.includes(w)) ? \"LOW\" : \"NORMAL\";\n\n  if (best === null) {\n    // Keine Regel greift. Dann sagt die KI das ehrlich, statt zu raten.\n    const clean = String(description).trim().replace(/\\s+/g, \" \");\n    return {\n      categorySlug: null,\n      summary: clean.length < 10\n        ? \"Die Beschreibung reicht noch nicht aus, um das Anliegen einzuordnen.\"\n        : (clean.length > 150 ? clean.slice(0, 149) + \"…\" : clean),\n      urgency,\n      questions: [\"Um welche Art von Leistung geht es genau?\", \"Wo soll die Arbeit ausgeführt werden?\"],\n      confidence: 0.2\n    };\n  }\n\n  const askedSet = new Set((answered || []).map((a) => a.question));\n  const open = best.rule.questions.filter((q) => !askedSet.has(q));\n  return {\n    categorySlug: best.rule.slug,\n    summary: best.rule.summary,\n    urgency,\n    // Ein Foto ersetzt oft eine Rückfrage.\n    questions: photoCount > 0 ? open.slice(0, 2) : open.slice(0, 3),\n    confidence: Math.min(0.9, 0.55 + best.hits * 0.1)\n  };\n}\n\n/* ==========================================================================\n   3. Die Matching-Engine\n   Übernommen aus services/api/src/modules/matching/engine.ts.\n   Die Gewichte sind ein Startmodell - was wirklich zu Aufträgen führt,\n   zeigt sich erst im Betrieb.\n   ========================================================================== */\n\nconst WEIGHTS = { service: 35, distance: 20, availability: 15, rating: 10, price: 10, experience: 5, responseTime: 5 };\n\nconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\nconst saturate = (v, half) => (v <= 0 ? 0 : v / (v + half));\n\nfunction scoreBusiness(biz, categorySlug, referencePrice) {\n  const parent = SUBCATEGORIES[categorySlug] ? SUBCATEGORIES[categorySlug].parent : null;\n  const exact = biz.categories.includes(categorySlug);\n  // Nur die Oberkategorie selbst zählt als teilweise Übereinstimmung, nicht\n  // eine Schwesterkategorie: ein Maler ist kein Treffer für eine Heizung.\n  const viaParent = !exact && parent !== null && biz.categories.includes(parent);\n\n  const f = {\n    service: exact ? 1 : viaParent ? 0.45 : 0,\n    // Außerhalb des Einsatzradius: 0. Ein Betrieb, der nicht hinfährt,\n    // ist kein Treffer, egal wie gut er sonst passt.\n    distance: biz.distanceKm > biz.radius ? 0 : clamp(1 - biz.distanceKm / biz.radius, 0, 1),\n    availability: biz.availability ? 1 : 0,\n    // Wenige Bestbewertungen werden gedämpft: 5,0 aus einer Bewertung soll\n    // 4,7 aus 200 nicht überholen.\n    rating: biz.reviews === 0 ? 0.5 : 0.5 + (clamp((biz.rating - 1) / 4, 0, 1) - 0.5) * saturate(biz.reviews, 20),\n    price: 0.5,\n    experience: saturate(biz.jobs, 25),\n    responseTime: biz.responseMin <= 15 ? 1 : biz.responseMin >= 1440 ? 0 : clamp(1 - (biz.responseMin - 15) / 1425, 0, 1)\n  };\n\n  if (referencePrice > 0) {\n    const own = (biz.priceMin + biz.priceMax) / 2;\n    f.price = clamp(1 - (own / referencePrice - 0.5) / 1.5, 0, 1);\n  }\n\n  const reasons = [];\n  let total = 0;\n  for (const key of Object.keys(WEIGHTS)) {\n    const points = f[key] * WEIGHTS[key];\n    total += points;\n    const label = reasonLabel(key, biz, f[key]);\n    if (label) reasons.push({ factor: key, label, points: Math.round(points * 10) / 10 });\n  }\n\n  return {\n    business: biz,\n    score: Math.round(clamp(total, 0, 100)),\n    reasons: reasons.sort((a, b) => b.points - a.points)\n  };\n}\n\nfunction reasonLabel(factor, biz, value) {\n  switch (factor) {\n    case \"service\": return value === 1 ? \"Bietet genau diese Leistung an\" : value > 0 ? \"Arbeitet in diesem Bereich\" : null;\n    case \"distance\": return value > 0 ? fmtKm(biz.distanceKm) + \" entfernt\" : null;\n    case \"availability\": return biz.availability ? \"Hat freie Zeiten hinterlegt\" : null;\n    case \"rating\": return biz.reviews === 0 ? null : biz.rating.toFixed(1).replace(\".\", \",\") + \" aus \" + biz.reviews + \" Bewertungen\";\n    case \"price\": return value > 0.5 ? \"Preislich günstig\" : null;\n    case \"experience\": return biz.jobs === 0 ? null : biz.jobs + \" abgeschlossene Aufträge\";\n    case \"responseTime\": return \"Antwortet im Schnitt in \" + fmtMin(biz.responseMin);\n    default: return null;\n  }\n}\n\nfunction runMatching(categorySlug) {\n  if (!categorySlug) return [];\n  const parent = SUBCATEGORIES[categorySlug] ? SUBCATEGORIES[categorySlug].parent : null;\n  const pool = BUSINESSES.filter((b) =>\n    b.categories.includes(categorySlug) || (parent !== null && b.categories.includes(parent))\n  );\n  if (pool.length === 0) return [];\n\n  // Bezugspreis ist der Median, nicht der Mittelwert: einzelne Ausreißer\n  // sollen ihn nicht verziehen.\n  const mids = pool.map((b) => (b.priceMin + b.priceMax) / 2).sort((a, b) => a - b);\n  const mid = Math.floor(mids.length / 2);\n  const reference = mids.length % 2 ? mids[mid] : (mids[mid - 1] + mids[mid]) / 2;\n\n  return pool\n    .map((b) => scoreBusiness(b, categorySlug, reference))\n    .filter((m) => m.score >= 25)\n    .sort((a, b) => b.score - a.score)\n    .slice(0, 6);\n}\n\n/* --- Formatierung --------------------------------------------------------- */\n\nconst fmtEuro = (cents) => (cents / 100).toFixed(2).replace(\".\", \",\") + \" €\";\nconst fmtEuroShort = (cents) => Math.round(cents / 100) + \" €\";\nconst fmtKm = (km) => (km < 10 ? km.toFixed(1).replace(\".\", \",\") : Math.round(km)) + \" km\";\nconst fmtMin = (m) => (m < 60 ? m + \" Min.\" : Math.round(m / 60) + \" Std.\");\n\nconst URGENCY_LABELS = { LOW: \"Kann warten\", NORMAL: \"Normal\", HIGH: \"Dringend\" };\nconst STATUS_LABELS = {\n  DRAFT: \"Entwurf\", ANALYZING: \"Wird analysiert\", OPEN: \"Offen\",\n  MATCHING: \"Anbieter gefunden\", OFFERED: \"Angebote erhalten\",\n  ACCEPTED: \"Angebot angenommen\", COMPLETED: \"Abgeschlossen\", CANCELLED: \"Zurückgezogen\"\n};\n\nfunction esc(value) {\n  return String(value).replace(/[&<>\"']/g, (c) =>\n    ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n}\n\n/* ==========================================================================\n   4. Zustand\n   ========================================================================== */\n\nconst initialState = () => ({\n  role: \"customer\",\n  screen: \"welcome\",\n  toast: null,\n  draft: { description: \"\", locationLabel: \"45127 Essen\", urgency: \"NORMAL\", photos: 0 },\n  request: null,\n  analysis: null,\n  answers: {},\n  matches: [],\n  offers: [],\n  openedOfferId: null,\n  acceptedOfferId: null,\n  appointment: null,\n  jobStatus: null,\n  review: null,\n  messages: [],\n  signupRole: \"CUSTOMER\",\n  bizOffer: { labor: 8000, material: 2500, travel: 1500, description: \"\", aiAssisted: false },\n  bizDeclined: false,\n  log: []\n});\n\nlet state = initialState();\n\nfunction logCall(verb, path, status) {\n  state.log.push({ verb, path, status });\n  if (state.log.length > 40) state.log.shift();\n}\n\nfunction toast(text) {\n  state.toast = text;\n  window.clearTimeout(toast._t);\n  toast._t = window.setTimeout(() => { state.toast = null; render(); }, 2600);\n}\n\n/* Das Angebot eines Betriebs - deterministisch aus seiner Preisspanne. */\nfunction offerFor(biz) {\n  const round500 = (n) => Math.round(n / 500) * 500;\n  return {\n    id: \"o-\" + biz.id,\n    businessId: biz.id,\n    labor: round500(biz.priceMin * 0.9),\n    material: round500(biz.priceMin * 0.28),\n    travel: Math.min(3000, round500(biz.distanceKm * 450)),\n    description:\n      \"Anfahrt, Störungssuche und Reparatur an der Anlage. Sollte sich vor Ort ein \" +\n      \"größerer Aufwand zeigen, stimmen wir uns vorher mit Ihnen ab.\",\n    aiAssisted: false,\n    status: \"PENDING\"\n  };\n}\nconst offerTotal = (o) => o.labor + o.material + o.travel;\nconst bizById = (id) => BUSINESSES.find((b) => b.id === id);\nconst offerById = (id) => state.offers.find((o) => o.id === id);\n\n/* ==========================================================================\n   5. Screens - Kundenseite\n   ========================================================================== */\n\nconst screens = {};\n\n/* Screen 01 */\nscreens.welcome = () => `\n  <div class=\"screen\" style=\"justify-content:space-between;padding-top:40px;padding-bottom:40px\">\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px\">\n      <div style=\"font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--jf-primary);letter-spacing:-.03em\">JobFlow<\/div>\n      <p class=\"jf-h2\" style=\"font-size:19px\">Von der Anfrage zum Auftrag.<\/p>\n      <p class=\"jf-muted\" style=\"font-size:14.5px\">\n        Sag uns einfach, was los ist. Wir kümmern uns um den Rest &mdash;\n        passende Betriebe, Angebote und Termin.\n      <\/p>\n    <\/div>\n    <div class=\"jf-stack\">\n      <button class=\"jf-btn jf-btn--primary\" data-go=\"signup\">Konto erstellen<\/button>\n      <button class=\"jf-btn jf-btn--secondary\" data-go=\"login\">Anmelden<\/button>\n      <button class=\"jf-btn jf-btn--ghost\" data-action=\"as-business\">Als Unternehmen starten<\/button>\n    <\/div>\n  <\/div>`;\n\nscreens.signup = () => `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"welcome\">&larr;<\/button><span class=\"jf-topbar__title\">Konto erstellen<\/span><\/div>\n    <p class=\"jf-muted\">Wofür möchtest du JobFlow nutzen?<\/p>\n    <div class=\"jf-stack--tight jf-stack\">\n      <button class=\"jf-option\" data-action=\"signup-role\" data-value=\"CUSTOMER\" aria-pressed=\"${state.signupRole === \"CUSTOMER\"}\">\n        <span class=\"jf-option__title\">Ich suche jemanden<\/span>\n        <span class=\"jf-option__desc\">Problem beschreiben und passende Anbieter finden.<\/span>\n      <\/button>\n      <button class=\"jf-option\" data-action=\"signup-role\" data-value=\"BUSINESS\" aria-pressed=\"${state.signupRole === \"BUSINESS\"}\">\n        <span class=\"jf-option__title\">Ich biete Leistungen an<\/span>\n        <span class=\"jf-option__desc\">Passende Anfragen erhalten und Angebote schreiben.<\/span>\n      <\/button>\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"su-name\">${state.signupRole === \"BUSINESS\" ? \"Name des Unternehmens\" : \"Dein Name\"}<\/label>\n      <input class=\"jf-input\" id=\"su-name\" value=\"${state.signupRole === \"BUSINESS\" ? \"HeizPro Essen\" : \"Max Mustermann\"}\">\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"su-mail\">E-Mail<\/label>\n      <input class=\"jf-input\" id=\"su-mail\" value=\"max@example.de\">\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"su-pw\">Passwort<\/label>\n      <input class=\"jf-input\" id=\"su-pw\" type=\"password\" value=\"ein-langes-passwort\">\n      <p class=\"jf-hint\">Mindestens 10 Zeichen. Länge schützt mehr als Sonderzeichen.<\/p>\n    <\/div>\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-action=\"do-signup\">Konto erstellen<\/button>\n  <\/div>`;\n\nscreens.login = () => `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"welcome\">&larr;<\/button><span class=\"jf-topbar__title\">Anmelden<\/span><\/div>\n    <div>\n      <label class=\"jf-label\" for=\"li-mail\">E-Mail<\/label>\n      <input class=\"jf-input\" id=\"li-mail\" value=\"max@example.de\">\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"li-pw\">Passwort<\/label>\n      <input class=\"jf-input\" id=\"li-pw\" type=\"password\" value=\"ein-langes-passwort\">\n    <\/div>\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-action=\"do-login\">Anmelden<\/button>\n    <button class=\"jf-btn jf-btn--ghost\" data-go=\"signup\">Noch kein Konto? Jetzt erstellen<\/button>\n  <\/div>`;\n\n/* Screen 02 */\nscreens.home = () => {\n  const recent = state.request ? `\n    <div class=\"jf-stack\">\n      <h2 class=\"jf-h2\">Deine letzte Anfrage<\/h2>\n      ${requestCard(state.request)}\n    <\/div>` : \"\";\n\n  return `\n  <div class=\"screen\">\n    <div>\n      <p class=\"jf-greeting\">Hallo Max \\u{1F44B}<\/p>\n      <h1 class=\"jf-h1\">Was brauchst du?<\/h1>\n    <\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-go=\"create\">\n      <span class=\"jf-btn__icon\">✍️<\/span> Problem beschreiben\n    <\/button>\n    <button class=\"jf-btn jf-btn--secondary\" data-action=\"add-photo\">\n      <span class=\"jf-btn__icon\">\\u{1F4F7}<\/span> Foto hinzufügen\n    <\/button>\n    ${recent}\n    <div class=\"jf-stack\">\n      <h2 class=\"jf-h2\">Beliebte Kategorien<\/h2>\n      <div class=\"jf-grid-3\">\n        ${CATEGORIES.map((c) => `\n          <button class=\"jf-cat\" data-action=\"pick-category\" data-value=\"${c.slug}\">\n            <span class=\"jf-cat__icon\">${c.icon}<\/span>\n            <span class=\"jf-cat__name\">${esc(c.name)}<\/span>\n          <\/button>`).join(\"\")}\n      <\/div>\n    <\/div>\n  <\/div>`;\n};\n\nfunction requestCard(req) {\n  const sub = req.categorySlug ? SUBCATEGORIES[req.categorySlug] : null;\n  const tone = req.status === \"COMPLETED\" ? \"success\"\n    : req.status === \"ANALYZING\" ? \"ai\"\n    : req.status === \"OFFERED\" || req.status === \"ACCEPTED\" ? \"success\" : \"\";\n  return `\n    <button class=\"jf-card\" data-go=\"${state.jobStatus ? \"job\" : \"detail\"}\">\n      <div class=\"jf-row\" style=\"flex-wrap:wrap\">\n        <span class=\"jf-badge ${tone ? \"jf-badge--\" + tone : \"\"}\">${STATUS_LABELS[req.status]}<\/span>\n        ${req.urgency === \"HIGH\" ? '<span class=\"jf-badge jf-badge--warning\">Dringend<\/span>' : \"\"}\n        ${sub ? `<span class=\"jf-badge jf-badge--primary\">${sub.icon} ${esc(sub.name)}<\/span>` : \"\"}\n      <\/div>\n      <p class=\"jf-body\" style=\"font-weight:600\">${esc(req.description)}<\/p>\n      <p class=\"jf-caption\">\\u{1F4CD} ${esc(req.locationLabel)} &nbsp;·&nbsp; \\u{1F550} heute<\/p>\n    <\/button>`;\n}\n\n/* Screen 03 */\nscreens.create = () => `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"home\">&larr;<\/button><span class=\"jf-topbar__title\">Anfrage erstellen<\/span><\/div>\n    <h1 class=\"jf-h1\">Was ist passiert?<\/h1>\n    <div>\n      <label class=\"jf-label\" for=\"desc\">Beschreibung<\/label>\n      <textarea class=\"jf-textarea\" id=\"desc\" placeholder=\"Meine Heizung wird nicht mehr richtig warm.\">${esc(state.draft.description)}<\/textarea>\n      <p class=\"jf-hint\">Ein bis zwei Sätze reichen. Den Rest fragt die KI gezielt nach.<\/p>\n    <\/div>\n    <div>\n      <label class=\"jf-label\">Fotos<\/label>\n      <div class=\"jf-row\">\n        ${Array.from({ length: state.draft.photos }, () => `\n          <div style=\"width:66px;height:66px;border-radius:14px;background:var(--jf-surface-muted);display:grid;place-items:center;font-size:24px\">\\u{1F5BC}<\/div>`).join(\"\")}\n        <button data-action=\"add-photo\" style=\"width:66px;height:66px;border-radius:14px;border:2px dashed var(--jf-border);background:var(--jf-surface);font-size:24px;color:var(--jf-muted);cursor:pointer\">+<\/button>\n      <\/div>\n      <p class=\"jf-hint\">Ein Foto ersetzt oft eine Rückfrage.<\/p>\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"loc\">Wo?<\/label>\n      <input class=\"jf-input\" id=\"loc\" value=\"${esc(state.draft.locationLabel)}\">\n      <p class=\"jf-hint\">Postleitzahl und Ort genügen. Die genaue Adresse bekommt nur der beauftragte Betrieb.<\/p>\n    <\/div>\n    <div>\n      <label class=\"jf-label\">Wie dringend ist es?<\/label>\n      <div class=\"jf-row\">\n        ${[\"LOW\", \"NORMAL\", \"HIGH\"].map((u) => `\n          <button class=\"jf-choice\" data-action=\"set-urgency\" data-value=\"${u}\" aria-pressed=\"${state.draft.urgency === u}\">${URGENCY_LABELS[u]}<\/button>`).join(\"\")}\n      <\/div>\n    <\/div>\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-action=\"submit-request\">Anfrage starten<\/button>\n  <\/div>`;\n\n/* Screen 04 - der charakteristische Moment des Produkts */\nscreens.analyzing = () => `\n  <div class=\"screen\" style=\"justify-content:center\">\n    <div class=\"jf-thinking\">\n      <div class=\"jf-thinking__orb\">\\u{1F916}<\/div>\n      <p class=\"jf-h2\" style=\"text-align:center\">Ich schaue mir dein Problem an<\/p>\n      <div class=\"jf-thinking__steps\">\n        <div class=\"jf-thinking__step\" data-step=\"0\"><span class=\"jf-thinking__tick\">✓<\/span> Beschreibung gelesen<\/div>\n        <div class=\"jf-thinking__step\" data-step=\"1\"><span class=\"jf-thinking__tick\">✓<\/span> Kategorie bestimmt<\/div>\n        <div class=\"jf-thinking__step\" data-step=\"2\"><span class=\"jf-thinking__tick\">✓<\/span> Offene Punkte gesammelt<\/div>\n      <\/div>\n    <\/div>\n  <\/div>`;\n\n/* Screen 04b */\nscreens.questions = () => {\n  const a = state.analysis;\n  const sub = a.categorySlug ? SUBCATEGORIES[a.categorySlug] : null;\n  const open = a.questions.filter((q) => !state.answers[q]);\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><span class=\"jf-topbar__title\">KI-Analyse<\/span><\/div>\n    <div class=\"jf-ai\">\n      <div class=\"jf-ai__head\"><span style=\"font-size:19px\">\\u{1F916}<\/span><span class=\"jf-ai__title\">Von der KI erkannt<\/span><\/div>\n      <dl style=\"margin:0;display:flex;flex-direction:column;gap:11px\">\n        <div class=\"jf-ai__field\">\n          <dt>Kategorie<\/dt>\n          <dd>${sub ? sub.icon + \" \" + esc(sub.name) : \"Noch nicht eindeutig\"}<\/dd>\n        <\/div>\n        <div class=\"jf-ai__field\">\n          <dt>Problem<\/dt>\n          <dd style=\"font-weight:500;font-size:14px\">${esc(a.summary)}<\/dd>\n        <\/div>\n        <div class=\"jf-ai__field\">\n          <dt>Dringlichkeit<\/dt>\n          <dd style=\"font-size:14px\">${URGENCY_LABELS[a.urgency]}<\/dd>\n        <\/div>\n      <\/dl>\n      <p class=\"jf-ai__disclaimer\">\n        ${a.confidence < 0.6\n          ? \"Die KI ist sich hier unsicher (\" + Math.round(a.confidence * 100) + \" %). Bitte prüfe die Angaben.\"\n          : \"Sicherheit \" + Math.round(a.confidence * 100) + \" % &mdash; automatisch erstellt, bitte kurz prüfen.\"}\n      <\/p>\n    <\/div>\n\n    ${open.length > 0 ? `\n      <div class=\"jf-stack\">\n        <h2 class=\"jf-h2\">Noch ${open.length} ${open.length === 1 ? \"Frage\" : \"Fragen\"}<\/h2>\n        <p class=\"jf-muted\" style=\"margin-top:-4px\">Nur das, was für ein gutes Angebot wirklich fehlt.<\/p>\n        ${open.map((q, i) => `\n          <div class=\"jf-card\">\n            <label class=\"jf-label\" for=\"q${i}\" style=\"margin:0\">${esc(q)}<\/label>\n            <input class=\"jf-input\" id=\"q${i}\" data-question=\"${esc(q)}\" placeholder=\"Deine Antwort\">\n          <\/div>`).join(\"\")}\n        <button class=\"jf-btn jf-btn--primary\" data-action=\"answer-questions\">Antworten senden<\/button>\n        <button class=\"jf-btn jf-btn--ghost\" data-go=\"summary\">Überspringen<\/button>\n      <\/div>`\n      : `\n      <div class=\"jf-card\">\n        <p class=\"jf-body\">Alle Rückfragen beantwortet. \\u{2705}<\/p>\n        <p class=\"jf-muted\">${Object.keys(state.answers).length} Antworten gehen mit an die Betriebe.<\/p>\n      <\/div>\n      <button class=\"jf-btn jf-btn--primary\" data-go=\"summary\">Weiter<\/button>`}\n  <\/div>`;\n};\n\n/* Screen 05 */\nscreens.summary = () => {\n  const a = state.analysis;\n  const sub = a && a.categorySlug ? SUBCATEGORIES[a.categorySlug] : null;\n  const answered = Object.entries(state.answers);\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"questions\">&larr;<\/button><span class=\"jf-topbar__title\">Deine Anfrage<\/span><\/div>\n    <div class=\"jf-card\">\n      <div class=\"jf-row jf-row--between\">\n        <h2 class=\"jf-h2\">${sub ? sub.icon + \" \" + esc(sub.name) : \"Anfrage\"}<\/h2>\n        <span class=\"jf-badge jf-badge--ai\">KI erkannt<\/span>\n      <\/div>\n      <div>\n        <p class=\"jf-label\" style=\"margin-bottom:2px\">Problem<\/p>\n        <p class=\"jf-body\">${esc(state.request.description)}<\/p>\n      <\/div>\n      ${state.draft.photos > 0 ? `<div><p class=\"jf-label\" style=\"margin-bottom:2px\">Fotos<\/p><p class=\"jf-body\">\\u{1F5BC} ${state.draft.photos} Bilder<\/p><\/div>` : \"\"}\n      <div>\n        <p class=\"jf-label\" style=\"margin-bottom:2px\">Standort<\/p>\n        <p class=\"jf-body\">\\u{1F4CD} ${esc(state.request.locationLabel)}<\/p>\n      <\/div>\n      <div>\n        <p class=\"jf-label\" style=\"margin-bottom:2px\">Dringlichkeit<\/p>\n        <p class=\"jf-body\">${URGENCY_LABELS[state.request.urgency]}<\/p>\n      <\/div>\n    <\/div>\n    ${answered.length > 0 ? `\n      <div class=\"jf-card\">\n        <p class=\"jf-label\" style=\"margin:0\">Deine Antworten<\/p>\n        ${answered.map(([q, ans]) => `\n          <div><p class=\"jf-caption\">${esc(q)}<\/p><p class=\"jf-body\" style=\"font-weight:500\">${esc(ans)}<\/p><\/div>`).join(\"\")}\n      <\/div>` : \"\"}\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-action=\"find-providers\">Passende Anbieter suchen<\/button>\n  <\/div>`;\n};\n\n/* Screen 06 */\nscreens.matches = () => `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><span class=\"jf-topbar__title\">Passende Anbieter<\/span><\/div>\n    ${state.matches.length === 0 ? `\n      <div class=\"jf-empty\">\n        <span class=\"jf-empty__icon\">\\u{1F50D}<\/span>\n        <p class=\"jf-h2\">Noch kein passender Betrieb<\/p>\n        <p class=\"jf-muted\">In dieser Kategorie ist noch niemand in deiner Nähe registriert.<\/p>\n      <\/div>`\n    : `\n      <p class=\"jf-muted\">Wir haben <b style=\"color:var(--jf-text)\">${state.matches.length} passende Unternehmen<\/b> gefunden.<\/p>\n      ${state.matches.map((m) => `\n        <div class=\"jf-card\">\n          <div class=\"jf-row jf-row--between\">\n            <div>\n              <p class=\"jf-body\" style=\"font-weight:600;font-size:15.5px\">${esc(m.business.name)}<\/p>\n              <p class=\"jf-caption\">${m.business.reviews === 0 ? \"Noch keine Bewertungen\"\n                : \"⭐ \" + m.business.rating.toFixed(1).replace(\".\", \",\") + \" · \" + m.business.reviews + \" Bewertungen\"}<\/p>\n            <\/div>\n            <span class=\"jf-badge jf-badge--primary\">${m.score}/100<\/span>\n          <\/div>\n          ${m.business.verified ? '<span class=\"jf-badge jf-badge--success\">✓ Geprüft<\/span>' : \"\"}\n          <div class=\"jf-stack--tight jf-stack\" style=\"margin-top:2px\">\n            ${m.reasons.slice(0, 3).map((r) => `<p class=\"jf-caption\">• ${esc(r.label)}<\/p>`).join(\"\")}\n          <\/div>\n        <\/div>`).join(\"\")}\n      <div class=\"jf-spacer\"><\/div>\n      <button class=\"jf-btn jf-btn--primary\" data-action=\"request-offers\">Angebote erhalten<\/button>`}\n  <\/div>`;\n\n/* Screen 07 */\nscreens.offers = () => `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><span class=\"jf-topbar__title\">Angebote<\/span><\/div>\n    <h1 class=\"jf-h1\">${state.offers.length} Angebote erhalten<\/h1>\n    <p class=\"jf-muted\" style=\"margin-top:-8px\">Du entscheidest. Preise sind vollständig, inklusive Anfahrt.<\/p>\n    ${state.offers.map((o) => {\n      const biz = bizById(o.businessId);\n      const accepted = o.status === \"ACCEPTED\";\n      const declined = o.status === \"DECLINED\";\n      return `\n        <button class=\"jf-card\" data-action=\"open-offer\" data-value=\"${o.id}\" ${declined ? 'style=\"opacity:.5\"' : \"\"}>\n          <div class=\"jf-row jf-row--between\">\n            <p class=\"jf-body\" style=\"font-weight:600;font-size:15.5px\">${esc(biz.name)}<\/p>\n            ${accepted ? '<span class=\"jf-badge jf-badge--success\">Angenommen<\/span>'\n              : declined ? '<span class=\"jf-badge\">Abgelehnt<\/span>' : \"\"}\n          <\/div>\n          <div class=\"jf-row jf-row--between\" style=\"align-items:baseline\">\n            <span style=\"font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--jf-text);font-variant-numeric:tabular-nums\">${fmtEuroShort(offerTotal(o))}<\/span>\n            <span class=\"jf-caption\">⭐ ${biz.rating.toFixed(1).replace(\".\", \",\")} · ${fmtKm(biz.distanceKm)}<\/span>\n          <\/div>\n          <p class=\"jf-caption\">inkl. Material &amp; Anfahrt<\/p>\n        <\/button>`;\n    }).join(\"\")}\n  <\/div>`;\n\n/* Screen 08 */\nscreens.offer = () => {\n  const o = offerById(state.openedOfferId) || state.offers[0];\n  const biz = bizById(o.businessId);\n  const valid = new Date(Date.now() + 6 * 864e5).toLocaleDateString(\"de-DE\", { day: \"2-digit\", month: \"2-digit\", year: \"numeric\" });\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"offers\">&larr;<\/button><span class=\"jf-topbar__title\">Angebot<\/span><\/div>\n    <div>\n      <h1 class=\"jf-h1\">${esc(biz.name)}<\/h1>\n      <p class=\"jf-muted\">⭐ ${biz.rating.toFixed(1).replace(\".\", \",\")} · ${biz.reviews} Bewertungen · ${fmtKm(biz.distanceKm)}<\/p>\n    <\/div>\n    ${biz.verified ? '<span class=\"jf-badge jf-badge--success\">✓ Unternehmen geprüft<\/span>' : '<span class=\"jf-badge jf-badge--warning\">Noch nicht geprüft<\/span>'}\n    <div class=\"jf-card\">\n      <dl class=\"jf-price\">\n        <div class=\"jf-price__row\"><dt>Arbeitskosten<\/dt><dd>${fmtEuro(o.labor)}<\/dd><\/div>\n        <div class=\"jf-price__row\"><dt>Material<\/dt><dd>${fmtEuro(o.material)}<\/dd><\/div>\n        <div class=\"jf-price__row\"><dt>Anfahrt<\/dt><dd>${fmtEuro(o.travel)}<\/dd><\/div>\n        <div class=\"jf-price__total\"><dt>Gesamt<\/dt><dd>${fmtEuroShort(offerTotal(o))}<\/dd><\/div>\n      <\/dl>\n    <\/div>\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Beschreibung<\/p>\n      <p class=\"jf-body\">${esc(o.description)}<\/p>\n      ${o.aiAssisted ? '<p class=\"jf-caption\" style=\"color:var(--jf-ai)\">Text mit KI-Unterstützung verfasst, vom Betrieb freigegeben.<\/p>' : \"\"}\n    <\/div>\n    <p class=\"jf-caption\">Gültig bis ${valid}<\/p>\n    <div class=\"jf-spacer\"><\/div>\n    ${o.status === \"ACCEPTED\"\n      ? '<button class=\"jf-btn jf-btn--secondary\" data-go=\"appointment\">Zum Termin<\/button>'\n      : `<button class=\"jf-btn jf-btn--primary\" data-action=\"accept-offer\" data-value=\"${o.id}\">Angebot annehmen<\/button>\n         <button class=\"jf-btn jf-btn--ghost\" data-action=\"decline-offer\" data-value=\"${o.id}\">Ablehnen<\/button>`}\n  <\/div>`;\n};\n\n/* Screen 09 - Termin. Der Kunde sieht nur freigegebene Zeitfenster. */\nscreens.appointment = () => {\n  const today = new Date();\n  today.setHours(0, 0, 0, 0);\n\n  // Drei Wochen ab dem Montag der laufenden Woche - derselbe Horizont wie\n  // AppointmentService.availableSlots im Backend. Ein fester Kalendermonat\n  // wäre am Monatsende fast leer.\n  const monday = new Date(today);\n  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));\n  const days = Array.from({ length: 21 }, (_, i) => {\n    const d = new Date(monday);\n    d.setDate(monday.getDate() + i);\n    return d;\n  });\n\n  const first = days[0];\n  const last = days[days.length - 1];\n  const rangeLabel = first.getMonth() === last.getMonth()\n    ? first.toLocaleDateString(\"de-DE\", { month: \"long\", year: \"numeric\" })\n    : first.toLocaleDateString(\"de-DE\", { month: \"long\" }) + \" – \" +\n      last.toLocaleDateString(\"de-DE\", { month: \"long\", year: \"numeric\" });\n\n  const chosen = state.appointment ? state.appointment.key : null;\n\n  const cells = days.map((d) => {\n    const key = d.toISOString().slice(0, 10);\n    const past = d.getTime() < today.getTime();\n    // Verfügbarkeit des Betriebs laut Wochenplan: Montag, Dienstag, Donnerstag.\n    const free = !past && [1, 2, 4].includes(d.getDay());\n    return `<button class=\"jf-cal__day ${free ? \"jf-cal__day--free\" : \"\"}\" data-action=\"pick-day\" data-value=\"${key}\"\n      ${free ? \"\" : \"disabled\"} aria-pressed=\"${chosen === key}\"\n      aria-label=\"${d.toLocaleDateString(\"de-DE\", { weekday: \"long\", day: \"numeric\", month: \"long\" })}\">${d.getDate()}<\/button>`;\n  }).join(\"\");\n\n  const slots = [\"09:00\", \"11:00\", \"14:00\", \"16:00\"];\n  const acceptedBiz = bizById(offerById(state.acceptedOfferId).businessId);\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><span class=\"jf-topbar__title\">Termin auswählen<\/span><\/div>\n    <p class=\"jf-muted\">Diese Zeiten hat ${esc(acceptedBiz.name)} freigegeben.<\/p>\n    <div class=\"jf-card\">\n      <p class=\"jf-h2\" style=\"text-transform:capitalize\">${rangeLabel}<\/p>\n      <div class=\"jf-cal\">\n        ${[\"Mo\", \"Di\", \"Mi\", \"Do\", \"Fr\", \"Sa\", \"So\"].map((w) => `<span class=\"jf-cal__wd\">${w}<\/span>`).join(\"\")}\n        ${cells}\n      <\/div>\n    <\/div>\n    ${chosen ? `\n      <div class=\"jf-stack\">\n        <h2 class=\"jf-h2\">Verfügbare Zeiten<\/h2>\n        <div class=\"jf-slots\">\n          ${slots.map((t) => `\n            <button class=\"jf-slot\" data-action=\"pick-time\" data-value=\"${t}\" aria-pressed=\"${state.appointment.time === t}\">${t}<\/button>`).join(\"\")}\n        <\/div>\n      <\/div>` : '<p class=\"jf-caption\">Wähle zuerst einen Tag mit grünem Punkt.<\/p>'}\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-action=\"confirm-appointment\"\n      ${state.appointment && state.appointment.time ? \"\" : \"disabled\"}>Termin bestätigen<\/button>\n  <\/div>`;\n};\n\n/* Screen 10 */\nscreens.job = () => {\n  const o = offerById(state.acceptedOfferId);\n  const biz = bizById(o.businessId);\n  const sub = state.analysis && state.analysis.categorySlug ? SUBCATEGORIES[state.analysis.categorySlug] : null;\n\n  const steps = [\n    { label: \"Anfrage erstellt\", done: true },\n    { label: \"Angebot erhalten\", done: true },\n    { label: \"Angebot angenommen\", done: true },\n    { label: \"Termin bestätigt\", done: Boolean(state.appointment && state.appointment.confirmed) },\n    { label: \"Auftrag abgeschlossen\", done: state.jobStatus === \"COMPLETED\" }\n  ];\n  const currentIndex = steps.findIndex((s) => !s.done);\n\n  const apptText = state.appointment && state.appointment.confirmed\n    ? new Date(state.appointment.key).toLocaleDateString(\"de-DE\",\n        { weekday: \"long\", day: \"numeric\", month: \"long\" }) + \" um \" + state.appointment.time + \" Uhr\"\n    : \"Noch kein Termin\";\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><span class=\"jf-topbar__title\">Dein Auftrag<\/span><\/div>\n    <div>\n      <h1 class=\"jf-h1\">${sub ? esc(sub.name) : \"Auftrag\"}<\/h1>\n      <p class=\"jf-muted\">${esc(biz.name)} · ${fmtEuroShort(offerTotal(o))}<\/p>\n    <\/div>\n    <div class=\"jf-card\">\n      <div class=\"jf-timeline\">\n        ${steps.map((s, i) => {\n          const isNow = i === currentIndex;\n          const last = i === steps.length - 1;\n          return `\n            <div class=\"jf-tl\">\n              <div class=\"jf-tl__col\">\n                <span class=\"jf-tl__dot ${s.done ? \"jf-tl__dot--done\" : isNow ? \"jf-tl__dot--now\" : \"\"}\">${s.done ? \"✓\" : isNow ? \"●\" : \"○\"}<\/span>\n                ${last ? \"\" : `<span class=\"jf-tl__line ${s.done ? \"jf-tl__line--done\" : \"\"}\"><\/span>`}\n              <\/div>\n              <span class=\"jf-tl__label ${s.done || isNow ? \"jf-tl__label--reached\" : \"\"}\">${s.label}<\/span>\n            <\/div>`;\n        }).join(\"\")}\n      <\/div>\n    <\/div>\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Termin<\/p>\n      <p class=\"jf-body\" style=\"font-weight:600\">\\u{1F4C5} ${apptText}<\/p>\n      ${state.jobStatus === \"COMPLETED\" ? '<span class=\"jf-badge jf-badge--success\">Auftrag abgeschlossen<\/span>' : \"\"}\n    <\/div>\n    <button class=\"jf-btn jf-btn--secondary\" data-go=\"chat\">\n      <span class=\"jf-btn__icon\">\\u{1F4AC}<\/span> Nachricht schreiben\n    <\/button>\n    ${state.jobStatus === \"COMPLETED\" && !state.review\n      ? '<button class=\"jf-btn jf-btn--primary\" data-go=\"review\">Auftrag bewerten<\/button>'\n      : state.jobStatus === \"COMPLETED\"\n        ? `<div class=\"jf-card\"><p class=\"jf-label\" style=\"margin:0\">Deine Bewertung<\/p><p class=\"jf-body\">${\"⭐\".repeat(state.review.rating)}<\/p><p class=\"jf-muted\">${esc(state.review.text)}<\/p><\/div>`\n        : `<button class=\"jf-btn jf-btn--ghost\" data-action=\"simulate-completion\">Betrieb meldet: Auftrag erledigt<\/button>`}\n  <\/div>`;\n};\n\n/* Screen 11 */\nscreens.review = () => {\n  const o = offerById(state.acceptedOfferId);\n  const biz = bizById(o.businessId);\n  const rating = state.reviewDraft || 0;\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"job\">&larr;<\/button><span class=\"jf-topbar__title\">Bewertung<\/span><\/div>\n    <h1 class=\"jf-h1\" style=\"text-align:center;margin-top:14px\">Wie war dein Auftrag?<\/h1>\n    <p class=\"jf-muted\" style=\"text-align:center;margin-top:-8px\">${esc(biz.name)}<\/p>\n    <div class=\"jf-stars\">\n      ${[1, 2, 3, 4, 5].map((n) => `\n        <button class=\"jf-star ${n <= rating ? \"is-on\" : \"\"}\" data-action=\"rate\" data-value=\"${n}\" aria-label=\"${n} von 5\">⭐<\/button>`).join(\"\")}\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"rev\">Was möchtest du sagen?<\/label>\n      <textarea class=\"jf-textarea\" id=\"rev\" placeholder=\"Sehr freundlicher und zuverlässiger Service.\">Sehr freundlicher und zuverlässiger Service.<\/textarea>\n    <\/div>\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-action=\"submit-review\" ${rating > 0 ? \"\" : \"disabled\"}>Bewertung senden<\/button>\n    <p class=\"jf-caption\" style=\"text-align:center\">Bewerten kannst du nur einen abgeschlossenen Auftrag &mdash; das schützt vor erfundenen Bewertungen.<\/p>\n  <\/div>`;\n};\n\n/* Anfragenliste */\nscreens.requests = () => `\n  <div class=\"screen\">\n    <h1 class=\"jf-h1\">Meine Anfragen<\/h1>\n    ${state.request ? requestCard(state.request) : `\n      <div class=\"jf-empty\">\n        <span class=\"jf-empty__icon\">\\u{1F4CB}<\/span>\n        <p class=\"jf-h2\">Noch keine Anfragen<\/p>\n        <p class=\"jf-muted\">Beschreibe dein Anliegen &mdash; JobFlow findet die passenden Anbieter.<\/p>\n        <button class=\"jf-btn jf-btn--primary jf-btn--sm\" data-go=\"create\" style=\"width:auto;margin-top:8px\">Anfrage starten<\/button>\n      <\/div>`}\n  <\/div>`;\n\n/* Detailansicht der Anfrage - führt durch den nächsten offenen Schritt */\nscreens.detail = () => {\n  const req = state.request;\n  const sub = req.categorySlug ? SUBCATEGORIES[req.categorySlug] : null;\n  let next = \"\";\n  if (!state.analysis) next = `<button class=\"jf-btn jf-btn--primary\" data-action=\"run-analysis\"><span class=\"jf-btn__icon\">\\u{1F916}<\/span> Von der KI analysieren lassen<\/button>`;\n  else if (state.matches.length === 0) next = `<button class=\"jf-btn jf-btn--primary\" data-action=\"find-providers\"><span class=\"jf-btn__icon\">\\u{1F50E}<\/span> Passende Anbieter suchen<\/button>`;\n  else if (state.offers.length === 0) next = `<button class=\"jf-btn jf-btn--primary\" data-action=\"request-offers\">Angebote erhalten<\/button>`;\n  else next = `<button class=\"jf-btn jf-btn--primary\" data-go=\"offers\">${state.offers.length} Angebote ansehen<\/button>`;\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"requests\">&larr;<\/button><span class=\"jf-topbar__title\">Anfrage<\/span><\/div>\n    <div>\n      <div class=\"jf-row\" style=\"flex-wrap:wrap;margin-bottom:8px\">\n        <span class=\"jf-badge ${req.status === \"OFFERED\" ? \"jf-badge--success\" : \"\"}\">${STATUS_LABELS[req.status]}<\/span>\n        ${sub ? `<span class=\"jf-badge jf-badge--primary\">${sub.icon} ${esc(sub.name)}<\/span>` : \"\"}\n      <\/div>\n      <p class=\"jf-body\">${esc(req.description)}<\/p>\n      <p class=\"jf-caption\" style=\"margin-top:6px\">\\u{1F4CD} ${esc(req.locationLabel)}<\/p>\n    <\/div>\n    ${state.analysis ? `\n      <div class=\"jf-ai\">\n        <div class=\"jf-ai__head\"><span style=\"font-size:19px\">\\u{1F916}<\/span><span class=\"jf-ai__title\">KI-Zusammenfassung<\/span><\/div>\n        <p class=\"jf-body\">${esc(state.analysis.summary)}<\/p>\n        <p class=\"jf-ai__disclaimer\">Automatisch erstellt &mdash; bitte kurz prüfen.<\/p>\n      <\/div>` : \"\"}\n    ${next}\n  <\/div>`;\n};\n\n/* Chat */\nscreens.chat = () => {\n  const o = state.acceptedOfferId ? offerById(state.acceptedOfferId) : state.offers[0];\n  const partner = state.role === \"customer\"\n    ? (o ? bizById(o.businessId).name : \"JobFlow\")\n    : \"Max M.\";\n\n  return `\n  <div class=\"screen\" style=\"min-height:100%\">\n    <div class=\"jf-topbar\">\n      <button class=\"jf-back\" data-go=\"${state.role === \"customer\" ? (state.jobStatus ? \"job\" : \"offers\") : \"bizdashboard\"}\">&larr;<\/button>\n      <span class=\"jf-topbar__title\">${esc(partner)}<\/span>\n    <\/div>\n    <div class=\"jf-chat\">\n      ${state.messages.length === 0 ? '<p class=\"jf-caption\" style=\"text-align:center\">Noch keine Nachrichten.<\/p>' : \"\"}\n      ${state.messages.map((m) => `\n        <div class=\"jf-bubble jf-bubble--${m.mine ? \"me\" : \"them\"} ${m.ai ? \"jf-bubble--ai-mark\" : \"\"}\">\n          ${esc(m.text)}\n          <span class=\"jf-bubble__time\">${m.time}${m.ai ? \" · KI-Vorschlag\" : \"\"}<\/span>\n        <\/div>`).join(\"\")}\n    <\/div>\n    <div class=\"jf-spacer\"><\/div>\n    ${state.role === \"business\" ? `\n      <div class=\"jf-ai\">\n        <div class=\"jf-ai__head\"><span style=\"font-size:17px\">\\u{1F916}<\/span><span class=\"jf-ai__title\">Antwort formulieren<\/span><\/div>\n        <p class=\"jf-caption\">Die KI schreibt einen Vorschlag &mdash; du entscheidest, ob du ihn abschickst.<\/p>\n        <button class=\"jf-btn jf-btn--secondary jf-btn--sm\" data-action=\"suggest-reply\">Vorschlag erzeugen<\/button>\n      <\/div>` : \"\"}\n    <div class=\"jf-composer\">\n      <input class=\"jf-input\" id=\"msg\" placeholder=\"Nachricht schreiben\" value=\"${esc(state.msgDraft || \"\")}\">\n      <button class=\"jf-btn jf-btn--primary jf-btn--sm\" data-action=\"send-message\" style=\"width:auto;padding:0 18px\">Senden<\/button>\n    <\/div>\n  <\/div>`;\n};\n\nscreens.profile = () => `\n  <div class=\"screen\">\n    <h1 class=\"jf-h1\">Profil<\/h1>\n    <div class=\"jf-card\">\n      <p class=\"jf-h2\">Max Mustermann<\/p>\n      <p class=\"jf-caption\">max@example.de<\/p>\n      <p class=\"jf-caption\">Kundenkonto<\/p>\n    <\/div>\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Deine Daten<\/p>\n      <p class=\"jf-muted\">\n        JobFlow speichert deine Anfragen, Angebote und Termine. Der Standort wird nur so\n        genau gespeichert, wie es für die Vermittlung nötig ist &mdash; die vollständige\n        Adresse erfährt erst der Betrieb, den du beauftragst.\n      <\/p>\n    <\/div>\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">KI-Hinweise<\/p>\n      <p class=\"jf-muted\">\n        Alles, was die KI erzeugt, ist in der App violett markiert. Sie trifft keine\n        verbindlichen Entscheidungen über Preise oder Termine.\n      <\/p>\n    <\/div>\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--secondary\" data-action=\"logout\">Abmelden<\/button>\n  <\/div>`;\n\n/* ==========================================================================\n   6. Screens - Unternehmensseite\n   Dieselbe Codebasis, völlig andere Oberfläche.\n   ========================================================================== */\n\n/* Die Anfrage, die der Betrieb sieht - entweder die selbst erstellte oder ein Beispiel. */\nfunction inboxRequest() {\n  if (state.request && state.analysis) {\n    return {\n      description: state.request.description,\n      summary: state.analysis.summary,\n      categorySlug: state.analysis.categorySlug,\n      urgency: state.request.urgency,\n      location: state.request.locationLabel,\n      photos: state.draft.photos,\n      answers: Object.entries(state.answers),\n      distanceKm: 4.2,\n      score: state.matches.length > 0 ? state.matches[0].score : 88,\n      customer: \"Max M.\"\n    };\n  }\n  return {\n    description: \"Meine Heizung wird nicht mehr richtig warm.\",\n    summary: \"Die Heizung arbeitet nicht wie erwartet.\",\n    categorySlug: \"heizung\",\n    urgency: \"NORMAL\",\n    location: \"45127 Essen\",\n    photos: 2,\n    answers: [[\"Sind mehrere Heizkörper betroffen oder nur einer?\", \"Alle Heizkörper, seit gestern Abend.\"]],\n    distanceKm: 4.2,\n    score: 88,\n    customer: \"Max M.\"\n  };\n}\n\n/* Screen 12 */\nscreens.bizdashboard = () => {\n  const req = inboxRequest();\n  const sub = SUBCATEGORIES[req.categorySlug] || SUBCATEGORIES.heizung;\n  const sent = state.offers.some((o) => o.businessId === \"b1\" && o.fromBusinessScreen);\n\n  return `\n  <div class=\"screen\">\n    <div>\n      <p class=\"jf-greeting\">Guten Morgen \\u{1F44B}<\/p>\n      <h1 class=\"jf-h1\">HeizPro Essen<\/h1>\n    <\/div>\n    <div class=\"jf-tiles\">\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">${state.bizDeclined ? 0 : 1}<\/span><span class=\"jf-tile__label\">Neue Anfragen<\/span><\/div>\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">${sent ? 13 : 12}<\/span><span class=\"jf-tile__label\">Angebote offen<\/span><\/div>\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">5<\/span><span class=\"jf-tile__label\">Aufträge diese Woche<\/span><\/div>\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">2.430&nbsp;€<\/span><span class=\"jf-tile__label\">Umsatz<\/span><\/div>\n    <\/div>\n\n    <div class=\"jf-stack\">\n      <h2 class=\"jf-h2\">Neue Anfrage<\/h2>\n      ${state.bizDeclined ? `\n        <div class=\"jf-empty\">\n          <span class=\"jf-empty__icon\">\\u{2705}<\/span>\n          <p class=\"jf-muted\">Alles bearbeitet. Sobald eine passende Anfrage entsteht, erscheint sie hier.<\/p>\n        <\/div>`\n      : `\n        <button class=\"jf-card\" data-go=\"bizrequest\">\n          <div class=\"jf-row jf-row--between\">\n            <span class=\"jf-badge jf-badge--primary\">${sub.icon} ${esc(sub.name)}<\/span>\n            <span class=\"jf-badge\">Passung ${req.score}<\/span>\n          <\/div>\n          <p class=\"jf-body\" style=\"font-weight:600\">${esc(req.description)}<\/p>\n          <p class=\"jf-caption\">\\u{1F4CD} ${fmtKm(req.distanceKm)} entfernt · \\u{1F5BC} ${req.photos} Fotos · \\u{1F550} diese Woche<\/p>\n        <\/button>`}\n    <\/div>\n\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Diese Woche<\/p>\n      ${bar(\"Anfragen\", 128, 128)}\n      ${bar(\"Angebote\", 87, 128)}\n      ${bar(\"Aufträge\", 42, 128)}\n    <\/div>\n    <button class=\"jf-btn jf-btn--secondary\" data-go=\"bizstats\">Alle Statistiken<\/button>\n  <\/div>`;\n};\n\nfunction bar(label, value, max) {\n  return `\n    <div class=\"jf-bar\">\n      <div class=\"jf-bar__head\"><span>${label}<\/span><span>${value}<\/span><\/div>\n      <div class=\"jf-bar__track\"><div class=\"jf-bar__fill\" style=\"width:${Math.round((value / max) * 100)}%\"><\/div><\/div>\n    <\/div>`;\n}\n\n/* Screen 13 */\nscreens.bizrequest = () => {\n  const req = inboxRequest();\n  const sub = SUBCATEGORIES[req.categorySlug] || SUBCATEGORIES.heizung;\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"bizdashboard\">&larr;<\/button><span class=\"jf-topbar__title\">Anfrage<\/span><\/div>\n    <div>\n      <h1 class=\"jf-h1\">${sub.icon} ${esc(sub.name)}<\/h1>\n      <p class=\"jf-muted\">${esc(req.customer)} · ${fmtKm(req.distanceKm)} entfernt<\/p>\n    <\/div>\n\n    <div class=\"jf-ai\">\n      <div class=\"jf-ai__head\"><span style=\"font-size:19px\">\\u{1F916}<\/span><span class=\"jf-ai__title\">KI-Zusammenfassung<\/span><\/div>\n      <p class=\"jf-body\">${esc(req.summary)}<\/p>\n      <p class=\"jf-ai__disclaimer\">Automatisch aus der Beschreibung erstellt. Der Wortlaut des Kunden steht darunter.<\/p>\n    <\/div>\n\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Der Kunde schreibt<\/p>\n      <p class=\"jf-body\">„${esc(req.description)}\"<\/p>\n    <\/div>\n\n    ${req.answers.length > 0 ? `\n      <div class=\"jf-card\">\n        <p class=\"jf-label\" style=\"margin:0\">Rückfragen bereits beantwortet<\/p>\n        ${req.answers.map(([q, a]) => `\n          <div><p class=\"jf-caption\">${esc(q)}<\/p><p class=\"jf-body\" style=\"font-weight:500\">${esc(a)}<\/p><\/div>`).join(\"\")}\n      <\/div>` : \"\"}\n\n    <div class=\"jf-card\">\n      <div class=\"jf-row\" style=\"flex-wrap:wrap\">\n        <span class=\"jf-badge\">\\u{1F4CD} ${esc(req.location)}<\/span>\n        <span class=\"jf-badge\">\\u{1F5BC} ${req.photos} Fotos<\/span>\n        <span class=\"jf-badge ${req.urgency === \"HIGH\" ? \"jf-badge--warning\" : \"\"}\">${URGENCY_LABELS[req.urgency]}<\/span>\n      <\/div>\n      ${req.photos > 0 ? `\n        <div class=\"jf-row\" style=\"margin-top:4px\">\n          ${Array.from({ length: Math.min(req.photos, 3) }, () => `\n            <div style=\"width:74px;height:74px;border-radius:14px;background:var(--jf-surface-muted);display:grid;place-items:center;font-size:26px\">\\u{1F5BC}<\/div>`).join(\"\")}\n        <\/div>` : \"\"}\n    <\/div>\n\n
