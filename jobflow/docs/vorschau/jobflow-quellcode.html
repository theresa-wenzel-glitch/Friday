"\n        options={{\n          title: \"Start\",\n          href: isBusiness ? null : \"/(app)/home\",\n          tabBarIcon: ({ color }) => <TabIcon icon=\"🏠\" color={color} />,\n        }}\n      />\n      <Tabs.Screen\n        name=\"dashboard\"\n        options={{\n          title: \"Dashboard\",\n          href: isBusiness ? \"/(app)/dashboard\" : null,\n          tabBarIcon: ({ color }) => <TabIcon icon=\"📊\" color={color} />,\n        }}\n      />\n      <Tabs.Screen\n        name=\"requests/index\"\n        options={{\n          title: isBusiness ? \"Anfragen\" : \"Meine Anfragen\",\n          tabBarIcon: ({ color }) => <TabIcon icon=\"📋\" color={color} />,\n        }}\n      />\n      <Tabs.Screen\n        name=\"create-request\"\n        options={{\n          title: \"Neu\",\n          href: isBusiness ? null : \"/(app)/create-request\",\n          tabBarIcon: ({ color }) => <TabIcon icon=\"➕\" color={color} />,\n        }}\n      />\n      <Tabs.Screen\n        name=\"jobs/index\"\n        options={{\n          title: \"Aufträge\",\n          href: isBusiness ? \"/(app)/jobs\" : null,\n          tabBarIcon: ({ color }) => <TabIcon icon=\"🧾\" color={color} />,\n        }}\n      />\n      <Tabs.Screen\n        name=\"chat\"\n        options={{\n          title: \"Chat\",\n          tabBarIcon: ({ color }) => <TabIcon icon=\"💬\" color={color} />,\n        }}\n      />\n      <Tabs.Screen\n        name=\"profile\"\n        options={{\n          title: \"Profil\",\n          href: isBusiness ? null : \"/(app)/profile\",\n          tabBarIcon: ({ color }) => <TabIcon icon=\"👤\" color={color} />,\n        }}\n      />\n      <Tabs.Screen\n        name=\"business-profile\"\n        options={{\n          title: \"Profil\",\n          href: isBusiness ? \"/(app)/business-profile\" : null,\n          tabBarIcon: ({ color }) => <TabIcon icon=\"🏢\" color={color} />,\n        }}\n      />\n\n      {/* Über den Ablauf erreichbar, nicht über die Leiste. */}\n      <Tabs.Screen name=\"requests/[id]\" options={{ href: null }} />\n      <Tabs.Screen name=\"offers/[id]\" options={{ href: null }} />\n      <Tabs.Screen name=\"jobs/[id]\" options={{ href: null }} />\n      <Tabs.Screen name=\"appointment\" options={{ href: null }} />\n      <Tabs.Screen name=\"review\" options={{ href: null }} />\n      <Tabs.Screen name=\"create-offer\" options={{ href: null }} />\n      <Tabs.Screen name=\"statistics\" options={{ href: null }} />\n    <\/Tabs>\n  );\n}\n\nfunction TabIcon({ icon, color }: { icon: string; color: ColorValue }) {\n  return <Text style={{ fontSize: 20, color }}>{icon}<\/Text>;\n}\n"}, {"pfad": "apps/mobile/app/(app)/appointment.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 221, "bytes": 8231, "inhalt": "import { useCallback, useMemo, useState } from \"react\";\nimport { ActivityIndicator, Pressable, StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect, useLocalSearchParams } from \"expo-router\";\nimport type { AvailableSlot, Offer } from \"@jobflow/types\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { Card } from \"../../components/Card.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\n/**\n * Terminwahl.\n *\n * Der Kunde sieht ausschließlich Zeitfenster, die das Unternehmen freigegeben\n * hat und die nicht bereits belegt sind. Die Berechnung dieser Fenster liegt im\n * Backend - die App zeigt nur, was sie bekommt, und erfindet keine Termine.\n */\nexport default function AppointmentScreen() {\n  const { offerId } = useLocalSearchParams<{ offerId: string }>();\n\n  const [offer, setOffer] = useState<Offer | null>(null);\n  const [slots, setSlots] = useState<AvailableSlot[]>([]);\n  const [selectedDay, setSelectedDay] = useState<string | null>(null);\n  const [selected, setSelected] = useState<AvailableSlot | null>(null);\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [loading, setLoading] = useState(true);\n\n  useFocusEffect(\n    useCallback(() => {\n      let cancelled = false;\n      setLoading(true);\n      void (async () => {\n        if (typeof offerId !== \"string\") return;\n        try {\n          const found = await api.get<Offer>(`/offers/${offerId}`);\n          if (cancelled) return;\n          setOffer(found);\n          const available = await api.get<AvailableSlot[]>(`/businesses/${found.businessId}/availability`);\n          if (!cancelled) setSlots(available);\n        } catch (error) {\n          if (!cancelled) {\n            setMessage(error instanceof ApiClientError ? error.message : \"Termine konnten nicht geladen werden.\");\n          }\n        } finally {\n          if (!cancelled) setLoading(false);\n        }\n      })();\n      return () => {\n        cancelled = true;\n      };\n    }, [offerId]),\n  );\n\n  /** Die freien Fenster nach Tagen gruppieren - so wählt man einen Termin. */\n  const byDay = useMemo(() => {\n    const groups = new Map<string, AvailableSlot[]>();\n    for (const slot of slots) {\n      const key = slot.startTime.slice(0, 10);\n      const list = groups.get(key);\n      if (list === undefined) groups.set(key, [slot]);\n      else list.push(slot);\n    }\n    return groups;\n  }, [slots]);\n\n  const days = useMemo(() => [...byDay.keys()].sort(), [byDay]);\n\n  async function confirm(): Promise<void> {\n    if (offer === null || selected === null) return;\n    setBusy(true);\n    setMessage(null);\n    try {\n      await api.post(\"/appointments\", {\n        offerId: offer.id,\n        startTime: selected.startTime,\n        endTime: selected.endTime,\n      });\n      router.replace(\"/(app)/jobs\");\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Der Termin konnte nicht gebucht werden.\");\n      setBusy(false);\n    }\n  }\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Termin auswählen<\/Text>\n\n      {days.length === 0 ? (\n        <Card style={styles.empty}>\n          <Text style={styles.emptyTitle}>Keine freien Zeiten<\/Text>\n          <Text style={styles.emptyHint}>\n            Das Unternehmen hat für die nächsten drei Wochen nichts freigegeben. Schreib ihm eine\n            Nachricht, um einen Termin abzustimmen.\n          <\/Text>\n          <Button title=\"Nachricht schreiben\" variant=\"secondary\" onPress={() => router.push(\"/(app)/chat\")} />\n        <\/Card>\n      ) : (\n        <>\n          <View style={styles.section}>\n            <Text style={styles.label}>Tag<\/Text>\n            <View style={styles.days}>\n              {days.slice(0, 12).map((day) => (\n                <Pressable\n                  key={day}\n                  onPress={() => {\n                    setSelectedDay(day);\n                    setSelected(null);\n                  }}\n                  accessibilityRole=\"radio\"\n                  accessibilityState={{ selected: selectedDay === day }}\n                  style={[styles.day, selectedDay === day ? styles.daySelected : null]}\n                >\n                  <Text style={[styles.dayWeekday, selectedDay === day ? styles.daySelectedText : null]}>\n                    {new Date(day).toLocaleDateString(\"de-DE\", { weekday: \"short\" })}\n                  <\/Text>\n                  <Text style={[styles.dayNumber, selectedDay === day ? styles.daySelectedText : null]}>\n                    {new Date(day).getDate()}\n                  <\/Text>\n                <\/Pressable>\n              ))}\n            <\/View>\n          <\/View>\n\n          {selectedDay !== null ? (\n            <View style={styles.section}>\n              <Text style={styles.label}>Verfügbare Zeiten<\/Text>\n              <View style={styles.slots}>\n                {(byDay.get(selectedDay) ?? []).map((slot) => (\n                  <Pressable\n                    key={slot.startTime}\n                    onPress={() => setSelected(slot)}\n                    accessibilityRole=\"radio\"\n                    accessibilityState={{ selected: selected?.startTime === slot.startTime }}\n                    style={[styles.slot, selected?.startTime === slot.startTime ? styles.slotSelected : null]}\n                  >\n                    <Text\n                      style={[\n                        styles.slotText,\n                        selected?.startTime === slot.startTime ? styles.daySelectedText : null,\n                      ]}\n                    >\n                      {new Date(slot.startTime).toLocaleTimeString(\"de-DE\", { hour: \"2-digit\", minute: \"2-digit\" })}\n                    <\/Text>\n                  <\/Pressable>\n                ))}\n              <\/View>\n            <\/View>\n          ) : (\n            <Text style={styles.hint}>Wähle zuerst einen Tag.<\/Text>\n          )}\n        <\/>\n      )}\n\n      <ErrorNotice message={message} />\n      {days.length > 0 ? (\n        <Button title=\"Termin bestätigen\" loading={busy} disabled={selected === null} onPress={confirm} />\n      ) : null}\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  section: { gap: spacing.sm },\n  label: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.textMuted,\n  },\n  days: { flexDirection: \"row\", flexWrap: \"wrap\", gap: spacing.sm },\n  day: {\n    width: 60,\n    paddingVertical: spacing.md,\n    borderRadius: radii.md,\n    borderWidth: 2,\n    borderColor: colors.border,\n    backgroundColor: colors.surface,\n    alignItems: \"center\",\n    gap: 2,\n  },\n  daySelected: { borderColor: colors.primary, backgroundColor: colors.primaryLight },\n  daySelectedText: { color: colors.primaryDark },\n  dayWeekday: { fontSize: typography.sizes.caption, color: colors.textMuted },\n  dayNumber: {\n    fontSize: typography.sizes.title,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  slots: { flexDirection: \"row\", flexWrap: \"wrap\", gap: spacing.sm },\n  slot: {\n    paddingVertical: spacing.md,\n    paddingHorizontal: spacing.xl,\n    borderRadius: radii.md,\n    borderWidth: 2,\n    borderColor: colors.border,\n    backgroundColor: colors.surface,\n  },\n  slotSelected: { borderColor: colors.primary, backgroundColor: colors.primaryLight },\n  slotText: { fontSize: typography.sizes.body, color: colors.text },\n  hint: { fontSize: typography.sizes.small, color: colors.textMuted },\n  empty: { gap: spacing.md },\n  emptyTitle: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  emptyHint: { fontSize: typography.sizes.small, color: colors.textMuted, lineHeight: 20 },\n});\n"}, {"pfad": "apps/mobile/app/(app)/business-profile.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 207, "bytes": 7530, "inhalt": "import { useCallback, useState } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect } from \"expo-router\";\nimport type { AvailabilitySlot, Business, BusinessService, Category } from \"@jobflow/types\";\nimport { colors, spacing, typography } from \"@jobflow/config\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { Badge } from \"../../components/Badge.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { Card } from \"../../components/Card.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Input } from \"../../components/Input.js\";\nimport { Screen } from \"../../components/Screen.js\";\nimport { useSession } from \"../../lib/session.js\";\n\nconst WEEKDAYS = [\"Sonntag\", \"Montag\", \"Dienstag\", \"Mittwoch\", \"Donnerstag\", \"Freitag\", \"Samstag\"];\n\n/**\n * Unternehmensprofil.\n *\n * Ohne Standort und ohne hinterlegte Leistung findet das Matching den Betrieb\n * nicht - deshalb steht dieser Hinweis oben und nicht im Kleingedruckten.\n */\nexport default function BusinessProfileScreen() {\n  const { signOut } = useSession();\n\n  const [business, setBusiness] = useState<Business | null>(null);\n  const [services, setServices] = useState<BusinessService[]>([]);\n  const [availability, setAvailability] = useState<AvailabilitySlot[]>([]);\n  const [categories, setCategories] = useState<Category[]>([]);\n  const [radius, setRadius] = useState(\"30\");\n  const [description, setDescription] = useState(\"\");\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [loading, setLoading] = useState(true);\n\n  const load = useCallback(async () => {\n    try {\n      const [profile, ownServices, slots, allCategories] = await Promise.all([\n        api.get<Business>(\"/businesses/me\"),\n        api.get<BusinessService[]>(\"/businesses/me/services\").catch(() => [] as BusinessService[]),\n        api.get<AvailabilitySlot[]>(\"/businesses/me/availability\").catch(() => [] as AvailabilitySlot[]),\n        api.get<Category[]>(\"/categories\").catch(() => [] as Category[]),\n      ]);\n      setBusiness(profile);\n      setServices(ownServices);\n      setAvailability(slots);\n      setCategories(allCategories);\n      setRadius(String(profile.serviceRadiusKm));\n      setDescription(profile.description ?? \"\");\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Profil konnte nicht geladen werden.\");\n    } finally {\n      setLoading(false);\n    }\n  }, []);\n\n  useFocusEffect(\n    useCallback(() => {\n      setLoading(true);\n      void load();\n    }, [load]),\n  );\n\n  async function save(): Promise<void> {\n    if (business === null) return;\n    setBusy(true);\n    setMessage(null);\n    try {\n      const updated = await api.patch<Business>(\"/businesses/me\", {\n        name: business.name,\n        description: description.trim() === \"\" ? null : description,\n        latitude: business.latitude,\n        longitude: business.longitude,\n        serviceRadiusKm: Number(radius) || 30,\n      });\n      setBusiness(updated);\n      setMessage(null);\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Speichern fehlgeschlagen.\");\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  const categoryName = (id: string): string =>\n    categories.find((category) => category.id === id)?.name ?? \"Leistung\";\n\n  const incomplete = business !== null && (business.latitude === null || services.length === 0);\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Unternehmen<\/Text>\n\n      {incomplete ? (\n        <Card style={styles.warn}>\n          <Text style={styles.warnTitle}>Profil unvollständig<\/Text>\n          <Text style={styles.body}>\n            {business?.latitude === null\n              ? \"Ohne Standort kann das Matching die Entfernung nicht berechnen.\"\n              : \"Ohne hinterlegte Leistung wirst du zu keiner Anfrage vorgeschlagen.\"}\n          <\/Text>\n        <\/Card>\n      ) : null}\n\n      <Card>\n        <View style={styles.row}>\n          <Text style={styles.name}>{business?.name ?? \"\"}<\/Text>\n          {business?.verified === true ? <Badge label=\"Geprüft\" tone=\"success\" /> : null}\n        <\/View>\n        <Text style={styles.meta}>\n          {business?.rating == null\n            ? \"Noch keine Bewertungen\"\n            : `⭐ ${business.rating.toFixed(1).replace(\".\", \",\")} · ${business.reviewCount} Bewertungen`}\n        <\/Text>\n      <\/Card>\n\n      <Input\n        label=\"Beschreibung\"\n        value={description}\n        onChangeText={setDescription}\n        placeholder=\"Was macht euer Betrieb?\"\n        multiline\n      />\n      <Input\n        label=\"Einsatzradius in Kilometern\"\n        value={radius}\n        onChangeText={setRadius}\n        keyboardType=\"number-pad\"\n        hint=\"Anfragen außerhalb dieses Radius werden dir nicht vorgeschlagen.\"\n      />\n\n      <ErrorNotice message={message} />\n      <Button title=\"Speichern\" loading={busy} onPress={save} />\n\n      <Card>\n        <Text style={styles.sectionLabel}>Leistungen<\/Text>\n        {services.length === 0 ? (\n          <Text style={styles.body}>Noch keine Leistung hinterlegt.<\/Text>\n        ) : (\n          <View style={styles.chips}>\n            {services.map((service) => (\n              <Badge key={service.id} label={categoryName(service.categoryId)} tone=\"neutral\" />\n            ))}\n          <\/View>\n        )}\n      <\/Card>\n\n      <Card>\n        <Text style={styles.sectionLabel}>Verfügbarkeit<\/Text>\n        {availability.length === 0 ? (\n          <Text style={styles.body}>\n            Noch keine Zeiten hinterlegt. Kunden können dann keinen Termin buchen.\n          <\/Text>\n        ) : (\n          availability.map((slot) => (\n            <View key={slot.id} style={styles.row}>\n              <Text style={styles.meta}>{WEEKDAYS[slot.weekday]}<\/Text>\n              <Text style={styles.body}>\n                {slot.startTime}–{slot.endTime}\n              <\/Text>\n            <\/View>\n          ))\n        )}\n        <Text style={styles.hint}>Der Kunde sieht ausschließlich diese Zeiten.<\/Text>\n      <\/Card>\n\n      <Button\n        title=\"Abmelden\"\n        variant=\"secondary\"\n        onPress={() => {\n          void signOut().then(() => router.replace(\"/\"));\n        }}\n      />\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  row: { flexDirection: \"row\", justifyContent: \"space-between\", alignItems: \"center\", gap: spacing.sm },\n  name: { fontSize: typography.sizes.title, fontWeight: typography.weights.semibold, color: colors.text },\n  meta: { fontSize: typography.sizes.small, color: colors.textMuted },\n  sectionLabel: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.textMuted,\n  },\n  body: { fontSize: typography.sizes.small, color: colors.text, lineHeight: 20 },\n  hint: { fontSize: typography.sizes.caption, color: colors.textMuted },\n  chips: { flexDirection: \"row\", flexWrap: \"wrap\", gap: spacing.sm },\n  warn: { backgroundColor: colors.warningLight },\n  warnTitle: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.warning,\n  },\n});\n"}, {"pfad": "apps/mobile/app/(app)/chat.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 216, "bytes": 7511, "inhalt": "import { useCallback, useRef, useState } from \"react\";\nimport { ActivityIndicator, ScrollView, StyleSheet, Text, View } from \"react-native\";\nimport { useFocusEffect } from \"expo-router\";\nimport type { Conversation, Message } from \"@jobflow/types\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { useSession } from \"../../lib/session.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { Card } from \"../../components/Card.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Input } from \"../../components/Input.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\n/**\n * Der Chat.\n *\n * Jede Anfrage-Unternehmen-Beziehung hat genau eine Konversation. Die KI kann\n * eine Antwort vorschlagen, aber niemals selbst absenden - und ein Text, der\n * von ihr stammt, ist auch nach dem Absenden als solcher gekennzeichnet.\n */\nexport default function ChatScreen() {\n  const { user } = useSession();\n  const scrollRef = useRef<React.ComponentRef<typeof ScrollView>>(null);\n\n  const [conversations, setConversations] = useState<Conversation[]>([]);\n  const [activeId, setActiveId] = useState<string | null>(null);\n  const [messages, setMessages] = useState<Message[]>([]);\n  const [draft, setDraft] = useState(\"\");\n  const [draftIsAi, setDraftIsAi] = useState(false);\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [loading, setLoading] = useState(true);\n\n  const loadMessages = useCallback(async (conversationId: string) => {\n    const found = await api.get<Message[]>(`/conversations/${conversationId}/messages?limit=100`);\n    setMessages(found);\n  }, []);\n\n  useFocusEffect(\n    useCallback(() => {\n      let cancelled = false;\n      setLoading(true);\n      void (async () => {\n        try {\n          const found = await api.get<Conversation[]>(\"/conversations\");\n          if (cancelled) return;\n          setConversations(found);\n          const first = found[0];\n          if (first !== undefined) {\n            setActiveId(first.id);\n            await loadMessages(first.id);\n          }\n        } catch {\n          if (!cancelled) setConversations([]);\n        } finally {\n          if (!cancelled) setLoading(false);\n        }\n      })();\n      return () => {\n        cancelled = true;\n      };\n    }, [loadMessages]),\n  );\n\n  async function send(): Promise<void> {\n    if (activeId === null || draft.trim() === \"\") return;\n    setBusy(true);\n    setMessage(null);\n    try {\n      await api.post(`/conversations/${activeId}/messages`, {\n        body: draft.trim(),\n        isAiGenerated: draftIsAi,\n      });\n      setDraft(\"\");\n      setDraftIsAi(false);\n      await loadMessages(activeId);\n      scrollRef.current?.scrollToEnd({ animated: true });\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Die Nachricht konnte nicht gesendet werden.\");\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  async function suggest(): Promise<void> {\n    if (activeId === null) return;\n    setBusy(true);\n    setMessage(null);\n    try {\n      const result = await api.post<{ text: string }>(`/conversations/${activeId}/suggest-reply`, {\n        context: messages.at(-1)?.body ?? \"Rückfrage des Kunden\",\n      });\n      setDraft(result.text);\n      // Der Vorschlag bleibt als KI-Text markiert, auch wenn er noch bearbeitet\n      // wird - die Kennzeichnung geht mit an den Empfänger.\n      setDraftIsAi(true);\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Kein Vorschlag möglich.\");\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  if (conversations.length === 0) {\n    return (\n      <Screen>\n        <Text style={styles.title}>Nachrichten<\/Text>\n        <Card style={styles.empty}>\n          <Text style={styles.emptyTitle}>Noch keine Gespräche<\/Text>\n          <Text style={styles.emptyHint}>\n            {user?.role === \"CUSTOMER\"\n              ? \"Sobald ein Unternehmen dir ein Angebot schickt, könnt ihr hier schreiben.\"\n              : \"Sobald du auf eine Anfrage antwortest, entsteht hier ein Gespräch.\"}\n          <\/Text>\n        <\/Card>\n      <\/Screen>\n    );\n  }\n\n  const isBusiness = user?.role === \"BUSINESS\" || user?.role === \"BUSINESS_EMPLOYEE\";\n\n  return (\n    <Screen scroll={false}>\n      <Text style={styles.title}>Nachrichten<\/Text>\n\n      <ScrollView\n        ref={scrollRef}\n        style={styles.thread}\n        contentContainerStyle={styles.threadContent}\n        onContentSizeChange={() => scrollRef.current?.scrollToEnd({ animated: false })}\n      >\n        {messages.map((entry) => {\n          const mine = entry.senderId === user?.id;\n          return (\n            <View\n              key={entry.id}\n              style={[styles.bubble, mine ? styles.bubbleMine : styles.bubbleTheirs]}\n            >\n              <Text style={[styles.bubbleText, mine ? styles.bubbleTextMine : null]}>{entry.body}<\/Text>\n              <Text style={[styles.bubbleMeta, mine ? styles.bubbleMetaMine : null]}>\n                {new Date(entry.createdAt).toLocaleTimeString(\"de-DE\", { hour: \"2-digit\", minute: \"2-digit\" })}\n                {entry.isAiGenerated ? \" · mit KI verfasst\" : \"\"}\n              <\/Text>\n            <\/View>\n          );\n        })}\n      <\/ScrollView>\n\n      <ErrorNotice message={message} />\n\n      {isBusiness ? (\n        <Button title=\"Antwort vorschlagen\" icon=\"🤖\" variant=\"secondary\" onPress={suggest} />\n      ) : null}\n\n      <View style={styles.composer}>\n        <View style={styles.composerInput}>\n          <Input\n            label=\"Nachricht\"\n            value={draft}\n            onChangeText={(value) => {\n              setDraft(value);\n              if (value.trim() === \"\") setDraftIsAi(false);\n            }}\n            placeholder=\"Nachricht schreiben\"\n          />\n        <\/View>\n        <Button title=\"Senden\" loading={busy} onPress={send} />\n      <\/View>\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  thread: { flex: 1 },\n  threadContent: { gap: spacing.sm, paddingVertical: spacing.sm },\n  bubble: { maxWidth: \"80%\", padding: spacing.md, borderRadius: radii.lg },\n  bubbleMine: {\n    alignSelf: \"flex-end\",\n    backgroundColor: colors.primary,\n    borderBottomRightRadius: radii.sm,\n  },\n  bubbleTheirs: {\n    alignSelf: \"flex-start\",\n    backgroundColor: colors.surface,\n    borderBottomLeftRadius: radii.sm,\n  },\n  bubbleText: { fontSize: typography.sizes.small, color: colors.text, lineHeight: 20 },\n  bubbleTextMine: { color: colors.textInverted },\n  bubbleMeta: { fontSize: typography.sizes.caption, color: colors.textMuted, marginTop: spacing.xs },\n  bubbleMetaMine: { color: colors.primaryLight },\n  composer: { gap: spacing.sm },\n  composerInput: { flex: 1 },\n  empty: { alignItems: \"center\", gap: spacing.sm, paddingVertical: spacing.xxl },\n  emptyTitle: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  emptyHint: {\n    fontSize: typography.sizes.small,\n    color: colors.textMuted,\n    textAlign: \"center\",\n    lineHeight: 20,\n  },\n});\n"}, {"pfad": "apps/mobile/app/(app)/create-offer.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 186, "bytes": 6229, "inhalt": "import { useCallback, useState } from \"react\";\nimport { StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect, useLocalSearchParams } from \"expo-router\";\nimport type { AiAnalysisDetail, Offer } from \"@jobflow/types\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\nimport { createOfferSchema, validate } from \"@jobflow/validation\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { Card } from \"../../components/Card.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Input } from \"../../components/Input.js\";\nimport { Screen } from \"../../components/Screen.js\";\nimport { formatEuro } from \"../../lib/format.js\";\n\n/**\n * Angebot erstellen.\n *\n * Die KI schlägt einen Beschreibungstext vor - über Preis und Inhalt\n * entscheidet ausschließlich das Unternehmen. Die Gesamtsumme rechnet das\n * Backend aus den drei Positionen; hier wird sie nur zur Kontrolle angezeigt.\n */\nexport default function CreateOfferScreen() {\n  const { requestId } = useLocalSearchParams<{ requestId: string }>();\n\n  const [labor, setLabor] = useState(\"80\");\n  const [material, setMaterial] = useState(\"25\");\n  const [travel, setTravel] = useState(\"15\");\n  const [description, setDescription] = useState(\"\");\n  const [aiAssisted, setAiAssisted] = useState(false);\n  const [summary, setSummary] = useState<string | null>(null);\n  const [fields, setFields] = useState<Record<string, string>>({});\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n\n  useFocusEffect(\n    useCallback(() => {\n      if (typeof requestId !== \"string\") return;\n      void api\n        .get<AiAnalysisDetail>(`/requests/${requestId}/analysis`)\n        .then((analysis) => setSummary(analysis.summary))\n        .catch(() => setSummary(null));\n    }, [requestId]),\n  );\n\n  const totalCents = toCents(labor) + toCents(material) + toCents(travel);\n\n  async function suggest(): Promise<void> {\n    setBusy(true);\n    setMessage(null);\n    try {\n      const result = await api.post<{ text: string }>(\"/offers/suggest-text\", {\n        context: summary ?? \"Reparatur beim Kunden vor Ort\",\n      });\n      setDescription(result.text);\n      setAiAssisted(true);\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Kein Vorschlag möglich.\");\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  async function submit(): Promise<void> {\n    setMessage(null);\n    // Ein Angebot gilt eine Woche - lang genug zum Vergleichen, kurz genug,\n    // dass der Betrieb seine Preise nicht monatelang gebunden hat.\n    const validUntil = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();\n    const parsed = validate(createOfferSchema, {\n      requestId,\n      laborCents: toCents(labor),\n      materialCents: toCents(material),\n      travelCents: toCents(travel),\n      description,\n      validUntil,\n      descriptionAiAssisted: aiAssisted,\n    });\n    if (!parsed.ok) {\n      setFields(parsed.fields);\n      return;\n    }\n    setFields({});\n    setBusy(true);\n    try {\n      await api.post<Offer>(\"/offers\", parsed.value);\n      router.replace(\"/(app)/dashboard\");\n    } catch (error) {\n      if (error instanceof ApiClientError) {\n        setFields(error.fields);\n        setMessage(error.message);\n      } else {\n        setMessage(\"Das Angebot konnte nicht gesendet werden.\");\n      }\n      setBusy(false);\n    }\n  }\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Angebot erstellen<\/Text>\n\n      {summary !== null ? (\n        <Card style={styles.ai}>\n          <Text style={styles.aiLabel}>🤖 Das Anliegen laut KI<\/Text>\n          <Text style={styles.body}>{summary}<\/Text>\n        <\/Card>\n      ) : null}\n\n      <Input\n        label=\"Arbeitskosten in Euro\"\n        value={labor}\n        onChangeText={setLabor}\n        keyboardType=\"decimal-pad\"\n        error={fields[\"laborCents\"]}\n      />\n      <Input\n        label=\"Material in Euro\"\n        value={material}\n        onChangeText={setMaterial}\n        keyboardType=\"decimal-pad\"\n        error={fields[\"materialCents\"]}\n      />\n      <Input\n        label=\"Anfahrt in Euro\"\n        value={travel}\n        onChangeText={setTravel}\n        keyboardType=\"decimal-pad\"\n        error={fields[\"travelCents\"]}\n      />\n\n      <View style={styles.total}>\n        <Text style={styles.totalLabel}>Gesamt<\/Text>\n        <Text style={styles.totalValue}>{formatEuro(totalCents)}<\/Text>\n      <\/View>\n\n      <Input\n        label=\"Beschreibung\"\n        value={description}\n        onChangeText={(value) => {\n          setDescription(value);\n          if (value.trim() === \"\") setAiAssisted(false);\n        }}\n        placeholder=\"Was ist im Angebot enthalten?\"\n        multiline\n        error={fields[\"description\"]}\n        {...(aiAssisted ? { hint: \"Vorschlag der KI – du kannst ihn frei ändern.\" } : {})}\n      />\n\n      <Button title=\"KI-Text vorschlagen\" icon=\"🤖\" variant=\"secondary\" onPress={suggest} />\n\n      <ErrorNotice message={message} />\n      <Button title=\"Angebot senden\" loading={busy} onPress={submit} />\n    <\/Screen>\n  );\n}\n\n/** \"80\" oder \"80,50\" -> Cent. Gerechnet wird immer in Cent. */\nfunction toCents(value: string): number {\n  const parsed = Number(value.replace(\",\", \".\"));\n  return Number.isFinite(parsed) && parsed >= 0 ? Math.round(parsed * 100) : 0;\n}\n\nconst styles = StyleSheet.create({\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  ai: { backgroundColor: colors.aiLight },\n  aiLabel: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.semibold,\n    color: colors.ai,\n  },\n  body: { fontSize: typography.sizes.small, color: colors.text, lineHeight: 21 },\n  total: {\n    flexDirection: \"row\",\n    justifyContent: \"space-between\",\n    alignItems: \"baseline\",\n    backgroundColor: colors.primaryLight,\n    borderRadius: radii.lg,\n    padding: spacing.lg,\n  },\n  totalLabel: { fontSize: typography.sizes.small, color: colors.primaryDark },\n  totalValue: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.primaryDark,\n  },\n});\n"}, {"pfad": "apps/mobile/app/(app)/create-request.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 140, "bytes": 4850, "inhalt": "import { useState } from \"react\";\nimport { Pressable, StyleSheet, Text, View } from \"react-native\";\nimport { router, useLocalSearchParams } from \"expo-router\";\nimport type { ServiceRequest, Urgency } from \"@jobflow/types\";\nimport { colors, radii, spacing, typography, urgencyLabels } from \"@jobflow/config\";\nimport { createRequestSchema, REQUEST_DESCRIPTION_MIN, validate } from \"@jobflow/validation\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Input } from \"../../components/Input.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\nconst URGENCY_OPTIONS: Urgency[] = [\"LOW\", \"NORMAL\", \"HIGH\"];\n\n/**\n * Screen 03 - Anfrage erstellen.\n *\n * Ein Textfeld, ein Ort, ein Zeitrahmen. Kein 30-Felder-Formular: was noch\n * fehlt, fragt die KI im nächsten Schritt gezielt nach - und nur das, was\n * wirklich nötig ist.\n */\nexport default function CreateRequestScreen() {\n  const params = useLocalSearchParams<{ categoryId?: string }>();\n\n  const [description, setDescription] = useState(\"\");\n  const [locationLabel, setLocationLabel] = useState(\"\");\n  const [urgency, setUrgency] = useState<Urgency>(\"NORMAL\");\n  const [fields, setFields] = useState<Record<string, string>>({});\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n\n  async function submit(): Promise<void> {\n    setMessage(null);\n    const parsed = validate(createRequestSchema, {\n      description,\n      urgency,\n      locationLabel: locationLabel.trim() === \"\" ? null : locationLabel,\n      categoryId: params.categoryId ?? null,\n    });\n    if (!parsed.ok) {\n      setFields(parsed.fields);\n      return;\n    }\n    setFields({});\n    setBusy(true);\n    try {\n      const request = await api.post<ServiceRequest>(\"/requests\", parsed.value);\n      setDescription(\"\");\n      setLocationLabel(\"\");\n      router.replace(`/(app)/requests/${request.id}`);\n    } catch (error) {\n      if (error instanceof ApiClientError) {\n        setFields(error.fields);\n        setMessage(error.message);\n      } else {\n        setMessage(\"Die Anfrage konnte nicht erstellt werden.\");\n      }\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Was ist passiert?<\/Text>\n\n      <Input\n        label=\"Beschreibung\"\n        value={description}\n        onChangeText={setDescription}\n        placeholder=\"Meine Heizung wird nicht mehr richtig warm.\"\n        multiline\n        hint={`Ein bis zwei Sätze reichen. Mindestens ${REQUEST_DESCRIPTION_MIN} Zeichen.`}\n        error={fields[\"description\"]}\n      />\n\n      <Input\n        label=\"Wo?\"\n        value={locationLabel}\n        onChangeText={setLocationLabel}\n        placeholder=\"45127 Essen\"\n        hint=\"Postleitzahl und Ort genügen. Die genaue Adresse bekommt nur das beauftragte Unternehmen.\"\n        error={fields[\"locationLabel\"]}\n      />\n\n      <View style={styles.section}>\n        <Text style={styles.label}>Wie dringend ist es?<\/Text>\n        <View style={styles.options}>\n          {URGENCY_OPTIONS.map((option) => (\n            <Pressable\n              key={option}\n              onPress={() => setUrgency(option)}\n              accessibilityRole=\"radio\"\n              accessibilityState={{ selected: urgency === option }}\n              style={[styles.option, urgency === option ? styles.optionSelected : null]}\n            >\n              <Text style={[styles.optionText, urgency === option ? styles.optionTextSelected : null]}>\n                {urgencyLabels[option]}\n              <\/Text>\n            <\/Pressable>\n          ))}\n        <\/View>\n      <\/View>\n\n      {/* Fotos folgen in Phase 2 - der Upload braucht Object Storage und\n          Zugriffsschutz, und ohne beides wäre er ein Sicherheitsproblem. */}\n\n      <ErrorNotice message={message} />\n      <Button title=\"Anfrage starten\" onPress={submit} loading={busy} />\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  title: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.text,\n  },\n  section: { gap: spacing.sm },\n  label: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.textMuted,\n  },\n  options: { flexDirection: \"row\", gap: spacing.sm },\n  option: {\n    flex: 1,\n    paddingVertical: spacing.md,\n    borderRadius: radii.md,\n    borderWidth: 2,\n    borderColor: colors.border,\n    backgroundColor: colors.surface,\n    alignItems: \"center\",\n  },\n  optionSelected: { borderColor: colors.primary, backgroundColor: colors.primaryLight },\n  optionText: { fontSize: typography.sizes.small, color: colors.textMuted },\n  optionTextSelected: { color: colors.primaryDark, fontWeight: typography.weights.semibold },\n});\n"}, {"pfad": "apps/mobile/app/(app)/dashboard.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 224, "bytes": 7455, "inhalt": "import { useCallback, useState } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect } from \"expo-router\";\nimport type { Business, Match } from \"@jobflow/types\";\nimport { colors, spacing, typography } from \"@jobflow/config\";\nimport { api } from \"../../lib/api.js\";\nimport { Badge } from \"../../components/Badge.js\";\nimport { Card } from \"../../components/Card.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\ninterface Statistics {\n  matchCount: number;\n  offerCount: number;\n  jobCount: number;\n  offerRate: number;\n  winRate: number;\n  avgResponseMinutes: number | null;\n  rating: number | null;\n  reviewCount: number;\n}\n\n/**\n * Das Dashboard eines Unternehmens.\n *\n * Es beantwortet die drei Fragen, die ein Betrieb morgens hat: Was ist neu?\n * Wie viele meiner Angebote werden angenommen? Wie schnell bin ich?\n */\nexport default function DashboardScreen() {\n  const [business, setBusiness] = useState<Business | null>(null);\n  const [statistics, setStatistics] = useState<Statistics | null>(null);\n  const [matches, setMatches] = useState<Match[]>([]);\n  const [loading, setLoading] = useState(true);\n\n  useFocusEffect(\n    useCallback(() => {\n      let cancelled = false;\n      void (async () => {\n        try {\n          const [profile, stats, newMatches] = await Promise.all([\n            api.get<Business>(\"/businesses/me\"),\n            api.get<Statistics>(\"/businesses/me/statistics\"),\n            api.get<Match[]>(\"/businesses/me/matches?limit=5\"),\n          ]);\n          if (cancelled) return;\n          setBusiness(profile);\n          setStatistics(stats);\n          setMatches(newMatches);\n        } catch {\n          // Ohne Daten bleibt der Screen leer, statt abzustürzen.\n        } finally {\n          if (!cancelled) setLoading(false);\n        }\n      })();\n      return () => {\n        cancelled = true;\n      };\n    }, []),\n  );\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  const incomplete = business !== null && (business.latitude === null || business.description === null);\n\n  return (\n    <Screen>\n      <View>\n        <Text style={styles.greeting}>Guten Morgen 👋<\/Text>\n        <Text style={styles.name}>{business?.name ?? \"Dein Unternehmen\"}<\/Text>\n      <\/View>\n\n      {incomplete ? (\n        <Card style={styles.hint}>\n          <Text style={styles.hintTitle}>Profil vervollständigen<\/Text>\n          <Text style={styles.hintText}>\n            Ohne Standort und Leistungen findet dich das Matching nicht. Beides lässt sich im Profil\n            hinterlegen.\n          <\/Text>\n        <\/Card>\n      ) : null}\n\n      <View style={styles.tiles}>\n        <Tile label=\"Neue Anfragen\" value={String(statistics?.matchCount ?? 0)} />\n        <Tile label=\"Angebote\" value={String(statistics?.offerCount ?? 0)} />\n        <Tile label=\"Aufträge\" value={String(statistics?.jobCount ?? 0)} />\n        <Tile label=\"Angebotsquote\" value={`${statistics?.offerRate ?? 0} %`} />\n      <\/View>\n\n      <Card>\n        <Text style={styles.sectionTitle}>Kennzahlen<\/Text>\n        <Metric\n          label=\"Aus Angeboten werden Aufträge\"\n          value={`${statistics?.winRate ?? 0} %`}\n        />\n        <Metric\n          label=\"Durchschnittliche Antwortzeit\"\n          value={\n            statistics?.avgResponseMinutes == null\n              ? \"Noch keine Daten\"\n              : formatMinutes(statistics.avgResponseMinutes)\n          }\n        />\n        <Metric\n          label=\"Bewertung\"\n          value={\n            statistics?.rating == null\n              ? \"Noch keine Bewertungen\"\n              : `${statistics.rating.toFixed(1).replace(\".\", \",\")} aus ${statistics.reviewCount}`\n          }\n        />\n      <\/Card>\n\n      <View style={styles.section}>\n        <Text style={styles.sectionTitle}>Neue Anfragen<\/Text>\n        {matches.length === 0 ? (\n          <Card>\n            <Text style={styles.empty}>\n              Zurzeit keine passenden Anfragen. Sobald eine entsteht, erscheint sie hier.\n            <\/Text>\n          <\/Card>\n        ) : (\n          matches.map((match) => (\n            <Card\n              key={match.id}\n              onPress={() => router.push(`/(app)/requests/${match.requestId}`)}\n              accessibilityLabel=\"Anfrage öffnen\"\n            >\n              <View style={styles.matchHeader}>\n                <Text style={styles.matchScore}>Passung {match.score}<\/Text>\n                {match.distanceKm !== null ? (\n                  <Badge label={`${match.distanceKm.toFixed(1).replace(\".\", \",\")} km`} />\n                ) : null}\n              <\/View>\n              {match.reasons.slice(0, 2).map((reason) => (\n                <Text key={reason.factor} style={styles.reason}>\n                  • {reason.label}\n                <\/Text>\n              ))}\n            <\/Card>\n          ))\n        )}\n      <\/View>\n    <\/Screen>\n  );\n}\n\nfunction Tile({ label, value }: { label: string; value: string }) {\n  return (\n    <Card style={styles.tile}>\n      <Text style={styles.tileValue}>{value}<\/Text>\n      <Text style={styles.tileLabel}>{label}<\/Text>\n    <\/Card>\n  );\n}\n\nfunction Metric({ label, value }: { label: string; value: string }) {\n  return (\n    <View style={styles.metric}>\n      <Text style={styles.metricLabel}>{label}<\/Text>\n      <Text style={styles.metricValue}>{value}<\/Text>\n    <\/View>\n  );\n}\n\nfunction formatMinutes(minutes: number): string {\n  return minutes < 60 ? `${minutes} Min.` : `${Math.round(minutes / 60)} Std.`;\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  greeting: { fontSize: typography.sizes.body, color: colors.textMuted },\n  name: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.text,\n  },\n  hint: { backgroundColor: colors.warningLight, gap: spacing.xs },\n  hintTitle: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.warning,\n  },\n  hintText: { fontSize: typography.sizes.small, color: colors.text, lineHeight: 20 },\n  tiles: { flexDirection: \"row\", flexWrap: \"wrap\", gap: spacing.md },\n  tile: { flexBasis: \"47%\", flexGrow: 1, gap: spacing.xs },\n  tileValue: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.primary,\n  },\n  tileLabel: { fontSize: typography.sizes.caption, color: colors.textMuted },\n  section: { gap: spacing.md },\n  sectionTitle: {\n    fontSize: typography.sizes.title,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n    marginBottom: spacing.sm,\n  },\n  metric: {\n    flexDirection: \"row\",\n    justifyContent: \"space-between\",\n    paddingVertical: spacing.sm,\n  },\n  metricLabel: { fontSize: typography.sizes.small, color: colors.textMuted, flex: 1 },\n  metricValue: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.text,\n  },\n  matchHeader: { flexDirection: \"row\", justifyContent: \"space-between\", alignItems: \"center\", marginBottom: spacing.sm },\n  matchScore: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  reason: { fontSize: typography.sizes.small, color: colors.textMuted },\n  empty: { fontSize: typography.sizes.small, color: colors.textMuted, lineHeight: 20 },\n});\n"}, {"pfad": "apps/mobile/app/(app)/home.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 101, "bytes": 3377, "inhalt": "import { useCallback, useEffect, useState } from \"react\";\nimport { StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect } from \"expo-router\";\nimport type { Category, ServiceRequest } from \"@jobflow/types\";\nimport { colors, spacing, typography } from \"@jobflow/config\";\nimport { api } from \"../../lib/api.js\";\nimport { useSession } from \"../../lib/session.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { CategoryCard } from \"../../components/CategoryCard.js\";\nimport { RequestCard } from \"../../components/RequestCard.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\n/**\n * Screen 02 - Startseite des Kunden.\n *\n * Bewusst fast leer. Der wichtigste Weg ist \"Problem beschreiben\"; alles\n * andere darf davon nicht ablenken. Kategorien sind eine Abkürzung für\n * Leute, die schon wissen, was sie brauchen - kein Pflichtweg.\n */\nexport default function HomeScreen() {\n  const { user } = useSession();\n  const [categories, setCategories] = useState<Category[]>([]);\n  const [recent, setRecent] = useState<ServiceRequest[]>([]);\n\n  useEffect(() => {\n    void api\n      .get<Category[]>(\"/categories\")\n      .then((all) => setCategories(all.filter((category) => category.parentId === null)))\n      .catch(() => setCategories([]));\n  }, []);\n\n  // Beim Zurückkehren auf den Screen neu laden - sonst fehlt die gerade\n  // erstellte Anfrage.\n  useFocusEffect(\n    useCallback(() => {\n      void api\n        .get<{ items: ServiceRequest[] }>(\"/requests?limit=3\")\n        .then((page) => setRecent(page.items))\n        .catch(() => setRecent([]));\n    }, []),\n  );\n\n  const firstName = user?.name.split(\" \")[0] ?? \"\";\n\n  return (\n    <Screen>\n      <View>\n        <Text style={styles.greeting}>Hallo {firstName} 👋<\/Text>\n        <Text style={styles.question}>Was brauchst du?<\/Text>\n      <\/View>\n\n      <Button icon=\"✍️\" title=\"Problem beschreiben\" onPress={() => router.push(\"/(app)/create-request\")} />\n\n      {recent.length > 0 ? (\n        <View style={styles.section}>\n          <Text style={styles.sectionTitle}>Deine letzten Anfragen<\/Text>\n          <View style={styles.list}>\n            {recent.map((request) => (\n              <RequestCard\n                key={request.id}\n                request={request}\n                onPress={(item) => router.push(`/(app)/requests/${item.id}`)}\n              />\n            ))}\n          <\/View>\n        <\/View>\n      ) : null}\n\n      <View style={styles.section}>\n        <Text style={styles.sectionTitle}>Beliebte Kategorien<\/Text>\n        <View style={styles.grid}>\n          {categories.map((category) => (\n            <CategoryCard\n              key={category.id}\n              category={category}\n              onPress={(item) => router.push(`/(app)/create-request?categoryId=${item.id}`)}\n            />\n          ))}\n        <\/View>\n      <\/View>\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  greeting: { fontSize: typography.sizes.body, color: colors.textMuted },\n  question: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.text,\n  },\n  section: { gap: spacing.md },\n  sectionTitle: {\n    fontSize: typography.sizes.title,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  list: { gap: spacing.md },\n  grid: { flexDirection: \"row\", flexWrap: \"wrap\", gap: spacing.md },\n});\n"}, {"pfad": "apps/mobile/app/(app)/jobs/[id].tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 167, "bytes": 6043, "inhalt": "import { useCallback, useState } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect, useLocalSearchParams } from \"expo-router\";\nimport type { Business, Job, Offer, Review, ServiceRequest } from \"@jobflow/types\";\nimport { colors, spacing, typography } from \"@jobflow/config\";\nimport { api, ApiClientError } from \"../../../lib/api.js\";\nimport { useSession } from \"../../../lib/session.js\";\nimport { Button } from \"../../../components/Button.js\";\nimport { Card } from \"../../../components/Card.js\";\nimport { ErrorNotice } from \"../../../components/ErrorNotice.js\";\nimport { Screen } from \"../../../components/Screen.js\";\nimport { StatusTimeline } from \"../../../components/StatusTimeline.js\";\nimport { formatEuro } from \"../../../lib/format.js\";\n\n/**\n * Der Auftragsstatus.\n *\n * Zwischen Zusage und Termin liegen oft mehrere Tage. In dieser Zeit ist der\n * Zeitstrahl das Einzige, was dem Kunden zeigt, dass sein Anliegen laeuft -\n * deshalb steht er ganz oben.\n */\nexport default function JobDetailScreen() {\n  const { id } = useLocalSearchParams<{ id: string }>();\n  const { user } = useSession();\n  const isBusiness = user?.role === \"BUSINESS\" || user?.role === \"BUSINESS_EMPLOYEE\";\n\n  const [job, setJob] = useState<Job | null>(null);\n  const [offer, setOffer] = useState<Offer | null>(null);\n  const [request, setRequest] = useState<ServiceRequest | null>(null);\n  const [business, setBusiness] = useState<Business | null>(null);\n  const [review, setReview] = useState<Review | null>(null);\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [loading, setLoading] = useState(true);\n\n  const load = useCallback(async () => {\n    if (typeof id !== \"string\") return;\n    try {\n      const found = await api.get<Job>(`/jobs/${id}`);\n      setJob(found);\n      const [loadedOffer, loadedRequest, loadedBusiness] = await Promise.all([\n        api.get<Offer>(`/offers/${found.offerId}`).catch(() => null),\n        api.get<ServiceRequest>(`/requests/${found.requestId}`).catch(() => null),\n        api.get<Business>(`/businesses/${found.businessId}`).catch(() => null),\n      ]);\n      setOffer(loadedOffer);\n      setRequest(loadedRequest);\n      setBusiness(loadedBusiness);\n\n      // Ob bereits bewertet wurde, steht in den Bewertungen des Unternehmens.\n      if (found.status === \"COMPLETED\") {\n        const reviews = await api\n          .get<Review[]>(`/businesses/${found.businessId}/reviews?limit=50`)\n          .catch(() => [] as Review[]);\n        setReview(reviews.find((entry) => entry.jobId === found.id) ?? null);\n      }\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Diesen Auftrag gibt es nicht.\");\n    } finally {\n      setLoading(false);\n    }\n  }, [id]);\n\n  useFocusEffect(\n    useCallback(() => {\n      setLoading(true);\n      void load();\n    }, [load]),\n  );\n\n  async function setStatus(status: Job[\"status\"]): Promise<void> {\n    if (job === null) return;\n    setBusy(true);\n    setMessage(null);\n    try {\n      await api.patch(`/jobs/${job.id}/status`, { status });\n      await load();\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Das hat nicht geklappt.\");\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  if (job === null) {\n    return (\n      <Screen>\n        <ErrorNotice message={message ?? \"Diesen Auftrag gibt es nicht.\"} />\n      <\/Screen>\n    );\n  }\n\n  return (\n    <Screen>\n      <View>\n        <Text style={styles.title}>{request?.title ?? \"Dein Auftrag\"}<\/Text>\n        <Text style={styles.meta}>\n          {business?.name ?? \"\"}\n          {offer === null ? \"\" : ` · ${formatEuro(offer.totalCents)}`}\n        <\/Text>\n      <\/View>\n\n      <Card>\n        <StatusTimeline status={request?.status ?? \"ACCEPTED\"} />\n      <\/Card>\n\n      {request !== null ? (\n        <Card>\n          <Text style={styles.sectionLabel}>Anliegen<\/Text>\n          <Text style={styles.body}>{request.description}<\/Text>\n        <\/Card>\n      ) : null}\n\n      <ErrorNotice message={message} />\n\n      <Button\n        title=\"Nachricht schreiben\"\n        icon=\"💬\"\n        variant=\"secondary\"\n        onPress={() => router.push(\"/(app)/chat\")}\n      />\n\n      {/* Den Fortschritt meldet das ausführende Unternehmen - das ist seine\n          Aussage, nicht die des Kunden. Das Backend erzwingt dieselbe Regel. */}\n      {isBusiness && job.status === \"SCHEDULED\" ? (\n        <Button title=\"Auftrag beginnen\" loading={busy} onPress={() => setStatus(\"IN_PROGRESS\")} />\n      ) : null}\n      {isBusiness && job.status === \"IN_PROGRESS\" ? (\n        <Button title=\"Auftrag abschließen\" loading={busy} onPress={() => setStatus(\"COMPLETED\")} />\n      ) : null}\n\n      {!isBusiness && job.status === \"COMPLETED\" && review === null ? (\n        <Button title=\"Auftrag bewerten\" onPress={() => router.push(`/(app)/review?jobId=${job.id}`)} />\n      ) : null}\n\n      {review !== null ? (\n        <Card>\n          <Text style={styles.sectionLabel}>Deine Bewertung<\/Text>\n          <Text style={styles.stars}>{\"⭐\".repeat(review.rating)}<\/Text>\n          {review.text === null ? null : <Text style={styles.body}>{review.text}<\/Text>}\n        <\/Card>\n      ) : null}\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  meta: { fontSize: typography.sizes.small, color: colors.textMuted, marginTop: spacing.xs },\n  sectionLabel: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.textMuted,\n  },\n  body: { fontSize: typography.sizes.small, color: colors.text, lineHeight: 21 },\n  stars: { fontSize: typography.sizes.title },\n});\n"}, {"pfad": "apps/mobile/app/(app)/jobs/index.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 111, "bytes": 3587, "inhalt": "import { useCallback, useState } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect } from \"expo-router\";\nimport type { Appointment, Job } from \"@jobflow/types\";\nimport { colors, jobStatusLabels, spacing, typography } from \"@jobflow/config\";\nimport { api } from \"../../../lib/api.js\";\nimport { useSession } from \"../../../lib/session.js\";\nimport { Badge, type BadgeTone } from \"../../../components/Badge.js\";\nimport { Card } from \"../../../components/Card.js\";\nimport { Screen } from \"../../../components/Screen.js\";\n\nfunction toneFor(status: Job[\"status\"]): BadgeTone {\n  if (status === \"COMPLETED\") return \"success\";\n  if (status === \"CANCELLED\") return \"error\";\n  if (status === \"IN_PROGRESS\") return \"warning\";\n  return \"neutral\";\n}\n\n/** Alle Aufträge - für Kunden wie für Unternehmen dieselbe Liste. */\nexport default function JobListScreen() {\n  const { user } = useSession();\n  const [jobs, setJobs] = useState<Job[]>([]);\n  const [loading, setLoading] = useState(true);\n\n  useFocusEffect(\n    useCallback(() => {\n      let cancelled = false;\n      setLoading(true);\n      void api\n        .get<Job[]>(\"/jobs?limit=50\")\n        .then((found) => {\n          if (!cancelled) setJobs(found);\n        })\n        .catch(() => {\n          if (!cancelled) setJobs([]);\n        })\n        .finally(() => {\n          if (!cancelled) setLoading(false);\n        });\n      return () => {\n        cancelled = true;\n      };\n    }, []),\n  );\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Aufträge<\/Text>\n      {jobs.length === 0 ? (\n        <Card style={styles.empty}>\n          <Text style={styles.emptyTitle}>Noch keine Aufträge<\/Text>\n          <Text style={styles.emptyHint}>\n            {user?.role === \"CUSTOMER\"\n              ? \"Sobald du ein Angebot annimmst, entsteht hier ein Auftrag.\"\n              : \"Sobald ein Kunde eines deiner Angebote annimmt, erscheint der Auftrag hier.\"}\n          <\/Text>\n        <\/Card>\n      ) : (\n        jobs.map((job) => (\n          <Card\n            key={job.id}\n            onPress={() => router.push(`/(app)/jobs/${job.id}`)}\n            accessibilityLabel=\"Auftrag öffnen\"\n          >\n            <View style={styles.header}>\n              <Badge label={jobStatusLabels[job.status] ?? job.status} tone={toneFor(job.status)} />\n            <\/View>\n            <Text style={styles.meta}>\n              Angelegt am{\" \"}\n              {new Date(job.createdAt).toLocaleDateString(\"de-DE\", {\n                day: \"2-digit\",\n                month: \"2-digit\",\n                year: \"numeric\",\n              })}\n            <\/Text>\n          <\/Card>\n        ))\n      )}\n    <\/Screen>\n  );\n}\n\nexport type { Appointment };\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  header: { flexDirection: \"row\", gap: spacing.sm },\n  meta: { fontSize: typography.sizes.small, color: colors.textMuted },\n  empty: { alignItems: \"center\", gap: spacing.sm, paddingVertical: spacing.xxl },\n  emptyTitle: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  emptyHint: {\n    fontSize: typography.sizes.small,\n    color: colors.textMuted,\n    textAlign: \"center\",\n    lineHeight: 20,\n  },\n});\n"}, {"pfad": "apps/mobile/app/(app)/offers/[id].tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 204, "bytes": 7234, "inhalt": "import { useCallback, useState } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect, useLocalSearchParams } from \"expo-router\";\nimport type { Business, Job, Offer } from \"@jobflow/types\";\nimport { colors, offerStatusLabels, spacing, typography } from \"@jobflow/config\";\nimport { api, ApiClientError } from \"../../../lib/api.js\";\nimport { useSession } from \"../../../lib/session.js\";\nimport { Badge } from \"../../../components/Badge.js\";\nimport { Button } from \"../../../components/Button.js\";\nimport { Card } from \"../../../components/Card.js\";\nimport { ErrorNotice } from \"../../../components/ErrorNotice.js\";\nimport { Screen } from \"../../../components/Screen.js\";\nimport { formatEuro } from \"../../../lib/format.js\";\n\n/**\n * Das Angebot im Detail.\n *\n * Der Preis steht vollständig und aufgeschlüsselt da, bevor der Kunde\n * annimmt - Arbeit, Material, Anfahrt. Ein Marktplatz, auf dem erst nach der\n * Zusage klar wird, was etwas kostet, verspielt genau das Vertrauen, von dem\n * er lebt.\n */\nexport default function OfferDetailScreen() {\n  const { id } = useLocalSearchParams<{ id: string }>();\n  const { user } = useSession();\n  const isCustomer = user?.role === \"CUSTOMER\";\n\n  const [offer, setOffer] = useState<Offer | null>(null);\n  const [business, setBusiness] = useState<Business | null>(null);\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [loading, setLoading] = useState(true);\n\n  const load = useCallback(async () => {\n    if (typeof id !== \"string\") return;\n    try {\n      const found = await api.get<Offer>(`/offers/${id}`);\n      setOffer(found);\n      setBusiness(await api.get<Business>(`/businesses/${found.businessId}`));\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Dieses Angebot gibt es nicht.\");\n    } finally {\n      setLoading(false);\n    }\n  }, [id]);\n\n  useFocusEffect(\n    useCallback(() => {\n      setLoading(true);\n      void load();\n    }, [load]),\n  );\n\n  async function accept(): Promise<void> {\n    if (offer === null) return;\n    setBusy(true);\n    setMessage(null);\n    try {\n      // Die Antwort enthält den frisch angelegten Auftrag - der Kunde geht\n      // direkt weiter zur Terminwahl.\n      const result = await api.post<{ offer: Offer; job: Job }>(`/offers/${offer.id}/accept`);\n      router.replace(`/(app)/appointment?offerId=${result.offer.id}`);\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Das hat nicht geklappt.\");\n      setBusy(false);\n    }\n  }\n\n  async function decline(): Promise<void> {\n    if (offer === null) return;\n    setBusy(true);\n    try {\n      await api.post(`/offers/${offer.id}/decline`);\n      router.back();\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Das hat nicht geklappt.\");\n      setBusy(false);\n    }\n  }\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  if (offer === null) {\n    return (\n      <Screen>\n        <ErrorNotice message={message ?? \"Dieses Angebot gibt es nicht.\"} />\n      <\/Screen>\n    );\n  }\n\n  return (\n    <Screen>\n      <View>\n        <Text style={styles.title}>{business?.name ?? \"Angebot\"}<\/Text>\n        <Text style={styles.meta}>\n          {business == null || business.rating === null\n            ? \"Noch keine Bewertungen\"\n            : `⭐ ${business.rating.toFixed(1).replace(\".\", \",\")} · ${business.reviewCount} Bewertungen`}\n        <\/Text>\n      <\/View>\n\n      {business?.verified === true ? (\n        <Badge label=\"Unternehmen geprüft\" tone=\"success\" />\n      ) : (\n        <Badge label=\"Noch nicht geprüft\" tone=\"warning\" />\n      )}\n\n      <Card>\n        <View style={styles.line}>\n          <Text style={styles.lineLabel}>Arbeitskosten<\/Text>\n          <Text style={styles.lineValue}>{formatEuro(offer.laborCents)}<\/Text>\n        <\/View>\n        <View style={styles.line}>\n          <Text style={styles.lineLabel}>Material<\/Text>\n          <Text style={styles.lineValue}>{formatEuro(offer.materialCents)}<\/Text>\n        <\/View>\n        <View style={styles.line}>\n          <Text style={styles.lineLabel}>Anfahrt<\/Text>\n          <Text style={styles.lineValue}>{formatEuro(offer.travelCents)}<\/Text>\n        <\/View>\n        <View style={styles.total}>\n          <Text style={styles.lineLabel}>Gesamt<\/Text>\n          <Text style={styles.totalValue}>{formatEuro(offer.totalCents)}<\/Text>\n        <\/View>\n      <\/Card>\n\n      <Card>\n        <Text style={styles.sectionLabel}>Beschreibung<\/Text>\n        <Text style={styles.body}>{offer.description}<\/Text>\n        {offer.descriptionAiAssisted ? (\n          <Text style={styles.aiHint}>\n            Text mit KI-Unterstützung verfasst und vom Unternehmen freigegeben.\n          <\/Text>\n        ) : null}\n      <\/Card>\n\n      <View style={styles.statusRow}>\n        <Badge\n          label={offerStatusLabels[offer.status] ?? offer.status}\n          tone={offer.status === \"ACCEPTED\" ? \"success\" : \"neutral\"}\n        />\n        <Text style={styles.meta}>Gültig bis {formatDate(offer.validUntil)}<\/Text>\n      <\/View>\n\n      <ErrorNotice message={message} />\n\n      {isCustomer && offer.status === \"PENDING\" ? (\n        <View style={styles.actions}>\n          <Button title=\"Angebot annehmen\" loading={busy} onPress={accept} />\n          <Button title=\"Ablehnen\" variant=\"ghost\" onPress={decline} />\n        <\/View>\n      ) : offer.status === \"ACCEPTED\" ? (\n        <Button\n          title=\"Termin ansehen\"\n          variant=\"secondary\"\n          onPress={() => router.push(`/(app)/appointment?offerId=${offer.id}`)}\n        />\n      ) : null}\n    <\/Screen>\n  );\n}\n\nfunction formatDate(iso: string): string {\n  return new Date(iso).toLocaleDateString(\"de-DE\", { day: \"2-digit\", month: \"2-digit\", year: \"numeric\" });\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  meta: { fontSize: typography.sizes.small, color: colors.textMuted },\n  sectionLabel: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.textMuted,\n  },\n  body: { fontSize: typography.sizes.small, color: colors.text, lineHeight: 21 },\n  aiHint: { fontSize: typography.size import { api, ApiClientError } from \"../../../lib/api.js\";\nimport { useSession } from \"../../../lib/session.js\";\nimport { AiNotice } from \"../../../components/AiNotice.js\";\nimport { Badge } from \"../../../components/Badge.js\";\nimport { Button } from \"../../../components/Button.js\";\nimport { Card } from \"../../../components/Card.js\";\nimport { ErrorNotice } from \"../../../components/ErrorNotice.js\";\nimport { Input } from \"../../../components/Input.js\";\nimport { Screen } from \"../../../components/Screen.js\";\nimport { StatusTimeline } from \"../../../components/StatusTimeline.js\";\n\n/**\n * Die Detailansicht einer Anfrage.\n *\n * Sie führt den Kunden durch den Ablauf: analysieren, Rückfragen\n * beantworten, Anbieter suchen, Angebot annehmen. Jeder Schritt ist genau\n * dann sichtbar, wenn er an der Reihe ist.\n */\nexport default function RequestDetailScreen() {\n  const { id } = useLocalSearchParams<{ id: string }>();\n  const { user } = useSession();\n  const isCustomer = user?.role === \"CUSTOMER\";\n\n  const [request, setRequest] = useState<ServiceRequestDetail | null>(null);\n  const [analysis, setAnalysis] = useState<AiAnalysisDetail | null>(null);\n  const [matches, setMatches] = useState<MatchWithBusiness[]>([]);\n  const [offers, setOffers] = useState<Offer[]>([]);\n  const [answers, setAnswers] = useState<Record<string, string>>({});\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState<string | null>(null);\n  const [loading, setLoading] = useState(true);\n\n  const load = useCallback(async () => {\n    if (typeof id !== \"string\") return;\n    try {\n      setRequest(await api.get<ServiceRequestDetail>(`/requests/${id}`));\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Anfrage nicht gefunden.\");\n      setLoading(false);\n      return;\n    }\n\n    // Analyse, Vorschläge und Angebote gibt es noch nicht in jeder Phase -\n    // ein 404 ist hier kein Fehler, sondern eine Auskunft.\n    await Promise.all([\n      api\n        .get<AiAnalysisDetail>(`/requests/${id}/analysis`)\n        .then(setAnalysis)\n        .catch(() => setAnalysis(null)),\n      isCustomer\n        ? api\n            .get<MatchWithBusiness[]>(`/requests/${id}/matches`)\n            .then(setMatches)\n            .catch(() => setMatches([]))\n        : Promise.resolve(),\n      isCustomer\n        ? api\n            .get<Offer[]>(`/requests/${id}/offers`)\n            .then(setOffers)\n            .catch(() => setOffers([]))\n        : Promise.resolve(),\n    ]);\n    setLoading(false);\n  }, [id, isCustomer]);\n\n  useFocusEffect(\n    useCallback(() => {\n      setLoading(true);\n      void load();\n    }, [load]),\n  );\n\n  async function run(key: string, action: () => Promise<unknown>): Promise<void> {\n    setMessage(null);\n    setBusy(key);\n    try {\n      await action();\n      await load();\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Das hat nicht geklappt.\");\n    } finally {\n      setBusy(null);\n    }\n  }\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  if (request === null) {\n    return (\n      <Screen>\n        <ErrorNotice message={message ?? \"Diese Anfrage gibt es nicht.\"} />\n      <\/Screen>\n    );\n  }\n\n  const openQuestions = analysis?.questions.filter((question) => question.answer === null) ?? [];\n\n  return (\n    <Screen>\n      <Text style={styles.title}>{request.title ?? \"Deine Anfrage\"}<\/Text>\n      <Text style={styles.description}>{request.description}<\/Text>\n\n      <Card>\n        <StatusTimeline status={request.status} />\n      <\/Card>\n\n      <ErrorNotice message={message} />\n\n      {/* Schritt 1: analysieren lassen. */}\n      {analysis === null && isCustomer ? (\n        <Button\n          icon=\"🤖\"\n          title=\"Von der KI analysieren lassen\"\n          loading={busy === \"analyze\"}\n          onPress={() => run(\"analyze\", () => api.post(`/requests/${request.id}/analyze`))}\n        />\n      ) : null}\n\n      {analysis !== null ? (\n        <AiNotice confidence={analysis.confidence}>\n          <Text style={styles.aiSummary}>{analysis.summary}<\/Text>\n        <\/AiNotice>\n      ) : null}\n\n      {/* Schritt 2: die wenigen offenen Rückfragen beantworten. */}\n      {isCustomer && openQuestions.length > 0 ? (\n        <Card>\n          <Text style={styles.sectionTitle}>\n            Noch {openQuestions.length} {openQuestions.length === 1 ? \"Frage\" : \"Fragen\"}\n          <\/Text>\n          <View style={styles.questions}>\n            {openQuestions.map((question) => (\n              <View key={question.id} style={styles.question}>\n                <Input\n                  label={question.question}\n                  value={answers[question.id] ?? \"\"}\n                  onChangeText={(value) => setAnswers((current) => ({ ...current, [question.id]: value }))}\n                  placeholder=\"Deine Antwort\"\n                />\n                <Button\n                  title=\"Antwort senden\"\n                  variant=\"secondary\"\n                  loading={busy === question.id}\n                  onPress={() =>\n                    run(question.id, () =>\n                      api.post(`/requests/${request.id}/questions/${question.id}`, {\n                        answer: answers[question.id] ?? \"\",\n                      }),\n                    )\n                  }\n                />\n              <\/View>\n            ))}\n          <\/View>\n        <\/Card>\n      ) : null}\n\n      {/* Schritt 3: passende Anbieter suchen. */}\n      {isCustomer && matches.length === 0 && request.categoryId !== null ? (\n        <Button\n          icon=\"🔎\"\n          title=\"Passende Anbieter suchen\"\n          loading={busy === \"match\"}\n          onPress={() => run(\"match\", () => api.post(`/requests/${request.id}/matches`))}\n        />\n      ) : null}\n\n      {matches.length > 0 ? (\n        <View style={styles.section}>\n          <Text style={styles.sectionTitle}>\n            {matches.length} {matches.length === 1 ? \"passender Anbieter\" : \"passende Anbieter\"}\n          <\/Text>\n          {matches.map((match) => (\n            <Card key={match.id}>\n              <View style={styles.businessHeader}>\n                <Text style={styles.businessName}>{match.business.name}<\/Text>\n                {match.business.verified ? <Badge label=\"Geprüft\" tone=\"success\" /> : null}\n              <\/View>\n              <Text style={styles.businessMeta}>\n                {match.business.rating === null\n                  ? \"Noch keine Bewertungen\"\n                  : `⭐ ${match.business.rating.toFixed(1).replace(\".\", \",\")} · ${match.business.reviewCount} Bewertungen`}\n              <\/Text>\n              <View style={styles.reasons}>\n                {match.reasons.slice(0, 3).map((reason) => (\n                  <Text key={reason.factor} style={styles.reason}>\n                    • {reason.label}\n                  <\/Text>\n                ))}\n              <\/View>\n            <\/Card>\n          ))}\n        <\/View>\n      ) : null}\n\n      {/* Schritt 4: Angebote vergleichen. Angenommen wird auf der Detailseite,\n          wo der Preis vollständig aufgeschlüsselt steht. */}\n      {offers.length > 0 ? (\n        <View style={styles.section}>\n          <Text style={styles.sectionTitle}>\n            {offers.length} {offers.length === 1 ? \"Angebot\" : \"Angebote\"} erhalten\n          <\/Text>\n          {offers.map((offer) => (\n            <Card\n              key={offer.id}\n              onPress={() => router.push(`/(app)/offers/${offer.id}`)}\n              accessibilityLabel=\"Angebot ansehen\"\n            >\n              <View style={styles.offerHeader}>\n                <Text style={styles.offerTotal}>{formatEuro(offer.totalCents)}<\/Text>\n                <Badge\n                  label={offerStatusLabels[offer.status] ?? offer.status}\n                  tone={offer.status === \"ACCEPTED\" ? \"success\" : \"neutral\"}\n                />\n              <\/View>\n              <Text style={styles.offerDescription} numberOfLines={2}>\n                {offer.description}\n              <\/Text>\n              {offer.descriptionAiAssisted ? (\n                <Text style={styles.aiHint}>Beschreibung mit KI-Unterstützung verfasst.<\/Text>\n              ) : null}\n            <\/Card>\n          ))}\n        <\/View>\n      ) : null}\n\n      {/* Die Sicht des Unternehmens: auf diese Anfrage antworten. */}\n      {!isCustomer ? (\n        <Button\n          title=\"Angebot erstellen\"\n          loading={busy === \"offer\"}\n          onPress={() => router.push(`/(app)/create-offer?requestId=${request.id}`)}\n        />\n      ) : null}\n\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.text,\n  },\n  description: { fontSize: typography.sizes.body, color: colors.textMuted, lineHeight: 24 },\n  section: { gap: spacing.md },\n  sectionTitle: {\n    fontSize: typography.sizes.title,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n    marginBottom: spacing.sm,\n  },\n  aiSummary: { fontSize: typography.sizes.body, color: colors.text },\n  questions: { gap: spacing.lg },\n  question: { gap: spacing.sm },\n  businessHeader: { flexDirection: \"row\", alignItems: \"center\", gap: spacing.sm },\n  businessName: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  businessMeta: { fontSize: typography.sizes.small, color: colors.textMuted, marginTop: spacing.xs },\n  reasons: { gap: spacing.xs, marginTop: spacing.md },\n  reason: { fontSize: typography.sizes.small, color: colors.textMuted },\n  offerHeader: { flexDirection: \"row\", justifyContent: \"space-between\", alignItems: \"center\" },\n  offerTotal: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.text,\n  },\n  offerDescription: { fontSize: typography.sizes.small, color: colors.text, lineHeight: 20 },\n  aiHint: { fontSize: typography.sizes.caption, color: colors.ai, marginTop: spacing.sm },\n});\n"}, {"pfad": "apps/mobile/app/(app)/requests/index.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 157, "bytes": 4898, "inhalt": "import { useCallback, useState } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { router, useFocusEffect } from \"expo-router\";\nimport type { Match, ServiceRequest } from \"@jobflow/types\";\nimport { colors, spacing, typography } from \"@jobflow/config\";\nimport { api } from \"../../../lib/api.js\";\nimport { useSession } from \"../../../lib/session.js\";\nimport { Card } from \"../../../components/Card.js\";\nimport { RequestCard } from \"../../../components/RequestCard.js\";\nimport { Screen } from \"../../../components/Screen.js\";\n\n/**\n * Die Anfragenliste.\n *\n * Für den Kunden: \"Meine Anfragen\". Für das Unternehmen: die Anfragen, die\n * ihm vorgeschlagen wurden. Zwei Sichten, ein Screen - die Daten kommen aus\n * unterschiedlichen Endpunkten, die Darstellung ist dieselbe.\n */\nexport default function RequestListScreen() {\n  const { user } = useSession();\n  const isBusiness = user?.role === \"BUSINESS\" || user?.role === \"BUSINESS_EMPLOYEE\";\n\n  const [requests, setRequests] = useState<ServiceRequest[]>([]);\n  const [matches, setMatches] = useState<Match[]>([]);\n  const [loading, setLoading] = useState(true);\n\n  useFocusEffect(\n    useCallback(() => {\n      let cancelle
