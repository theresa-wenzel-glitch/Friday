known>): void;\n  warn(message: string, fields?: Record<string, unknown>): void;\n  error(message: string, fields?: Record<string, unknown>): void;\n}\n\nconst LEVEL_ORDER: Record<LogLevel, number> = { debug: 10, info: 20, warn: 30, error: 40 };\n\nexport function createLogger(minLevel: LogLevel = \"info\"): Logger {\n  const threshold = LEVEL_ORDER[minLevel];\n\n  function write(level: LogLevel, message: string, fields?: Record<string, unknown>): void {\n    if (LEVEL_ORDER[level] < threshold) return;\n    const line = JSON.stringify({\n      ts: new Date().toISOString(),\n      level,\n      message,\n      ...fields,\n    });\n    if (level === \"error\" || level === \"warn\") console.error(line);\n    else console.log(line);\n  }\n\n  return {\n    debug: (message, fields) => write(\"debug\", message, fields),\n    info: (message, fields) => write(\"info\", message, fields),\n    warn: (message, fields) => write(\"warn\", message, fields),\n    error: (message, fields) => write(\"error\", message, fields),\n  };\n}\n\n/** Verwirft jede Ausgabe - für Tests. */\nexport const silentLogger: Logger = {\n  debug: () => {},\n  info: () => {},\n  warn: () => {},\n  error: () => {},\n};\n"}, {"pfad": "services/api/src/lib/net.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 32, "bytes": 1298, "inhalt": "import type { IncomingMessage } from \"node:http\";\n\n/**\n * Kürzt eine IP-Adresse auf /24 (IPv4) bzw. /48 (IPv6).\n *\n * Das reicht, um Missbrauch zu erkennen und Anfragen zu begrenzen, speichert\n * aber keinen vollständigen Bewegungsverlauf einer einzelnen Person.\n */\nexport function ipPrefix(address: string | undefined): string {\n  if (!address) return \"unbekannt\";\n  const clean = address.startsWith(\"::ffff:\") ? address.slice(7) : address;\n\n  if (clean.includes(\".\")) {\n    const parts = clean.split(\".\");\n    if (parts.length !== 4) return \"unbekannt\";\n    return `${parts[0]}.${parts[1]}.${parts[2]}.0/24`;\n  }\n\n  const groups = clean.split(\":\").filter((group) => group.length > 0);\n  if (groups.length === 0) return \"unbekannt\";\n  return `${groups.slice(0, 3).join(\":\")}::/48`;\n}\n\nexport function clientIpPrefix(req: IncomingMessage): string {\n  // Hinter einem Reverse Proxy steht die echte Adresse im ersten Eintrag von\n  // X-Forwarded-For. Der Header ist fälschbar - er darf deshalb nur für\n  // Rate Limiting und Protokollierung genutzt werden, nie für Berechtigungen.\n  const forwarded = req.headers[\"x-forwarded-for\"];\n  const first = Array.isArray(forwarded) ? forwarded[0] : forwarded?.split(\",\")[0];\n  return ipPrefix(first?.trim() ?? req.socket.remoteAddress ?? undefined);\n}\n"}, {"pfad": "services/api/src/modules/ai/provider.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 47, "bytes": 1639, "inhalt": "import type { AiAnalysisResult } from \"@jobflow/types\";\n\n/**\n * Die Schnittstelle zur KI.\n *\n * Der springende Punkt: die KI redet nie direkt mit der Datenbank. Sie bekommt\n * einen Text und liefert ein Ergebnis in dieser Form zurück. Das Backend\n * validiert es und entscheidet, was gespeichert wird.\n *\n * Dadurch lässt sich das konkrete Modell austauschen, ohne die Anwendung\n * umzubaün - und ein Fehlverhalten der KI kann nichts kaputt machen, was das\n * Backend nicht ohnehin erlauben würde.\n */\nexport interface AiProvider {\n  /** Name inklusive Version, wird zur Analyse gespeichert, z. B. \"rules@1\". */\n  readonly name: string;\n  analyze(input: AiAnalysisInput): Promise<AiAnalysisResult>;\n  /** Formuliert einen Vorschlagstext - für Angebote und Chatantworten. */\n  suggestText(input: AiSuggestionInput): Promise<string>;\n}\n\nexport interface AiAnalysisInput {\n  description: string;\n  /** Slugs aller Kategorien, die die Plattform kennt. */\n  knownCategorySlugs: string[];\n  /** Bereits beantwortete Rückfragen, falls die Analyse wiederholt wird. */\n  answeredQuestions?: { question: string; answer: string }[];\n  photoCount: number;\n}\n\nexport type AiSuggestionKind = \"OFFER_DESCRIPTION\" | \"CHAT_REPLY\";\n\nexport interface AiSuggestionInput {\n  kind: AiSuggestionKind;\n  /** Zusammenfassung der Anfrage - nicht der komplette Verlauf. */\n  context: string;\n  hint?: string;\n}\n\n/** Die KI ist nicht erreichbar oder liefert Unbrauchbares. */\nexport class AiUnavailableError extends Error {\n  constructor(message: string, options?: { cause?: unknown }) {\n    super(message, options);\n    this.name = \"AiUnavailableError\";\n  }\n}\n"}, {"pfad": "services/api/src/modules/ai/remote-provider.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 91, "bytes": 3514, "inhalt": "import type { AiAnalysisResult } from \"@jobflow/types\";\nimport { aiAnalysisResultSchema, validate } from \"@jobflow/validation\";\nimport { AiUnavailableError, type AiAnalysisInput, type AiProvider, type AiSuggestionInput } from \"./provider.js\";\n\n/**\n * Anbindung an einen externen KI-Dienst.\n *\n * Was hier passiert, ist wichtiger als es aussieht: die Antwort des Dienstes\n * wird gegen dasselbe Schema geprüft wie eine Eingabe aus der App. Ein Modell\n * ist keine vertraünswürdige Quelle - es kann halluzinieren, Felder\n * weglassen oder eine Kategorie erfinden, die es nicht gibt.\n */\nexport interface RemoteAiProviderOptions {\n  baseUrl: string;\n  apiKey: string;\n  timeoutMs: number;\n  /** Nur für Tests: eigene fetch-Implementierung. */\n  fetchImpl?: typeof fetch;\n}\n\nexport class RemoteAiProvider implements AiProvider {\n  readonly name = \"remote@1\";\n\n  private readonly options: RemoteAiProviderOptions;\n  private readonly fetchImpl: typeof fetch;\n\n  constructor(options: RemoteAiProviderOptions) {\n    this.options = options;\n    this.fetchImpl = options.fetchImpl ?? fetch;\n  }\n\n  async analyze(input: AiAnalysisInput): Promise<AiAnalysisResult> {\n    const payload = await this.post(\"/analyze\", {\n      description: input.description,\n      knownCategorySlugs: input.knownCategorySlugs,\n      answeredQuestions: input.answeredQuestions ?? [],\n      photoCount: input.photoCount,\n    });\n\n    const result = validate(aiAnalysisResultSchema, payload);\n    if (!result.ok) {\n      throw new AiUnavailableError(\n        `Die KI hat ein unbrauchbares Ergebnis geliefert: ${JSON.stringify(result.fields)}`,\n      );\n    }\n\n    // Auch eine formal gültige Antwort kann eine Kategorie nennen, die es\n    // nicht gibt. Dann wird sie verworfen statt übernommen.\n    if (result.value.categorySlug !== null && !input.knownCategorySlugs.includes(result.value.categorySlug)) {\n      return { ...result.value, categorySlug: null, confidence: Math.min(result.value.confidence, 0.3) };\n    }\n    return result.value;\n  }\n\n  async suggestText(input: AiSuggestionInput): Promise<string> {\n    const payload = await this.post(\"/suggest\", { kind: input.kind, context: input.context, hint: input.hint ?? null });\n    const text = (payload as { text?: unknown }).text;\n    if (typeof text !== \"string\" || text.trim().length === 0) {\n      throw new AiUnavailableError(\"Die KI hat keinen verwertbaren Text geliefert.\");\n    }\n    // Der Vorschlag geht als Entwurf an das Unternehmen, nicht direkt an den\n    // Kunden - deshalb reicht eine Längenbegrenzung.\n    return text.trim().slice(0, 3000);\n  }\n\n  private async post(path: string, body: unknown): Promise<unknown> {\n    const controller = new AbortController();\n    const timeout = setTimeout(() => controller.abort(), this.options.timeoutMs);\n    try {\n      const response = await this.fetchImpl(`${this.options.baseUrl}${path}`, {\n        method: \"POST\",\n        headers: {\n          \"content-type\": \"application/json\",\n          authorization: `Bearer ${this.options.apiKey}`,\n        },\n        body: JSON.stringify(body),\n        signal: controller.signal,\n      });\n      if (!response.ok) {\n        throw new AiUnavailableError(`Die KI antwortete mit Status ${response.status}.`);\n      }\n      return await response.json();\n    } catch (error) {\n      if (error instanceof AiUnavailableError) throw error;\n      throw new AiUnavailableError(\"Die KI ist derzeit nicht erreichbar.\", { cause: error });\n    } finally {\n      clearTimeout(timeout);\n    }\n  }\n}\n"}, {"pfad": "services/api/src/modules/ai/rules-provider.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 229, "bytes": 8932, "inhalt": "import type { AiAnalysisResult } from \"@jobflow/types\";\nimport type { AiAnalysisInput, AiProvider, AiSuggestionInput } from \"./provider.js\";\n\n/**\n * Ein regelbasierter Provider ohne externen Dienst.\n *\n * Er ist kein Ersatz für ein Sprachmodell, aber er erfüllt genau denselben\n * Vertrag. Damit lässt sich die gesamte Plattform - Anfrage, Rückfragen,\n * Matching, Angebot - entwickeln und testen, ohne von einem Modell und dessen\n * Kosten abzuhängen. Der Austausch gegen ein echtes Modell ist später eine\n * Zeile in der Konfiguration.\n */\n\ninterface Rule {\n  slug: string;\n  /** Wörter, die auf diese Kategorie hindeuten. */\n  keywords: string[];\n  summary: string;\n  questions: string[];\n}\n\nconst RULES: Rule[] = [\n  {\n    slug: \"heizung\",\n    keywords: [\"heizung\", \"heizkörper\", \"heizkoerper\", \"thermostat\", \"warmwasser\", \"therme\", \"kessel\"],\n    summary: \"Die Heizung arbeitet nicht wie erwartet.\",\n    questions: [\n      \"Sind mehrere Heizkörper betroffen oder nur einer?\",\n      \"Seit wann besteht das Problem?\",\n      \"Welche Heizungsanlage ist verbaut?\",\n    ],\n  },\n  {\n    slug: \"sanitaer\",\n    keywords: [\"waschbecken\", \"wasserhahn\", \"abfluss\", \"toilette\", \"wc\", \"dusche\", \"rohr\", \"tropft\", \"undicht\", \"verstopft\", \"spülkasten\", \"spuelkasten\"],\n    summary: \"An der Sanitärinstallation tritt ein Defekt auf.\",\n    questions: [\n      \"Wo genau tritt das Wasser aus?\",\n      \"Seit wann besteht das Problem?\",\n      \"Lässt sich das Wasser abstellen?\",\n    ],\n  },\n  {\n    slug: \"elektrik\",\n    keywords: [\"strom\", \"steckdose\", \"sicherung\", \"lichtschalter\", \"kabel\", \"fi\", \"kurzschluss\", \"lampe\"],\n    summary: \"Es liegt eine Störung an der Elektroinstallation vor.\",\n    questions: [\n      \"Ist nur ein Raum betroffen oder die ganze Wohnung?\",\n      \"Hat die Sicherung ausgelöst?\",\n    ],\n  },\n  {\n    slug: \"maler\",\n    keywords: [\"streichen\", \"malern\", \"tapete\", \"wand\", \"anstrich\", \"lackieren\", \"farbe\"],\n    summary: \"Es werden Malerarbeiten benötigt.\",\n    questions: [\"Wie viele Quadratmeter sind es ungefähr?\", \"Sind die Wände vorbereitet?\"],\n  },\n  {\n    slug: \"dach\",\n    keywords: [\"dach\", \"ziegel\", \"dachrinne\", \"regenrinne\", \"dachfenster\", \"undichtes dach\"],\n    summary: \"Am Dach besteht ein Schaden.\",\n    questions: [\"Tritt bereits Wasser ins Gebäude ein?\", \"Wie viele Geschosse hat das Gebäude?\"],\n  },\n  {\n    slug: \"schluessel\",\n    keywords: [\"ausgesperrt\", \"schlüssel\", \"schluessel\", \"schloss\", \"tür klemmt\", \"tuer klemmt\"],\n    summary: \"Es besteht ein Problem mit Schloss oder Zugang.\",\n    questions: [\"Befindet sich jemand in der Wohnung?\", \"Um welche Art von Tuer handelt es sich?\"],\n  },\n  {\n    slug: \"kfz-reparatur\",\n    keywords: [\"auto\", \"motor\", \"bremse\", \"kupplung\", \"auspuff\", \"werkstatt\", \"fahrzeug\", \"pkw\"],\n    summary: \"Am Fahrzeug ist eine Reparatur nötig.\",\n    questions: [\"Welches Fahrzeugmodell und Baujahr?\", \"Ist das Fahrzeug noch fahrbereit?\"],\n  },\n  {\n    slug: \"kfz-reifen\",\n    keywords: [\"reifen\", \"felge\", \"reifenwechsel\", \"platten\", \"winterreifen\", \"sommerreifen\"],\n    summary: \"Es geht um Reifen oder einen Reifenwechsel.\",\n    questions: [\"Welche Reifengröße wird benötigt?\", \"Sind die Reifen bereits vorhanden?\"],\n  },\n  {\n    slug: \"reinigung\",\n    keywords: [\"putzen\", \"reinigung\", \"sauber\", \"fenster putzen\", \"grundreinigung\", \"haushalt\"],\n    summary: \"Es werden Reinigungsarbeiten benötigt.\",\n    questions: [\"Wie groß ist die zu reinigende Fläche?\", \"Einmalig oder regelmäßig?\"],\n  },\n  {\n    slug: \"umzug\",\n    keywords: [\"umzug\", \"umziehen\", \"transport\", \"möbel transportieren\", \"moebel transportieren\", \"kisten\"],\n    summary: \"Es steht ein Umzug oder Transport an.\",\n    questions: [\"Von welchem in welches Stockwerk?\", \"Wie viele Zimmer sind es?\"],\n  },\n  {\n    slug: \"montage\",\n    keywords: [\"aufbauen\", \"montage\", \"schrank\", \"regal\", \"küche montieren\", \"kueche montieren\", \"möbel aufbauen\"],\n    summary: \"Es sollen Moebel montiert werden.\",\n    questions: [\"Um welche Möbelstücke geht es?\", \"Liegt eine Aufbauanleitung vor?\"],\n  },\n  {\n    slug: \"gartenpflege\",\n    keywords: [\"rasen\", \"hecke\", \"unkraut\", \"garten\", \"mähen\", \"maehen\", \"beet\"],\n    summary: \"Der Garten soll gepflegt werden.\",\n    questions: [\"Wie groß ist die Fläche ungefähr?\", \"Einmalig oder regelmäßig?\"],\n  },\n  {\n    slug: \"baumpflege\",\n    keywords: [\"baum\", \"baumfällung\", \"baumfaellung\", \"äste\", \"aeste\", \"stubben\"],\n    summary: \"An Bäumen sind Arbeiten nötig.\",\n    questions: [\"Wie hoch ist der Baum ungefähr?\", \"Steht er frei zugänglich?\"],\n  },\n  {\n    slug: \"nachhilfe\",\n    keywords: [\"nachhilfe\", \"mathe\", \"lernen\", \"schule\", \"hausaufgaben\", \"abitur\"],\n    summary: \"Es wird Unterstützung beim Lernen gesucht.\",\n    questions: [\"Um welches Fach und welche Klassenstufe geht es?\", \"Präsenz oder online?\"],\n  },\n  {\n    slug: \"fotografie\",\n    keywords: [\"foto\", \"fotograf\", \"shooting\", \"hochzeit\", \"portrait\", \"bilder\"],\n    summary: \"Es wird ein Fotograf gesucht.\",\n    questions: [\"Um welchen Anlass geht es?\", \"Wann soll der Termin stattfinden?\"],\n  },\n];\n\n/** Wörter, die auf hohe Dringlichkeit hindeuten. */\nconst URGENT_KEYWORDS = [\n  \"notfall\", \"dringend\", \"sofort\", \"läuft aus\", \"laeuft aus\", \"überschwemmt\", \"überschwemmt\",\n  \"wasserschaden\", \"kein strom\", \"ausgesperrt\", \"gasgeruch\", \"brennt\", \"friert\",\n];\n\nconst RELAXED_KEYWORDS = [\"irgendwann\", \"keine eile\", \"gelegentlich\", \"in den nächsten wochen\", \"in den nächsten wochen\"];\n\nfunction normalize(text: string): string {\n  return text.toLowerCase().replace(/\\s+/g, \" \");\n}\n\nexport class RulesAiProvider implements AiProvider {\n  readonly name = \"rules@1\";\n\n  async analyze(input: AiAnalysisInput): Promise<AiAnalysisResult> {\n    const haystack = normalize(\n      [input.description, ...(input.answeredQuestions ?? []).map((q) => `${q.question} ${q.answer}`)].join(\" \"),\n    );\n\n    let best: { rule: Rule; hits: number } | null = null;\n    for (const rule of RULES) {\n      if (!input.knownCategorySlugs.includes(rule.slug)) continue;\n      const hits = rule.keywords.filter((keyword) => haystack.includes(keyword)).length;\n      if (hits > 0 && (best === null || hits > best.hits)) best = { rule, hits };\n    }\n\n    const urgency = URGENT_KEYWORDS.some((word) => haystack.includes(word))\n      ? \"HIGH\"\n      : RELAXED_KEYWORDS.some((word) => haystack.includes(word))\n        ? \"LOW\"\n        : \"NORMAL\";\n\n    if (best === null) {\n      // Keine Regel greift. Dann sagt der Provider das ehrlich - eine geratene\n      // Kategorie mit hoher Konfidenz wäre schlimmer als gar keine.\n      return {\n        categorySlug: null,\n        summary: summarizeUnknown(input.description),\n        urgency,\n        questions: [\n          \"Um welche Art von Leistung geht es genau?\",\n          \"Wo soll die Arbeit ausgeführt werden?\",\n        ],\n        confidence: 0.2,\n      };\n    }\n\n    // Bereits beantwortete Fragen nicht erneut stellen.\n    const asked = new Set((input.answeredQuestions ?? []).map((q) => q.question));\n    const open = best.rule.questions.filter((question) => !asked.has(question));\n\n    // Ein Foto ersetzt oft eine Rückfrage.\n    const questions = input.photoCount > 0 ? open.slice(0, 2) : open.slice(0, 3);\n\n    return {\n      categorySlug: best.rule.slug,\n      summary: best.rule.summary,\n      urgency,\n      questions,\n      // Mehrere passende Stichwörter erhöhen die Zuversicht, aber nie auf 1:\n      // ein Regelwerk kann sich nicht sicher sein.\n      confidence: Math.min(0.9, 0.55 + best.hits * 0.1),\n    };\n  }\n\n  async suggestText(input: AiSuggestionInput): Promise<string> {\n    if (input.kind === \"OFFER_DESCRIPTION\") {\n      return [\n        \"Vielen Dank für Ihre Anfrage.\",\n        `Wir kümmern uns um folgendes Anliegen: ${input.context}`,\n        \"Das Angebot umfasst Anfahrt, Arbeitszeit und das benötigte Material.\",\n        \"Sollte sich vor Ort ein größerer Aufwand zeigen, stimmen wir uns vorher mit Ihnen ab.\",\n      ].join(\" \");\n    }\n    return [\n      \"Hallo, vielen Dank für Ihre Nachricht.\",\n      input.hint ? `${input.hint}` : \"Wir melden uns zeitnah mit einem konkreten Vorschlag.\",\n    ].join(\" \");\n  }\n}\n\n/**\n * Zusammenfassung, wenn keine Regel greift.\n *\n * Aus einer sehr kurzen Beschreibung lässt sich keine Zusammenfassung bilden.\n * Dann sagt der Provider das ausdrücklich, statt den Text durchzureichen - ein\n * Ergebnis, das der eigene Vertrag nicht erfüllt, wäre schlimmer als eine\n * ehrliche Auskunft.\n */\nfunction summarizeUnknown(description: string): string {\n  const clean = description.trim().replace(/\\s+/g, \" \");\n  if (clean.length < 10) {\n    return \"Die Beschreibung reicht noch nicht aus, um das Anliegen einzuordnen.\";\n  }\n  return shorten(clean);\n}\n\nfunction shorten(text: string, maxLength = 160): string {\n  const clean = text.trim().replace(/\\s+/g, \" \");\n  if (clean.length <= maxLength) return clean;\n  return `${clean.slice(0, maxLength - 1).trimEnd()}…`;\n}\n"}, {"pfad": "services/api/src/modules/ai/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 240, "bytes": 8496, "inhalt": "import type { AiAnalysisDetail, AiAnalysis, AiQuestion, Urgency } from \"@jobflow/types\";\nimport { aiAnalysisResultSchema, validate } from \"@jobflow/validation\";\nimport type { Db } from \"../../db/pool.js\";\nimport { withTransaction } from \"../../db/pool.js\";\nimport { ApiError } from \"../../http/errors.js\";\nimport { recordEvent } from \"../analytics/audit.js\";\nimport { AiUnavailableError, type AiProvider } from \"./provider.js\";\n\ninterface AnalysisRow {\n  id: string;\n  request_id: string;\n  category_id: string | null;\n  summary: string;\n  urgency: Urgency;\n  confidence: number;\n  provider: string;\n  created_at: Date;\n}\n\ninterface QuestionRow {\n  id: string;\n  analysis_id: string;\n  position: number;\n  question: string;\n  answer: string | null;\n  answered_at: Date | null;\n}\n\nfunction mapAnalysis(row: AnalysisRow): AiAnalysis {\n  return {\n    id: row.id,\n    requestId: row.request_id,\n    categoryId: row.category_id,\n    summary: row.summary,\n    urgency: row.urgency,\n    confidence: row.confidence,\n    provider: row.provider,\n    createdAt: row.created_at.toISOString(),\n  };\n}\n\nfunction mapQuestion(row: QuestionRow): AiQuestion {\n  return {\n    id: row.id,\n    analysisId: row.analysis_id,\n    position: row.position,\n    question: row.question,\n    answer: row.answer,\n    answeredAt: row.answered_at === null ? null : row.answered_at.toISOString(),\n  };\n}\n\nexport class AiService {\n  constructor(\n    private readonly db: Db,\n    private readonly provider: AiProvider,\n  ) {}\n\n  /**\n   * Analysiert eine Anfrage und legt das Ergebnis ab.\n   *\n   * Der Ablauf ist bewusst so herum: App -> API -> KI -> Validierung -> Datenbank.\n   * Die KI bekommt nur Text und liefert nur Text zurück. Welche Kategorie\n   * tatsächlich gesetzt wird, entscheidet das Backend anhand der Kategorien,\n   * die es wirklich gibt.\n   */\n  async analyze(requestId: string, customerId: string): Promise<AiAnalysisDetail> {\n    const request = await this.db.query<{\n      id: string;\n      description: string;\n      status: string;\n      category_id: string | null;\n    }>(\"SELECT id, description, status, category_id FROM requests WHERE id = $1 AND customer_id = $2\", [\n      requestId,\n      customerId,\n    ]);\n    const row = request.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Diese Anfrage gibt es nicht.\");\n    if (row.status === \"CANCELLED\" || row.status === \"COMPLETED\") {\n      throw ApiError.conflict(\"Diese Anfrage ist abgeschlossen.\");\n    }\n\n    const categories = await this.db.query<{ id: string; slug: string }>(\n      \"SELECT id, slug FROM categories WHERE active\",\n    );\n    const slugToId = new Map(categories.rows.map((category) => [category.slug, category.id] as const));\n\n    const answered = await this.db.query<{ question: string; answer: string }>(\n      `SELECT q.question, q.answer\n       FROM ai_questions q\n       JOIN ai_analyses a ON a.id = q.analysis_id\n       WHERE a.request_id = $1 AND q.answer IS NOT NULL\n       ORDER BY a.created_at, q.position`,\n      [requestId],\n    );\n\n    const photoCount = await this.db.query<{ count: string }>(\n      \"SELECT count(*)::text AS count FROM request_photos WHERE request_id = $1\",\n      [requestId],\n    );\n\n    let raw: unknown;\n    try {\n      raw = await this.provider.analyze({\n        description: row.description,\n        knownCategorySlugs: [...slugToId.keys()],\n        answeredQuestions: answered.rows,\n        photoCount: Number(photoCount.rows[0]?.count ?? \"0\"),\n      });\n    } catch (error) {\n      if (error instanceof AiUnavailableError) {\n        throw new ApiError(503, \"AI_UNAVAILABLE\", \"Die Analyse ist gerade nicht möglich. Bitte versuche es erneut.\");\n      }\n      throw error;\n    }\n\n    // Auch das Ergebnis des eigenen Providers wird geprüft. Wer hier eine\n    // Ausnahme macht, hat die nächste Provider-Implementierung schon vergessen.\n    const parsed = validate(aiAnalysisResultSchema, raw);\n    if (!parsed.ok) {\n      throw new ApiError(503, \"AI_UNAVAILABLE\", \"Die Analyse lieferte kein verwertbares Ergebnis.\");\n    }\n\n    const categoryId = parsed.value.categorySlug === null ? null : (slugToId.get(parsed.value.categorySlug) ?? null);\n\n    return withTransaction(this.db, async (client) => {\n      const analysis = await client.query<AnalysisRow>(\n        `INSERT INTO ai_analyses (request_id, category_id, summary, urgency, confidence, provider)\n         VALUES ($1, $2, $3, $4, $5, $6)\n         RETURNING *`,\n        [requestId, categoryId, parsed.value.summary, parsed.value.urgency, parsed.value.confidence, this.provider.name],\n      );\n      const analysisRow = analysis.rows[0] as AnalysisRow;\n\n      const questions: QuestionRow[] = [];\n      for (const [index, question] of parsed.value.questions.entries()) {\n        const inserted = await client.query<QuestionRow>(\n          `INSERT INTO ai_questions (analysis_id, position, question) VALUES ($1, $2, $3) RETURNING *`,\n          [analysisRow.id, index, question],\n        );\n        questions.push(inserted.rows[0] as QuestionRow);\n      }\n\n      // Die Kategorie wird nur ergänzt, nie überschrieben: hat der Kunde\n      // selbst eine gewählt, wiegt das schwerer als ein Vorschlag der KI.\n      if (categoryId !== null && row.category_id === null) {\n        await client.query(\"UPDATE requests SET category_id = $2 WHERE id = $1\", [requestId, categoryId]);\n      }\n      await client.query(\"UPDATE requests SET status = 'ANALYZING' WHERE id = $1 AND status = 'DRAFT'\", [requestId]);\n\n      await recordEvent(client, {\n        name: \"ai_analysis_completed\",\n        userId: customerId,\n        requestId,\n        properties: {\n          provider: this.provider.name,\n          confidence: parsed.value.confidence,\n          questionCount: questions.length,\n          categoryRecognised: categoryId !== null,\n        },\n      });\n\n      return { ...mapAnalysis(analysisRow), questions: questions.map(mapQuestion) };\n    });\n  }\n\n  /** Die jüngste Analyse einer Anfrage. */\n  async latest(requestId: string, userId: string): Promise<AiAnalysisDetail | null> {\n    const analysis = await this.db.query<AnalysisRow>(\n      `SELECT a.*\n       FROM ai_analyses a\n       JOIN requests r ON r.id = a.request_id\n       WHERE a.request_id = $1\n         AND (\n           r.customer_id = $2\n           OR EXISTS (\n             SELECT 1 FROM matches m\n             JOIN business_members bm ON bm.business_id = m.business_id\n             WHERE m.request_id = r.id AND bm.user_id = $2\n           )\n         )\n       ORDER BY a.created_at DESC\n       LIMIT 1`,\n      [requestId, userId],\n    );\n    const row = analysis.rows[0];\n    if (row === undefined) return null;\n\n    const questions = await this.db.query<QuestionRow>(\n      \"SELECT * FROM ai_questions WHERE analysis_id = $1 ORDER BY position\",\n      [row.id],\n    );\n    return { ...mapAnalysis(row), questions: questions.rows.map(mapQuestion) };\n  }\n\n  /** Beantwortet eine Rückfrage. Nur der Kunde der Anfrage darf das. */\n  async answerQuestion(questionId: string, customerId: string, answer: string): Promise<AiQuestion> {\n    const result = await this.db.query<QuestionRow>(\n      `UPDATE ai_questions q\n       SET answer = $3, answered_at = now()\n       FROM ai_analyses a\n       JOIN requests r ON r.id = a.request_id\n       WHERE q.id = $1 AND q.analysis_id = a.id AND r.customer_id = $2\n       RETURNING q.*`,\n      [questionId, customerId, answer],\n    );\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Diese Rückfrage gibt es nicht.\");\n    return mapQuestion(row);\n  }\n\n  /**\n   * Erzeugt einen Textvorschlag.\n   *\n   * Wichtig: der Vorschlag wird zurückgegeben, nicht abgeschickt. Über Inhalt\n   * und Versand entscheidet immer ein Mensch.\n   */\n  async suggestOfferText(context: string): Promise<string> {\n    try {\n      return await this.provider.suggestText({ kind: \"OFFER_DESCRIPTION\", context });\n    } catch (error) {\n      if (error instanceof AiUnavailableError) {\n        throw new ApiError(503, \"AI_UNAVAILABLE\", \"Der Textvorschlag ist gerade nicht möglich.\");\n      }\n      throw error;\n    }\n  }\n\n  async suggestChatReply(context: string, hint?: string): Promise<string> {\n    try {\n      return await this.provider.suggestText({ kind: \"CHAT_REPLY\", context, ...(hint ? { hint } : {}) });\n    } catch (error) {\n      if (error instanceof AiUnavailableError) {\n        throw new ApiError(503, \"AI_UNAVAILABLE\", \"Der Textvorschlag ist gerade nicht möglich.\");\n      }\n      throw error;\n    }\n  }\n}\n"}, {"pfad": "services/api/src/modules/analytics/audit.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 61, "bytes": 1769, "inhalt": "import type { AnalyticsEvent } from \"@jobflow/types\";\nimport type { Queryable } from \"../../db/pool.js\";\n\nexport interface AuditEntry {\n  actorId: string | null;\n  action: string;\n  entityType?: string | null;\n  entityId?: string | null;\n  ipPrefix?: string | null;\n  detail?: Record<string, unknown>;\n}\n\n/**\n * Protokolliert eine sicherheitsrelevante Aktion.\n *\n * Bewusst mit demselben Client wie die eigentliche Änderung: entweder beides\n * oder nichts. Ein Protokoll, das den Vorgang nicht mitbekommt, ist wertlos.\n */\nexport async function recordAudit(client: Queryable, entry: AuditEntry): Promise<void> {\n  await client.query(\n    `INSERT INTO audit_log (actor_id, action, entity_type, entity_id, ip_prefix, detail)\n     VALUES ($1, $2, $3, $4, $5, $6)`,\n    [\n      entry.actorId,\n      entry.action,\n      entry.entityType ?? null,\n      entry.entityId ?? null,\n      entry.ipPrefix ?? null,\n      JSON.stringify(entry.detail ?? {}),\n    ],\n  );\n}\n\nexport interface EventEntry {\n  name: AnalyticsEvent;\n  userId?: string | null;\n  requestId?: string | null;\n  businessId?: string | null;\n  properties?: Record<string, unknown>;\n}\n\n/**\n * Schreibt ein Produktereignis für den Funnel.\n *\n * Wir messen den Weg von der Anfrage zum Auftrag - nicht Downloads. Deshalb\n * enthalten die Eigenschaften nur Kennzahlen und IDs, keine Freitexte der Nutzer.\n */\nexport async function recordEvent(client: Queryable, entry: EventEntry): Promise<void> {\n  await client.query(\n    `INSERT INTO analytics_events (name, user_id, request_id, business_id, properties)\n     VALUES ($1, $2, $3, $4, $5)`,\n    [\n      entry.name,\n      entry.userId ?? null,\n      entry.requestId ?? null,\n      entry.businessId ?? null,\n      JSON.stringify(entry.properties ?? {}),\n    ],\n  );\n}\n"}, {"pfad": "services/api/src/modules/appointments/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 210, "bytes": 7795, "inhalt": "import type { Appointment, AppointmentStatus, AvailableSlot } from \"@jobflow/types\";\nimport type { Parsed } from \"@jobflow/validation\";\nimport type { createAppointmentSchema } from \"@jobflow/validation\";\nimport type { Db } from \"../../db/pool.js\";\nimport { withTransaction } from \"../../db/pool.js\";\nimport { ApiError } from \"../../http/errors.js\";\nimport { recordEvent } from \"../analytics/audit.js\";\n\nexport type CreateAppointmentData = Parsed<typeof createAppointmentSchema>;\n\ninterface AppointmentRow {\n  id: string;\n  offer_id: string;\n  start_time: Date;\n  end_time: Date;\n  status: AppointmentStatus;\n  created_at: Date;\n  updated_at: Date;\n}\n\nfunction mapAppointment(row: AppointmentRow): Appointment {\n  return {\n    id: row.id,\n    offerId: row.offer_id,\n    startTime: row.start_time.toISOString(),\n    endTime: row.end_time.toISOString(),\n    status: row.status,\n    createdAt: row.created_at.toISOString(),\n    updatedAt: row.updated_at.toISOString(),\n  };\n}\n\n/** Wie weit im Voraus freie Zeitfenster berechnet werden. */\nconst SLOT_HORIZON_DAYS = 21;\n/** Länge eines vorgeschlagenen Zeitfensters in Minuten. */\nconst SLOT_MINUTES = 60;\n\nexport class AppointmentService {\n  constructor(private readonly db: Db) {}\n\n  /**\n   * Berechnet freie Zeitfenster aus dem Wochenplan eines Unternehmens.\n   *\n   * Der Kunde bekommt ausschließlich Zeiten zu sehen, die das Unternehmen\n   * freigegeben hat, und keine, die bereits belegt sind.\n   */\n  async availableSlots(businessId: string, from: Date = new Date()): Promise<AvailableSlot[]> {\n    const availability = await this.db.query<{ weekday: number; start_time: string; end_time: string }>(\n      \"SELECT weekday, start_time, end_time FROM business_availability WHERE business_id = $1 ORDER BY weekday, start_time\",\n      [businessId],\n    );\n    if (availability.rows.length === 0) return [];\n\n    const until = new Date(from.getTime() + SLOT_HORIZON_DAYS * 24 * 60 * 60 * 1000);\n    const booked = await this.db.query<{ start_time: Date; end_time: Date }>(\n      `SELECT a.start_time, a.end_time\n       FROM appointments a\n       JOIN offers o ON o.id = a.offer_id\n       WHERE o.business_id = $1\n         AND a.status IN ('PROPOSED', 'CONFIRMED')\n         AND a.end_time > $2 AND a.start_time < $3`,\n      [businessId, from.toISOString(), until.toISOString()],\n    );\n\n    const slots: AvailableSlot[] = [];\n    const cursor = new Date(from);\n    cursor.setUTCHours(0, 0, 0, 0);\n\n    for (let day = 0; day <= SLOT_HORIZON_DAYS; day += 1) {\n      const date = new Date(cursor.getTime() + day * 24 * 60 * 60 * 1000);\n      const weekday = date.getUTCDay();\n\n      for (const window of availability.rows) {\n        if (window.weekday !== weekday) continue;\n        const windowStart = atTime(date, window.start_time);\n        const windowEnd = atTime(date, window.end_time);\n\n        for (\n          let start = windowStart.getTime();\n          start + SLOT_MINUTES * 60_000 <= windowEnd.getTime();\n          start += SLOT_MINUTES * 60_000\n        ) {\n          const end = start + SLOT_MINUTES * 60_000;\n          // Vergangene Zeitfenster gar nicht erst anbieten.\n          if (start <= from.getTime()) continue;\n          const overlaps = booked.rows.some(\n            (appointment) => appointment.start_time.getTime() < end && appointment.end_time.getTime() > start,\n          );\n          if (!overlaps) {\n            slots.push({ startTime: new Date(start).toISOString(), endTime: new Date(end).toISOString() });\n          }\n        }\n      }\n    }\n\n    return slots;\n  }\n\n  /**\n   * Legt einen Termin zu einem angenommenen Angebot an.\n   *\n   * Ohne angenommenes Angebot gibt es keinen Termin - sonst könnte jemand\n   * den Kalender eines Unternehmens füllen, ohne je einen Auftrag zu erteilen.\n   */\n  async create(userId: string, data: CreateAppointmentData): Promise<Appointment> {\n    const start = new Date(data.startTime);\n    if (start.getTime() <= Date.now()) {\n      throw ApiError.validation({ startTime: \"Der Termin muss in der Zukunft liegen.\" });\n    }\n\n    return withTransaction(this.db, async (client) => {\n      const offer = await client.query<{ id: string; status: string; business_id: string; request_id: string }>(\n        `SELECT o.id, o.status, o.business_id, o.request_id\n         FROM offers o\n         JOIN requests r ON r.id = o.request_id\n         WHERE o.id = $1\n           AND (\n             r.customer_id = $2\n             OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = o.business_id AND bm.user_id = $2)\n           )`,\n        [data.offerId, userId],\n      );\n      const offerRow = offer.rows[0];\n      if (offerRow === undefined) throw ApiError.notFound(\"Dieses Angebot gibt es nicht.\");\n      if (offerRow.status !== \"ACCEPTED\") {\n        throw ApiError.conflict(\"Ein Termin ist erst nach Annahme des Angebots möglich.\");\n      }\n\n      // Doppelbelegung verhindern. Der Teilindex in der Datenbank sichert nur\n      // \"ein aktiver Termin je Angebot\" ab - Überschneidungen zwischen\n      // verschiedenen Aufträgen desselben Betriebs müssen hier auffallen.\n      const conflict = await client.query(\n        `SELECT 1\n         FROM appointments a\n         JOIN offers o ON o.id = a.offer_id\n         WHERE o.business_id = $1\n           AND a.status IN ('PROPOSED', 'CONFIRMED')\n           AND a.start_time < $3 AND a.end_time > $2`,\n        [offerRow.business_id, data.startTime, data.endTime],\n      );\n      if ((conflict.rowCount ?? 0) > 0) {\n        throw ApiError.conflict(\"Zu dieser Zeit ist das Unternehmen bereits belegt.\");\n      }\n\n      const inserted = await client.query<AppointmentRow>(\n        `INSERT INTO appointments (offer_id, start_time, end_time, status)\n         VALUES ($1, $2, $3, 'CONFIRMED')\n         RETURNING *`,\n        [data.offerId, data.startTime, data.endTime],\n      );\n\n      await recordEvent(client, {\n        name: \"appointment_booked\",\n        userId,\n        requestId: offerRow.request_id,\n        businessId: offerRow.business_id,\n      });\n\n      return mapAppointment(inserted.rows[0] as AppointmentRow);\n    });\n  }\n\n  async get(appointmentId: string, userId: string): Promise<Appointment> {\n    const result = await this.db.query<AppointmentRow>(\n      `SELECT a.*\n       FROM appointments a\n       JOIN offers o ON o.id = a.offer_id\n       JOIN requests r ON r.id = o.request_id\n       WHERE a.id = $1\n         AND (\n           r.customer_id = $2\n           OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = o.business_id AND bm.user_id = $2)\n         )`,\n      [appointmentId, userId],\n    );\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Diesen Termin gibt es nicht.\");\n    return mapAppointment(row);\n  }\n\n  async cancel(appointmentId: string, userId: string): Promise<Appointment> {\n    const result = await this.db.query<AppointmentRow>(\n      `UPDATE appointments a\n       SET status = 'CANCELLED'\n       FROM offers o, requests r\n       WHERE a.id = $1\n         AND o.id = a.offer_id\n         AND r.id = o.request_id\n         AND a.status IN ('PROPOSED', 'CONFIRMED')\n         AND (\n           r.customer_id = $2\n           OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = o.business_id AND bm.user_id = $2)\n         )\n       RETURNING a.*`,\n      [appointmentId, userId],\n    );\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Diesen Termin gibt es nicht oder er ist bereits beendet.\");\n    return mapAppointment(row);\n  }\n}\n\n/** Kombiniert ein Datum mit einer Uhrzeit \"HH:MM[:SS]\". */\nfunction atTime(date: Date, time: string): Date {\n  const [hours, minutes] = time.split(\":\").map(Number);\n  const result = new Date(date);\n  result.setUTCHours(hours ?? 0, minutes ?? 0, 0, 0);\n  return result;\n}\n"}, {"pfad": "services/api/src/modules/auth/password.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 81, "bytes": 2461, "inhalt": "import { randomBytes, scrypt as scryptCallback, timingSafeEqual, type ScryptOptions } from \"node:crypto\";\nimport { promisify } from \"node:util\";\n\n// promisify wählt sonst die Überladung ohne Optionen; die Kostenparameter\n// müssen aber übergeben werden.\nconst scrypt = promisify(scryptCallback) as (\n  password: string,\n  salt: Buffer,\n  keylen: number,\n  options: ScryptOptions,\n) => Promise<Buffer>;\n\n/**\n * Passwörter werden mit scrypt gehasht.\n *\n * scrypt ist in Node eingebaut und speicherhart - Angreifer können es nicht\n * beliebig auf Grafikkarten parallelisieren. Die Parameter stehen im Hash\n * selbst, damit sie sich später erhöhen lassen, ohne alte Hashes zu entwerten.\n */\nconst KEY_LENGTH = 64;\nconst SALT_LENGTH = 16;\n\n/** Kostenparameter. N muss eine Zweierpotenz sein. */\nconst PARAMS = { N: 16_384, r: 8, p: 1 } as const;\n\nexport async function hashPassword(password: string): Promise<string> {\n  const salt = randomBytes(SALT_LENGTH);\n  const derived = await scrypt(password.normalize(\"NFKC\"), salt, KEY_LENGTH, {\n    N: PARAMS.N,\n    r: PARAMS.r,\n    p: PARAMS.p,\n    // scrypt braucht ungefähr 128 * N * r Bytes; ohne angehobenes Limit\n    // lehnt Node die Berechnung ab.\n    maxmem: 256 * PARAMS.N * PARAMS.r,\n  });\n\n  return [\n    \"scrypt\",\n    PARAMS.N,\n    PARAMS.r,\n    PARAMS.p,\n    salt.toString(\"base64\"),\n    derived.toString(\"base64\"),\n  ].join(\"$\");\n}\n\n/**\n * Prüft ein Passwort gegen einen gespeicherten Hash.\n *\n * Der Vergleich laeuft über timingSafeEqual: ein Vergleich mit === würde\n * über die Laufzeit verraten, wie viele Bytes bereits stimmen.\n */\nexport async function verifyPassword(password: string, stored: string): Promise<boolean> {\n  const parts = stored.split(\"$\");\n  if (parts.length !== 6 || parts[0] !== \"scrypt\") return false;\n\n  const N = Number(parts[1]);\n  const r = Number(parts[2]);\n  const p = Number(parts[3]);\n  if (!Number.isInteger(N) || !Number.isInteger(r) || !Number.isInteger(p)) return false;\n\n  let salt: Buffer;\n  let expected: Buffer;\n  try {\n    salt = Buffer.from(parts[4] as string, \"base64\");\n    expected = Buffer.from(parts[5] as string, \"base64\");\n  } catch {\n    return false;\n  }\n  if (salt.length === 0 || expected.length === 0) return false;\n\n  const derived = await scrypt(password.normalize(\"NFKC\"), salt, expected.length, {\n    N,\n    r,\n    p,\n    maxmem: 256 * N * r,\n  });\n\n  return derived.length === expected.length && timingSafeEqual(derived, expected);\n}\n"}, {"pfad": "services/api/src/modules/auth/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 183, "bytes": 6653, "inhalt": "import type { IncomingMessage } from \"node:http\";\nimport type { AuthResult, User, UserRole } from \"@jobflow/types\";\nimport type { Queryable, Db } from \"../../db/pool.js\";\nimport { withTransaction } from \"../../db/pool.js\";\nimport { ApiError } from \"../../http/errors.js\";\nimport type { Principal } from \"../../http/context.js\";\nimport { hashPassword, verifyPassword } from \"./password.js\";\nimport { bearerToken, createToken, hashToken } from \"./tokens.js\";\nimport { mapUser, type UserRow } from \"../users/mapper.js\";\nimport { recordAudit } from \"../analytics/audit.js\";\n\nexport interface AuthServiceOptions {\n  db: Db;\n  sessionSecret: string;\n  sessionTtlSeconds: number;\n}\n\nexport interface RegisterInput {\n  email: string;\n  name: string;\n  password: string;\n  role: \"CUSTOMER\" | \"BUSINESS\";\n  phone?: string | null;\n}\n\nexport class AuthService {\n  private readonly db: Db;\n  private readonly sessionSecret: string;\n  private readonly sessionTtlSeconds: number;\n\n  constructor(options: AuthServiceOptions) {\n    this.db = options.db;\n    this.sessionSecret = options.sessionSecret;\n    this.sessionTtlSeconds = options.sessionTtlSeconds;\n  }\n\n  async register(input: RegisterInput, ipPrefix: string): Promise<AuthResult> {\n    const passwordHash = await hashPassword(input.password);\n\n    return withTransaction(this.db, async (client) => {\n      const inserted = await client.query<UserRow>(\n        `INSERT INTO users (email, name, password_hash, role, phone)\n         VALUES ($1, $2, $3, $4, $5)\n         ON CONFLICT (email) DO NOTHING\n         RETURNING *`,\n        [input.email, input.name, passwordHash, input.role, input.phone ?? null],\n      );\n\n      const row = inserted.rows[0];\n      if (row === undefined) {\n        // Die Adresse ist bereits vergeben. Das lässt sich bei einer\n        // Registrierung nicht verbergen - der Nutzer muss ja erfahren, dass er\n        // sich stattdessen anmelden soll.\n        throw ApiError.conflict(\"Zu dieser E-Mail-Adresse gibt es bereits ein Konto.\");\n      }\n\n      // Ein Unternehmenskonto bekommt sofort ein - noch leeres - Profil.\n      // Sonst müsste jede spätere Abfrage den Sonderfall \"Konto ohne\n      // Unternehmen\" behandeln.\n      if (row.role === \"BUSINESS\") {\n        const business = await client.query<{ id: string }>(\n          `INSERT INTO businesses (owner_id, name) VALUES ($1, $2) RETURNING id`,\n          [row.id, input.name],\n        );\n        await client.query(\n          `INSERT INTO business_members (business_id, user_id, role) VALUES ($1, $2, 'OWNER')`,\n          [business.rows[0]?.id, row.id],\n        );\n      }\n\n      const session = await this.issueSession(client, row.id);\n      await recordAudit(client, {\n        actorId: row.id,\n        action: \"user.registered\",\n        entityType: \"user\",\n        entityId: row.id,\n        ipPrefix,\n        detail: { role: row.role },\n      });\n\n      return { user: mapUser(row), token: session.token, expiresAt: session.expiresAt };\n    });\n  }\n\n  async login(email: string, password: string, ipPrefix: string): Promise<AuthResult> {\n    const found = await this.db.query<UserRow>(\"SELECT * FROM users WHERE email = $1\", [email]);\n    const row = found.rows[0];\n\n    // Auch wenn es das Konto nicht gibt, wird ein Hash geprüft. Sonst wäre an\n    // der Antwortzeit ablesbar, welche Adressen registriert sind.\n    const storedHash = row?.password_hash ?? DUMMY_PASSWORD_HASH;\n    const passwordOk = await verifyPassword(password, storedHash);\n\n    if (row === undefined || !passwordOk) {\n      throw new ApiError(401, \"UNAUTHENTICATED\", \"E-Mail-Adresse oder Passwort ist falsch.\");\n    }\n    if (row.blocked_at !== null) {\n      throw ApiError.forbidden(\"Dieses Konto ist gesperrt. Bitte wende dich an den Support.\");\n    }\n\n    return withTransaction(this.db, async (client) => {\n      const session = await this.issueSession(client, row.id);\n      await recordAudit(client, {\n        actorId: row.id,\n        action: \"user.logged_in\",\n        entityType: \"user\",\n        entityId: row.id,\n        ipPrefix,\n      });\n      return { user: mapUser(row), token: session.token, expiresAt: session.expiresAt };\n    });\n  }\n\n  async logout(sessionId: string): Promise<void> {\n    await this.db.query(\"DELETE FROM sessions WHERE id = $1\", [sessionId]);\n  }\n\n  /** Meldet den Nutzer auf allen Geräten ab. */\n  async logoutEverywhere(userId: string): Promise<void> {\n    await this.db.query(\"DELETE FROM sessions WHERE user_id = $1\", [userId]);\n  }\n\n  /**\n   * Löst das Bearer-Token in einen Nutzer auf.\n   *\n   * Liefert null statt zu werfen: manche Endpunkte dürfen mit und ohne\n   * Anmeldung aufgerufen werden.\n   */\n  async authenticate(req: IncomingMessage): Promise<Principal | null> {\n    const token = bearerToken(req.headers.authorization);\n    if (token === null) return null;\n\n    const tokenHash = hashToken(token, this.sessionSecret);\n    const result = await this.db.query<UserRow & { session_id: string }>(\n      `SELECT u.*, s.id AS session_id\n       FROM sessions s\n       JOIN users u ON u.id = s.user_id\n       WHERE s.token_hash = $1 AND s.expires_at > now()`,\n      [tokenHash],\n    );\n\n    const row = result.rows[0];\n    if (row === undefined) return null;\n    // Eine Sperrung wirkt sofort, auch auf bereits ausgestellte Tokens.\n    if (row.blocked_at !== null) return null;\n\n    // Nur grob fortschreiben - ein Schreibzugriff pro Anfrage wäre Verschwendung.\n    void this.db\n      .query(\"UPDATE sessions SET last_seen_at = now() WHERE id = $1 AND last_seen_at < now() - interval '5 minutes'\", [\n        row.session_id,\n      ])\n      .catch(() => {});\n\n    return { user: mapUser(row), sessionId: row.session_id };\n  }\n\n  private async issueSession(\n    client: Queryable,\n    userId: string,\n  ): Promise<{ token: string; expiresAt: string }> {\n    const token = createToken();\n    const tokenHash = hashToken(token, this.sessionSecret);\n    const result = await client.query<{ expires_at: Date }>(\n      `INSERT INTO sessions (user_id, token_hash, expires_at)\n       VALUES ($1, $2, now() + make_interval(secs => $3))\n       RETURNING expires_at`,\n      [userId, tokenHash, this.sessionTtlSeconds],\n    );\n    return { token, expiresAt: (result.rows[0] as { expires_at: Date }).expires_at.toISOString() };\n  }\n}\n\n/**\n * Ein gültig aufgebauter, aber unerreichbarer Hash. Er dient nur dazu, dass\n * die Anmeldung bei unbekannten Adressen dieselbe Arbeit leistet wie bei\n * bekannten.\n */\nconst DUMMY_PASSWORD_HASH =\n  \"scrypt$16384$8$1$AAAAAAAAAAAAAAAAAAAAAA==$\" +\n  \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==\";\n\nexport type { UserRole, User };\n"}, {"pfad": "services/api/src/modules/auth/tokens.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 37, "bytes": 1371, "inhalt": "import { createHmac, randomBytes, timingSafeEqual } from \"node:crypto\";\n\n/**\n * Session-Token.\n *\n * Der Client bekommt einen zufälligen Wert, die Datenbank speichert nur\n * dessen HMAC. Wer die Datenbank liest, kann sich damit nicht anmelden, und\n * wer den HMAC-Schluessel kennt, kennt trotzdem keine Tokens.\n *\n * Bewusst kein JWT: eine Abmeldung oder Sperrung soll sofort wirken. Ein\n * signiertes Token ohne Serverzustand gilt dagegen bis zum Ablauf weiter.\n */\nconst TOKEN_BYTES = 32;\n\nexport function createToken(): string {\n  return randomBytes(TOKEN_BYTES).toString(\"base64url\");\n}\n\nexport function hashToken(token: string, secret: string): string {\n  return createHmac(\"sha256\", secret).update(token).digest(\"hex\");\n}\n\n/** Zeitkonstanter Vergleich zweier Hex-Hashes. */\nexport function tokensMatch(a: string, b: string): boolean {\n  const bufferA = Buffer.from(a, \"hex\");\n  const bufferB = Buffer.from(b, \"hex\");\n  return bufferA.length === bufferB.length && timingSafeEqual(bufferA, bufferB);\n}\n\n/** Liest das Bearer-Token aus dem Authorization-Header. */\nexport function bearerToken(header: string | string[] | undefined): string | null {\n  const value = Array.isArray(header) ? header[0] : header;\n  if (typeof value !== \"string\") return null;\n  const match = /^Bearer\\s+(\\S+)$/i.exec(value.trim());\n  return match === null ? null : (match[1] as string);\n}\n"}, {"pfad": "services/api/src/modules/businesses/mapper.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 40, "bytes": 1086, "inhalt": "import type { Business } from \"@jobflow/types\";\n\nexport interface BusinessRow {\n  id: string;\n  owner_id: string;\n  name: string;\n  description: string | null;\n  verified: boolean;\n  verified_at: Date | null;\n  rating: number | null;\n  review_count: number;\n  latitude: number | null;\n  longitude: number | null;\n  service_radius_km: number;\n  avg_response_minutes: number | null;\n  completed_job_count: number;\n  created_at: Date;\n  updated_at: Date;\n}\n\nexport function mapBusiness(row: BusinessRow): Business {\n  return {\n    id: row.id,\n    ownerId: row.owner_id,\n    name: row.name,\n    description: row.description,\n    verified: row.verified,\n    verifiedAt: row.verified_at === null ? null : row.verified_at.toISOString(),\n    rating: row.rating,\n    reviewCount: row.review_count,\n    latitude: row.latitude,\n    longitude: row.longitude,\n    serviceRadiusKm: row.service_radius_km,\n    avgResponseMinutes: row.avg_response_minutes,\n    completedJobCount: row.completed_job_count,\n    createdAt: row.created_at.toISOString(),\n    updatedAt: row.updated_at.toISOString(),\n  };\n}\n"}, {"pfad": "services/api/src/modules/businesses/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 241, "bytes": 8727, "inhalt": "import type { AvailabilitySlot, Business, BusinessService as BusinessServiceEntity } from \"@jobflow/types\";\nimport type { Parsed } from \"@jobflow/validation\";\nimport type { availabilityScheduleSchema, businessProfileSchema, businessServiceSchema } from \"@jobflow/validation\";\nimport type { Db } from \"../../db/pool.js\";\nimport { withTransaction } from \"../../db/pool.js\";\nimport { ApiError } from \"../../http/errors.js\";\nimport { mapBusiness, type BusinessRow } from \"./mapper.js\";\n\nexport type BusinessProfileData = Parsed<typeof businessProfileSchema>;\nexport type BusinessServiceData = Parsed<typeof businessServiceSchema>;\nexport type AvailabilityData = Parsed<typeof availabilityScheduleSchema>;\n\ninterface ServiceRow {\n  id: string;\n  business_id: string;\n  category_id: string;\n  name: string;\n  description: string | null;\n  price_min_cents: number | null;\n  price_max_cents: number | null;\n  active: boolean;\n  created_at: Date;\n}\n\ninterface AvailabilityRow {\n  id: string;\n  business_id: string;\n  weekday: number;\n  start_time: string;\n  end_time: string;\n}\n\nfunction mapService(row: ServiceRow): BusinessServiceEntity {\n  return {\n    id: row.id,\n    businessId: row.business_id,\n    categoryId: row.category_id,\n    name: row.name,\n    description: row.description,\n    priceMinCents: row.price_min_cents,\n    priceMaxCents: row.price_max_cents,\n    active: row.active,\n    createdAt: row.created_at.toISOString(),\n  };\n}\n\nfunction mapAvailability(row: AvailabilityRow): AvailabilitySlot {\n  return {\n    id: row.id,\n    businessId: row.business_id,\n    weekday: row.weekday,\n    // PostgreSQL liefert time als \"HH:MM:SS\" - die API arbeitet mit \"HH:MM\".\n    startTime: row.start_time.slice(0, 5),\n    endTime: row.end_time.slice(0, 5),\n  };\n}\n\nexport class BusinessService {\n  constructor(private readonly db: Db) {}\n\n  /**\n   * Das Unternehmen des angemeldeten Nutzers.\n   *\n   * Diese Methode ist der Angelpunkt der Zugriffskontrolle auf der\n   * Unternehmensseite: jede Aktion eines Betriebs geht über die hier\n   * ermittelte businessId. Ein Unternehmen kann damit gar nicht erst die Daten\n   * eines anderen anfragen.\n   */\n  async requireMembership(userId: string): Promise<{ businessId: string; role: \"OWNER\" | \"MEMBER\" }> {\n    const result = await this.db.query<{ business_id: string; role: \"OWNER\" | \"MEMBER\" }>(\n      \"SELECT business_id, role FROM business_members WHERE user_id = $1 LIMIT 1\",\n      [userId],\n    );\n    const row = result.rows[0];\n    if (row === undefined) {\n      throw ApiError.forbidden(\"Zu diesem Konto gehört kein Unternehmen.\");\n    }\n    return { businessId: row.business_id, role: row.role };\n  }\n\n  /** Aktionen, die dem Inhaber vorbehalten sind (Profil, Leistungen, Mitarbeiter). */\n  async requireOwner(userId: string): Promise<string> {\n    const membership = await this.requireMembership(userId);\n    if (membership.role !== \"OWNER\") {\n      throw ApiError.forbidden(\"Das darf nur der Inhaber des Unternehmens.\");\n    }\n    return membership.businessId;\n  }\n\n  async get(businessId: string): Promise<Business> {\n    const result = await this.db.query<BusinessRow>(\"SELECT * FROM businesses WHERE id = $1\", [businessId]);\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Dieses Unternehmen gibt es nicht.\");\n    return mapBusiness(row);\n  }\n\n  async updateProfile(businessId: string, data: BusinessProfileData): Promise<Business> {\n    const result = await this.db.query<BusinessRow>(\n      `UPDATE businesses\n       SET name = $2, description = $3, latitude = $4, longitude = $5, service_radius_km = $6\n       WHERE id = $1\n       RETURNING *`,\n      [\n        businessId,\n        data.name,\n        data.description ?? null,\n        data.latitude ?? null,\n        data.longitude ?? null,\n        data.serviceRadiusKm,\n      ],\n    );\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Dieses Unternehmen gibt es nicht.\");\n    return mapBusiness(row);\n  }\n\n  async listServices(businessId: string): Promise<BusinessServiceEntity[]> {\n    const result = await this.db.query<ServiceRow>(\n      \"SELECT * FROM business_services WHERE business_id = $1 AND active ORDER BY name\",\n      [businessId],\n    );\n    return result.rows.map(mapService);\n  }\n\n  async addService(businessId: string, data: BusinessServiceData): Promise<BusinessServiceEntity> {\n    const known = await this.db.query(\"SELECT 1 FROM categories WHERE id = $1 AND active\", [data.categoryId]);\n    if (known.rowCount !== 1) {\n      throw ApiError.validation({ categoryId: \"Diese Kategorie gibt es nicht.\" });\n    }\n\n    const result = await this.db.query<ServiceRow>(\n      `INSERT INTO business_services (business_id, category_id, name, description, price_min_cents, price_max_cents)\n       VALUES ($1, $2, $3, $4, $5, $6)\n       ON CONFLICT (business_id, category_id) DO UPDATE\n         SET name = EXCLUDED.name,\n             description = EXCLUDED.description,\n             price_min_cents = EXCLUDED.price_min_cents,\n             price_max_cents = EXCLUDED.price_max_cents,\n             active = true\n       RETURNING *`,\n      [\n        businessId,\n        data.categoryId,\n        data.name,\n        data.description ?? null,\n        data.priceMinCents ?? null,\n        data.priceMaxCents ?? null,\n      ],\n    );\n    return mapService(result.rows[0] as ServiceRow);\n  }\n\n  async removeService(businessId: string, serviceId: string): Promise<void> {\n    // Nicht löschen, sondern deaktivieren: bestehende Anfragen und Angebote\n    // verweisen darauf, und ihre Geschichte soll nachvollziehbar bleiben.\n    const result = await this.db.query(\n      \"UPDATE business_services SET active = false WHERE id = $1 AND business_id = $2\",\n      [serviceId, businessId],\n    );\n    if (result.rowCount === 0) throw ApiError.notFound(\"Diese Leistung gibt es nicht.\");\n  }\n\n  async getAvailability(businessId: string): Promise<AvailabilitySlot[]> {\n    const result = await this.db.query<AvailabilityRow>(\n      \"SELECT * FROM business_availability WHERE business_id = $1 ORDER BY weekday, start_time\",\n      [businessId],\n    );\n    return result.rows.map(mapAvailability);\n  }\n\n  /** Ersetzt den kompletten Wochenplan. */\n  async setAvailability(businessId: string, data: AvailabilityData): Promise<AvailabilitySlot[]> {\n    return withTransaction(this.db, async (client) => {\n      await client.query(\"DELETE FROM business_availability WHERE business_id = $1\", [businessId]);\n      const rows: AvailabilityRow[] = [];\n      for (const slot of data.slots) {\n        const inserted = await client.query<AvailabilityRow>(\n          `INSERT INTO business_availability (business_id, weekday, start_time, end_time)\n           VALUES ($1, $2, $3, $4)\n           ON CONFLICT DO NOTHING\n           RETURNING *`,\n          [businessId, slot.weekday, slot.startTime, slot.endTime],\n        );\n        const row = inserted.rows[0];\n        if (row !== undefined) rows.push(row);\n      }\n      return rows.map(mapAvailability);\n    });\n  }\n\n  /** Kennzahlen für das Dashboard eines Unternehmens. */\n  async statistics(businessId: string): Promise<{\n    matchCount: number;\n    offerCount: number;\n    jobCount: number;\n    offerRate: number;\n    winRate: number;\n    avgResponseMinutes: number | null;\n    rating: number | null;\n    reviewCount: number;\n  }> {\n    const result = await this.db.query<{\n      match_count: string;\n      offer_count: string;\n      job_count: string;\n      avg_response_minutes: number | null;\n      rating: number | null;\n      review_count: number;\n    }>(\n      `SELECT\n         (SELECT count(*) FROM matches WHERE business_id = $1)::text AS match_count,\n         (SELECT count(*) FROM offers WHERE business_id = $1)::text AS offer_count,\n         (SELECT count(*) FROM jobs WHERE business_id = $1)::text AS job_count,\n         b.avg_response_minutes,\n         b.rating,\n         b.review_count\n       FROM businesses b WHERE b.id = $1`,\n      [businessId],\n    );\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Dieses Unternehmen gibt es nicht.\");\n\n    const matchCount = Number(row.match_count);\n    const offerCount = Number(row.offer_count);\n    const jobCount = Number(row.job_count);\n\n    return {\n      matchCount,\n      offerCount,\n      jobCount,\n      // Anteil der Anfragen, auf die tatsächlich ein Angebot folgte.\n      offerRate: matchCount === 0 ? 0 : Math.round((offerCount / matchCount) * 100),\n      // Anteil der Angebote, die zu einem Auftrag wurden.\n      winRate: offerCount === 0 ? 0 : Math.round((jobCount / offerCount) * 100),\n      avgResponseMinutes: row.avg_response_minutes,\n      rating: row.rating,\n      reviewCount: row.review_count,\n    };\n  }\n}\n"}, {"pfad": "services/api/src/modules/categories/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 82, "bytes": 2380, "inhalt": "import type { Category, CategoryNode } from \"@jobflow/types\";\nimport type { Db } from \"../../db/pool.js\";\n\nexport interface CategoryRow {\n  id: string;\n  slug: string;\n  name: string;\n  icon: string | null;\n  parent_id: string | null;\n  position: number;\n  active: boolean;\n  created_at: Date;\n}\n\nexport function mapCategory(row: CategoryRow): Category {\n  return {\n    id: row.id,\n    slug: row.slug,\n    name: row.name,\n    icon: row.icon,\n    parentId: row.parent_id,\n    position: row.position,\n    active: row.active,\n    createdAt: row.created_at.toISOString(),\n  };\n}\n\nexport class CategoryService {\n  constructor(private readonly db: Db) {}\n\n  async list(): Promise<Category[]> {\n    const result = await this.db.query<CategoryRow>(\n      \"SELECT * FROM categories WHERE active ORDER BY position, name\",\n    );\n    return result.rows.map(mapCategory);\n  }\n\n  /**\n   * Kategorien als Baum - das ist die Form, die die Startseite braucht.\n   *\n   * Der Baum wird im Speicher gebaut statt mit einer rekursiven Abfrage: es\n   * sind wenige Dutzend Zeilen, und die Kategorienliste eignet sich später\n   * gut zum Zwischenspeichern.\n   */\n  async tree(): Promise<CategoryNode[]> {\n    const categories = await this.list();\n    const nodes = new Map<string, CategoryNode>();\n    for (const category of categories) {\n      nodes.set(category.id, { ...category, children: [] });\n    }\n\n    const roots: CategoryNode[] = [];\n    for (const node of nodes.values()) {\n      if (node.parentId === null) {\n        roots.push(node);\n        continue;\n      }\n      const parent = nodes.get(node.parentId);\n      // Ist die Oberkategorie inaktiv, wäre die Unterkategorie nicht\n      // erreichbar. Sie wird dann wie eine eigene Wurzel behandelt, statt\n      // stillschweigend zu verschwinden.\n      if (parent === undefined) roots.push(node);\n      else parent.children.push(node);\n    }\n    return roots;\n  }\n\n  async findBySlug(slug: string): Promise<Category | null> {\n    const result = await this.db.query<CategoryRow>(\n      \"SELECT * FROM categories WHERE slug = $1 AND active\",\n      [slug],\n    );\n    const row = result.rows[0];\n    return row === undefined ? null : mapCategory(row);\n  }\n\n  async exists(id: string): Promise<boolean> {\n    const result = await this.db.query(\"SELECT 1 FROM categories WHERE id = $1 AND active\", [id]);\n    return result.rowCount === 1;\n  }\n}\n"}, {"pfad": "services/api/src/modules/conversations/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 117, "bytes": 3864, "inhalt": "import type { Conversation, Message } from \"@jobflow/types\";\nimport type { Db } from \"../../db/pool.js\";\nimport { withTransaction } from \"../../db/pool.js\";\nimport { ApiError } from \"../../http/errors.js\";\n\ninterface ConversationRow {\n  id: string;\n  request_id: string;\n  business_id: string;\n  customer_id: string;\n  last_message_at: Date | null;\n  created_at: Date;\n}\n\ninterface MessageRow {\n  id: string;\n  conversation_id: string;\n  sender_id: string;\n  body: string;\n  is_ai_generated: boolean;\n  created_at: Date;\n}\n\nfunction mapConversation(row: ConversationRow): Conversation {\n  return {\n    id: row.id,\n    requestId: row.request_id,\n    businessId: row.business_id,\n    customerId: row.customer_id,\n    lastMessageAt: row.last_message_at === null ? null : row.last_message_at.toISOString(),\n    createdAt: row.created_at.toISOString(),\n  };\n}\n\nfunction mapMessage(row: MessageRow): Message {\n  return {\n    id: row.id,\n    conversationId: row.conversation_id,\n    senderId: row.sender_id,\n    body: row.body,\n    isAiGenerated: row.is_ai_generated,\n    createdAt: row.created_at.toISOString(),\n  };\n}\n\nexport class ConversationService {\n  constructor(private readonly db: Db) {}\n\n  async listForUser(userId: string): Promise<Conversation[]> {\n    const result = await this.db.query<ConversationRow>(\n      `SELECT c.*\n       FROM conversations c\n       WHERE c.customer_id = $1\n          OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = c.business_id AND bm.user_id = $1)\n       ORDER BY c.last_message_at DESC NULLS LAST, c.created_at DESC`,\n      [userId],\n    );\n    return result.rows.map(mapConversation);\n  }\n\n  /**\n   * Prüft, ob der Nutzer an dieser Konversation beteiligt ist.\n   *\n   * Jede Nachrichtenoperation geht durch diese Prüfung. Ein Chat ist der Ort,\n   * an dem Kunden Adressen und Telefonnummern austauschen - hier wäre ein\n   * Fehler in der Berechtigung besonders unangenehm.\n   */\n  private async requireParticipant(conversationId: string, userId: string): Promise<ConversationRow> {\n    const result = await this.db.query<ConversationRow>(\n      `SELECT c.*\n       FROM conversations c\n       WHERE c.id = $1\n         AND (\n           c.customer_id = $2\n           OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = c.business_id AND bm.user_id = $2)\n         )`,\n      [conversationId, userId],\n    );\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Dieses Gespräch gibt es nicht.\");\n    return row;\n  }\n\n  async get(conversationId: string, userId: string): Promise<Conversation> {\n    return mapConversation(await this.requireParticipant(conversationId, userId));\n  }\n\n  async listMessages(conversationId: string, userId: string, limit: number, offset: number): Promise<Message[]> {\n    await this.requireParticipant(conversationId, userId);\n    const result = await this.db.query<MessageRow>(\n      \"SELECT * FROM messages WHERE conversation_id = $1 ORDER BY created_at DESC LIMIT $2 OFFSET $3\",\n      [conversationId, limit, offset],\n    );\n    // Älteste zuerst - so erwartet es die Anzeige.\n    return result.rows.reverse().map(mapMessage);\n  }\n\n  async sendMessage(\n    conversationId: string,\n    senderId: string,\n    body: string,\n    isAiGenerated: boolean,\n  ): Promise<Message> {\n    await this.requireParticipant(conversationId, senderId);\n    return withTransaction(this.db, async (client) => {\n      const inserted = await client.query<MessageRow>(\n        `INSERT INTO messages (conversation_id, sender_id, body, is_ai_generated)\n         VALUES ($1, $2, $3, $4)\n         RETURNING *`,\n        [conversationId, senderId, body, isAiGenerated],\n      );\n      await client.query(\"UPDATE conversations SET last_message_at = now() WHERE id = $1\", [conversationId]);\n      return mapMessage(inserted.rows[0] as MessageRow);\n    });\n  }\n}\n"}, {"pfad": "services/api/src/modules/jobs/mapper.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 30, "bytes": 780, "inhalt": "import type { Job, JobStatus } from \"@jobflow/types\";\n\nexport interface JobRow {\n  id: string;\n  offer_id: string;\n  request_id: string;\n  business_id: string;\n  customer_id: string;\n  status: JobStatus;\n  started_at: Date | null;\n  completed_at: Date | null;\n  created_at: Date;\n  updated_at: Date;\n}\n\nexport function mapJob(row: JobRow): Job {\n  return {\n    id: row.id,\n    offerId: row.offer_id,\n    requestId: row.request_id,\n    businessId: row.business_id,\n    customerId: row.customer_id,\n    status: row.status,\n    startedAt: row.started_at === null ? null : row.started_at.toISOString(),\n    completedAt: row.completed_at === null ? null : row.completed_at.toISOString(),\n    createdAt: row.created_at.toISOString(),\n    updatedAt: row.updated_at.toISOString(),\n  };\n}\n"}, {"pfad": "services/api/src/modules/jobs/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 127, "bytes": 4529, "inhalt": "import type { Job, JobStatus } from \"@jobflow/types\";\nimport type { Db } from \"../../db/pool.js\";\nimport { withTransaction } from \"../../db/pool.js\";\nimport { ApiError } from \"../../http/errors.js\";\nimport { recordEvent } from \"../analytics/audit.js\";\nimport { mapJob, type JobRow } from \"./mapper.js\";\n\n/**\n * Erlaubte Statuswechsel eines Auftrags.\n *\n * Ohne diese Tabelle ließe sich ein abgeschlossener Auftrag über die API\n * wieder auf \"geplant\" zurücksetzen - und damit eine zweite Bewertung\n * ermöglichen.\n */\nconst ALLOWED_TRANSITIONS: Record<JobStatus, JobStatus[]> = {\n  SCHEDULED: [\"IN_PROGRESS\", \"CANCELLED\"],\n  IN_PROGRESS: [\"COMPLETED\", \"CANCELLED\"],\n  COMPLETED: [],\n  CANCELLED: [],\n};\n\nexport class JobService {\n  constructor(private readonly db: Db) {}\n\n  async get(jobId: string, userId: string): Promise<Job> {\n    const result = await this.db.query<JobRow>(\n      `SELECT j.*\n       FROM jobs j\n       WHERE j.id = $1\n         AND (\n           j.customer_id = $2\n           OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = j.business_id AND bm.user_id = $2)\n         )`,\n      [jobId, userId],\n    );\n    const row = result.rows[0];\n    if (row === undefined) throw ApiError.notFound(\"Diesen Auftrag gibt es nicht.\");\n    return mapJob(row);\n  }\n\n  async listForUser(userId: string, limit: number, offset: number): Promise<Job[]> {\n    const result = await this.db.query<JobRow>(\n      `SELECT j.*\n       FROM jobs j\n       WHERE j.customer_id = $1\n          OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = j.business_id AND bm.user_id = $1)\n       ORDER BY j.created_at DESC\n       LIMIT $2 OFFSET $3`,\n      [userId, limit, offset],\n    );\n    return result.rows.map(mapJob);\n  }\n\n  /**\n   * Ändert den Status eines Auftrags.\n   *\n   * Den Fortschritt meldet das ausführende Unternehmen; abbrechen dürfen\n   * beide Seiten. Ein Kunde soll einen Auftrag nicht selbst als erledigt\n   * markieren können - das ist die Aussage des Betriebs.\n   */\n  async setStatus(jobId: string, userId: string, status: JobStatus): Promise<Job> {\n    return withTransaction(this.db, async (client) => {\n      const found = await client.query<JobRow & { is_business: boolean }>(\n        `SELECT j.*,\n                EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = j.business_id AND bm.user_id = $2) AS is_business\n         FROM jobs j\n         WHERE j.id = $1\n           AND (\n             j.customer_id = $2\n             OR EXISTS (SELECT 1 FROM business_members bm WHERE bm.business_id = j.business_id AND bm.user_id = $2)\n           )\n         FOR UPDATE OF j`,\n        [jobId, userId],\n      );\n      const row = found.rows[0];\n      if (row === undefined) throw ApiError.notFound(\"Diesen Auftrag gibt es nicht.\");\n\n      if (!ALLOWED_TRANSITIONS[row.status].includes(status)) {\n        throw ApiError.conflict(\n          `Der Wechsel von \"${row.status}\" nach \"${status}\" ist nicht vorgesehen.`,\n        );\n      }\n      if (status !== \"CANCELLED\" && !row.is_business) {\n        throw ApiError.forbidden(\"Den Fortschritt meldet das ausführende Unternehmen.\");\n      }\n\n      const updated = await client.query<JobRow>(\n        `UPDATE jobs\n         SET status = $2,\n             started_at = CASE WHEN $2 = 'IN_PROGRESS' AND started_at IS NULL THEN now() ELSE started_at END,\n             completed_at = CASE WHEN $2 = 'COMPLETED' THEN now() ELSE completed_at END\n         WHERE id = $1\n         RETURNING *`,\n        [jobId, status],\n      );\n\n      if (status === \"COMPLETED\") {\n        await client.query(\"UPDATE requests SET status = 'COMPLETED' WHERE id = $1\", [row.request_id]);\n        await client.query(\n          \"UPDATE appointments SET status = 'COMPLETED' WHERE offer_id = $1 AND status = 'CONFIRMED'\",\n          [row.offer_id],\n        );\n        // Erfahrung fortschreiben - sie fließt ins Matching ein.\n        await client.query(\n          \"UPDATE businesses SET completed_job_count = completed_job_count + 1 WHERE id = $1\",\n          [row.business_id],\n        );\n        await recordEvent(client, {\n          name: \"job_completed\",\n          userId,\n          requestId: row.request_id,\n          businessId: row.business_id,\n        });\n      }\n\n      if (status === \"CANCELLED\") {\n        await client.query(\n          \"UPDATE appointments SET status = 'CANCELLED' WHERE offer_id = $1 AND status IN ('PROPOSED', 'CONFIRMED')\",\n          [row.offer_id],\n        );\n      }\n\n      return mapJob(updated.rows[0] as JobRow);\n    });\n  }\n}\n"}, {"pfad": "services/api/src/modules/matching/engine.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 206, "bytes": 7708, "inhalt": "import type { MatchReason, MatchWeights } from \"@jobflow/types\";\nimport { DEFAULT_MATCH_WEIGHTS } from \"@jobflow/types\";\n\n/**\n * Die Matching-Engine.\n *\n * Sie ist absichtlich eine reine Funktion ohne Datenbankzugriff: so lässt sie\n * sich einzeln testen, und die Gewichte lassen sich später anhand echter\n * Daten nachjustieren, ohne die Abfragen anzufassen.\n *\n * Die Gewichte sind ein Startmodell, keine Wahrheit. Welche Faktoren\n * tatsächlich zu Aufträgen führen, zeigt sich erst im Betrieb.\n */\n\nexport interface CandidateInput {\n  businessId: string;\n  /** Bietet das Unternehmen die gesuchte Kategorie an? */\n  matchesCategory: boolean;\n  /** Bietet es die Oberkategorie an, aber nicht die konkrete Unterkategorie? */\n  matchesParentCategory: boolean;\n  /** Entfernung zur Anfrage in Kilometern; null, wenn Koordinaten fehlen. */\n  distanceKm: number | null;\n  /** Wie weit das Unternehmen fährt. */\n  serviceRadiusKm: number;\n  /** Hat es für den gewünschten Zeitraum Verfügbarkeit hinterlegt? */\n  hasAvailability: boolean;\n  rating: number | null;\n  reviewCount: number;\n  completedJobCount: number;\n  avgResponseMinutes: number | null;\n  /** Preisspanne der passenden Leistung in Cent. */\n  priceMinCents: number | null;\n  priceMaxCents: number | null;\n  verified: boolean;\n}\n\nexport interface ScoredCandidate {\n  businessId: string;\n  score: number;\n  reasons: MatchReason[];\n  distanceKm: number | null;\n}\n\nexport interface ScoringOptions {\n  weights?: MatchWeights;\n  /** Median der Preisspannen aller Kandidaten - Bezugspunkt für den Preisfaktor. */\n  referencePriceCents?: number | null;\n}\n\n/** Ein Kandidat, dessen Anteil an einem Faktor 0 bis 1 beträgt. */\ntype FactorScores = Record<keyof MatchWeights, number>;\n\nexport function scoreCandidate(candidate: CandidateInput, options: ScoringOptions = {}): ScoredCandidate {\n  const weights = options.weights ?? DEFAULT_MATCH_WEIGHTS;\n  const factors = computeFactors(candidate, options.referencePriceCents ?? null);\n\n  const reasons: MatchReason[] = [];\n  let total = 0;\n  for (const key of Object.keys(weights) as (keyof MatchWeights)[]) {\n    const points = factors[key] * weights[key];\n    total += points;\n    const label = describe(key, candidate, factors[key]);\n    if (label !== null) reasons.push({ factor: key, label, points: round(points) });\n  }\n\n  return {\n    businessId: candidate.businessId,\n    score: Math.round(clamp(total, 0, 100)),\n    // Die stärksten Gründe zuerst - die App zeigt nur die obersten an.\n    reasons: reasons.sort((a, b) => b.points - a.points),\n    distanceKm: candidate.distanceKm,\n  };\n}\n\nfunction computeFactors(candidate: CandidateInput, referencePriceCents: number | null): FactorScores {\n  return {\n    // Die passende Leistung ist der wichtigste Faktor. Eine Übereinstimmung\n    // nur auf Ebene der Oberkategorie zählt deutlich weniger.\n    service: candidate.matchesCategory ? 1 : candidate.matchesParentCategory ? 0.45 : 0,\n\n    distance: distanceFactor(candidate.distanceKm, candidate.serviceRadiusKm),\n\n    availability: candidate.hasAvailability ? 1 : 0,\n\n    rating: ratingFactor(candidate.rating, candidate.reviewCount),\n\n    price: priceFactor(candidate.priceMinCents, candidate.priceMaxCents, referencePriceCents),\n\n    // Erfahrung wächst schnell und flacht dann ab: der Unterschied zwischen\n    // 0 und 10 Aufträgen sagt viel mehr aus als der zwischen 200 und 210.\n    experience: saturate(candidate.completedJobCount, 25),\n\n    responseTime: responseFactor(candidate.avgResponseMinutes),\n  };\n}\n\n/**\n * Entfernung.\n *\n * Innerhalb des eigenen Einsatzradius fällt der Wert linear ab, außerhalb\n * ist er 0 - ein Betrieb, der nicht hinfährt, ist kein Treffer, egal wie gut\n * er sonst passt.\n */\nfunction distanceFactor(distanceKm: number | null, serviceRadiusKm: number): number {\n  // Ohne Koordinaten lässt sich nichts sagen. Ein mittlerer Wert ist ehrlicher\n  // als eine 0 (die den Betrieb aussortieren würde) oder eine 1 (die ihn\n  // gegenüber Betrieben mit Angabe bevorzugen würde).\n  if (distanceKm === null) return 0.5;\n  if (distanceKm > serviceRadiusKm) return 0;\n  return clamp(1 - distanceKm / serviceRadiusKm, 0, 1);\n}\n\n/**\n * Bewertung.\n *\n * Wenige Bewertungen sind wenig aussagekräftig, deshalb wird der Ausschlag\n * gedämpft: ein Betrieb mit 5,0 aus einer Bewertung soll einen mit 4,7 aus\n * 200 Bewertungen nicht überholen. Ohne Bewertungen gibt es den Mittelwert -\n * neue Betriebe sollen eine Chance bekommen.\n */\nfunction ratingFactor(rating: number | null, reviewCount: number): number {\n  if (rating === null || reviewCount === 0) return 0.5;\n  const normalized = clamp((rating - 1) / 4, 0, 1);\n  const trust = saturate(reviewCount, 20);\n  return 0.5 + (normalized - 0.5) * trust;\n}\n\n/**\n * Preis.\n *\n * Günstiger ist besser, aber nur mäßig gewichtet: der billigste Anbieter\n * ist selten der beste. Ohne Preisangabe gibt es den Mittelwert.\n */\nfunction priceFactor(minCents: number | null, maxCents: number | null, referenceCents: number | null): number {\n  if (referenceCents === null || referenceCents <= 0) return 0.5;\n  const own = midpoint(minCents, maxCents);\n  if (own === null) return 0.5;\n  // Halber Referenzpreis -> 1, doppelter -> 0.\n  const ratio = own / referenceCents;\n  return clamp(1 - (ratio - 0.5) / 1.5, 0, 1);\n}\n\nfunction responseFactor(avgResponseMinutes: number | null): number {\n  if (avgResponseMinutes === null) return 0.5;\n  // Unter 15 Minuten ist hervorragend, ab 24 Stunden zählt es nicht mehr.\n  if (avgResponseMinutes <= 15) return 1;\n  if (avgResponseMinutes >= 1440) return 0;\n  return clamp(1 - (avgResponseMinutes - 15) / (1440 - 15), 0, 1);\n}\n\nfunction describe(factor: keyof MatchWeights, candidate: CandidateInput, value: number): string | null {\n  switch (factor) {\n    case \"service\":\n      if (candidate.matchesCategory) return \"Bietet genau diese Leistung an\";\n      if (candidate.matchesParentCategory) return \"Arbeitet in diesem Bereich\";\n      return null;\n    case \"distance\":\n      if (candidate.distanceKm === null) return null;\n      return `${formatKm(candidate.distanceKm)} entfernt`;\n    case \"availability\":\n      return candidate.hasAvailability ? \"Hat freie Zeiten hinterlegt\" : null;\n    case \"rating\":\n      if (candidate.rating === null || candidate.reviewCount === 0) return null;\n      return `${candidate.rating.toFixed(1).replace(\".\", \",\")} aus ${candidate.reviewCount} Bewertungen`;\n    case \"price\":\n      if (value <= 0.5) return null;\n      return \"Preislich günstig\";\n    case \"experience\":\n      if (candidate.completedJobCount === 0) return null;\n      return `${candidate.completedJobCount} abgeschlossene Aufträge`;\n    case \"responseTime\":\n      if (candidate.avgResponseMinutes === null) return null;\n      return `Antwortet im Schnitt in ${formatMinutes(candidate.avgResponseMinutes)}`;\n  }\n}\n\nfunction formatKm(km: number): string {\n  return km < 10 ? `${km.toFixed(1).replace(\".\", \",\")} km` : `${Math.round(km)} km`;\n}\n\nfunction formatMinutes(minutes: number): string {\n  if (minutes < 60) return `${Math.round(minutes)} Min.`;\n  return `${Math.round(minutes / 60)} Std.`;\n}\n\nfunction midpoint(min: number | null, max: number | null): number | null {\n  if (min !== null && max !== null) return (min + max) / 2;\n  return min ?? max;\n}\n\n/** Wächst von 0 gegen 1 und erreicht bei `half` genau 0,5. */\nfunction saturate(value: number, half: number): number {\n  if (value <= 0) return 0;\n  return value / (value + half);\n}\n\nfunction clamp(value: number, min: number, max: number): number {\n  return Math.min(max, Math.max(min, value));\n}\n\nfunction round(value: number): number {\n  return Math.round(value * 10) / 10;\n}\n\nexport { DEFAULT_MATCH_WEIGHTS };\n"}, {"pfad": "services/api/src/modules/matching/service.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 283, "bytes": 10544, "inhalt": "import type { Match, MatchWithBusiness } from \"@jobflow/types\";\nimport type { Db } from \"../../db/pool.js\";\nimport { withTransaction } from \"../../db/pool.js\";\nimport { ApiError } from \"../../http/errors.js\";\nimport { recordEvent } from \"../analytics/audit.js\";\nimport { mapBusiness, type BusinessRow } from \"../businesses/mapper.js\";\nimport { scoreCandidate, type CandidateInput } from \"./engine.js\";\n\n/** Wie viele Unternehmen höchstens vorgeschlagen werden.
