achbau der Datenbank wäre für JobFlow wertlos: die interessanten\n * Zusicherungen - \"nur ein angenommenes Angebot je Anfrage\", die generierte\n * Gesamtsumme, die Berechtigungsprüfungen in den Abfragen - stecken im Schema\n * selbst. Ohne Datenbank ist keine davon getestet.\n *\n * Ist keine Testdatenbank konfiguriert, überspringen sich die Tests, statt\n * fehlzuschlagen.\n *\n * Jeder Lauf baut das Schema neu auf. Deshalb laufen die Testdateien\n * nacheinander (--test-concurrency=1 im test-Skript) - parallel würden sie\n * einander die Tabellen unter den Füßen wegziehen.\n */\nexport const TEST_DATABASE_URL = process.env[\"TEST_DATABASE_URL\"] ?? process.env[\"DATABASE_URL\"] ?? null;\n\nexport const skipUnlessDatabase = TEST_DATABASE_URL === null\n  ? { skip: \"TEST_DATABASE_URL ist nicht gesetzt - Integrationstests werden übersprungen.\" }\n  : {};\n\nexport interface TestHarness {\n  app: AppServices;\n  server: Server;\n  baseUrl: string;\n  config: Config;\n  close(): Promise<void>;\n}\n\nfunction testConfig(databaseUrl: string): Config {\n  return loadConfig({\n    DATABASE_URL: databaseUrl,\n    SESSION_SECRET: \"test-geheimnis-mit-mindestens-32-zeichen\",\n    PORT: \"0\",\n    AI_PROVIDER: \"rules\",\n    NODE_ENV: \"test\",\n  } as NodeJS.ProcessEnv);\n}\n\n/** Baut das Schema neu auf und startet die API auf einem freien Port. */\nexport async function startHarness(): Promise<TestHarness> {\n  if (TEST_DATABASE_URL === null) throw new Error(\"Keine Testdatenbank konfiguriert.\");\n\n  const pool = new Pool({ connectionString: TEST_DATABASE_URL, max: 5 });\n  await pool.query(\"DROP SCHEMA IF EXISTS public CASCADE\");\n  await pool.query(\"CREATE SCHEMA public\");\n  await migrate(pool);\n  await seed(pool);\n\n  const config = testConfig(TEST_DATABASE_URL);\n  const app = buildServices({ config, db: pool, logger: silentLogger });\n  const server = createApiServer(app);\n\n  await new Promise<void>((resolve) => server.listen(0, \"127.0.0.1\", resolve));\n  const address = server.address() as AddressInfo;\n\n  return {\n    app,\n    server,\n    config,\n    baseUrl: `http://127.0.0.1:${address.port}`,\n    close: async () => {\n      await new Promise<void>((resolve, reject) =>\n        server.close((error) => (error ? reject(error) : resolve())),\n      );\n      await pool.end();\n    },\n  };\n}\n\nexport interface ApiCallResult<T = unknown> {\n  status: number;\n  body: { success: boolean; data: T; error: { code: string; message: string; fields?: Record<string, string> } | null };\n}\n\n/** Kleiner Client für die Tests - spricht die API genau wie die App. */\nexport class TestClient {\n  private token: string | null = null;\n\n  constructor(private readonly baseUrl: string) {}\n\n  setToken(token: string | null): void {\n    this.token = token;\n  }\n\n  async call<T = unknown>(\n    method: string,\n    path: string,\n    body?: unknown,\n  ): Promise<ApiCallResult<T>> {\n    const headers: Record<string, string> = {};\n    if (body !== undefined) headers[\"content-type\"] = \"application/json\";\n    if (this.token !== null) headers[\"authorization\"] = `Bearer ${this.token}`;\n\n    const response = await fetch(`${this.baseUrl}${path}`, {\n      method,\n      headers,\n      ...(body === undefined ? {} : { body: JSON.stringify(body) }),\n    });\n    return { status: response.status, body: (await response.json()) as ApiCallResult<T>[\"body\"] };\n  }\n\n  get<T = unknown>(path: string): Promise<ApiCallResult<T>> {\n    return this.call<T>(\"GET\", path);\n  }\n  post<T = unknown>(path: string, body?: unknown): Promise<ApiCallResult<T>> {\n    return this.call<T>(\"POST\", path, body ?? {});\n  }\n  patch<T = unknown>(path: string, body: unknown): Promise<ApiCallResult<T>> {\n    return this.call<T>(\"PATCH\", path, body);\n  }\n  delete<T = unknown>(path: string): Promise<ApiCallResult<T>> {\n    return this.call<T>(\"DELETE\", path);\n  }\n}\n\n/** Erwartet einen Erfolg und liefert die Nutzdaten. */\nexport function expectOk<T>(result: ApiCallResult<T>, context: string): T {\n  if (!result.body.success) {\n    throw new Error(\n      `${context}: erwartet wurde Erfolg, kam aber ${result.status} ${result.body.error?.code} - ${result.body.error?.message}`,\n    );\n  }\n  return result.body.data;\n}\n\nlet emailCounter = 0;\nexport function uniqueEmail(prefix: string): string {\n  emailCounter += 1;\n  return `${prefix}-${process.pid}-${emailCounter}@example.test`;\n}\n"}, {"pfad": "services/api/test/matching-engine.test.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 124, "bytes": 5523, "inhalt": "import assert from \"node:assert/strict\";\nimport { describe, it } from \"node:test\";\nimport { DEFAULT_MATCH_WEIGHTS } from \"@jobflow/types\";\nimport { scoreCandidate, type CandidateInput } from \"../src/modules/matching/engine.js\";\n\n/** Ein durchschnittlicher Betrieb ohne Auffälligkeiten. */\nfunction candidate(overrides: Partial<CandidateInput> = {}): CandidateInput {\n  return {\n    businessId: \"b1\",\n    matchesCategory: true,\n    matchesParentCategory: false,\n    distanceKm: 5,\n    serviceRadiusKm: 30,\n    hasAvailability: true,\n    rating: 4.5,\n    reviewCount: 40,\n    completedJobCount: 25,\n    avgResponseMinutes: 30,\n    priceMinCents: 9000,\n    priceMaxCents: 13000,\n    verified: true,\n    ...overrides,\n  };\n}\n\ndescribe(\"Matching-Score\", () => {\n  it(\"bleibt zwischen 0 und 100\", () => {\n    const best = scoreCandidate(candidate({ distanceKm: 0, rating: 5, reviewCount: 500, completedJobCount: 900, avgResponseMinutes: 1 }));\n    const worst = scoreCandidate(\n      candidate({\n        matchesCategory: false,\n        matchesParentCategory: false,\n        distanceKm: 999,\n        hasAvailability: false,\n        rating: 1,\n        reviewCount: 200,\n        completedJobCount: 0,\n        avgResponseMinutes: 5000,\n      }),\n    );\n    assert.ok(best.score <= 100 && best.score >= 0, `best=${best.score}`);\n    assert.ok(worst.score <= 100 && worst.score >= 0, `worst=${worst.score}`);\n    assert.ok(best.score > worst.score);\n  });\n\n  it(\"gewichtet die passende Leistung am stärksten\", () => {\n    const exact = scoreCandidate(candidate({ matchesCategory: true, matchesParentCategory: false }));\n    const parentOnly = scoreCandidate(candidate({ matchesCategory: false, matchesParentCategory: true }));\n    const neither = scoreCandidate(candidate({ matchesCategory: false, matchesParentCategory: false }));\n\n    assert.ok(exact.score > parentOnly.score);\n    assert.ok(parentOnly.score > neither.score);\n    // Der Abstand zwischen \"genau passend\" und \"gar nicht passend\" entspricht\n    // dem vollen Gewicht des Faktors.\n    assert.equal(exact.score - neither.score, DEFAULT_MATCH_WEIGHTS.service);\n  });\n\n  it(\"schließt Betriebe außerhalb ihres Einsatzradius vom Entfernungspunkt aus\", () => {\n    const inside = scoreCandidate(candidate({ distanceKm: 29, serviceRadiusKm: 30 }));\n    const outside = scoreCandidate(candidate({ distanceKm: 31, serviceRadiusKm: 30 }));\n    assert.ok(inside.score > outside.score);\n    assert.ok(!outside.reasons.some((reason) => reason.factor === \"distance\" && reason.points > 0));\n  });\n\n  it(\"bevorzugt den näheren Betrieb bei sonst gleichen Daten\", () => {\n    const near = scoreCandidate(candidate({ distanceKm: 2 }));\n    const far = scoreCandidate(candidate({ distanceKm: 25 }));\n    assert.ok(near.score > far.score);\n  });\n\n  it(\"lässt wenige Bestbewertungen nicht viele gute Bewertungen überholen\", () => {\n    // Genau der Fall, den ein ungedämpfter Durchschnitt falsch macht:\n    // 5,0 aus einer einzigen Bewertung sagt fast nichts aus.\n    const oneFiveStar = scoreCandidate(candidate({ rating: 5, reviewCount: 1 }));\n    const manyGood = scoreCandidate(candidate({ rating: 4.7, reviewCount: 200 }));\n    assert.ok(manyGood.score >= oneFiveStar.score);\n  });\n\n  it(\"benachteiligt einen neuen Betrieb ohne Bewertungen nicht übermäßig\", () => {\n    const fresh = scoreCandidate(candidate({ rating: null, reviewCount: 0, completedJobCount: 0, avgResponseMinutes: null }));\n    const bad = scoreCandidate(candidate({ rating: 1.2, reviewCount: 80, completedJobCount: 0, avgResponseMinutes: 2000 }));\n    assert.ok(fresh.score > bad.score, `fresh=${fresh.score} bad=${bad.score}`);\n  });\n\n  it(\"wertet fehlende Koordinaten neutral, nicht als Ausschluss\", () => {\n    const unknown = scoreCandidate(candidate({ distanceKm: null }));\n    const veryFar = scoreCandidate(candidate({ distanceKm: 40, serviceRadiusKm: 30 }));\n    assert.ok(unknown.score > veryFar.score);\n    assert.equal(unknown.distanceKm, null);\n  });\n\n  it(\"belohnt den günstigeren Anbieter gegenüber dem Referenzpreis\", () => {\n    const cheap = scoreCandidate(candidate({ priceMinCents: 6000, priceMaxCents: 8000 }), {\n      referencePriceCents: 12000,\n    });\n    const expensive = scoreCandidate(candidate({ priceMinCents: 18000, priceMaxCents: 22000 }), {\n      referencePriceCents: 12000,\n    });\n    assert.ok(cheap.score > expensive.score);\n  });\n\n  it(\"liefert nachvollziehbare Gründe, absteigend nach Gewicht\", () => {\n    const scored = scoreCandidate(candidate());\n    assert.ok(scored.reasons.length > 0);\n    for (let i = 1; i < scored.reasons.length; i += 1) {\n      assert.ok((scored.reasons[i - 1] as { points: number }).points >= (scored.reasons[i] as { points: number }).points);\n    }\n    const distance = scored.reasons.find((reason) => reason.factor === \"distance\");\n    assert.equal(distance?.label, \"5,0 km entfernt\");\n  });\n\n  it(\"nennt keinen Grund für einen Faktor, zu dem nichts bekannt ist\", () => {\n    const scored = scoreCandidate(candidate({ rating: null, reviewCount: 0, avgResponseMinutes: null, completedJobCount: 0 }));\n    assert.ok(!scored.reasons.some((reason) => reason.factor === \"rating\"));\n    assert.ok(!scored.reasons.some((reason) => reason.factor === \"responseTime\"));\n    assert.ok(!scored.reasons.some((reason) => reason.factor === \"experience\"));\n  });\n\n  it(\"summiert die Gewichte auf 100\", () => {\n    const total = Object.values(DEFAULT_MATCH_WEIGHTS).reduce((sum, weight) => sum + weight, 0);\n    assert.equal(total, 100);\n  });\n});\n"}, {"pfad": "services/api/test/permissions.test.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 272, "bytes": 11479, "inhalt": "import assert from \"node:assert/strict\";\nimport { after, before, describe, it } from \"node:test\";\nimport type { AuthResult, Business, Category, Offer, ServiceRequest } from \"@jobflow/types\";\nimport { expectOk, skipUnlessDatabase, startHarness, TestClient, uniqueEmail, type TestHarness } from \"./helpers.js\";\n\n/**\n * Berechtigungen.\n *\n * Die App darf nicht einfach \"GET /requests/123\" sagen und damit die Anfrage\n * eines fremden Kunden bekommen. Geprüft wird das ausschließlich im Backend,\n * und genau das steht hier auf dem Prüfstand.\n */\ndescribe(\"Berechtigungen\", skipUnlessDatabase, () => {\n  let harness: TestHarness;\n  let kundeA: TestClient;\n  let kundeB: TestClient;\n  let betriebA: TestClient;\n  let betriebB: TestClient;\n  let anonym: TestClient;\n\n  let anfrageVonA: ServiceRequest;\n  let heizungId: string;\n  let betriebAId: string;\n\n  before(async () => {\n    harness = await startHarness();\n    kundeA = new TestClient(harness.baseUrl);\n    kundeB = new TestClient(harness.baseUrl);\n    betriebA = new TestClient(harness.baseUrl);\n    betriebB = new TestClient(harness.baseUrl);\n    anonym = new TestClient(harness.baseUrl);\n\n    const registriere = async (client: TestClient, prefix: string, role: \"CUSTOMER\" | \"BUSINESS\") => {\n      const result = expectOk<AuthResult>(\n        await client.post(\"/auth/register\", {\n          email: uniqueEmail(prefix),\n          name: `${prefix} Test`,\n          password: \"ein-langes-passwort\",\n          role,\n        }),\n        `${prefix} registrieren`,\n      );\n      client.setToken(result.token);\n      return result;\n    };\n\n    await registriere(kundeA, \"kunde-a\", \"CUSTOMER\");\n    await registriere(kundeB, \"kunde-b\", \"CUSTOMER\");\n    await registriere(betriebA, \"betrieb-a\", \"BUSINESS\");\n    await registriere(betriebB, \"betrieb-b\", \"BUSINESS\");\n\n    const kategorien = expectOk<Category[]>(await anonym.get(\"/categories\"), \"Kategorien\");\n    heizungId = kategorien.find((category) => category.slug === \"heizung\")?.id as string;\n\n    betriebAId = expectOk<Business>(await betriebA.get(\"/businesses/me\"), \"Profil A\").id;\n    expectOk(\n      await betriebA.patch(\"/businesses/me\", { name: \"Betrieb A\", latitude: 51.45, longitude: 7.01, serviceRadiusKm: 40 }),\n      \"Profil A pflegen\",\n    );\n    expectOk(\n      await betriebA.post(\"/businesses/me/services\", { categoryId: heizungId, name: \"Heizung\" }),\n      \"Leistung A\",\n    );\n\n    anfrageVonA = expectOk<ServiceRequest>(\n      await kundeA.post(\"/requests\", {\n        description: \"Meine Heizung wird nicht mehr richtig warm.\",\n        latitude: 51.4556,\n        longitude: 7.0116,\n      }),\n      \"Anfrage von A\",\n    );\n  });\n\n  after(async () => {\n    await harness.close();\n  });\n\n  it(\"weist Zugriffe ohne Anmeldung ab\", async () => {\n    const result = await anonym.get(\"/requests\");\n    assert.equal(result.status, 401);\n    assert.equal(result.body.error?.code, \"UNAUTHENTICATED\");\n  });\n\n  it(\"weist ein erfundenes Token ab\", async () => {\n    const gefälscht = new TestClient(harness.baseUrl);\n    gefälscht.setToken(\"völlig-erfundenes-token\");\n    assert.equal((await gefälscht.get(\"/me\")).status, 401);\n  });\n\n  it(\"lässt einen Kunden die Anfrage eines anderen Kunden nicht sehen\", async () => {\n    const result = await kundeB.get(`/requests/${anfrageVonA.id}`);\n    // 404 statt 403: sonst ließe sich am Statuscode ablesen, welche\n    // Anfrage-IDs es überhaupt gibt.\n    assert.equal(result.status, 404);\n  });\n\n  it(\"lässt einen Kunden die Anfrage eines anderen nicht ändern\", async () => {\n    const result = await kundeB.patch(`/requests/${anfrageVonA.id}`, { description: \"Ich übernehme das jetzt mal.\" });\n    assert.equal(result.status, 404);\n\n    const unverändert = expectOk<ServiceRequest>(await kundeA.get(`/requests/${anfrageVonA.id}`), \"Anfrage von A\");\n    assert.equal(unverändert.description, \"Meine Heizung wird nicht mehr richtig warm.\");\n  });\n\n  it(\"lässt einen Kunden die Anfrage eines anderen nicht zurückziehen\", async () => {\n    assert.equal((await kundeB.delete(`/requests/${anfrageVonA.id}`)).status, 404);\n  });\n\n  it(\"lässt einen Kunden die Analyse eines anderen nicht auslösen\", async () => {\n    assert.equal((await kundeB.post(`/requests/${anfrageVonA.id}/analyze`)).status, 404);\n  });\n\n  it(\"lässt ein Unternehmen keine Anfrage lesen, zu der es nicht vorgeschlagen wurde\", async () => {\n    // Betrieb A ist noch nicht zugeordnet - die Anfrage bleibt unsichtbar.\n    assert.equal((await betriebA.get(`/requests/${anfrageVonA.id}`)).status, 404);\n  });\n\n  it(\"lässt ein Unternehmen kein Angebot zu einer fremden Anfrage abgeben\", async () => {\n    const result = await betriebB.post(\"/offers\", {\n      requestId: anfrageVonA.id,\n      laborCents: 100,\n      description: \"Ich mache das günstiger, ohne gefragt worden zu sein.\",\n      validUntil: new Date(Date.now() + 86_400_000).toISOString(),\n    });\n    assert.equal(result.status, 404);\n  });\n\n  it(\"lässt ein Unternehmen erst nach dem Matching lesen und anbieten\", async () => {\n    expectOk(await kundeA.post(`/requests/${anfrageVonA.id}/analyze`), \"Analyse\");\n    const treffer = expectOk<unknown[]>(await kundeA.post(`/requests/${anfrageVonA.id}/matches`), \"Matching\");\n    assert.equal(treffer.length, 1, \"Nur Betrieb A bietet Heizung an.\");\n\n    // Jetzt darf Betrieb A lesen - Betrieb B weiterhin nicht.\n    assert.equal((await betriebA.get(`/requests/${anfrageVonA.id}`)).status, 200);\n    assert.equal((await betriebB.get(`/requests/${anfrageVonA.id}`)).status, 404);\n  });\n\n  it(\"lässt ein Unternehmen die Daten eines anderen Unternehmens nicht abrufen\", async () => {\n    // \"/businesses/me\" bezieht sich immer auf das eigene Unternehmen - eine\n    // fremde ID lässt sich gar nicht erst übergeben.\n    const eigenes = expectOk<Business>(await betriebB.get(\"/businesses/me\"), \"Profil B\");\n    assert.notEqual(eigenes.id, betriebAId);\n\n    // Das öffentliche Profil ist sichtbar, die Statistik nicht.\n    assert.equal((await betriebB.get(`/businesses/${betriebAId}`)).status, 200);\n    const statistik = expectOk<{ matchCount: number }>(await betriebB.get(\"/businesses/me/statistics\"), \"Statistik B\");\n    assert.equal(statistik.matchCount, 0, \"Betrieb B sieht nur die eigenen Kennzahlen.\");\n  });\n\n  it(\"lässt einen Kunden keine Unternehmensfunktionen aufrufen\", async () => {\n    const result = await kundeA.get(\"/businesses/me\");\n    assert.equal(result.status, 403);\n    assert.equal(result.body.error?.code, \"FORBIDDEN\");\n  });\n\n  it(\"lässt ein Unternehmen keine Anfrage stellen\", async () => {\n    const result = await betriebA.post(\"/requests\", { description: \"Ich hätte gerne eine Heizung repariert.\" });\n    assert.equal(result.status, 403);\n  });\n\n  it(\"lässt nur den Kunden ein Angebot annehmen\", async () => {\n    const angebot = expectOk<Offer>(\n      await betriebA.post(\"/offers\", {\n        requestId: anfrageVonA.id,\n        laborCents: 8000,\n        materialCents: 2500,\n        travelCents: 1500,\n        description: \"Prüfung und Reparatur der Heizungsanlage.\",\n        validUntil: new Date(Date.now() + 7 * 86_400_000).toISOString(),\n      }),\n      \"Angebot\",\n    );\n\n    // Ein fremder Kunde darf es nicht annehmen ...\n    assert.equal((await kundeB.post(`/offers/${angebot.id}/accept`)).status, 404);\n    // ... und das Unternehmen sein eigenes Angebot auch nicht.\n    assert.equal((await betriebA.post(`/offers/${angebot.id}/accept`)).status, 403);\n    // Der Kunde schon.\n    assert.equal((await kundeA.post(`/offers/${angebot.id}/accept`)).status, 201);\n  });\n\n  it(\"lässt ein Angebot kein zweites Mal annehmen\", async () => {\n    const angebote = expectOk<Offer[]>(await kundeA.get(`/requests/${anfrageVonA.id}/offers`), \"Angebote\");\n    const angenommen = angebote.find((offer) => offer.status === \"ACCEPTED\");\n    assert.ok(angenommen);\n    const result = await kundeA.post(`/offers/${angenommen.id}/accept`);\n    assert.equal(result.status, 409);\n    assert.equal(result.body.error?.code, \"CONFLICT\");\n  });\n\n  it(\"meldet den Fortschritt eines Auftrags nur an das ausführende Unternehmen\", async () => {\n    const jobs = expectOk<{ id: string }[]>(await kundeA.get(\"/jobs\"), \"Aufträge\");\n    const job = jobs[0];\n    assert.ok(job);\n    // Der Kunde soll einen Auftrag nicht selbst als erledigt melden können.\n    const result = await kundeA.patch(`/jobs/${job.id}/status`, { status: \"IN_PROGRESS\" });\n    assert.equal(result.status, 403);\n    assert.equal((await betriebA.patch(`/jobs/${job.id}/status`, { status: \"IN_PROGRESS\" })).status, 200);\n  });\n\n  it(\"lässt nur den Auftraggeber bewerten und nur nach Abschluss\", async () => {\n    const jobs = expectOk<{ id: string; status: string }[]>(await kundeA.get(\"/jobs\"), \"Aufträge\");\n    const job = jobs[0];\n    assert.ok(job);\n\n    // Noch nicht abgeschlossen.\n    assert.equal((await kundeA.post(\"/reviews\", { jobId: job.id, rating: 5 })).status, 409);\n\n    expectOk(await betriebA.patch(`/jobs/${job.id}/status`, { status: \"COMPLETED\" }), \"Abschließen\");\n\n    // Ein fremder Kunde darf nicht bewerten.\n    assert.equal((await kundeB.post(\"/reviews\", { jobId: job.id, rating: 1 })).status, 404);\n    // Der Auftraggeber schon - aber nur einmal.\n    assert.equal((await kundeA.post(\"/reviews\", { jobId: job.id, rating: 5 })).status, 201);\n    assert.equal((await kundeA.post(\"/reviews\", { jobId: job.id, rating: 1 })).status, 409);\n  });\n\n  it(\"lässt niemanden in ein fremdes Gespräch schreiben\", async () => {\n    const gespraeche = expectOk<{ id: string }[]>(await kundeA.get(\"/conversations\"), \"Gespräche\");\n    const gespraech = gespraeche[0];\n    assert.ok(gespraech);\n\n    assert.equal((await kundeB.get(`/conversations/${gespraech.id}/messages`)).status, 404);\n    assert.equal(\n      (await kundeB.post(`/conversations/${gespraech.id}/messages`, { body: \"Hallo, ich gehöre hier nicht hin.\" })).status,\n      404,\n    );\n    assert.equal((await betriebB.get(`/conversations/${gespraech.id}/messages`)).status, 404);\n  });\n\n  it(\"beendet eine Session beim Abmelden sofort\", async () => {\n    const kurz = new TestClient(harness.baseUrl);\n    const konto = expectOk<AuthResult>(\n      await kurz.post(\"/auth/register\", {\n        email: uniqueEmail(\"kurz\"),\n        name: \"Kurz Test\",\n        password: \"ein-langes-passwort\",\n      }),\n      \"Registrieren\",\n    );\n    kurz.setToken(konto.token);\n    assert.equal((await kurz.get(\"/me\")).status, 200);\n\n    expectOk(await kurz.post(\"/auth/logout\"), \"Abmelden\");\n    // Das Token ist sofort wertlos - deshalb liegen Sessions in der Datenbank\n    // und nicht nur in einem signierten Token.\n    assert.equal((await kurz.get(\"/me\")).status, 401);\n  });\n\n  it(\"nennt bei falschem Passwort nicht, ob es die Adresse gibt\", async () => {\n    const client = new TestClient(harness.baseUrl);\n    const unbekannt = await client.post(\"/auth/login\", {\n      email: \"gibt-es-nicht@example.test\",\n      password: \"irgendein-passwort\",\n    });\n    const falsch = await client.post(\"/auth/login\", {\n      email: \"gibt-es-nicht@example.test\",\n      password: \"anderes-passwort\",\n    });\n    assert.equal(unbekannt.status, 401);\n    assert.equal(unbekannt.body.error?.message, falsch.body.error?.message);\n  });\n\n  it(\"gibt niemals den Passwort-Hash heraus\", async () => {\n    const result = await kundeA.get(\"/me\");\n    const serialized = JSON.stringify(result.body);\n    assert.ok(!serialized.includes(\"password\"), serialized);\n    assert.ok(!serialized.includes(\"scrypt\"));\n  });\n});\n"}, {"pfad": "services/api/test/router.test.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 103, "bytes": 3836, "inhalt": "import assert from \"node:assert/strict\";\nimport { describe, it } from \"node:test\";\nimport { ApiError } from \"../src/http/errors.js\";\nimport { Router } from \"../src/http/router.js\";\nimport { RateLimiter } from \"../src/http/rate-limit.js\";\n\nconst noop = async () => null;\n\ndescribe(\"Router\", () => {\n  it(\"findet eine einfache Route\", () => {\n    const router = new Router().get(\"/health\", noop);\n    assert.notEqual(router.match(\"GET\", \"/health\"), null);\n  });\n\n  it(\"liest Pfadparameter aus\", () => {\n    const router = new Router().get(\"/requests/:id/questions/:questionId\", noop);\n    const match = router.match(\"GET\", \"/requests/abc/questions/xyz\");\n    assert.deepEqual(match?.params, { id: \"abc\", questionId: \"xyz\" });\n  });\n\n  it(\"dekodiert Prozentzeichen in Parametern\", () => {\n    const router = new Router().get(\"/x/:value\", noop);\n    assert.equal(router.match(\"GET\", \"/x/a%2Fb\")?.params[\"value\"], \"a/b\");\n  });\n\n  it(\"liefert null für einen unbekannten Pfad\", () => {\n    const router = new Router().get(\"/health\", noop);\n    assert.equal(router.match(\"GET\", \"/gibt-es-nicht\"), null);\n  });\n\n  it(\"unterscheidet unbekannten Pfad von falscher Methode\", () => {\n    const router = new Router().get(\"/requests\", noop);\n    assert.throws(\n      () => router.match(\"DELETE\", \"/requests\"),\n      (error: unknown) => error instanceof ApiError && error.status === 405,\n    );\n  });\n\n  it(\"hängt Module unter einem Präfix ein\", () => {\n    const inner = new Router().get(\"/:id\", noop);\n    const router = new Router().mount(\"/requests\", inner);\n    assert.equal(router.match(\"GET\", \"/requests/123\")?.params[\"id\"], \"123\");\n  });\n\n  it(\"unterscheidet Pfade unterschiedlicher Länge\", () => {\n    const router = new Router().get(\"/businesses/me\", noop).get(\"/businesses/:id\", noop);\n    assert.deepEqual(router.match(\"GET\", \"/businesses/me\")?.params, {});\n    assert.equal(router.match(\"GET\", \"/businesses/abc\")?.params[\"id\"], \"abc\");\n  });\n\n  it(\"bevorzugt die zuerst eingetragene Route bei gleichem Muster\", () => {\n    // \"/businesses/me\" ist vor \"/businesses/:id\" eingetragen und gewinnt\n    // deshalb - sonst würde \"me\" als Unternehmens-ID gelesen.\n    const seen: string[] = [];\n    const router = new Router()\n      .get(\"/businesses/me\", async () => {\n        seen.push(\"me\");\n        return null;\n      })\n      .get(\"/businesses/:id\", async () => {\n        seen.push(\"id\");\n        return null;\n      });\n    const match = router.match(\"GET\", \"/businesses/me\");\n    assert.notEqual(match, null);\n    void match?.handler({} as never);\n    assert.deepEqual(seen, [\"me\"]);\n  });\n});\n\ndescribe(\"Rate Limiting\", () => {\n  it(\"lässt Anfragen bis zur Grenze durch\", () => {\n    const limiter = new RateLimiter();\n    const rule = { limit: 3, windowMs: 1000 };\n    assert.equal(limiter.check(\"a\", rule, 0), true);\n    assert.equal(limiter.check(\"a\", rule, 0), true);\n    assert.equal(limiter.check(\"a\", rule, 0), true);\n    assert.equal(limiter.check(\"a\", rule, 0), false);\n  });\n\n  it(\"zählt Schluessel getrennt\", () => {\n    const limiter = new RateLimiter();\n    const rule = { limit: 1, windowMs: 1000 };\n    assert.equal(limiter.check(\"a\", rule, 0), true);\n    assert.equal(limiter.check(\"b\", rule, 0), true);\n    assert.equal(limiter.check(\"a\", rule, 0), false);\n  });\n\n  it(\"gibt das Kontingent nach Ablauf des Fensters frei\", () => {\n    const limiter = new RateLimiter();\n    const rule = { limit: 1, windowMs: 1000 };\n    assert.equal(limiter.check(\"a\", rule, 0), true);\n    assert.equal(limiter.check(\"a\", rule, 500), false);\n    assert.equal(limiter.check(\"a\", rule, 1001), true);\n  });\n\n  it(\"nennt eine Wartezeit von mindestens einer Sekunde\", () => {\n    const limiter = new RateLimiter();\n    limiter.check(\"a\", { limit: 1, windowMs: 5000 }, 0);\n    assert.ok(limiter.retryAfterSeconds(\"a\", 0) >= 1);\n  });\n});\n"}, {"pfad": "services/api/test/rules-provider.test.ts", "bereich": "Backend", "sprache": "typescript", "zeilen": 103, "bytes": 4202, "inhalt": "import assert from \"node:assert/strict\";\nimport { describe, it } from \"node:test\";\nimport { aiAnalysisResultSchema, validate } from \"@jobflow/validation\";\nimport { RulesAiProvider } from \"../src/modules/ai/rules-provider.js\";\n\nconst ALL_SLUGS = [\n  \"heizung\", \"sanitaer\", \"elektrik\", \"maler\", \"dach\", \"schluessel\",\n  \"kfz-reparatur\", \"kfz-reifen\", \"reinigung\", \"umzug\", \"montage\",\n  \"gartenpflege\", \"baumpflege\", \"nachhilfe\", \"fotografie\",\n];\n\nconst provider = new RulesAiProvider();\n\nasync function analyze(description: string, overrides: Partial<Parameters<typeof provider.analyze>[0]> = {}) {\n  return provider.analyze({\n    description,\n    knownCategorySlugs: ALL_SLUGS,\n    photoCount: 0,\n    ...overrides,\n  });\n}\n\ndescribe(\"Regelbasierte Analyse\", () => {\n  it(\"erkennt die Heizung aus dem Beispiel des Konzepts\", async () => {\n    const result = await analyze(\"Meine Heizung wird nicht mehr richtig warm.\");\n    assert.equal(result.categorySlug, \"heizung\");\n    assert.ok(result.questions.length > 0);\n  });\n\n  it(\"erkennt das tropfende Waschbecken aus dem Beispiel des Konzepts\", async () => {\n    const result = await analyze(\"Mein Waschbecken tropft.\");\n    assert.equal(result.categorySlug, \"sanitaer\");\n  });\n\n  it(\"liefert immer ein Ergebnis, das das Schema besteht\", async () => {\n    const beschreibungen = [\n      \"Meine Heizung wird nicht warm.\",\n      \"Ich brauche jemanden, der meinen Rasen maeht.\",\n      \"Das Auto macht komische Geräusche beim Bremsen.\",\n      \"Völlig unklares Anliegen ohne erkennbare Kategorie.\",\n      \"🙂\",\n    ];\n    for (const beschreibung of beschreibungen) {\n      const result = await analyze(beschreibung);\n      const parsed = validate(aiAnalysisResultSchema, result);\n      assert.equal(parsed.ok, true, `Schema verletzt für: ${beschreibung}`);\n    }\n  });\n\n  it(\"gibt zu, wenn es die Kategorie nicht erkennt - statt zu raten\", async () => {\n    const result = await analyze(\"Ich hätte gerne etwas, das ich nicht näher beschreiben kann.\");\n    assert.equal(result.categorySlug, null);\n    assert.ok(result.confidence <= 0.3, `confidence=${result.confidence}`);\n  });\n\n  it(\"schlägt nie eine Kategorie vor, die die Plattform nicht kennt\", async () => {\n    // Wenn \"heizung\" nicht existiert, darf sie auch nicht vorgeschlagen werden.\n    const result = await analyze(\"Meine Heizung wird nicht warm.\", {\n      knownCategorySlugs: [\"sanitaer\", \"elektrik\"],\n    });\n    assert.notEqual(result.categorySlug, \"heizung\");\n  });\n\n  it(\"erkennt Dringlichkeit an den Formulierungen\", async () => {\n    const notfall = await analyze(\"Notfall: Wasserschaden, es laeuft aus dem Heizkörper!\");\n    assert.equal(notfall.urgency, \"HIGH\");\n\n    const entspannt = await analyze(\"Die Heizung tropft leicht, hat aber keine Eile.\");\n    assert.equal(entspannt.urgency, \"LOW\");\n\n    const normal = await analyze(\"Die Heizung wird nicht richtig warm.\");\n    assert.equal(normal.urgency, \"NORMAL\");\n  });\n\n  it(\"stellt weniger Rückfragen, wenn Fotos vorliegen\", async () => {\n    const ohne = await analyze(\"Meine Heizung wird nicht warm.\", { photoCount: 0 });\n    const mit = await analyze(\"Meine Heizung wird nicht warm.\", { photoCount: 2 });\n    assert.ok(mit.questions.length <= ohne.questions.length);\n  });\n\n  it(\"wiederholt keine bereits beantworteten Rückfragen\", async () => {\n    const erste = await analyze(\"Meine Heizung wird nicht warm.\");\n    const beantwortet = erste.questions.slice(0, 1).map((question) => ({ question, answer: \"Seit gestern.\" }));\n    const zweite = await analyze(\"Meine Heizung wird nicht warm.\", { answeredQuestions: beantwortet });\n    for (const question of beantwortet) {\n      assert.ok(!zweite.questions.includes(question.question));\n    }\n  });\n\n  it(\"bleibt bei der Konfidenz unter 1 - ein Regelwerk kann nicht sicher sein\", async () => {\n    const result = await analyze(\"Heizung Heizkörper Thermostat Warmwasser Therme Kessel\");\n    assert.ok(result.confidence < 1);\n  });\n\n  it(\"liefert einen Textvorschlag für ein Angebot\", async () => {\n    const text = await provider.suggestText({\n      kind: \"OFFER_DESCRIPTION\",\n      context: \"Heizkörper wird nicht warm\",\n    });\n    assert.ok(text.length > 20);\n  });\n});\n"}, {"pfad": "services/api/tsconfig.build.json", "bereich": "Backend", "sprache": "json", "zeilen": 6, "bytes": 154, "inhalt": "{\n  \"extends\": \"../../tsconfig.base.json\",\n  \"compilerOptions\": { \"rootDir\": \"src\", \"outDir\": \"dist\", \"types\": [\"node\"] },\n  \"include\": [\"src/**/*.ts\"]\n}\n"}, {"pfad": "services/api/tsconfig.json", "bereich": "Backend", "sprache": "json", "zeilen": 6, "bytes": 150, "inhalt": "{\n  \"extends\": \"../../tsconfig.base.json\",\n  \"compilerOptions\": { \"noEmit\": true, \"types\": [\"node\"] },\n  \"include\": [\"src/**/*.ts\", \"test/**/*.ts\"]\n}\n"}, {"pfad": "packages/config/package.json", "bereich": "Geteilte Pakete", "sprache": "json", "zeilen": 27, "bytes": 620, "inhalt": "{\n  \"name\": \"@jobflow/config\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"Design-Tokens und geteilte Konstanten. Zentral definiert, damit sich das Branding an einer Stelle ändern lässt.\",\n  \"main\": \"./dist/index.js\",\n  \"types\": \"./dist/index.d.ts\",\n  \"exports\": {\n    \".\": {\n      \"types\": \"./dist/index.d.ts\",\n      \"default\": \"./dist/index.js\"\n    }\n  },\n  \"files\": [\n    \"dist\"\n  ],\n  \"scripts\": {\n    \"build\": \"tsc -p tsconfig.build.json\",\n    \"typecheck\": \"tsc -p tsconfig.json --noEmit\",\n    \"clean\": \"rm -rf dist\"\n  },\n  \"devDependencies\": {\n    \"typescript\": \"^5.9.3\"\n  }\n}\n"}, {"pfad": "packages/config/src/index.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 3, "bytes": 64, "inhalt": "export * from \"./theme.js\";\nexport * from \"./status-labels.js\";\n"}, {"pfad": "packages/config/src/status-labels.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 56, "bytes": 1611, "inhalt": "/**\n * Deutsche Bezeichnungen für die Status-Werte aus @jobflow/types.\n *\n * Die Typen selbst bleiben englisch (sie sind Datenbankwerte), die Oberfläche\n * ist deutsch. Diese Zuordnung liegt zentral, damit Mobile, Web und Admin\n * dieselben Wörter verwenden.\n */\n\nexport const requestStatusLabels: Record<string, string> = {\n  DRAFT: \"Entwurf\",\n  ANALYZING: \"Wird analysiert\",\n  OPEN: \"Offen\",\n  MATCHING: \"Anbieter werden gesucht\",\n  OFFERED: \"Angebote erhalten\",\n  ACCEPTED: \"Angebot angenommen\",\n  COMPLETED: \"Abgeschlossen\",\n  CANCELLED: \"Zurückgezogen\",\n};\n\nexport const offerStatusLabels: Record<string, string> = {\n  PENDING: \"Offen\",\n  ACCEPTED: \"Angenommen\",\n  DECLINED: \"Abgelehnt\",\n  WITHDRAWN: \"Zurückgezogen\",\n  EXPIRED: \"Abgelaufen\",\n};\n\nexport const appointmentStatusLabels: Record<string, string> = {\n  PROPOSED: \"Vorgeschlagen\",\n  CONFIRMED: \"Bestätigt\",\n  CANCELLED: \"Abgesagt\",\n  COMPLETED: \"Stattgefunden\",\n};\n\nexport const jobStatusLabels: Record<string, string> = {\n  SCHEDULED: \"Geplant\",\n  IN_PROGRESS: \"In Arbeit\",\n  COMPLETED: \"Abgeschlossen\",\n  CANCELLED: \"Abgebrochen\",\n};\n\nexport const urgencyLabels: Record<string, string> = {\n  LOW: \"Kann warten\",\n  NORMAL: \"Normal\",\n  HIGH: \"Dringend\",\n};\n\n/** Reihenfolge der Schritte in der Statusanzeige einer Anfrage. */\nexport const requestTimeline = [\n  { status: \"OPEN\", label: \"Anfrage erstellt\" },\n  { status: \"MATCHING\", label: \"Anbieter gefunden\" },\n  { status: \"OFFERED\", label: \"Angebot erhalten\" },\n  { status: \"ACCEPTED\", label: \"Angebot angenommen\" },\n  { status: \"COMPLETED\", label: \"Auftrag abgeschlossen\" },\n] as const;\n"}, {"pfad": "packages/config/src/theme.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 96, "bytes": 2112, "inhalt": "/**\n * Design-Tokens von JobFlow.\n *\n * Alle Farben, Abstände und Schriftgrößen stehen hier - und nur hier.\n * Sonst lässt sich das Branding später nicht mehr ändern, ohne hundert\n * Dateien anzufassen.\n */\n\nexport const colors = {\n  /** Primärfarbe: Violett/Blau. Buttons, aktive Zustände, Akzente. */\n  primary: \"#5B4CF0\",\n  primaryDark: \"#4438C7\",\n  primaryLight: \"#EDEBFE\",\n\n  /** Hintergrund der App: sehr helles Grau. */\n  background: \"#F6F7FB\",\n  /** Karten und Eingabefelder liegen hell darauf. */\n  surface: \"#FFFFFF\",\n  surfaceMuted: \"#F0F1F7\",\n\n  /** Text: dunkles Navy statt reinem Schwarz - ruhiger zu lesen. */\n  text: \"#131A34\",\n  textMuted: \"#5A6284\",\n  textInverted: \"#FFFFFF\",\n\n  border: \"#E3E5EF\",\n\n  success: \"#1FA971\",\n  successLight: \"#E4F7EF\",\n  warning: \"#E08A1E\",\n  warningLight: \"#FDF2E1\",\n  error: \"#D8464F\",\n  errorLight: \"#FCEAEB\",\n\n  /**\n   * Eigene Farbe für alles, was von der KI kommt. KI-Inhalte müssen optisch\n   * erkennbar sein und dürfen nicht wie gesicherte Fakten aussehen.\n   */\n  ai: \"#7A5AF8\",\n  aiLight: \"#F1EDFE\",\n} as const;\n\n/** Abstandsskala in Punkten. Vielfache von 4. */\nexport const spacing = {\n  xs: 4,\n  sm: 8,\n  md: 12,\n  lg: 16,\n  xl: 24,\n  xxl: 32,\n  xxxl: 48,\n} as const;\n\n/** Große, weiche Radien - das prägt den Charakter der Oberfläche. */\nexport const radii = {\n  sm: 8,\n  md: 12,\n  lg: 16,\n  xl: 24,\n  pill: 999,\n} as const;\n\nexport const typography = {\n  /** Inter als Grundschrift, mit Systemschrift als Rückfallebene. */\n  fontFamily: \"Inter\",\n  sizes: {\n    caption: 12,\n    small: 14,\n    body: 16,\n    title: 20,\n    heading: 24,\n    display: 32,\n  },\n  weights: {\n    regular: \"400\",\n    medium: \"500\",\n    semibold: \"600\",\n    bold: \"700\",\n  },\n} as const;\n\n/** Dezente Schatten. Karten sollen schweben, nicht schreien. */\nexport const shadows = {\n  card: {\n    shadowColor: \"#131A34\",\n    shadowOpacity: 0.06,\n    shadowRadius: 12,\n    shadowOffset: { width: 0, height: 4 },\n    elevation: 2,\n  },\n} as const;\n\nexport const theme = { colors, spacing, radii, typography, shadows } as const;\n\nexport type Theme = typeof theme;\n"}, {"pfad": "packages/config/tsconfig.build.json", "bereich": "Geteilte Pakete", "sprache": "json", "zeilen": 6, "bytes": 135, "inhalt": "{\n  \"extends\": \"../../tsconfig.base.json\",\n  \"compilerOptions\": { \"rootDir\": \"src\", \"outDir\": \"dist\" },\n  \"include\": [\"src/**/*.ts\"]\n}\n"}, {"pfad": "packages/config/tsconfig.json", "bereich": "Geteilte Pakete", "sprache": "json", "zeilen": 6, "bytes": 115, "inhalt": "{\n  \"extends\": \"../../tsconfig.base.json\",\n  \"compilerOptions\": { \"noEmit\": true },\n  \"include\": [\"src/**/*.ts\"]\n}\n"}, {"pfad": "packages/types/package.json", "bereich": "Geteilte Pakete", "sprache": "json", "zeilen": 27, "bytes": 577, "inhalt": "{\n  \"name\": \"@jobflow/types\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"Gemeinsame Domaenen- und API-Typen für Mobile, Web, Admin und Backend.\",\n  \"main\": \"./dist/index.js\",\n  \"types\": \"./dist/index.d.ts\",\n  \"exports\": {\n    \".\": {\n      \"types\": \"./dist/index.d.ts\",\n      \"default\": \"./dist/index.js\"\n    }\n  },\n  \"files\": [\n    \"dist\"\n  ],\n  \"scripts\": {\n    \"build\": \"tsc -p tsconfig.build.json\",\n    \"typecheck\": \"tsc -p tsconfig.json --noEmit\",\n    \"clean\": \"rm -rf dist\"\n  },\n  \"devDependencies\": {\n    \"typescript\": \"^5.9.3\"\n  }\n}\n"}, {"pfad": "packages/types/src/ai.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 50, "bytes": 1460, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\nimport type { Urgency } from \"./request.js\";\n\n/**\n * Das Ergebnis, das ein KI-Provider liefern MUSS.\n *\n * Der Provider ist austauschbar (Regelwerk, externes Modell ...). Das Backend\n * validiert dieses Objekt, bevor irgendetwas gespeichert wird - die KI schreibt\n * nie direkt in die Datenbank.\n */\nexport interface AiAnalysisResult {\n  /** Slug einer bekannten Kategorie, oder null wenn unklar. */\n  categorySlug: string | null;\n  /** Kurze Zusammenfassung des Problems in einem Satz. */\n  summary: string;\n  urgency: Urgency;\n  /** Nur die wirklich nötigen Rückfragen - kein 30-Felder-Formular. */\n  questions: string[];\n  /** Selbsteinschätzung des Providers, 0.0 - 1.0. */\n  confidence: number;\n}\n\n/** Gespeicherte Analyse zu einer Anfrage. */\nexport interface AiAnalysis {\n  id: Uuid;\n  requestId: Uuid;\n  categoryId: Uuid | null;\n  summary: string;\n  urgency: Urgency;\n  confidence: number;\n  /** Welcher Provider das Ergebnis erzeugt hat, z. B. \"rules@1\". */\n  provider: string;\n  createdAt: IsoDateTime;\n}\n\n/** Eine Rückfrage der KI und - sobald vorhanden - die Antwort des Kunden. */\nexport interface AiQuestion {\n  id: Uuid;\n  analysisId: Uuid;\n  position: number;\n  question: string;\n  answer: string | null;\n  answeredAt: IsoDateTime | null;\n}\n\n/** Analyse mit Rückfragen, so wie die App sie anzeigt. */\nexport interface AiAnalysisDetail extends AiAnalysis {\n  questions: AiQuestion[];\n}\n"}, {"pfad": "packages/types/src/analytics.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 19, "bytes": 471, "inhalt": "/**\n * Produktereignisse für den Funnel.\n *\n * Wir messen den Weg von der Anfrage zum Auftrag - nicht Downloads.\n * Die Ereignisse enthalten bewusst keine personenbezogenen Freitexte.\n */\nexport const ANALYTICS_EVENTS = [\n  \"request_created\",\n  \"ai_analysis_completed\",\n  \"match_generated\",\n  \"offer_created\",\n  \"offer_accepted\",\n  \"appointment_booked\",\n  \"job_completed\",\n  \"review_created\",\n] as const;\n\nexport type AnalyticsEvent = (typeof ANALYTICS_EVENTS)[number];\n"}, {"pfad": "packages/types/src/appointment.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 22, "bytes": 647, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\nexport const APPOINTMENT_STATUSES = [\"PROPOSED\", \"CONFIRMED\", \"CANCELLED\", \"COMPLETED\"] as const;\nexport type AppointmentStatus = (typeof APPOINTMENT_STATUSES)[number];\n\n/** Ein Termin gehört immer zu einem angenommenen Angebot. */\nexport interface Appointment {\n  id: Uuid;\n  offerId: Uuid;\n  startTime: IsoDateTime;\n  endTime: IsoDateTime;\n  status: AppointmentStatus;\n  createdAt: IsoDateTime;\n  updatedAt: IsoDateTime;\n}\n\n/** Freies Zeitfenster, das aus der Verfügbarkeit eines Unternehmens folgt. */\nexport interface AvailableSlot {\n  startTime: IsoDateTime;\n  endTime: IsoDateTime;\n}\n"}, {"pfad": "packages/types/src/business.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 68, "bytes": 2167, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\n/** Ein Dienstleister. Gehört genau einem Benutzer mit der Rolle BUSINESS. */\nexport interface Business {\n  id: Uuid;\n  ownerId: Uuid;\n  name: string;\n  description: string | null;\n  /** Von der Administration geprüft (Gewerbeanmeldung, Impressum ...). */\n  verified: boolean;\n  verifiedAt: IsoDateTime | null;\n  /** Durchschnitt aller Bewertungen, 1.0 - 5.0, null solange keine vorliegt. */\n  rating: number | null;\n  reviewCount: number;\n  /** Betriebssitz. Grundlage für die Entfernungsberechnung im Matching. */\n  latitude: number | null;\n  longitude: number | null;\n  /** Wie weit das Unternehmen zu einem Auftrag fährt, in Kilometern. */\n  serviceRadiusKm: number;\n  /** Median der Antwortzeit auf neue Anfragen, in Minuten. Null = noch keine Daten. */\n  avgResponseMinutes: number | null;\n  /** Abgeschlossene Aufträge - fließt als \"Erfahrung\" ins Matching ein. */\n  completedJobCount: number;\n  createdAt: IsoDateTime;\n  updatedAt: IsoDateTime;\n}\n\n/** Eine konkrete Leistung, die ein Unternehmen anbietet. */\nexport interface BusinessService {\n  id: Uuid;\n  businessId: Uuid;\n  categoryId: Uuid;\n  name: string;\n  description: string | null;\n  /** Preisspanne in Cent. Null = keine Angabe. */\n  priceMinCents: number | null;\n  priceMaxCents: number | null;\n  active: boolean;\n  createdAt: IsoDateTime;\n}\n\n/**\n * Wöchentlich wiederkehrende Verfügbarkeit.\n * Der Kunde sieht später nur Zeitfenster, die hier freigegeben sind.\n */\nexport interface AvailabilitySlot {\n  id: Uuid;\n  businessId: Uuid;\n  /** 0 = Sonntag ... 6 = Samstag (wie Date#getDay). */\n  weekday: number;\n  /** Ortszeit im Format \"HH:MM\". */\n  startTime: string;\n  endTime: string;\n}\n\n/** Mitarbeiter eines Unternehmens - darf Anfragen bearbeiten, aber nicht alles. */\nexport interface BusinessEmployee {\n  id: Uuid;\n  businessId: Uuid;\n  userId: Uuid;\n  /** OWNER darf das Unternehmen verwalten, MEMBER nur Anfragen bearbeiten. */\n  role: BusinessMemberRole;\n  createdAt: IsoDateTime;\n}\n\nexport const BUSINESS_MEMBER_ROLES = [\"OWNER\", \"MEMBER\"] as const;\nexport type BusinessMemberRole = (typeof BUSINESS_MEMBER_ROLES)[number];\n"}, {"pfad": "packages/types/src/category.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 28, "bytes": 838, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\n/**\n * Kategorien sind Daten, kein fest einprogrammierter Baum.\n *\n * Das ist eine der wichtigsten Architekturentscheidungen: neue Branchen\n * (Auto, Haushalt, Garten, Freelancer ...) kommen über die Datenbank dazu,\n * nicht über ein Deployment.\n */\nexport interface Category {\n  id: Uuid;\n  /** Stabiler, sprachunabhängiger Schluessel, z. B. \"heizung\". */\n  slug: string;\n  name: string;\n  /** Emoji oder Icon-Schluessel für die Oberfläche. */\n  icon: string | null;\n  parentId: Uuid | null;\n  /** Sortierung innerhalb der Ebene, kleinere Werte zuerst. */\n  position: number;\n  active: boolean;\n  createdAt: IsoDateTime;\n}\n\n/** Kategorie mit ihren Unterkategorien - für die Startseite der App. */\nexport interface CategoryNode extends Category {\n  children: CategoryNode[];\n}\n"}, {"pfad": "packages/types/src/common.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 66, "bytes": 1546, "inhalt": "/**\n * Einheitliche Antwortstruktur.\n *\n * Jede API-Antwort hat exakt diese Form - im Erfolgs- wie im Fehlerfall.\n * Dadurch müssen Mobile, Web und Admin nicht pro Endpunkt raten, wie eine\n * Antwort aussieht.\n */\nexport type ApiResponse<T> = ApiSuccess<T> | ApiFailure;\n\nexport interface ApiSuccess<T> {\n  success: true;\n  data: T;\n  error: null;\n}\n\nexport interface ApiFailure {\n  success: false;\n  data: null;\n  error: ApiErrorBody;\n}\n\nexport interface ApiErrorBody {\n  /** Maschinenlesbarer Code, z. B. \"REQUEST_NOT_FOUND\". */\n  code: ApiErrorCode;\n  /** Für Menschen lesbare Meldung (deutsch). */\n  message: string;\n  /** Feldbezogene Validierungsfehler: Feldpfad -> Meldung. */\n  fields?: Record<string, string>;\n}\n\nexport const API_ERROR_CODES = [\n  \"VALIDATION_FAILED\",\n  \"UNAUTHENTICATED\",\n  \"FORBIDDEN\",\n  \"NOT_FOUND\",\n  \"CONFLICT\",\n  \"RATE_LIMITED\",\n  \"PAYLOAD_TOO_LARGE\",\n  \"UNSUPPORTED_MEDIA_TYPE\",\n  \"AI_UNAVAILABLE\",\n  \"INTERNAL_ERROR\",\n] as const;\n\nexport type ApiErrorCode = (typeof API_ERROR_CODES)[number];\n\n/** Seitenweise Auflistung. */\nexport interface Page<T> {\n  items: T[];\n  /** Gesamtzahl der Treffer ohne Berücksichtigung von limit/offset. */\n  total: number;\n  limit: number;\n  offset: number;\n}\n\n/** Geografische Position. JobFlow speichert Koordinaten, keine Freitext-Adressen. */\nexport interface GeoPoint {\n  latitude: number;\n  longitude: number;\n}\n\n/** ISO-8601-Zeitstempel als String, so wie er über die API geht. */\nexport type IsoDateTime = string;\n\n/** UUID v4 als String. */\nexport type Uuid = string;\n"}, {"pfad": "packages/types/src/index.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 14, "bytes": 385, "inhalt": "export * from \"./common.js\";\nexport * from \"./user.js\";\nexport * from \"./category.js\";\nexport * from \"./business.js\";\nexport * from \"./request.js\";\nexport * from \"./ai.js\";\nexport * from \"./matching.js\";\nexport * from \"./offer.js\";\nexport * from \"./appointment.js\";\nexport * from \"./job.js\";\nexport * from \"./messaging.js\";\nexport * from \"./review.js\";\nexport * from \"./analytics.js\";\n"}, {"pfad": "packages/types/src/job.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 22, "bytes": 579, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\nexport const JOB_STATUSES = [\"SCHEDULED\", \"IN_PROGRESS\", \"COMPLETED\", \"CANCELLED\"] as const;\nexport type JobStatus = (typeof JOB_STATUSES)[number];\n\n/**\n * Der Auftrag. Entsteht, sobald der Kunde ein Angebot annimmt.\n * Hier endet der Funnel, den wir messen wollen.\n */\nexport interface Job {\n  id: Uuid;\n  offerId: Uuid;\n  requestId: Uuid;\n  businessId: Uuid;\n  customerId: Uuid;\n  status: JobStatus;\n  startedAt: IsoDateTime | null;\n  completedAt: IsoDateTime | null;\n  createdAt: IsoDateTime;\n  updatedAt: IsoDateTime;\n}\n"}, {"pfad": "packages/types/src/matching.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 60, "bytes": 1608, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\nimport type { Business } from \"./business.js\";\n\n/**\n * Gewichte des Matching-Scores. Summe: 100.\n *\n * Das ist ein Startmodell. Sobald echte Daten vorliegen, gehören die Gewichte\n * anhand der Frage nachjustiert, welche Faktoren tatsächlich zu Aufträgen führen.\n */\nexport interface MatchWeights {\n  service: number;\n  distance: number;\n  availability: number;\n  rating: number;\n  price: number;\n  experience: number;\n  responseTime: number;\n}\n\nexport const DEFAULT_MATCH_WEIGHTS: MatchWeights = {\n  service: 35,\n  distance: 20,\n  availability: 15,\n  rating: 10,\n  price: 10,\n  experience: 5,\n  responseTime: 5,\n};\n\n/** Warum ein Unternehmen vorgeschlagen wird - für die Anzeige in der App. */\nexport interface MatchReason {\n  /** Welcher Faktor, z. B. \"distance\". */\n  factor: keyof MatchWeights;\n  /** Erklärung in einem kurzen Satz, z. B. \"3,2 km entfernt\". */\n  label: string;\n  /** Beitrag dieses Faktors zum Gesamtscore, 0 - Gewicht des Faktors. */\n  points: number;\n}\n\nexport const MATCH_STATUSES = [\"PENDING\", \"NOTIFIED\", \"ACCEPTED\", \"DECLINED\", \"EXPIRED\"] as const;\nexport type MatchStatus = (typeof MATCH_STATUSES)[number];\n\n/** Zuordnung Anfrage <-> Unternehmen mit Bewertung. */\nexport interface Match {\n  id: Uuid;\n  requestId: Uuid;\n  businessId: Uuid;\n  /** 0 - 100. */\n  score: number;\n  reasons: MatchReason[];\n  status: MatchStatus;\n  distanceKm: number | null;\n  createdAt: IsoDateTime;\n}\n\n/** Match inklusive Unternehmensdaten - das sieht der Kunde. */\nexport interface MatchWithBusiness extends Match {\n  business: Business;\n}\n"}, {"pfad": "packages/types/src/messaging.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 26, "bytes": 652, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\n/** Jede Anfrage-Unternehmen-Beziehung bekommt genau eine Konversation. */\nexport interface Conversation {\n  id: Uuid;\n  requestId: Uuid;\n  businessId: Uuid;\n  customerId: Uuid;\n  lastMessageAt: IsoDateTime | null;\n  createdAt: IsoDateTime;\n}\n\nexport interface Message {\n  id: Uuid;\n  conversationId: Uuid;\n  senderId: Uuid;\n  body: string;\n  /**\n   * true, wenn der Text aus einem KI-Vorschlag stammt.\n   * Die Oberfläche muss das kennzeichnen - KI-Inhalte dürfen nicht so\n   * aussehen, als kämen sie garantiert von einem Menschen.\n   */\n  isAiGenerated: boolean;\n  createdAt: IsoDateTime;\n}\n"}, {"pfad": "packages/types/src/offer.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 47, "bytes": 1372, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\n/**\n * PENDING   - vom Unternehmen abgeschickt, der Kunde hat noch nicht entschieden\n * ACCEPTED  - der Kunde hat angenommen\n * DECLINED  - der Kunde hat abgelehnt\n * WITHDRAWN - das Unternehmen hat zurückgezogen\n * EXPIRED   - validUntil ist verstrichen\n */\nexport const OFFER_STATUSES = [\"PENDING\", \"ACCEPTED\", \"DECLINED\", \"WITHDRAWN\", \"EXPIRED\"] as const;\nexport type OfferStatus = (typeof OFFER_STATUSES)[number];\n\n/**\n * Ein Angebot. Alle Beträge in Cent - Gleitkommazahlen haben bei Geld\n * nichts zu suchen.\n *\n * Über Preis und Inhalt entscheidet immer das Unternehmen. Die KI darf\n * höchstens einen Textvorschlag liefern.\n */\nexport interface Offer {\n  id: Uuid;\n  requestId: Uuid;\n  businessId: Uuid;\n  laborCents: number;\n  materialCents: number;\n  travelCents: number;\n  /** Summe der drei Positionen. Wird serverseitig berechnet. */\n  totalCents: number;\n  description: string;\n  /** true, wenn der Beschreibungstext aus einem KI-Vorschlag stammt. */\n  descriptionAiAssisted: boolean;\n  validUntil: IsoDateTime;\n  status: OfferStatus;\n  createdAt: IsoDateTime;\n  updatedAt: IsoDateTime;\n}\n\nexport interface CreateOfferInput {\n  requestId: string;\n  laborCents: number;\n  materialCents: number;\n  travelCents: number;\n  description: string;\n  validUntil: string;\n  descriptionAiAssisted?: boolean;\n}\n"}, {"pfad": "packages/types/src/request.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 79, "bytes": 2301, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\n/**\n * Lebenszyklus einer Anfrage.\n *\n * DRAFT      - angelegt, noch nicht abgeschickt\n * ANALYZING  - die KI wertet Beschreibung und Fotos aus\n * OPEN       - abgeschickt, Rückfragen beantwortet\n * MATCHING   - passende Unternehmen wurden ermittelt und benachrichtigt\n * OFFERED    - mindestens ein Angebot liegt vor\n * ACCEPTED   - der Kunde hat ein Angebot angenommen, daraus entsteht ein Job\n * COMPLETED  - der Auftrag ist abgeschlossen\n * CANCELLED  - vom Kunden zurückgezogen\n */\nexport const REQUEST_STATUSES = [\n  \"DRAFT\",\n  \"ANALYZING\",\n  \"OPEN\",\n  \"MATCHING\",\n  \"OFFERED\",\n  \"ACCEPTED\",\n  \"COMPLETED\",\n  \"CANCELLED\",\n] as const;\nexport type RequestStatus = (typeof REQUEST_STATUSES)[number];\n\nexport const URGENCIES = [\"LOW\", \"NORMAL\", \"HIGH\"] as const;\nexport type Urgency = (typeof URGENCIES)[number];\n\n/** Die zentrale Entität der Plattform: das Problem eines Kunden. */\nexport interface ServiceRequest {\n  id: Uuid;\n  customerId: Uuid;\n  /** Kann anfangs null sein - die KI schlägt die Kategorie vor. */\n  categoryId: Uuid | null;\n  title: string | null;\n  description: string;\n  urgency: Urgency;\n  latitude: number | null;\n  longitude: number | null;\n  /** Grobe Ortsangabe für die Anzeige, z. B. \"45127 Essen\". */\n  locationLabel: string | null;\n  /** Gewünschter Zeitraum. */\n  desiredFrom: IsoDateTime | null;\n  desiredTo: IsoDateTime | null;\n  status: RequestStatus;\n  createdAt: IsoDateTime;\n  updatedAt: IsoDateTime;\n}\n\n/** Foto zu einer Anfrage. Der Zugriff ist auf die Beteiligten beschränkt. */\nexport interface RequestPhoto {\n  id: Uuid;\n  requestId: Uuid;\n  /** Schluessel im Object Storage - niemals eine öffentliche URL. */\n  storageKey: string;\n  contentType: string;\n  byteSize: number;\n  createdAt: IsoDateTime;\n}\n\n/** Eingabe zum Anlegen einer Anfrage. */\nexport interface CreateRequestInput {\n  categoryId?: string | null;\n  title?: string | null;\n  description: string;\n  urgency?: Urgency;\n  latitude?: number | null;\n  longitude?: number | null;\n  locationLabel?: string | null;\n  desiredFrom?: string | null;\n  desiredTo?: string | null;\n}\n\n/** Anfrage inklusive der Daten, die die Detailansicht braucht. */\nexport interface ServiceRequestDetail extends ServiceRequest {\n  photos: RequestPhoto[];\n}\n"}, {"pfad": "packages/types/src/review.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 20, "bytes": 419, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\n/** Bewertung eines abgeschlossenen Auftrags. Nur der Kunde darf bewerten. */\nexport interface Review {\n  id: Uuid;\n  jobId: Uuid;\n  customerId: Uuid;\n  businessId: Uuid;\n  /** Ganzzahl 1 - 5. */\n  rating: number;\n  text: string | null;\n  createdAt: IsoDateTime;\n}\n\nexport interface CreateReviewInput {\n  jobId: string;\n  rating: number;\n  text?: string | null;\n}\n"}, {"pfad": "packages/types/src/user.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 39, "bytes": 1124, "inhalt": "import type { IsoDateTime, Uuid } from \"./common.js\";\n\n/**\n * Rollen der Plattform.\n *\n * CUSTOMER und BUSINESS werden bei der Registrierung gewählt.\n * BUSINESS_EMPLOYEE wird von einem Unternehmen vergeben, ADMIN nur intern.\n */\nexport const USER_ROLES = [\"CUSTOMER\", \"BUSINESS\", \"BUSINESS_EMPLOYEE\", \"ADMIN\"] as const;\nexport type UserRole = (typeof USER_ROLES)[number];\n\n/** Rollen, die sich selbst registrieren dürfen. */\nexport const SELF_SIGNUP_ROLES = [\"CUSTOMER\", \"BUSINESS\"] as const;\nexport type SelfSignupRole = (typeof SELF_SIGNUP_ROLES)[number];\n\n/**\n * Ein Benutzer, so wie ihn die API nach außen gibt.\n * Das Passwort-Hash verlässt das Backend niemals.\n */\nexport interface User {\n  id: Uuid;\n  email: string;\n  name: string;\n  role: UserRole;\n  phone: string | null;\n  /** Gesperrte Konten können sich nicht anmelden. */\n  blockedAt: IsoDateTime | null;\n  createdAt: IsoDateTime;\n  updatedAt: IsoDateTime;\n}\n\n/** Ergebnis von /auth/register und /auth/login. */\nexport interface AuthResult {\n  user: User;\n  /** Bearer-Token für den Authorization-Header. */\n  token: string;\n  expiresAt: IsoDateTime;\n}\n"}, {"pfad": "packages/types/tsconfig.build.json", "bereich": "Geteilte Pakete", "sprache": "json", "zeilen": 9, "bytes": 145, "inhalt": "{\n  \"extends\": \"../../tsconfig.base.json\",\n  \"compilerOptions\": {\n    \"rootDir\": \"src\",\n    \"outDir\": \"dist\"\n  },\n  \"include\": [\"src/**/*.ts\"]\n}\n"}, {"pfad": "packages/types/tsconfig.json", "bereich": "Geteilte Pakete", "sprache": "json", "zeilen": 8, "bytes": 121, "inhalt": "{\n  \"extends\": \"../../tsconfig.base.json\",\n  \"compilerOptions\": {\n    \"noEmit\": true\n  },\n  \"include\": [\"src/**/*.ts\"]\n}\n"}, {"pfad": "packages/ui/README.md", "bereich": "Geteilte Pakete", "sprache": "markdown", "zeilen": 18, "bytes": 783, "inhalt": "# packages/ui — noch nicht gebaut\n\nHier sollen später die UI-Komponenten liegen, die sich Mobile- und Web-App\nteilen.\n\n**Warum noch nicht:** Solange es nur eine Oberfläche gibt, wäre ein\ngemeinsames Paket eine Abstraktion ohne zweiten Verwender — und damit\nzuverlässig die falsche. Die Komponenten liegen deshalb vorerst direkt in\n`apps/mobile/components/`.\n\n**Was schon geteilt wird:** Die Design-Tokens. Farben, Abstände, Radien und\nSchriftgrößen stehen in `@jobflow/config` und werden von der Mobile-App nur\nnoch verwendet, nicht mehr definiert. Damit lässt sich das Branding an einer\nStelle ändern, und die Web-App wird später dieselben Werte benutzen.\n\nSobald `apps/web` existiert, wandern die Komponenten hierher, die beide\nOberflächen wirklich gemeinsam haben.\n"}, {"pfad": "packages/validation/package.json", "bereich": "Geteilte Pakete", "sprache": "json", "zeilen": 33, "bytes": 749, "inhalt": "{\n  \"name\": \"@jobflow/validation\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"Gemeinsame Validierung für Mobile, Web und Backend - ohne Laufzeitabhaengigkeiten.\",\n  \"main\": \"./dist/index.js\",\n  \"types\": \"./dist/index.d.ts\",\n  \"exports\": {\n    \".\": {\n      \"types\": \"./dist/index.d.ts\",\n      \"default\": \"./dist/index.js\"\n    }\n  },\n  \"files\": [\n    \"dist\"\n  ],\n  \"scripts\": {\n    \"build\": \"tsc -p tsconfig.build.json\",\n    \"typecheck\": \"tsc -p tsconfig.json --noEmit\",\n    \"test\": \"tsx --test test/*.test.ts\",\n    \"clean\": \"rm -rf dist\"\n  },\n  \"dependencies\": {\n    \"@jobflow/types\": \"workspace:*\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"^22.15.0\",\n    \"tsx\": \"^4.23.1\",\n    \"typescript\": \"^5.9.3\"\n  }\n}\n"}, {"pfad": "packages/validation/src/core.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 261, "bytes": 9398, "inhalt": "/**\n * Ein sehr kleines Validierungs-Werkzeug ohne Abhängigkeiten.\n *\n * Bewusst klein gehalten: es laeuft unverändert im Backend (Node) und in der\n * React-Native-App. Beide Seiten prüfen dieselben Regeln - die App für schnelle\n * Rückmeldung, das Backend als verbindliche Instanz. Die App darf nie allein\n * darüber entscheiden, ob Daten gültig sind.\n */\n\nexport type ValidationResult<T> =\n  | { ok: true; value: T }\n  | { ok: false; fields: Record<string, string> };\n\n/** Ein Validator prüft einen Wert an einer bestimmten Stelle (path). */\nexport interface Validator<T> {\n  parse(input: unknown, path: string, errors: Record<string, string>): T | undefined;\n}\n\n/** Führt einen Validator aus und liefert entweder Wert oder Feldfehler. */\nexport function validate<T>(validator: Validator<T>, input: unknown): ValidationResult<T> {\n  const errors: Record<string, string> = {};\n  const value = validator.parse(input, \"\", errors);\n  if (Object.keys(errors).length > 0) return { ok: false, fields: errors };\n  return { ok: true, value: value as T };\n}\n\nfunction fail(errors: Record<string, string>, path: string, message: string): undefined {\n  // Der erste Fehler pro Feld ist der aussagekräftigste; spätere überschreiben ihn nicht.\n  if (!(path in errors)) errors[path] = message;\n  return undefined;\n}\n\nfunction join(path: string, key: string): string {\n  return path === \"\" ? key : `${path}.${key}`;\n}\n\n// --- Bausteine -------------------------------------------------------------\n\nexport interface StringOptions {\n  min?: number;\n  max?: number;\n  /** Führende und abschließende Leerzeichen entfernen (Standard: true). */\n  trim?: boolean;\n  pattern?: RegExp;\n  patternMessage?: string;\n}\n\nexport function string(options: StringOptions = {}): Validator<string> {\n  const { min = 1, max = 10_000, trim = true, pattern, patternMessage } = options;\n  return {\n    parse(input, path, errors) {\n      if (typeof input !== \"string\") return fail(errors, path, \"Bitte einen Text angeben.\");\n      const value = trim ? input.trim() : input;\n      if (value.length < min) {\n        return fail(\n          errors,\n          path,\n          min === 1 ? \"Dieses Feld darf nicht leer sein.\" : `Bitte mindestens ${min} Zeichen angeben.`,\n        );\n      }\n      if (value.length > max) return fail(errors, path, `Bitte höchstens ${max} Zeichen angeben.`);\n      if (pattern && !pattern.test(value)) {\n        return fail(errors, path, patternMessage ?? \"Das Format ist ungueltig.\");\n      }\n      return value;\n    },\n  };\n}\n\n// Absichtlich pragmatisch: eine vollständige RFC-Prüfung ist weder möglich\n// noch sinnvoll. Ob eine Adresse existiert, zeigt erst die Bestätigungsmail.\nconst EMAIL_PATTERN = /^[^\\s@]+@[^\\s@.]+(\\.[^\\s@.]+)+$/;\n\nexport function email(): Validator<string> {\n  return {\n    parse(input, path, errors) {\n      if (typeof input !== \"string\") return fail(errors, path, \"Bitte eine E-Mail-Adresse angeben.\");\n      const value = input.trim().toLowerCase();\n      if (value.length === 0) return fail(errors, path, \"Bitte eine E-Mail-Adresse angeben.\");\n      if (value.length > 254 || !EMAIL_PATTERN.test(value)) {\n        return fail(errors, path, \"Diese E-Mail-Adresse sieht nicht gültig aus.\");\n      }\n      return value;\n    },\n  };\n}\n\nexport interface NumberOptions {\n  min?: number;\n  max?: number;\n  int?: boolean;\n}\n\nexport function number(options: NumberOptions = {}): Validator<number> {\n  const { min, max, int = false } = options;\n  return {\n    parse(input, path, errors) {\n      const value = typeof input === \"string\" && input.trim() !== \"\" ? Number(input) : input;\n      if (typeof value !== \"number\" || !Number.isFinite(value)) {\n        return fail(errors, path, \"Bitte eine Zahl angeben.\");\n      }\n      if (int && !Number.isInteger(value)) return fail(errors, path, \"Bitte eine ganze Zahl angeben.\");\n      if (min !== undefined && value < min) return fail(errors, path, `Der Wert muss mindestens ${min} sein.`);\n      if (max !== undefined && value > max) return fail(errors, path, `Der Wert darf höchstens ${max} sein.`);\n      return value;\n    },\n  };\n}\n\nexport function boolean(): Validator<boolean> {\n  return {\n    parse(input, path, errors) {\n      if (typeof input !== \"boolean\") return fail(errors, path, \"Bitte ja oder nein angeben.\");\n      return input;\n    },\n  };\n}\n\nexport function oneOf<const T extends readonly string[]>(values: T): Validator<T[number]> {\n  return {\n    parse(input, path, errors) {\n      if (typeof input !== \"string\" || !values.includes(input)) {\n        return fail(errors, path, `Erlaubt sind: ${values.join(\", \")}.`);\n      }\n      return input as T[number];\n    },\n  };\n}\n\nconst UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-9a-f][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n\nexport function uuid(): Validator<string> {\n  return {\n    parse(input, path, errors) {\n      if (typeof input !== \"string\" || !UUID_PATTERN.test(input)) {\n        return fail(errors, path, \"Ungültige Kennung.\");\n      }\n      return input.toLowerCase();\n    },\n  };\n}\n\n/** ISO-8601-Zeitstempel. Liefert den normalisierten UTC-String zurück. */\nexport function isoDateTime(): Validator<string> {\n  return {\n    parse(input, path, errors) {\n      if (typeof input !== \"string\") return fail(errors, path, \"Bitte einen Zeitpunkt angeben.\");\n      const ms = Date.parse(input);\n      if (Number.isNaN(ms)) return fail(errors, path, \"Dieser Zeitpunkt ist ungueltig.\");\n      return new Date(ms).toISOString();\n    },\n  };\n}\n\nexport function latitude(): Validator<number> {\n  return number({ min: -90, max: 90 });\n}\n\nexport function longitude(): Validator<number> {\n  return number({ min: -180, max: 180 });\n}\n\n/** Erlaubt zusätzlich undefined und einen fehlenden Schluessel. */\nexport function optional<T>(inner: Validator<T>): Validator<T | undefined> {\n  return {\n    parse(input, path, errors) {\n      if (input === undefined) return undefined;\n      return inner.parse(input, path, errors);\n    },\n  };\n}\n\n/** Erlaubt zusätzlich null (und undefined, das zu null wird). */\nexport function nullable<T>(inner: Validator<T>): Validator<T | null> {\n  return {\n    parse(input, path, errors) {\n      if (input === null || input === undefined) return null;\n      const value = inner.parse(input, path, errors);\n      return value === undefined ? undefined : value;\n    },\n  };\n}\n\n/** Setzt einen Standardwert ein, wenn nichts übergeben wurde. */\nexport function withDefault<T>(inner: Validator<T>, fallback: T): Validator<T> {\n  return {\n    parse(input, path, errors) {\n      if (input === undefined || input === null) return fallback;\n      return inner.parse(input, path, errors);\n    },\n  };\n}\n\nexport function array<T>(inner: Validator<T>, options: { min?: number; max?: number } = {}): Validator<T[]> {\n  const { min = 0, max = 100 } = options;\n  return {\n    parse(input, path, errors) {\n      if (!Array.isArray(input)) return fail(errors, path, \"Bitte eine Liste angeben.\");\n      if (input.length < min) return fail(errors, path, `Bitte mindestens ${min} Einträge angeben.`);\n      if (input.length > max) return fail(errors, path, `Bitte höchstens ${max} Einträge angeben.`);\n      const out: T[] = [];\n      let failed = false;\n      input.forEach((item, index) => {\n        const before = Object.keys(errors).length;\n        const value = inner.parse(item, join(path, String(index)), errors);\n        if (Object.keys(errors).length > before) failed = true;\n        else out.push(value as T);\n      });\n      return failed ? undefined : out;\n    },\n  };\n}\n\ntype ShapeOf<S extends Record<string, Validator<unknown>>> = {\n  [K in keyof S]: S[K] extends Validator<infer T> ? T : never;\n};\n\n/**\n * Objekt-Validator. Unbekannte Schluessel werden verworfen - so kann ein Client\n * keine Felder unterschieben, die es gar nicht geben soll.\n */\nexport function object<S extends Record<string, Validator<any>>>(shape: S): Validator<ShapeOf<S>> {\n  return {\n    parse(input, path, errors) {\n      if (typeof input !== \"object\" || input === null || Array.isArray(input)) {\n        return fail(errors, path, \"Es wurden keine gültigen Daten übermittelt.\");\n      }\n      const source = input as Record<string, unknown>;\n      const out: Record<string, unknown> = {};\n      let failed = false;\n      for (const key of Object.keys(shape)) {\n        const validator = shape[key] as Validator<unknown>;\n        // Ob ein Feld in Ordnung ist, entscheidet allein, ob der Validator einen\n        // Fehler gemeldet hat. Ein undefined als Rückgabe ist bei optional()\n        // ein völlig legitimes Ergebnis.\n        const before = Object.keys(errors).length;\n        const value = validator.parse(source[key], join(path, key), errors);\n        if (Object.keys(errors).length > before) {\n          failed = true;\n          continue;\n        }\n        if (value !== undefined) out[key] = value;\n      }\n      return failed ? undefined : (out as ShapeOf<S>);\n    },\n  };\n}\n\n/** Prüft einen bereits geparsten Wert und wirft nicht - nur zur Verfeinerung. */\nexport function refine<T>(inner: Validator<T>, check: (value: T) => string | null): Validator<T> {\n  return {\n    parse(input, path, errors) {\n      const value = inner.parse(input, path, errors);\n      if (value === undefined) return undefined;\n      const message = check(value);\n      if (message !== null) return fail(errors, path, message);\n      return value;\n    },\n  };\n}\n"}, {"pfad": "packages/validation/src/index.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 3, "bytes": 57, "inhalt": "export * from \"./core.js\";\nexport * from \"./schemas.js\";\n"}, {"pfad": "packages/validation/src/schemas.ts", "bereich": "Geteilte Pakete", "sprache": "typescript", "zeilen": 215, "bytes": 7282, "inhalt": "import { SELF_SIGNUP_ROLES, URGENCIES } from \"@jobflow/types\";\nimport {\n  array,\n  boolean,\n  email,\n  isoDateTime,\n  latitude,\n  longitude,\n  nullable,\n  number,\n  object,\n  oneOf,\n  optional,\n  refine,\n  string,\n  uuid,\n  withDefault,\n  type Validator,\n} from \"./core.js\";\n\n/**\n * Passwortregeln.\n *\n * Bewusst nur eine Mindestlänge statt Zeichenklassen-Zwang: Länge ist der\n * Faktor, der tatsächlich schützt, und erzwungene Sonderzeichen führen in der\n * Praxis zu schlechteren Passwörtern.\n */\nexport const PASSWORD_MIN_LENGTH = 10;\nexport const PASSWORD_MAX_LENGTH = 200;\n\nexport const passwordSchema = string({\n  min: PASSWORD_MIN_LENGTH,\n  max: PASSWORD_MAX_LENGTH,\n  trim: false,\n});\n\n// --- Authentifizierung -----------------------------------------------------\n\nexport const registerSchema = object({\n  email: email(),\n  name: string({ min: 2, max: 120 }),\n  password: passwordSchema,\n  role: withDefault(oneOf(SELF_SIGNUP_ROLES), \"CUSTOMER\" as const),\n  phone: optional(nullable(string({ min: 5, max: 40 }))),\n});\n\nexport const loginSchema = object({\n  email: email(),\n  password: string({ min: 1, max: PASSWORD_MAX_LENGTH, trim: false }),\n});\n\n// --- Anfragen --------------------------------------------------------------\n\nexport const REQUEST_DESCRIPTION_MIN = 10;\nexport const REQUEST_DESCRIPTION_MAX = 4000;\n\nexport const createRequestSchema = refine(\n  object({\n    categoryId: optional(nullable(uuid())),\n    title: optional(nullable(string({ min: 3, max: 140 }))),\n    description: string({ min: REQUEST_DESCRIPTION_MIN, max: REQUEST_DESCRIPTION_MAX }),\n    urgency: withDefault(oneOf(URGENCIES), \"NORMAL\" as const),\n    latitude: optional(nullable(latitude())),\n    longitude: optional(nullable(longitude())),\n    locationLabel: optional(nullable(string({ min: 2, max: 140 }))),\n    desiredFrom: optional(nullable(isoDateTime())),\n    desiredTo: optional(nullable(isoDateTime())),\n  }),\n  (value) => {\n    // Eine halbe Koordinate ist wertlos - entweder beides oder nichts.\n    const hasLat = value.latitude !== null && value.latitude !== undefined;\n    const hasLon = value.longitude !== null && value.longitude !== undefined;\n    if (hasLat !== hasLon) return \"Bitte Breiten- und Längengrad gemeinsam angeben.\";\n    if (value.desiredFrom && value.desiredTo && value.desiredFrom > value.desiredTo) {\n      return \"Das Ende des Zeitraums liegt vor seinem Beginn.\";\n    }\n    return null;\n  },\n);\n\nexport const updateRequestSchema = object({\n  title: optional(nullable(string({ min: 3, max: 140 }))),\n  description: optional(string({ min: REQUEST_DESCRIPTION_MIN, max: REQUEST_DESCRIPTION_MAX })),\n  urgency: optional(oneOf(URGENCIES)),\n  categoryId: optional(nullable(uuid())),\n  locationLabel: optional(nullable(string({ min: 2, max: 140 }))),\n  desiredFrom: optional(nullable(isoDateTime())),\n  desiredTo: optional(nullable(isoDateTime())),\n});\n\nexport const answerQuestionSchema = object({\n  answer: string({ min: 1, max: 1000 }),\n});\n\n// --- KI --------------------------------------------------------------------\n\n/**\n * Schema für das, was ein KI-Provider zurückliefert.\n *\n * Wichtig: Auch die KI ist eine untrusted source. Ihr Ergebnis wird genauso\n * validiert wie eine Eingabe aus der App, bevor es in die Datenbank darf.\n */\nexport const aiAnalysisResultSchema = object({\n  categorySlug: nullable(string({ min: 1, max: 80, pattern: /^[a-z0-9-]+$/ })),\n  summary: string({ min: 3, max: 500 }),\n  urgency: withDefault(oneOf(URGENCIES), \"NORMAL\" as const),\n  questions: withDefault(array(string({ min: 3, max: 300 }), { max: 5 }), []),\n  confidence: number({ min: 0, max: 1 }),\n});\n\n// --- Unternehmen -----------------------------------------------------------\n\nexport const businessProfileSchema = object({\n  name: string({ min: 2, max: 140 }),\n  description: optional(nullable(string({ min: 10, max: 2000 }))),\n  latitude: optional(nullable(latitude())),\n  longitude: optional(nullable(longitude())),\n  serviceRadiusKm: withDefault(number({ min: 1, max: 300, int: true }), 30),\n});\n\nexport const businessServiceSchema = refine(\n  object({\n    categoryId: uuid(),\n    name: string({ min: 2, max: 140 }),\n    description: optional(nullable(string({ min: 5, max: 1000 }))),\n    priceMinCents: optional(nullable(number({ min: 0, max: 100_000_000, int: true }))),\n    priceMaxCents: optional(nullable(number({ min: 0, max: 100_000_000, int: true }))),\n  }),\n  (value) => {\n    if (\n      value.priceMinCents !== null &&\n      value.priceMinCents !== undefined &&\n      value.priceMaxCents !== null &&\n      value.priceMaxCents !== undefined &&\n      value.priceMinCents > value.priceMaxCents\n    ) {\n      return \"Der Mindestpreis darf nicht über dem Höchstpreis liegen.\";\n    }\n    return null;\n  },\n);\n\nconst TIME_PATTERN = /^([01]\\d|2[0-3]):[0-5]\\d$/;\n\nexport const availabilitySlotSchema = refine(\n  object({\n    weekday: number({ min: 0, max: 6, int: true }),\n    startTime: string({ pattern: TIME_PATTERN, patternMessage: \"Bitte im Format HH:MM angeben.\" }),\n    endTime: string({ pattern: TIME_PATTERN, patternMessage: \"Bitte im Format HH:MM angeben.\" }),\n  }),\n  (value) => (value.startTime >= value.endTime ? \"Das Ende muss nach dem Beginn liegen.\" : null),\n);\n\nexport const availabilityScheduleSchema = object({\n  slots: array(availabilitySlotSchema, { max: 40 }),\n});\n\n// --- Angebote --------------------------------------------------------------\n\nconst moneyCents = number({ min: 0, max: 100_000_000, int: true });\n\nexport const createOfferSchema = refine(\n  object({\n    requestId: uuid(),\n    laborCents: moneyCents,\n    materialCents: withDefault(moneyCents, 0),\n    travelCents: withDefault(moneyCents, 0),\n    description: string({ min: 10, max: 3000 }),\n    validUntil: isoDateTime(),\n    descriptionAiAssisted: withDefault(boolean(), false),\n  }),\n  (value) => {\n    const total = value.laborCents + value.materialCents + value.travelCents;\n    if (total <= 0) return \"Das Angebot muss einen Betrag größer als 0 enthalten.\";\n    if (total > 100_000_000) return \"Der Gesamtbetrag ist zu hoch.\";\n    return null;\n  },\n);\n\n// --- Termine ---------------------------------------------------------------\n\nexport const createAppointmentSchema = refine(\n  object({\n    offerId: uuid(),\n    startTime: isoDateTime(),\n    endTime: isoDateTime(),\n  }),\n  (value) => (value.startTime >= value.endTime ? \"Das Ende muss nach dem Beginn liegen.\" : null),\n);\n\n// --- Nachrichten -----------------------------------------------------------\n\nexport const sendMessageSc
