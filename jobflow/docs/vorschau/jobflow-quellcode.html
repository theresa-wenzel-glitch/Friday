 <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-go=\"bizoffer\">Angebot erstellen<\/button>\n    <button class=\"jf-btn jf-btn--ghost\" data-action=\"decline-request\">Ablehnen<\/button>\n  <\/div>`;\n};\n\n/* Screen 14 */\nscreens.bizoffer = () => {\n  const o = state.bizOffer;\n  const total = o.labor + o.material + o.travel;\n\n  return `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"bizrequest\">&larr;<\/button><span class=\"jf-topbar__title\">Angebot erstellen<\/span><\/div>\n    <div>\n      <label class=\"jf-label\" for=\"lab\">Arbeitskosten<\/label>\n      <input class=\"jf-input\" id=\"lab\" inputmode=\"decimal\" data-money=\"labor\" value=\"${(o.labor / 100).toFixed(0)}\">\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"mat\">Material<\/label>\n      <input class=\"jf-input\" id=\"mat\" inputmode=\"decimal\" data-money=\"material\" value=\"${(o.material / 100).toFixed(0)}\">\n    <\/div>\n    <div>\n      <label class=\"jf-label\" for=\"tra\">Anfahrt<\/label>\n      <input class=\"jf-input\" id=\"tra\" inputmode=\"decimal\" data-money=\"travel\" value=\"${(o.travel / 100).toFixed(0)}\">\n    <\/div>\n\n    <div class=\"jf-card\" style=\"background:var(--jf-primary-light)\">\n      <div class=\"jf-price__total\" style=\"border:none;padding:0\">\n        <dt style=\"font-size:13.5px;color:var(--jf-primary-dark)\">Gesamt<\/dt>\n        <dd style=\"color:var(--jf-primary-dark)\">${fmtEuroShort(total)}<\/dd>\n      <\/div>\n      <p class=\"jf-caption\" style=\"color:var(--jf-primary-dark)\">Wird serverseitig aus den drei Positionen berechnet.<\/p>\n    <\/div>\n\n    <div>\n      <label class=\"jf-label\" for=\"odesc\">Beschreibung<\/label>\n      <textarea class=\"jf-textarea\" id=\"odesc\" placeholder=\"Was ist im Angebot enthalten?\">${esc(o.description)}<\/textarea>\n      ${o.aiAssisted ? '<p class=\"jf-hint\" style=\"color:var(--jf-ai)\">Vorschlag der KI &mdash; du kannst ihn frei ändern.<\/p>' : \"\"}\n    <\/div>\n\n    <div class=\"jf-ai\">\n      <div class=\"jf-ai__head\"><span style=\"font-size:17px\">\\u{1F916}<\/span><span class=\"jf-ai__title\">Text vorschlagen<\/span><\/div>\n      <p class=\"jf-caption\">Die KI formuliert einen Entwurf. Über Preis und Inhalt entscheidest du.<\/p>\n      <button class=\"jf-btn jf-btn--secondary jf-btn--sm\" data-action=\"suggest-offer-text\">KI-Text vorschlagen<\/button>\n    <\/div>\n\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--primary\" data-action=\"send-offer\" ${total > 0 && o.description.trim().length > 9 ? \"\" : \"disabled\"}>Angebot senden<\/button>\n  <\/div>`;\n};\n\n/* Screen 15 */\nscreens.bizstats = () => `\n  <div class=\"screen\">\n    <div class=\"jf-topbar\"><button class=\"jf-back\" data-go=\"bizdashboard\">&larr;<\/button><span class=\"jf-topbar__title\">Statistik<\/span><\/div>\n    <h1 class=\"jf-h1\">Statistik<\/h1>\n    <div class=\"jf-card\">\n      ${bar(\"Anfragen\", 128, 128)}\n      ${bar(\"Angebote\", 87, 128)}\n      ${bar(\"Aufträge\", 42, 128)}\n    <\/div>\n    <div class=\"jf-tiles\">\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">67&nbsp;%<\/span><span class=\"jf-tile__label\">Angebotsquote<\/span><\/div>\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">48&nbsp;%<\/span><span class=\"jf-tile__label\">Aus Angebot wird Auftrag<\/span><\/div>\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">18&nbsp;Min.<\/span><span class=\"jf-tile__label\">Antwortzeit im Schnitt<\/span><\/div>\n      <div class=\"jf-tile\"><span class=\"jf-tile__value\">4,9<\/span><span class=\"jf-tile__label\">aus 238 Bewertungen<\/span><\/div>\n    <\/div>\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Was das bedeutet<\/p>\n      <p class=\"jf-muted\">\n        Von 128 vorgeschlagenen Anfragen hast du 87 beantwortet und 42 gewonnen.\n        Die Antwortzeit fließt direkt ins Matching ein &mdash; wer schneller antwortet,\n        wird häufiger vorgeschlagen.\n      <\/p>\n    <\/div>\n  <\/div>`;\n\nscreens.bizprofile = () => `\n  <div class=\"screen\">\n    <h1 class=\"jf-h1\">Unternehmen<\/h1>\n    <div class=\"jf-card\">\n      <div class=\"jf-row jf-row--between\">\n        <p class=\"jf-h2\">HeizPro Essen<\/p>\n        <span class=\"jf-badge jf-badge--success\">✓ Geprüft<\/span>\n      <\/div>\n      <p class=\"jf-muted\">Heizungsbau und Sanitär seit 1998.<\/p>\n      <p class=\"jf-caption\">\\u{1F4CD} 45127 Essen · Einsatzradius 40 km<\/p>\n    <\/div>\n\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Leistungen<\/p>\n      <div class=\"jf-row\" style=\"flex-wrap:wrap\">\n        <span class=\"jf-badge jf-badge--primary\">\\u{1F525} Heizung<\/span>\n        <span class=\"jf-badge jf-badge--primary\">\\u{1F6BF} Sanitär<\/span>\n        <button class=\"jf-badge\" data-action=\"noop\" style=\"border:1px dashed var(--jf-border);cursor:pointer\">+ Leistung<\/button>\n      <\/div>\n      <p class=\"jf-caption\">Ohne hinterlegte Leistung findet dich das Matching nicht.<\/p>\n    <\/div>\n\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Verfügbarkeit<\/p>\n      ${[[\"Montag\", \"08:00–12:00, 14:00–18:00\"], [\"Dienstag\", \"09:00–17:00\"], [\"Donnerstag\", \"08:00–16:00\"]]\n        .map(([d, t]) => `<div class=\"jf-row jf-row--between\"><span class=\"jf-muted\">${d}<\/span><span class=\"jf-body\" style=\"font-size:13.5px\">${t}<\/span><\/div>`).join(\"\")}\n      <p class=\"jf-caption\">Der Kunde sieht ausschließlich diese Zeiten.<\/p>\n    <\/div>\n\n    <div class=\"jf-card\">\n      <p class=\"jf-label\" style=\"margin:0\">Paket<\/p>\n      <div class=\"jf-row jf-row--between\">\n        <span class=\"jf-body\" style=\"font-weight:600\">Pro<\/span>\n        <span class=\"jf-badge jf-badge--primary\">29 €/Monat<\/span>\n      <\/div>\n      <p class=\"jf-caption\">Preis ist eine Hypothese &mdash; erst echte Nutzer zeigen die Zahlungsbereitschaft.<\/p>\n    <\/div>\n\n    <div class=\"jf-spacer\"><\/div>\n    <button class=\"jf-btn jf-btn--secondary\" data-action=\"logout\">Abmelden<\/button>\n  <\/div>`;\n\n/* ==========================================================================\n   7. Navigation und Ablaufkarte\n   ========================================================================== */\n\nconst FLOW = {\n  customer: [\n    { group: \"Einstieg\", items: [\n      { key: \"welcome\", no: \"01\", label: \"Willkommen\" },\n      { key: \"signup\", no: \"02\", label: \"Konto erstellen\" },\n      { key: \"home\", no: \"03\", label: \"Startseite\" }\n    ]},\n    { group: \"Anfrage\", items: [\n      { key: \"create\", no: \"04\", label: \"Anfrage erstellen\" },\n      { key: \"questions\", no: \"05\", label: \"KI-Analyse und Rückfragen\", needs: \"analysis\" },\n      { key: \"summary\", no: \"06\", label: \"Anfrage prüfen\", needs: \"analysis\" }\n    ]},\n    { group: \"Vermittlung\", items: [\n      { key: \"matches\", no: \"07\", label: \"Passende Anbieter\", needs: \"matches\" },\n      { key: \"offers\", no: \"08\", label: \"Angebote\", needs: \"offers\" },\n      { key: \"offer\", no: \"09\", label: \"Angebot im Detail\", needs: \"offers\" }\n    ]},\n    { group: \"Auftrag\", items: [\n      { key: \"appointment\", no: \"10\", label: \"Termin wählen\", needs: \"accepted\" },\n      { key: \"job\", no: \"11\", label: \"Auftragsstatus\", needs: \"accepted\" },\n      { key: \"chat\", no: \"12\", label: \"Chat\", needs: \"offers\" },\n      { key: \"review\", no: \"13\", label: \"Bewertung\", needs: \"completed\" }\n    ]},\n    { group: \"Weiteres\", items: [\n      { key: \"requests\", no: \"14\", label: \"Meine Anfragen\" },\n      { key: \"profile\", no: \"15\", label: \"Profil\" }\n    ]}\n  ],\n  business: [\n    { group: \"Überblick\", items: [\n      { key: \"bizdashboard\", no: \"01\", label: \"Dashboard\" },\n      { key: \"bizstats\", no: \"02\", label: \"Statistik\" }\n    ]},\n    { group: \"Anfrage bearbeiten\", items: [\n      { key: \"bizrequest\", no: \"03\", label: \"Anfrage mit KI-Zusammenfassung\" },\n      { key: \"bizoffer\", no: \"04\", label: \"Angebot erstellen\" },\n      { key: \"chat\", no: \"05\", label: \"Chat mit KI-Vorschlag\" }\n    ]},\n    { group: \"Betrieb\", items: [\n      { key: \"bizprofile\", no: \"06\", label: \"Unternehmensprofil\" }\n    ]}\n  ]\n};\n\nconst NAV = {\n  customer: [\n    { key: \"home\", icon: \"\\u{1F3E0}\", label: \"Start\" },\n    { key: \"requests\", icon: \"\\u{1F4CB}\", label: \"Anfragen\" },\n    { key: \"create\", icon: \"+\", label: \"Neu\", fab: true },\n    { key: \"chat\", icon: \"\\u{1F4AC}\", label: \"Chat\" },\n    { key: \"profile\", icon: \"\\u{1F464}\", label: \"Profil\" }\n  ],\n  business: [\n    { key: \"bizdashboard\", icon: \"\\u{1F4CA}\", label: \"Dashboard\" },\n    { key: \"bizrequest\", icon: \"\\u{1F4CB}\", label: \"Anfragen\" },\n    { key: \"chat\", icon: \"\\u{1F4AC}\", label: \"Chat\" },\n    { key: \"bizprofile\", icon: \"\\u{1F3E2}\", label: \"Profil\" }\n  ]\n};\n\n/* Screens ohne untere Leiste - dort ist die Navigation Teil des Ablaufs. */\nconst NAV_HIDDEN = new Set([\"welcome\", \"signup\", \"login\", \"analyzing\"]);\n\nfunction reachable(key) {\n  const requirement = {\n    questions: () => Boolean(state.analysis),\n    summary: () => Boolean(state.analysis),\n    matches: () => state.matches.length > 0,\n    offers: () => state.offers.length > 0,\n    offer: () => state.offers.length > 0,\n    appointment: () => Boolean(state.acceptedOfferId),\n    job: () => Boolean(state.acceptedOfferId),\n    review: () => state.jobStatus === \"COMPLETED\",\n    detail: () => Boolean(state.request)\n  }[key];\n  return requirement ? requirement() : true;\n}\n\n/* ==========================================================================\n   8. Rendern\n   ========================================================================== */\n\nconst viewport = document.getElementById(\"viewport\");\nconst navEl = document.getElementById(\"nav\");\nconst flowmapEl = document.getElementById(\"flowmap\");\nconst rolesEl = document.getElementById(\"roles\");\nconst logEl = document.getElementById(\"log\");\nconst captionEl = document.getElementById(\"caption\");\nconst progressEl = document.getElementById(\"progress\");\n\nfunction render() {\n  const screen = screens[state.screen] || screens.welcome;\n  viewport.innerHTML = screen() + (state.toast ? `<div class=\"jf-toast\">${esc(state.toast)}<\/div>` : \"\");\n\n  const items = NAV[state.role];\n  if (NAV_HIDDEN.has(state.screen)) {\n    navEl.style.display = \"none\";\n  } else {\n    navEl.style.display = \"flex\";\n    navEl.innerHTML = items.map((item) => `\n      <button class=\"jf-nav__item ${item.fab ? \"jf-nav__item--fab\" : \"\"} ${state.screen === item.key ? \"is-active\" : \"\"}\"\n        data-go=\"${item.key}\">\n        <span class=\"jf-nav__icon\">${item.icon}<\/span>\n        <span>${item.label}<\/span>\n      <\/button>`).join(\"\");\n  }\n\n  renderConsole();\n}\n\nfunction renderConsole() {\n  rolesEl.innerHTML = `\n    <button class=\"role\" data-action=\"role\" data-value=\"customer\" aria-pressed=\"${state.role === \"customer\"}\">\n      <span class=\"role__name\">Kunde<\/span>\n      <span class=\"role__desc\">Problem beschreiben, Angebote vergleichen, Termin buchen.<\/span>\n    <\/button>\n    <button class=\"role\" data-action=\"role\" data-value=\"business\" aria-pressed=\"${state.role === \"business\"}\">\n      <span class=\"role__name\">Unternehmen<\/span>\n      <span class=\"role__desc\">Anfragen erhalten, Angebot schreiben, Auftrag gewinnen.<\/span>\n    <\/button>`;\n\n  const groups = FLOW[state.role];\n  flowmapEl.innerHTML = groups.map((g) => `\n    <div class=\"flowmap__group\">${g.group}<\/div>\n    ${g.items.map((item) => {\n      const open = reachable(item.key);\n      return `\n        <button class=\"step ${state.screen === item.key ? \"is-current\" : \"\"}\" data-go=\"${item.key}\">\n          <span class=\"step__no\">${item.no}<\/span>\n          <span>${item.label}<\/span>\n          ${open && item.needs ? '<span class=\"step__done\">✓<\/span>' : \"\"}\n        <\/button>`;\n    }).join(\"\")}`).join(\"\");\n\n  const total = groups.reduce((sum, g) => sum + g.items.length, 0);\n  const seen = groups.reduce((sum, g) => sum + g.items.filter((i) => reachable(i.key)).length, 0);\n  progressEl.textContent = seen + \" von \" + total + \" erreichbar\";\n\n  logEl.innerHTML = state.log.length === 0\n    ? '<div class=\"log__empty\" style=\"padding:0\">Noch nichts passiert. Tipp auf einen Button im Telefon.<\/div>'\n    : state.log.slice().reverse().map((e) => `\n        <div class=\"log__row\">\n          <span class=\"log__verb log__verb--${e.verb}\">${e.verb}<\/span>\n          <span class=\"log__path\">${esc(e.path)}<\/span>\n          <span class=\"log__status\">${e.status}<\/span>\n        <\/div>`).join(\"\");\n\n  const current = groups.flatMap((g) => g.items).find((i) => i.key === state.screen);\n  captionEl.innerHTML = current\n    ? `<b>${current.no}<\/b> &nbsp;${esc(current.label)}`\n    : \"&nbsp;\";\n}\n\n/* ==========================================================================\n   9. Aktionen\n   ========================================================================== */\n\nconst val = (id) => { const el = document.getElementById(id); return el ? el.value : \"\"; };\n\nconst actions = {\n  role(value) {\n    state.role = value;\n    state.screen = value === \"business\" ? \"bizdashboard\" : (state.request ? \"home\" : \"welcome\");\n  },\n\n  \"as-business\"() {\n    state.role = \"business\";\n    state.screen = \"bizdashboard\";\n    logCall(\"POST\", \"/auth/login\", 200);\n  },\n\n  \"signup-role\"(value) { state.signupRole = value; },\n\n  \"do-signup\"() {\n    logCall(\"POST\", \"/auth/register\", 201);\n    if (state.signupRole === \"BUSINESS\") {\n      state.role = \"business\";\n      state.screen = \"bizdashboard\";\n    } else {\n      state.role = \"customer\";\n      state.screen = \"home\";\n    }\n  },\n\n  \"do-login\"() {\n    logCall(\"POST\", \"/auth/login\", 200);\n    state.screen = state.role === \"business\" ? \"bizdashboard\" : \"home\";\n  },\n\n  logout() {\n    logCall(\"POST\", \"/auth/logout\", 200);\n    const log = state.log;\n    state = initialState();\n    state.log = log;\n  },\n\n  \"add-photo\"() {\n    if (state.draft.photos >= 3) { toast(\"Mehr als drei Fotos braucht es selten.\"); return; }\n    state.draft.photos += 1;\n    if (state.screen === \"home\") state.screen = \"create\";\n    toast(\"Foto hinzugefügt. Ein Bild ersetzt oft eine Rückfrage.\");\n  },\n\n  \"pick-category\"(value) {\n    state.draft.categoryHint = value;\n    state.screen = \"create\";\n    logCall(\"GET\", \"/categories\", 200);\n  },\n\n  \"set-urgency\"(value) { state.draft.urgency = value; },\n\n  \"submit-request\"() {\n    const description = val(\"desc\").trim();\n    if (description.length < 10) {\n      toast(\"Bitte beschreibe dein Anliegen in mindestens 10 Zeichen.\");\n      return;\n    }\n    state.draft.description = description;\n    state.draft.locationLabel = val(\"loc\").trim() || \"45127 Essen\";\n    state.request = {\n      description,\n      locationLabel: state.draft.locationLabel,\n      urgency: state.draft.urgency,\n      categorySlug: null,\n      status: \"DRAFT\"\n    };\n    state.analysis = null;\n    state.answers = {};\n    state.matches = [];\n    state.offers = [];\n    state.acceptedOfferId = null;\n    logCall(\"POST\", \"/requests\", 201);\n    actions[\"run-analysis\"]();\n  },\n\n  \"run-analysis\"() {\n    state.screen = \"analyzing\";\n    render();\n    logCall(\"POST\", \"/requests/:id/analyze\", 201);\n\n    // Die Schritte laufen sichtbar durch - das ist der charakteristische\n    // Moment des Produkts und soll nicht in einem Sprung verschwinden.\n    const steps = viewport.querySelectorAll(\".jf-thinking__step\");\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    const delay = reduce ? 60 : 420;\n    steps.forEach((step, i) => window.setTimeout(() => step.classList.add(\"is-on\"), delay * (i + 1)));\n\n    window.setTimeout(() => {\n      const answered = Object.entries(state.answers).map(([question, answer]) => ({ question, answer }));\n      state.analysis = analyze(state.request.description, state.draft.photos, answered);\n      state.request.categorySlug = state.analysis.categorySlug;\n      state.request.urgency = state.analysis.urgency;\n      state.request.status = \"ANALYZING\";\n      state.screen = \"questions\";\n      render();\n    }, delay * 3 + (reduce ? 40 : 400));\n  },\n\n  \"answer-questions\"() {\n    let count = 0;\n    viewport.querySelectorAll(\"[data-question]\").forEach((input) => {\n      const answer = input.value.trim();\n      if (answer.length > 0) {\n        state.answers[input.getAttribute(\"data-question\")] = answer;\n        count += 1;\n        logCall(\"POST\", \"/requests/:id/questions/:questionId\", 201);\n      }\n    });\n    if (count === 0) { toast(\"Beantworte mindestens eine Frage oder überspring den Schritt.\"); return; }\n    state.request.status = \"OPEN\";\n    state.screen = \"summary\";\n  },\n\n  \"find-providers\"() {\n    state.matches = runMatching(state.analysis ? state.analysis.categorySlug : null);\n    logCall(\"POST\", \"/requests/:id/matches\", 201);\n    state.request.status = state.matches.length > 0 ? \"MATCHING\" : \"OPEN\";\n    state.screen = \"matches\";\n    if (state.matches.length === 0) toast(\"In dieser Kategorie ist noch kein Betrieb registriert.\");\n  },\n\n  \"request-offers\"() {\n    state.offers = state.matches.slice(0, 3).map((m) => offerFor(m.business));\n    state.offers.sort((a, b) => offerTotal(a) - offerTotal(b));\n    state.offers.forEach(() => logCall(\"POST\", \"/offers\", 201));\n    logCall(\"GET\", \"/requests/:id/offers\", 200);\n    state.request.status = \"OFFERED\";\n    state.screen = \"offers\";\n    state.messages = [];\n  },\n\n  \"open-offer\"(value) {\n    state.openedOfferId = value;\n    state.screen = \"offer\";\n    logCall(\"GET\", \"/offers/:id\", 200);\n  },\n\n  \"accept-offer\"(value) {\n    state.offers.forEach((o) => { o.status = o.id === value ? \"ACCEPTED\" : \"DECLINED\"; });\n    state.acceptedOfferId = value;\n    state.request.status = \"ACCEPTED\";\n    state.jobStatus = \"SCHEDULED\";\n    logCall(\"POST\", \"/offers/:id/accept\", 201);\n    state.screen = \"appointment\";\n    toast(\"Angebot angenommen. Jetzt fehlt nur noch der Termin.\");\n  },\n\n  \"decline-offer\"(value) {\n    const offer = offerById(value);\n    if (offer) offer.status = \"DECLINED\";\n    logCall(\"POST\", \"/offers/:id/decline\", 201);\n    state.screen = \"offers\";\n  },\n\n  \"pick-day\"(value) {\n    state.appointment = { key: value, time: null, confirmed: false };\n    logCall(\"GET\", \"/businesses/:id/availability\", 200);\n  },\n\n  \"pick-time\"(value) {\n    if (!state.appointment) return;\n    state.appointment.time = value;\n  },\n\n  \"confirm-appointment\"() {\n    if (!state.appointment || !state.appointment.time) return;\n    state.appointment.confirmed = true;\n    logCall(\"POST\", \"/appointments\", 201);\n    state.screen = \"job\";\n    toast(\"Termin bestätigt. Du bekommst eine Erinnerung.\");\n  },\n\n  \"simulate-completion\"() {\n    state.jobStatus = \"COMPLETED\";\n    state.request.status = \"COMPLETED\";\n    logCall(\"PATCH\", \"/jobs/:id/status\", 200);\n    toast(\"Der Betrieb hat den Auftrag als erledigt gemeldet.\");\n  },\n\n  rate(value) { state.reviewDraft = Number(value); },\n\n  \"submit-review\"() {\n    if (!state.reviewDraft) return;\n    state.review = { rating: state.reviewDraft, text: val(\"rev\").trim() };\n    logCall(\"POST\", \"/reviews\", 201);\n    state.screen = \"job\";\n    toast(\"Danke für deine Bewertung.\");\n  },\n\n  \"send-message\"() {\n    const text = val(\"msg\").trim();\n    if (text.length === 0) return;\n    const time = new Date().toLocaleTimeString(\"de-DE\", { hour: \"2-digit\", minute: \"2-digit\" });\n    state.messages.push({ text, mine: true, time, ai: state.pendingAi === text });\n    state.pendingAi = null;\n    state.msgDraft = \"\";\n    logCall(\"POST\", \"/conversations/:id/messages\", 201);\n\n    // Eine Antwort der Gegenseite, damit der Verlauf lebendig wirkt.\n    window.setTimeout(() => {\n      const reply = state.role === \"customer\"\n        ? \"Wir könnten am Dienstag um 16 Uhr vorbeikommen. Passt das?\"\n        : \"Ja, Dienstag um 16 Uhr passt gut. Bis dann!\";\n      state.messages.push({ text: reply, mine: false, time, ai: false });\n      render();\n    }, 900);\n  },\n\n  \"suggest-reply\"() {\n    const text = \"Hallo Max, vielen Dank für Ihre Nachricht. Wir könnten am Dienstag um 16 Uhr vorbeikommen.\";\n    state.msgDraft = text;\n    state.pendingAi = text;\n    logCall(\"POST\", \"/conversations/:id/suggest-reply\", 201);\n    toast(\"Vorschlag eingefügt. Du kannst ihn ändern, bevor du sendest.\");\n  },\n\n  \"decline-request\"() {\n    state.bizDeclined = true;\n    logCall(\"POST\", \"/matches/:id/respond\", 201);\n    state.screen = \"bizdashboard\";\n    toast(\"Anfrage abgelehnt. Sie wird dir nicht erneut vorgeschlagen.\");\n  },\n\n  \"suggest-offer-text\"() {\n    const summary = state.analysis ? state.analysis.summary : \"Die Heizung arbeitet nicht wie erwartet.\";\n    state.bizOffer.description =\n      \"Vielen Dank für Ihre Anfrage. Wir kümmern uns um folgendes Anliegen: \" + summary +\n      \" Das Angebot umfasst Anfahrt, Arbeitszeit und das benötigte Material. Sollte sich vor Ort \" +\n      \"ein größerer Aufwand zeigen, stimmen wir uns vorher mit Ihnen ab.\";\n    state.bizOffer.aiAssisted = true;\n    logCall(\"POST\", \"/offers/suggest-text\", 201);\n    toast(\"Vorschlag eingefügt. Preis und Inhalt bleiben deine Entscheidung.\");\n  },\n\n  \"send-offer\"() {\n    state.bizOffer.description = val(\"odesc\").trim();\n    logCall(\"POST\", \"/offers\", 201);\n    state.screen = \"bizdashboard\";\n    toast(\"Angebot gesendet. Der Kunde sieht es sofort in seiner App.\");\n  },\n\n  noop() {}\n};\n\n/* --- Ereignisse ----------------------------------------------------------- */\n\ndocument.addEventListener(\"click\", (event) => {\n  const target = event.target.closest(\"[data-go], [data-action]\");\n  if (!target) return;\n\n  // Ein Hinweis gehört zu der Aktion, die ihn ausgelöst hat. Beim Wechsel\n  // des Screens ist er nicht mehr richtig und wird verworfen.\n  state.toast = null;\n  window.clearTimeout(toast._t);\n\n  const go = target.getAttribute(\"data-go\");\n  if (go) {\n    if (!reachable(go)) {\n      toast(\"Diesen Schritt gibt es erst später im Ablauf.\");\n      render();\n      return;\n    }\n    // Zustandsabhängige Umleitung: \"Anfragen\" führt zur Detailansicht,\n    // sobald eine Anfrage existiert.\n    state.screen = go === \"create\" && state.request && state.offers.length > 0 ? \"requests\" : go;\n    if (go === \"offers\" && state.offers.length === 0) state.screen = \"requests\";\n    render();\n    return;\n  }\n\n  const action = target.getAttribute(\"data-action\");\n  const handler = actions[action];\n  if (handler) {\n    handler(target.getAttribute(\"data-value\"));\n    render();\n  }\n});\n\n/* Eingaben zwischenspeichern, damit ein Neuzeichnen sie nicht verwirft. */\ndocument.addEventListener(\"input\", (event) => {\n  const el = event.target;\n  if (el.id === \"msg\") { state.msgDraft = el.value; return; }\n  if (el.id === \"odesc\") { state.bizOffer.description = el.value; return; }\n  if (el.id === \"desc\") { state.draft.description = el.value; return; }\n\n  const money = el.getAttribute && el.getAttribute(\"data-money\");\n  if (money) {\n    const euros = Number(String(el.value).replace(\",\", \".\"));\n    state.bizOffer[money] = Number.isFinite(euros) && euros >= 0 ? Math.round(euros * 100) : 0;\n    // Nur die Summe neu zeichnen, damit der Cursor im Feld bleibt.\n    const total = state.bizOffer.labor + state.bizOffer.material + state.bizOffer.travel;\n    const totalEl = viewport.querySelector(\".jf-price__total dd\");\n    if (totalEl) totalEl.textContent = fmtEuroShort(total);\n    const send = viewport.querySelector('[data-action=\"send-offer\"]');\n    if (send) send.disabled = !(total > 0 && state.bizOffer.description.trim().length > 9);\n  }\n});\n\n/* --- Steuerung ------------------------------------------------------------ */\n\ndocument.getElementById(\"reset\").addEventListener(\"click\", () => {\n  state = initialState();\n  render();\n});\n\nconst themeToggle = document.getElementById(\"themeToggle\");\nfunction currentlyDark() {\n  const stamped = document.documentElement.getAttribute(\"data-theme\");\n  if (stamped) return stamped === \"dark\";\n  return window.matchMedia(\"(prefers-color-scheme: dark)\").matches;\n}\nfunction syncToggleLabel() {\n  themeToggle.textContent = currentlyDark() ? \"Hell\" : \"Dunkel\";\n}\nthemeToggle.addEventListener(\"click\", () => {\n  document.documentElement.setAttribute(\"data-theme\", currentlyDark() ? \"light\" : \"dark\");\n  syncToggleLabel();\n});\nwindow.matchMedia(\"(prefers-color-scheme: dark)\").addEventListener(\"change\", syncToggleLabel);\nsyncToggleLabel();\n\n/* Die Uhr im Statusbalken zeigt die echte Zeit - eine eingefrorene 9:41\n   fällt sofort als Attrappe auf. */\nfunction tick() {\n  document.getElementById(\"clock\").textContent =\n    new Date().toLocaleTimeString(\"de-DE\", { hour: \"2-digit\", minute: \"2-digit\" });\n}\ntick();\nwindow.setInterval(tick, 30000);\n\nrender();\n<\/script>\n"}]</script>
<script>
"use strict";

const DATEIEN = JSON.parse(document.getElementById("quellcode").textContent);

/* Was in jedem Bereich passiert - der Baum ist nach der Architektur gruppiert,
   nicht alphabetisch, damit die Reihenfolge etwas über den Code aussagt. */
const BEREICHE = [
  ["Projekt", "Einstieg, Werkstatteinrichtung und die gemeinsame Konfiguration."],
  ["Datenbank", "Das PostgreSQL-Schema als Migrationen, dazu Seeds und der Migrationslauf."],
  ["Backend", "Modularer Monolith: eine Anwendung, innen nach Fachbereichen getrennt."],
  ["Geteilte Pakete", "Typen, Validierung und Design-Tokens - von App und Backend gemeinsam genutzt."],
  ["Mobile-App", "React Native mit Expo Router. Eine Codebasis, zwei Oberflächen."],
  ["Weitere Apps", "Web und Administration - noch nicht gebaut, mit Begründung."],
  ["Dokumentation", "Konzept, Architektur, API und die klickbare Vorschau."],
];

/* Ab dieser Größe wird nicht mehr eingefärbt - sonst hängt die Seite. */
const HIGHLIGHT_GRENZE = 70 * 1024;

const el = {
  groups: document.getElementById("groups"),
  filter: document.getElementById("filter"),
  path: document.getElementById("path"),
  meta: document.getElementById("meta"),
  code: document.getElementById("code"),
  gutter: document.getElementById("gutter"),
  notice: document.getElementById("notice"),
  stat: document.getElementById("stat"),
  copyBtn: document.getElementById("copyBtn"),
  themeBtn: document.getElementById("themeBtn"),
};

let aktiv = DATEIEN[0];

const zahl = (n) => n.toLocaleString("de-DE");

el.stat.textContent =
  `${zahl(DATEIEN.length)} Dateien · ${zahl(DATEIEN.reduce((s, d) => s + d.zeilen, 0))} Zeilen`;

function esc(text) {
  return text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

/* ==========================================================================
   Einfärbung

   Bewusst selbst geschrieben statt eine Bibliothek zu laden: die Seite soll
   auch offline und ohne Netzzugriff vollständig funktionieren. Für eine reine
   Leseansicht reicht ein einziger Durchlauf, bei dem Kommentare und
   Zeichenketten Vorrang haben - damit ein "//" innerhalb einer Zeichenkette
   nicht fälschlich einen Kommentar beginnt.
   ========================================================================== */

const SCHLUESSELWORTE_TS = new Set(("await async break case catch class const continue default delete do else " +
  "enum export extends false finally for from function get if implements import in instanceof interface let new " +
  "null of private protected public readonly return satisfies set static super switch this throw true try type " +
  "typeof undefined var void while yield as declare namespace abstract override keyof infer is").split(" "));

const SCHLUESSELWORTE_SQL = new Set(("select from where insert into values update set delete create table alter drop " +
  "index unique primary key foreign references on default not null check constraint and or as join left right inner " +
  "outer group by order having limit offset returning conflict do nothing begin commit rollback function returns " +
  "language declare if then else end loop return trigger before after each row execute cascade restrict exists " +
  "case when distinct union all with generated always stored partial timestamptz uuid text integer boolean numeric " +
  "smallint bigserial jsonb time date double precision interval").split(" "));

const SCHLUESSELWORTE_YAML = new Set(["true", "false", "null"]);

/** Ein Durchlauf über den Text; Treffer werden gefärbt, alles dazwischen bleibt roh. */
function faerbeAllgemein(text, opt) {
  const teile = [];
  const muster = new RegExp([
    opt.blockKommentar ? "\\/\\*[\\s\\S]*?\\*\\/" : null,
    opt.zeilenKommentar,
    "`(?:\\\\[\\s\\S]|[^\\\\`])*`",
    '"(?:\\\\[\\s\\S]|[^\\\\"\\n])*"',
    "'(?:\\\\[\\s\\S]|[^\\\\'\\n])*'",
    "\\b\\d[\\d_]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?\\b",
    "[A-Za-z_$][\\w$]*",
  ].filter(Boolean).join("|"), "g");

  let zuletzt = 0;
  let treffer;
  while ((treffer = muster.exec(text)) !== null) {
    const wert = treffer[0];
    teile.push(esc(text.slice(zuletzt, treffer.index)));
    zuletzt = treffer.index + wert.length;

    const erstes = wert[0];
    if (wert.startsWith("/*") || wert.startsWith("//") || wert.startsWith("--") || (erstes === "#" && opt.rauteKommentar)) {
      teile.push(`<span class="t-com">${esc(wert)}</span>`);
    } else if (erstes === '"' || erstes === "'" || erstes === "`") {
      // In JSON und YAML ist eine Zeichenkette vor einem Doppelpunkt ein Schlüssel.
      const rest = text.slice(zuletzt);
      const istSchluessel = opt.schluesselErkennen && /^\s*:/.test(rest);
      teile.push(`<span class="${istSchluessel ? "t-attr" : "t-str"}">${esc(wert)}</span>`);
    } else if (/^\d/.test(wert)) {
      teile.push(`<span class="t-num">${esc(wert)}</span>`);
    } else {
      const klein = wert.toLowerCase();
      if (opt.schluesselworte.has(opt.ignoriereGross ? klein : wert)) {
        teile.push(`<span class="t-key">${esc(wert)}</span>`);
      } else if (/^\s*\(/.test(text.slice(zuletzt))) {
        teile.push(`<span class="t-fn">${esc(wert)}</span>`);
      } else if (/^[A-Z]/.test(wert) && wert.length > 1) {
        teile.push(`<span class="t-typ">${esc(wert)}</span>`);
      } else {
        teile.push(esc(wert));
      }
    }
  }
  teile.push(esc(text.slice(zuletzt)));
  return teile.join("");
}

function faerbeMarkdown(text) {
  let imBlock = false;
  return text.split("\n").map((zeile) => {
    if (/^\s*```/.test(zeile)) {
      imBlock = !imBlock;
      return `<span class="t-com">${esc(zeile)}</span>`;
    }
    if (imBlock) return `<span class="t-str">${esc(zeile)}</span>`;
    if (/^#{1,6}\s/.test(zeile)) return `<span class="t-fn t-strong">${esc(zeile)}</span>`;
    if (/^\s*>/.test(zeile)) return `<span class="t-com">${esc(zeile)}</span>`;

    let aus = esc(zeile);
    aus = aus.replace(/`([^`]+)`/g, '<span class="t-str">`$1`</span>');
    aus = aus.replace(/\*\*([^*]+)\*\*/g, '<span class="t-strong">**$1**</span>');
    aus = aus.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="t-link">[$1]($2)</span>');
    aus = aus.replace(/^(\s*[-*|]\s)/, '<span class="t-num">$1</span>');
    return aus;
  }).join("\n");
}

function faerbeHtml(text) {
  const teile = [];
  const muster = /<!--[\s\S]*?-->|<\/?[A-Za-z][\w-]*|"[^"\n]*"|'[^'\n]*'|[A-Za-z-]+(?==)|\/?>/g;
  let zuletzt = 0;
  let treffer;
  while ((treffer = muster.exec(text)) !== null) {
    const wert = treffer[0];
    teile.push(esc(text.slice(zuletzt, treffer.index)));
    zuletzt = treffer.index + wert.length;
    if (wert.startsWith("<!--")) teile.push(`<span class="t-com">${esc(wert)}</span>`);
    else if (wert[0] === '"' || wert[0] === "'") teile.push(`<span class="t-str">${esc(wert)}</span>`);
    else if (wert[0] === "<" || wert.endsWith(">")) teile.push(`<span class="t-key">${esc(wert)}</span>`);
    else teile.push(`<span class="t-attr">${esc(wert)}</span>`);
  }
  teile.push(esc(text.slice(zuletzt)));
  return teile.join("");
}

function faerbe(text, sprache) {
  switch (sprache) {
    case "markdown":
      return faerbeMarkdown(text);
    case "xml":
      return faerbeHtml(text);
    case "sql":
      return faerbeAllgemein(text, {
        blockKommentar: true, zeilenKommentar: "--[^\\n]*",
        schluesselworte: SCHLUESSELWORTE_SQL, ignoriereGross: true,
      });
    case "json":
      return faerbeAllgemein(text, {
        blockKommentar: false, zeilenKommentar: null,
        schluesselworte: SCHLUESSELWORTE_YAML, ignoriereGross: true,
        schluesselErkennen: true,
      });
    case "yaml":
    case "bash":
      return faerbeAllgemein(text, {
        blockKommentar: false, zeilenKommentar: "#[^\\n]*", rauteKommentar: true,
        schluesselworte: SCHLUESSELWORTE_YAML, ignoriereGross: true,
      });
    default:
      return faerbeAllgemein(text, {
        blockKommentar: true, zeilenKommentar: "\\/\\/[^\\n]*",
        schluesselworte: SCHLUESSELWORTE_TS, ignoriereGross: false,
      });
  }
}

/** Verzeichnis und Dateiname getrennt darstellen - der Name trägt die Information. */
function pfadMarkup(pfad) {
  const i = pfad.lastIndexOf("/");
  if (i === -1) return `<span>${esc(pfad)}</span>`;
  return `<span class="file__dir">${esc(pfad.slice(0, i + 1))}</span><span>${esc(pfad.slice(i + 1))}</span>`;
}

function baumZeichnen(suche = "") {
  const begriff = suche.trim().toLowerCase();
  const treffer = begriff === ""
    ? DATEIEN
    : DATEIEN.filter((d) => d.pfad.toLowerCase().includes(begriff));

  if (treffer.length === 0) {
    el.groups.innerHTML = `<p class="tree__empty">Keine Datei enthält „${esc(suche)}".</p>`;
    return;
  }

  el.groups.innerHTML = BEREICHE.map(([name, hinweis]) => {
    const dateien = treffer.filter((d) => d.bereich === name);
    if (dateien.length === 0) return "";
    return `
      <section class="group">
        <div class="group__head">
          <span class="group__name">${name}</span>
          <span class="group__count">${dateien.length}</span>
        </div>
        ${begriff === "" ? `<p class="group__hint">${hinweis}</p>` : ""}
        ${dateien.map((d) => `
          <button class="file ${d === aktiv ? "is-active" : ""}" data-pfad="${esc(d.pfad)}">
            ${pfadMarkup(kurz(d))}
          </button>`).join("")}
      </section>`;
  }).join("");
}

/** Im Baum reicht der Pfad ab dem Bereichsordner. */
function kurz(datei) {
  const p = datei.pfad;
  for (const praefix of ["services/api/", "apps/mobile/", "packages/", "database/", "docs/", "apps/"]) {
    if (p.startsWith(praefix)) return p.slice(praefix.length);
  }
  return p;
}

function dateiZeigen(datei) {
  aktiv = datei;
  el.path.innerHTML = pfadMarkup(datei.pfad);
  el.meta.textContent = `${zahl(datei.zeilen)} Zeilen · ${zahl(Math.round(datei.bytes / 1024 * 10) / 10)} KB`;

  const grossDatei = datei.bytes > HIGHLIGHT_GRENZE;
  if (grossDatei) {
    el.notice.hidden = false;
    el.notice.textContent =
      "Diese Datei ist zu groß zum Einfärben - sie wird unverändert angezeigt.";
    el.code.textContent = datei.inhalt;
  } else {
    el.notice.hidden = true;
    try {
      el.code.innerHTML = faerbe(datei.inhalt, datei.sprache);
    } catch {
      // Lieber roher Text als eine leere Fläche.
      el.code.textContent = datei.inhalt;
    }
  }

  el.gutter.innerHTML = Array.from({ length: datei.zeilen }, (_, i) => `<span>${i + 1}</span>`).join("");

  document.querySelectorAll(".file").forEach((btn) => {
    btn.classList.toggle("is-active", btn.getAttribute("data-pfad") === datei.pfad);
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}

el.groups.addEventListener("click", (event) => {
  const btn = event.target.closest(".file");
  if (btn === null) return;
  const datei = DATEIEN.find((d) => d.pfad === btn.getAttribute("data-pfad"));
  if (datei !== undefined) dateiZeigen(datei);
});

el.filter.addEventListener("input", () => baumZeichnen(el.filter.value));
el.filter.addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  const erste = el.groups.querySelector(".file");
  if (erste !== null) erste.click();
});

let toastTimer = 0;
function toast(text) {
  const alt = document.querySelector(".toast");
  if (alt !== null) alt.remove();
  const node = document.createElement("div");
  node.className = "toast";
  node.setAttribute("role", "status");
  node.textContent = text;
  document.body.appendChild(node);
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => node.remove(), 2600);
}

el.copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(aktiv.inhalt);
    toast(`${aktiv.pfad} in die Zwischenablage kopiert.`);
  } catch {
    // In manchen Browsern ist der Zugriff auf die Zwischenablage gesperrt.
    // Dann hilft nur der Hinweis, den Text von Hand zu markieren.
    toast("Der Browser lässt das Kopieren nicht zu. Bitte den Text markieren und mit Strg+C kopieren.");
  }
});

function istDunkel() {
  const gesetzt = document.documentElement.getAttribute("data-theme");
  if (gesetzt) return gesetzt === "dark";
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function knopfBeschriften() { el.themeBtn.textContent = istDunkel() ? "Hell" : "Dunkel"; }
el.themeBtn.addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", istDunkel() ? "light" : "dark");
  knopfBeschriften();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", knopfBeschriften);
knopfBeschriften();

baumZeichnen();
dateiZeigen(aktiv);
</script>
