d = false;\n      setLoading(true);\n      void (async () => {\n        try {\n          if (isBusiness) {\n            const found = await api.get<Match[]>(\"/businesses/me/matches\");\n            if (!cancelled) setMatches(found);\n          } else {\n            const page = await api.get<{ items: ServiceRequest[] }>(\"/requests?limit=50\");\n            if (!cancelled) setRequests(page.items);\n          }\n        } catch {\n          if (!cancelled) {\n            setRequests([]);\n            setMatches([]);\n          }\n        } finally {\n          if (!cancelled) setLoading(false);\n        }\n      })();\n      return () => {\n        cancelled = true;\n      };\n    }, [isBusiness]),\n  );\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  if (isBusiness) {\n    return (\n      <Screen>\n        <Text style={styles.title}>Neue Anfragen<\/Text>\n        {matches.length === 0 ? (\n          <Empty\n            title=\"Noch keine Anfragen\"\n            hint=\"Sobald eine passende Anfrage in deiner Nähe entsteht, erscheint sie hier. Prüfe im Profil, ob deine Leistungen und dein Einsatzgebiet hinterlegt sind.\"\n          />\n        ) : (\n          <View style={styles.list}>\n            {matches.map((match) => (\n              <Card\n                key={match.id}\n                onPress={() => router.push(`/(app)/requests/${match.requestId}`)}\n                accessibilityLabel=\"Anfrage öffnen\"\n              >\n                <Text style={styles.matchScore}>Passung {match.score} von 100<\/Text>\n                <View style={styles.reasons}>\n                  {match.reasons.slice(0, 3).map((reason) => (\n                    <Text key={reason.factor} style={styles.reason}>\n                      • {reason.label}\n                    <\/Text>\n                  ))}\n                <\/View>\n              <\/Card>\n            ))}\n          <\/View>\n        )}\n      <\/Screen>\n    );\n  }\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Meine Anfragen<\/Text>\n      {requests.length === 0 ? (\n        <Empty\n          title=\"Noch keine Anfragen\"\n          hint=\"Beschreibe dein Anliegen - JobFlow findet die passenden Anbieter.\"\n        />\n      ) : (\n        <View style={styles.list}>\n          {requests.map((request) => (\n            <RequestCard\n              key={request.id}\n              request={request}\n              onPress={(item) => router.push(`/(app)/requests/${item.id}`)}\n            />\n          ))}\n        <\/View>\n      )}\n    <\/Screen>\n  );\n}\n\nfunction Empty({ title, hint }: { title: string; hint: string }) {\n  return (\n    <Card style={styles.empty}>\n      <Text style={styles.emptyTitle}>{title}<\/Text>\n      <Text style={styles.emptyHint}>{hint}<\/Text>\n    <\/Card>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.text,\n  },\n  list: { gap: spacing.md },\n  matchScore: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n    marginBottom: spacing.sm,\n  },\n  reasons: { gap: spacing.xs },\n  reason: { fontSize: typography.sizes.small, color: colors.textMuted },\n  empty: { alignItems: \"center\", gap: spacing.sm, paddingVertical: spacing.xxl },\n  emptyTitle: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  emptyHint: {\n    fontSize: typography.sizes.small,\n    color: colors.textMuted,\n    textAlign: \"center\",\n    lineHeight: 20,\n  },\n});\n"}, {"pfad": "apps/mobile/app/(app)/review.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 95, "bytes": 3188, "inhalt": "import { useState } from \"react\";\nimport { Pressable, StyleSheet, Text, View } from \"react-native\";\nimport { router, useLocalSearchParams } from \"expo-router\";\nimport type { Review } from \"@jobflow/types\";\nimport { colors, spacing, typography } from \"@jobflow/config\";\nimport { createReviewSchema, validate } from \"@jobflow/validation\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Input } from \"../../components/Input.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\n/**\n * Bewertung nach Abschluss.\n *\n * Bewerten kann nur der Auftraggeber, nur einmal und nur nach Abschluss. Diese\n * Regel steht im Backend und in der Datenbank - hier wird sie nur abgebildet.\n */\nexport default function ReviewScreen() {\n  const { jobId } = useLocalSearchParams<{ jobId: string }>();\n\n  const [rating, setRating] = useState(0);\n  const [text, setText] = useState(\"\");\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n\n  async function submit(): Promise<void> {\n    setMessage(null);\n    const parsed = validate(createReviewSchema, {\n      jobId,\n      rating,\n      text: text.trim() === \"\" ? null : text,\n    });\n    if (!parsed.ok) {\n      setMessage(\"Bitte vergib zuerst eine Bewertung von 1 bis 5 Sternen.\");\n      return;\n    }\n    setBusy(true);\n    try {\n      await api.post<Review>(\"/reviews\", parsed.value);\n      router.replace(`/(app)/jobs/${String(jobId)}`);\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Die Bewertung konnte nicht gesendet werden.\");\n      setBusy(false);\n    }\n  }\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Wie war dein Auftrag?<\/Text>\n\n      <View style={styles.stars}>\n        {[1, 2, 3, 4, 5].map((value) => (\n          <Pressable\n            key={value}\n            onPress={() => setRating(value)}\n            accessibilityRole=\"radio\"\n            accessibilityLabel={`${value} von 5 Sternen`}\n            accessibilityState={{ selected: rating === value }}\n            style={styles.starButton}\n          >\n            <Text style={[styles.star, value <= rating ? styles.starOn : null]}>⭐<\/Text>\n          <\/Pressable>\n        ))}\n      <\/View>\n\n      <Input\n        label=\"Was möchtest du sagen?\"\n        value={text}\n        onChangeText={setText}\n        placeholder=\"Sehr freundlicher und zuverlässiger Service.\"\n        multiline\n        hint=\"Freiwillig. Deine Bewertung ist öffentlich im Profil des Unternehmens sichtbar.\"\n      />\n\n      <ErrorNotice message={message} />\n      <Button title=\"Bewertung senden\" loading={busy} disabled={rating === 0} onPress={submit} />\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  title: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.text,\n    textAlign: \"center\",\n    marginTop: spacing.lg,\n  },\n  stars: { flexDirection: \"row\", justifyContent: \"center\", gap: spacing.sm },\n  starButton: { padding: spacing.xs },\n  star: { fontSize: 38, opacity: 0.3 },\n  starOn: { opacity: 1 },\n});\n"}, {"pfad": "apps/mobile/app/(app)/statistics.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 147, "bytes": 4962, "inhalt": "import { useCallback, useState } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { useFocusEffect } from \"expo-router\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\nimport { api } from \"../../lib/api.js\";\nimport { Card } from \"../../components/Card.js\";\nimport { Screen } from \"../../components/Screen.js\";\nimport { formatMinutes } from \"../../lib/format.js\";\n\ninterface Statistics {\n  matchCount: number;\n  offerCount: number;\n  jobCount: number;\n  offerRate: number;\n  winRate: number;\n  avgResponseMinutes: number | null;\n  rating: number | null;\n  reviewCount: number;\n}\n\n/**\n * Kennzahlen eines Unternehmens.\n *\n * Es geht nicht um möglichst viele Zahlen, sondern um die drei Fragen, die ein\n * Betrieb wirklich hat: Wie viele Anfragen bekomme ich? Wie viele davon\n * beantworte ich? Und wie viele werden zu Aufträgen?\n */\nexport default function StatisticsScreen() {\n  const [stats, setStats] = useState<Statistics | null>(null);\n  const [loading, setLoading] = useState(true);\n\n  useFocusEffect(\n    useCallback(() => {\n      let cancelled = false;\n      void api\n        .get<Statistics>(\"/businesses/me/statistics\")\n        .then((found) => {\n          if (!cancelled) setStats(found);\n        })\n        .catch(() => {\n          if (!cancelled) setStats(null);\n        })\n        .finally(() => {\n          if (!cancelled) setLoading(false);\n        });\n      return () => {\n        cancelled = true;\n      };\n    }, []),\n  );\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  const max = Math.max(stats?.matchCount ?? 0, 1);\n\n  return (\n    <Screen>\n      <Text style={styles.title}>Statistik<\/Text>\n\n      <Card>\n        <Bar label=\"Anfragen\" value={stats?.matchCount ?? 0} max={max} />\n        <Bar label=\"Angebote\" value={stats?.offerCount ?? 0} max={max} />\n        <Bar label=\"Aufträge\" value={stats?.jobCount ?? 0} max={max} />\n      <\/Card>\n\n      <View style={styles.tiles}>\n        <Tile label=\"Angebotsquote\" value={`${stats?.offerRate ?? 0} %`} />\n        <Tile label=\"Aus Angebot wird Auftrag\" value={`${stats?.winRate ?? 0} %`} />\n        <Tile\n          label=\"Antwortzeit im Schnitt\"\n          value={stats?.avgResponseMinutes == null ? \"–\" : formatMinutes(stats.avgResponseMinutes)}\n        />\n        <Tile\n          label={stats?.reviewCount === 1 ? \"aus 1 Bewertung\" : `aus ${stats?.reviewCount ?? 0} Bewertungen`}\n          value={stats?.rating == null ? \"–\" : stats.rating.toFixed(1).replace(\".\", \",\")}\n        />\n      <\/View>\n\n      <Card>\n        <Text style={styles.sectionLabel}>Was das bedeutet<\/Text>\n        <Text style={styles.body}>\n          Die Antwortzeit fließt direkt ins Matching ein: Wer schneller antwortet, wird häufiger\n          vorgeschlagen. Dasselbe gilt für abgeschlossene Aufträge und Bewertungen.\n        <\/Text>\n      <\/Card>\n    <\/Screen>\n  );\n}\n\nfunction Bar({ label, value, max }: { label: string; value: number; max: number }) {\n  return (\n    <View style={styles.bar}>\n      <View style={styles.barHead}>\n        <Text style={styles.barLabel}>{label}<\/Text>\n        <Text style={styles.barValue}>{value}<\/Text>\n      <\/View>\n      <View style={styles.barTrack}>\n        <View style={[styles.barFill, { width: `${Math.round((value / max) * 100)}%` }]} />\n      <\/View>\n    <\/View>\n  );\n}\n\nfunction Tile({ label, value }: { label: string; value: string }) {\n  return (\n    <Card style={styles.tile}>\n      <Text style={styles.tileValue}>{value}<\/Text>\n      <Text style={styles.tileLabel}>{label}<\/Text>\n    <\/Card>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  title: { fontSize: typography.sizes.heading, fontWeight: typography.weights.bold, color: colors.text },\n  sectionLabel: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.textMuted,\n  },\n  body: { fontSize: typography.sizes.small, color: colors.textMuted, lineHeight: 20 },\n  bar: { gap: spacing.xs },\n  barHead: { flexDirection: \"row\", justifyContent: \"space-between\" },\n  barLabel: { fontSize: typography.sizes.small, color: colors.textMuted },\n  barValue: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  barTrack: { height: 8, borderRadius: radii.pill, backgroundColor: colors.surfaceMuted, overflow: \"hidden\" },\n  barFill: { height: \"100%\", borderRadius: radii.pill, backgroundColor: colors.primary },\n  tiles: { flexDirection: \"row\", flexWrap: \"wrap\", gap: spacing.md },\n  tile: { flexBasis: \"47%\", flexGrow: 1, gap: spacing.xs },\n  tileValue: {\n    fontSize: typography.sizes.heading,\n    fontWeight: typography.weights.bold,\n    color: colors.primary,\n  },\n  tileLabel: { fontSize: typography.sizes.caption, color: colors.textMuted },\n});\n"}, {"pfad": "apps/mobile/app/(auth)/_layout.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 21, "bytes": 608, "inhalt": "import { Stack } from \"expo-router\";\nimport { colors } from \"@jobflow/config\";\n\nexport default function AuthLayout() {\n  return (\n    <Stack\n      screenOptions={{\n        headerShown: true,\n        headerBackTitle: \"Zurück\",\n        headerTintColor: colors.primary,\n        headerStyle: { backgroundColor: colors.background },\n        headerShadowVisible: false,\n        contentStyle: { backgroundColor: colors.background },\n      }}\n    >\n      <Stack.Screen name=\"register\" options={{ title: \"Konto erstellen\" }} />\n      <Stack.Screen name=\"login\" options={{ title: \"Anmelden\" }} />\n    <\/Stack>\n  );\n}\n"}, {"pfad": "apps/mobile/app/(auth)/login.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 79, "bytes": 2503, "inhalt": "import { useState } from \"react\";\nimport { Pressable, StyleSheet, Text } from \"react-native\";\nimport { router } from \"expo-router\";\nimport type { AuthResult } from \"@jobflow/types\";\nimport { colors, typography } from \"@jobflow/config\";\nimport { loginSchema, validate } from \"@jobflow/validation\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { useSession } from \"../../lib/session.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Input } from \"../../components/Input.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\nexport default function LoginScreen() {\n  const { signIn } = useSession();\n  const [email, setEmail] = useState(\"\");\n  const [password, setPassword] = useState(\"\");\n  const [fields, setFields] = useState<Record<string, string>>({});\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n\n  async function submit(): Promise<void> {\n    setMessage(null);\n    const parsed = validate(loginSchema, { email, password });\n    if (!parsed.ok) {\n      setFields(parsed.fields);\n      return;\n    }\n    setFields({});\n    setBusy(true);\n    try {\n      const result = await api.post<AuthResult>(\"/auth/login\", parsed.value);\n      await signIn(result);\n      router.replace(result.user.role === \"CUSTOMER\" ? \"/(app)/home\" : \"/(app)/dashboard\");\n    } catch (error) {\n      setMessage(error instanceof ApiClientError ? error.message : \"Anmeldung fehlgeschlagen.\");\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  return (\n    <Screen>\n      <Input\n        label=\"E-Mail\"\n        value={email}\n        onChangeText={setEmail}\n        keyboardType=\"email-address\"\n        autoCapitalize=\"none\"\n        error={fields[\"email\"]}\n      />\n      <Input\n        label=\"Passwort\"\n        value={password}\n        onChangeText={setPassword}\n        secureTextEntry\n        autoCapitalize=\"none\"\n        error={fields[\"password\"]}\n      />\n\n      <ErrorNotice message={message} />\n      <Button title=\"Anmelden\" onPress={submit} loading={busy} />\n\n      <Pressable onPress={() => router.replace(\"/(auth)/register\")} accessibilityRole=\"link\">\n        <Text style={styles.link}>Noch kein Konto? Jetzt erstellen<\/Text>\n      <\/Pressable>\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  link: {\n    textAlign: \"center\",\n    color: colors.primary,\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n  },\n});\n"}, {"pfad": "apps/mobile/app/(auth)/register.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 156, "bytes": 5135, "inhalt": "import { useState } from \"react\";\nimport { Pressable, StyleSheet, Text, View } from \"react-native\";\nimport { router } from \"expo-router\";\nimport type { AuthResult, SelfSignupRole } from \"@jobflow/types\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\nimport { PASSWORD_MIN_LENGTH, registerSchema, validate } from \"@jobflow/validation\";\nimport { api, ApiClientError } from \"../../lib/api.js\";\nimport { useSession } from \"../../lib/session.js\";\nimport { Button } from \"../../components/Button.js\";\nimport { ErrorNotice } from \"../../components/ErrorNotice.js\";\nimport { Input } from \"../../components/Input.js\";\nimport { Screen } from \"../../components/Screen.js\";\n\nexport default function RegisterScreen() {\n  const { signIn } = useSession();\n\n  const [role, setRole] = useState<SelfSignupRole>(\"CUSTOMER\");\n  const [name, setName] = useState(\"\");\n  const [email, setEmail] = useState(\"\");\n  const [password, setPassword] = useState(\"\");\n  const [fields, setFields] = useState<Record<string, string>>({});\n  const [message, setMessage] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n\n  async function submit(): Promise<void> {\n    setMessage(null);\n\n    // Dieselbe Prüfung wie im Backend - hier nur für die schnelle Rückmeldung.\n    // Verbindlich entscheidet immer der Server.\n    const parsed = validate(registerSchema, { name, email, password, role });\n    if (!parsed.ok) {\n      setFields(parsed.fields);\n      return;\n    }\n    setFields({});\n    setBusy(true);\n    try {\n      const result = await api.post<AuthResult>(\"/auth/register\", parsed.value);\n      await signIn(result);\n      router.replace(result.user.role === \"CUSTOMER\" ? \"/(app)/home\" : \"/(app)/dashboard\");\n    } catch (error) {\n      if (error instanceof ApiClientError) {\n        setFields(error.fields);\n        setMessage(error.message);\n      } else {\n        setMessage(\"Das hat leider nicht geklappt.\");\n      }\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  return (\n    <Screen>\n      <Text style={styles.intro}>Wofür moechtest du JobFlow nutzen?<\/Text>\n\n      <View style={styles.roles}>\n        <RoleOption\n          label=\"Ich suche jemanden\"\n          description=\"Problem beschreiben und passende Anbieter finden.\"\n          selected={role === \"CUSTOMER\"}\n          onPress={() => setRole(\"CUSTOMER\")}\n        />\n        <RoleOption\n          label=\"Ich biete Leistungen an\"\n          description=\"Passende Anfragen erhalten und Angebote schreiben.\"\n          selected={role === \"BUSINESS\"}\n          onPress={() => setRole(\"BUSINESS\")}\n        />\n      <\/View>\n\n      <Input\n        label={role === \"BUSINESS\" ? \"Name des Unternehmens\" : \"Dein Name\"}\n        value={name}\n        onChangeText={setName}\n        placeholder={role === \"BUSINESS\" ? \"HeizPro GmbH\" : \"Max Mustermann\"}\n        autoCapitalize=\"words\"\n        error={fields[\"name\"]}\n      />\n      <Input\n        label=\"E-Mail\"\n        value={email}\n        onChangeText={setEmail}\n        placeholder=\"max@example.de\"\n        keyboardType=\"email-address\"\n        autoCapitalize=\"none\"\n        error={fields[\"email\"]}\n      />\n      <Input\n        label=\"Passwort\"\n        value={password}\n        onChangeText={setPassword}\n        secureTextEntry\n        autoCapitalize=\"none\"\n        hint={`Mindestens ${PASSWORD_MIN_LENGTH} Zeichen. Länge schützt mehr als Sonderzeichen.`}\n        error={fields[\"password\"]}\n      />\n\n      <ErrorNotice message={message} />\n      <Button title=\"Konto erstellen\" onPress={submit} loading={busy} />\n\n      <Pressable onPress={() => router.replace(\"/(auth)/login\")} accessibilityRole=\"link\">\n        <Text style={styles.link}>Ich habe schon ein Konto<\/Text>\n      <\/Pressable>\n    <\/Screen>\n  );\n}\n\ninterface RoleOptionProps {\n  label: string;\n  description: string;\n  selected: boolean;\n  onPress: () => void;\n}\n\nfunction RoleOption({ label, description, selected, onPress }: RoleOptionProps) {\n  return (\n    <Pressable\n      onPress={onPress}\n      accessibilityRole=\"radio\"\n      accessibilityState={{ selected }}\n      style={[styles.role, selected ? styles.roleSelected : null]}\n    >\n      <Text style={[styles.roleLabel, selected ? styles.roleLabelSelected : null]}>{label}<\/Text>\n      <Text style={styles.roleDescription}>{description}<\/Text>\n    <\/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  intro: { fontSize: typography.sizes.body, color: colors.textMuted },\n  roles: { gap: spacing.md },\n  role: {\n    backgroundColor: colors.surface,\n    borderRadius: radii.lg,\n    borderWidth: 2,\n    borderColor: colors.border,\n    padding: spacing.lg,\n    gap: spacing.xs,\n  },\n  roleSelected: { borderColor: colors.primary, backgroundColor: colors.primaryLight },\n  roleLabel: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  roleLabelSelected: { color: colors.primaryDark },\n  roleDescription: { fontSize: typography.sizes.small, color: colors.textMuted },\n  link: {\n    textAlign: \"center\",\n    color: colors.primary,\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n  },\n});\n"}, {"pfad": "apps/mobile/app/_layout.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 84, "bytes": 2417, "inhalt": "import { useCallback, useEffect, useMemo, useState } from \"react\";\nimport { Stack } from \"expo-router\";\nimport { StatusBar } from \"expo-status-bar\";\nimport { SafeAreaProvider } from \"react-native-safe-area-context\";\nimport type { AuthResult, User } from \"@jobflow/types\";\nimport { colors } from \"@jobflow/config\";\nimport { api, setAuthToken } from \"../lib/api.js\";\nimport { readStoredToken, SessionContext, storeToken, type SessionState } from \"../lib/session.js\";\n\n/**\n * Wurzel der App.\n *\n * Hier entsteht die Sitzung, und von hier aus verzweigt die App in den\n * Kunden- oder den Unternehmensbereich. Beide Rollen teilen sich dieselbe\n * Codebasis, bekommen aber völlig unterschiedliche Oberflächen.\n */\nexport default function RootLayout() {\n  const [user, setUser] = useState<User | null>(null);\n  const [loading, setLoading] = useState(true);\n\n  const refresh = useCallback(async () => {\n    try {\n      setUser(await api.get<User>(\"/me\"));\n    } catch {\n      // Token abgelaufen, zurückgezogen oder Konto gesperrt.\n      await storeToken(null);\n      setUser(null);\n    }\n  }, []);\n\n  useEffect(() => {\n    let cancelled = false;\n    void (async () => {\n      const token = await readStoredToken();\n      if (token !== null) {\n        setAuthToken(token);\n        await refresh();\n      }\n      if (!cancelled) setLoading(false);\n    })();\n    return () => {\n      cancelled = true;\n    };\n  }, [refresh]);\n\n  const session = useMemo<SessionState>(\n    () => ({\n      user,\n      loading,\n      signIn: async (result: AuthResult) => {\n        await storeToken(result.token);\n        setUser(result.user);\n      },\n      signOut: async () => {\n        // Erst serverseitig abmelden, damit das Token sofort wertlos wird -\n        // und danach lokal aufräumen, auch wenn der Aufruf scheitert.\n        try {\n          await api.post(\"/auth/logout\");\n        } catch {\n          // Kein Netz. Lokal abmelden ist trotzdem richtig.\n        }\n        await storeToken(null);\n        setUser(null);\n      },\n      refresh,\n    }),\n    [user, loading, refresh],\n  );\n\n  return (\n    <SafeAreaProvider>\n      <SessionContext.Provider value={session}>\n        <StatusBar style=\"dark\" />\n        <Stack\n          screenOptions={{\n            headerShown: false,\n            contentStyle: { backgroundColor: colors.background },\n          }}\n        />\n      <\/SessionContext.Provider>\n    <\/SafeAreaProvider>\n  );\n}\n"}, {"pfad": "apps/mobile/app/index.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 66, "bytes": 2165, "inhalt": "import { useEffect } from \"react\";\nimport { ActivityIndicator, StyleSheet, Text, View } from \"react-native\";\nimport { router } from \"expo-router\";\nimport { colors, spacing, typography } from \"@jobflow/config\";\nimport { Button } from \"../components/Button.js\";\nimport { Screen } from \"../components/Screen.js\";\nimport { useSession } from \"../lib/session.js\";\n\n/**\n * Screen 01 - Willkommen.\n *\n * Wer bereits angemeldet ist, sieht diesen Screen gar nicht erst, sondern\n * landet direkt in seinem Bereich.\n */\nexport default function WelcomeScreen() {\n  const { user, loading } = useSession();\n\n  useEffect(() => {\n    if (loading || user === null) return;\n    router.replace(user.role === \"CUSTOMER\" ? \"/(app)/home\" : \"/(app)/dashboard\");\n  }, [user, loading]);\n\n  if (loading) {\n    return (\n      <Screen scroll={false} style={styles.center}>\n        <ActivityIndicator size=\"large\" color={colors.primary} />\n      <\/Screen>\n    );\n  }\n\n  return (\n    <Screen scroll={false} style={styles.wrapper}>\n      <View style={styles.hero}>\n        <Text style={styles.logo}>JobFlow<\/Text>\n        <Text style={styles.slogan}>Von der Anfrage zum Auftrag.<\/Text>\n        <Text style={styles.pitch}>\n          Sag uns einfach, was los ist. Wir kümmern uns um den Rest.\n        <\/Text>\n      <\/View>\n\n      <View style={styles.actions}>\n        <Button title=\"Konto erstellen\" onPress={() => router.push(\"/(auth)/register\")} />\n        <Button title=\"Anmelden\" variant=\"secondary\" onPress={() => router.push(\"/(auth)/login\")} />\n      <\/View>\n    <\/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrapper: { justifyContent: \"space-between\", paddingVertical: spacing.xxxl },\n  center: { alignItems: \"center\", justifyContent: \"center\" },\n  hero: { flex: 1, justifyContent: \"center\", gap: spacing.md },\n  logo: {\n    fontSize: typography.sizes.display,\n    fontWeight: typography.weights.bold,\n    color: colors.primary,\n  },\n  slogan: {\n    fontSize: typography.sizes.title,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n  },\n  pitch: { fontSize: typography.sizes.body, color: colors.textMuted, lineHeight: 24 },\n  actions: { gap: spacing.md },\n});\n"}, {"pfad": "apps/mobile/babel.config.js", "bereich": "Mobile-App", "sprache": "javascript", "zeilen": 13, "bytes": 318, "inhalt": "/**\n * Babel-Konfiguration.\n *\n * babel-preset-expo bringt alles mit, was Expo Router und React Native\n * brauchen - eigene Plugins sind hier bewusst nicht noetig.\n */\nmodule.exports = function (api) {\n  api.cache(true);\n  return {\n    presets: [[\"babel-preset-expo\", { unstable_transformImportMeta: true }]],\n  };\n};\n"}, {"pfad": "apps/mobile/components/AiNotice.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 51, "bytes": 1642, "inhalt": "import { StyleSheet, Text, View } from \"react-native\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\n\ninterface Props {\n  children: React.ReactNode;\n  /** Selbsteinschätzung der KI, 0 bis 1. */\n  confidence?: number | undefined;\n}\n\n/**\n * Rahmen für alles, was von der KI kommt.\n *\n * KI-Inhalte bekommen eine eigene Farbe und einen ausdrücklichen Hinweis.\n * Sie dürfen nicht so aussehen, als wären sie garantiert richtig - eine\n * falsch erkannte Kategorie ist kein Beinbruch, eine falsch erkannte Kategorie,\n * die wie eine Tatsache präsentiert wird, schon.\n */\nexport function AiNotice({ children, confidence }: Props) {\n  return (\n    <View style={styles.wrapper}>\n      <View style={styles.header}>\n        <Text style={styles.icon}>🤖<\/Text>\n        <Text style={styles.title}>Von der KI erkannt<\/Text>\n      <\/View>\n      {children}\n      <Text style={styles.disclaimer}>\n        {confidence !== undefined && confidence < 0.6\n          ? \"Die KI ist sich hier unsicher. Bitte prüfe die Angaben und ergänze, was fehlt.\"\n          : \"Automatisch erstellt - bitte kurz prüfen.\"}\n      <\/Text>\n    <\/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrapper: {\n    backgroundColor: colors.aiLight,\n    borderRadius: radii.lg,\n    padding: spacing.lg,\n    gap: spacing.sm,\n  },\n  header: { flexDirection: \"row\", alignItems: \"center\", gap: spacing.sm },\n  icon: { fontSize: typography.sizes.title },\n  title: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.semibold,\n    color: colors.ai,\n  },\n  disclaimer: { fontSize: typography.sizes.caption, color: colors.textMuted },\n});\n"}, {"pfad": "apps/mobile/components/Badge.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 44, "bytes": 1265, "inhalt": "import { StyleSheet, Text, View } from \"react-native\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\n\nexport type BadgeTone = \"neutral\" | \"success\" | \"warning\" | \"error\" | \"ai\";\n\ninterface Props {\n  label: string;\n  tone?: BadgeTone;\n}\n\nexport function Badge({ label, tone = \"neutral\" }: Props) {\n  return (\n    <View style={[styles.badge, backgrounds[tone]]}>\n      <Text style={[styles.label, foregrounds[tone]]}>{label}<\/Text>\n    <\/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  badge: {\n    paddingHorizontal: spacing.md,\n    paddingVertical: spacing.xs,\n    borderRadius: radii.pill,\n    alignSelf: \"flex-start\",\n  },\n  label: { fontSize: typography.sizes.caption, fontWeight: typography.weights.semibold },\n});\n\nconst backgrounds = StyleSheet.create({\n  neutral: { backgroundColor: colors.surfaceMuted },\n  success: { backgroundColor: colors.successLight },\n  warning: { backgroundColor: colors.warningLight },\n  error: { backgroundColor: colors.errorLight },\n  ai: { backgroundColor: colors.aiLight },\n});\n\nconst foregrounds = StyleSheet.create({\n  neutral: { color: colors.textMuted },\n  success: { color: colors.success },\n  warning: { color: colors.warning },\n  error: { color: colors.error },\n  ai: { color: colors.ai },\n});\n"}, {"pfad": "apps/mobile/components/Button.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 78, "bytes": 2491, "inhalt": "import { ActivityIndicator, Pressable, StyleSheet, Text, View } from \"react-native\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\n\n/**\n * Der Button von JobFlow.\n *\n * Absichtlich groß und deutlich: die App wird oft unterwegs bedient, teils\n * einhändig, teils in einem Keller mit schlechtem Licht.\n */\nexport type ButtonVariant = \"primary\" | \"secondary\" | \"ghost\" | \"danger\";\n\ninterface Props {\n  title: string;\n  onPress: () => void;\n  variant?: ButtonVariant;\n  disabled?: boolean;\n  loading?: boolean;\n  /** Emoji oder kurzes Zeichen links vom Text. */\n  icon?: string;\n}\n\nexport function Button({ title, onPress, variant = \"primary\", disabled = false, loading = false, icon }: Props) {\n  const inactive = disabled || loading;\n\n  return (\n    <Pressable\n      onPress={onPress}\n      disabled={inactive}\n      accessibilityRole=\"button\"\n      accessibilityLabel={title}\n      accessibilityState={{ disabled: inactive, busy: loading }}\n      style={({ pressed }) => [\n        styles.base,\n        styles[variant],\n        pressed && !inactive ? styles.pressed : null,\n        inactive ? styles.inactive : null,\n      ]}\n    >\n      {loading ? (\n        <ActivityIndicator color={variant === \"primary\" || variant === \"danger\" ? colors.textInverted : colors.primary} />\n      ) : (\n        <View style={styles.content}>\n          {icon ? <Text style={styles.icon}>{icon}<\/Text> : null}\n          <Text style={[styles.label, labelStyles[variant]]}>{title}<\/Text>\n        <\/View>\n      )}\n    <\/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  base: {\n    paddingVertical: spacing.lg,\n    paddingHorizontal: spacing.xl,\n    borderRadius: radii.lg,\n    alignItems: \"center\",\n    justifyContent: \"center\",\n    // Empfohlene Mindestgröße für Bedienelemente.\n    minHeight: 52,\n  },\n  content: { flexDirection: \"row\", alignItems: \"center\", gap: spacing.sm },\n  icon: { fontSize: typography.sizes.title },\n  label: { fontSize: typography.sizes.body, fontWeight: typography.weights.semibold },\n  primary: { backgroundColor: colors.primary },\n  secondary: { backgroundColor: colors.primaryLight },\n  ghost: { backgroundColor: \"transparent\" },\n  danger: { backgroundColor: colors.error },\n  pressed: { opacity: 0.85 },\n  inactive: { opacity: 0.5 },\n});\n\nconst labelStyles = StyleSheet.create({\n  primary: { color: colors.textInverted },\n  secondary: { color: colors.primaryDark },\n  ghost: { color: colors.primary },\n  danger: { color: colors.textInverted },\n});\n"}, {"pfad": "apps/mobile/components/Card.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 37, "bytes": 1014, "inhalt": "import { Pressable, StyleSheet, View, type ViewStyle } from \"react-native\";\nimport { colors, radii, shadows, spacing } from \"@jobflow/config\";\n\ninterface Props {\n  children: React.ReactNode;\n  onPress?: () => void;\n  style?: ViewStyle;\n  accessibilityLabel?: string;\n}\n\n/** Große, weich gerundete Karte - das prägende Element der Oberfläche. */\nexport function Card({ children, onPress, style, accessibilityLabel }: Props) {\n  if (onPress === undefined) {\n    return <View style={[styles.card, style]}>{children}<\/View>;\n  }\n  return (\n    <Pressable\n      onPress={onPress}\n      accessibilityRole=\"button\"\n      {...(accessibilityLabel === undefined ? {} : { accessibilityLabel })}\n      style={({ pressed }) => [styles.card, style, pressed ? styles.pressed : null]}\n    >\n      {children}\n    <\/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  card: {\n    backgroundColor: colors.surface,\n    borderRadius: radii.xl,\n    padding: spacing.lg,\n    ...shadows.card,\n  },\n  pressed: { opacity: 0.9 },\n});\n"}, {"pfad": "apps/mobile/components/CategoryCard.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 50, "bytes": 1339, "inhalt": "import { Pressable, StyleSheet, Text } from \"react-native\";\nimport { colors, radii, shadows, spacing, typography } from \"@jobflow/config\";\nimport type { Category } from \"@jobflow/types\";\n\ninterface Props {\n  category: Category;\n  onPress: (category: Category) => void;\n}\n\nexport function CategoryCard({ category, onPress }: Props) {\n  return (\n    <Pressable\n      onPress={() => onPress(category)}\n      accessibilityRole=\"button\"\n      accessibilityLabel={category.name}\n      style={({ pressed }) => [styles.card, pressed ? styles.pressed : null]}\n    >\n      <Text style={styles.icon}>{category.icon ?? \"🔧\"}<\/Text>\n      <Text style={styles.name} numberOfLines={2}>\n        {category.name}\n      <\/Text>\n    <\/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  card: {\n    backgroundColor: colors.surface,\n    borderRadius: radii.lg,\n    paddingVertical: spacing.lg,\n    paddingHorizontal: spacing.sm,\n    alignItems: \"center\",\n    justifyContent: \"center\",\n    gap: spacing.sm,\n    // Drei Karten pro Zeile mit den Abständen dazwischen.\n    flexBasis: \"30%\",\n    flexGrow: 1,\n    minHeight: 96,\n    ...shadows.card,\n  },\n  pressed: { opacity: 0.9 },\n  icon: { fontSize: 28 },\n  name: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.text,\n    textAlign: \"center\",\n  },\n});\n"}, {"pfad": "apps/mobile/components/ErrorNotice.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 26, "bytes": 697, "inhalt": "import { StyleSheet, Text, View } from \"react-native\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\n\ninterface Props {\n  message: string | null;\n}\n\n/** Einheitliche Fehleranzeige. Zeigt nichts, wenn es nichts zu zeigen gibt. */\nexport function ErrorNotice({ message }: Props) {\n  if (message === null) return null;\n  return (\n    <View style={styles.wrapper} accessibilityRole=\"alert\">\n      <Text style={styles.text}>{message}<\/Text>\n    <\/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrapper: {\n    backgroundColor: colors.errorLight,\n    borderRadius: radii.md,\n    padding: spacing.md,\n  },\n  text: { color: colors.error, fontSize: typography.sizes.small },\n});\n"}, {"pfad": "apps/mobile/components/Input.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 80, "bytes": 2444, "inhalt": "import { StyleSheet, Text, TextInput, View, type KeyboardTypeOptions } from \"react-native\";\nimport { colors, radii, spacing, typography } from \"@jobflow/config\";\n\ninterface Props {\n  label: string;\n  value: string;\n  onChangeText: (value: string) => void;\n  placeholder?: string;\n  /** Fehlermeldung aus der Validierung - lokal oder vom Server. */\n  error?: string | undefined;\n  multiline?: boolean;\n  secureTextEntry?: boolean;\n  keyboardType?: KeyboardTypeOptions;\n  autoCapitalize?: \"none\" | \"sentences\" | \"words\";\n  hint?: string;\n}\n\nexport function Input({\n  label,\n  value,\n  onChangeText,\n  placeholder,\n  error,\n  multiline = false,\n  secureTextEntry = false,\n  keyboardType,\n  autoCapitalize = \"sentences\",\n  hint,\n}: Props) {\n  return (\n    <View style={styles.wrapper}>\n      <Text style={styles.label}>{label}<\/Text>\n      <TextInput\n        value={value}\n        onChangeText={onChangeText}\n        {...(placeholder === undefined ? {} : { placeholder })}\n        placeholderTextColor={colors.textMuted}\n        multiline={multiline}\n        secureTextEntry={secureTextEntry}\n        {...(keyboardType === undefined ? {} : { keyboardType })}\n        autoCapitalize={autoCapitalize}\n        autoCorrect={!secureTextEntry}\n        accessibilityLabel={label}\n        style={[styles.input, multiline ? styles.multiline : null, error ? styles.inputError : null]}\n      />\n      {/* Der Hinweis verschwindet, sobald ein Fehler angezeigt wird - zwei\n          Zeilen Kleingedrucktes unter einem Feld liest niemand. */}\n      {error ? (\n        <Text style={styles.error}>{error}<\/Text>\n      ) : hint ? (\n        <Text style={styles.hint}>{hint}<\/Text>\n      ) : null}\n    <\/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrapper: { gap: spacing.xs },\n  label: {\n    fontSize: typography.sizes.small,\n    fontWeight: typography.weights.medium,\n    color: colors.textMuted,\n  },\n  input: {\n    backgroundColor: colors.surface,\n    borderRadius: radii.md,\n    borderWidth: 1,\n    borderColor: colors.border,\n    paddingHorizontal: spacing.lg,\n    paddingVertical: spacing.md,\n    fontSize: typography.sizes.body,\n    color: colors.text,\n    minHeight: 52,\n  },\n  multiline: { minHeight: 120, textAlignVertical: \"top\", paddingTop: spacing.md },\n  inputError: { borderColor: colors.error },\n  error: { fontSize: typography.sizes.caption, color: colors.error },\n  hint: { fontSize: typography.sizes.caption, color: colors.textMuted },\n});\n"}, {"pfad": "apps/mobile/components/RequestCard.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 65, "bytes": 2213, "inhalt": "import { StyleSheet, Text, View } from \"react-native\";\nimport { colors, requestStatusLabels, spacing, typography, urgencyLabels } from \"@jobflow/config\";\nimport type { ServiceRequest } from \"@jobflow/types\";\nimport { Badge, type BadgeTone } from \"./Badge.js\";\nimport { Card } from \"./Card.js\";\n\ninterface Props {\n  request: ServiceRequest;\n  onPress: (request: ServiceRequest) => void;\n}\n\n/** Ton der Statusanzeige - der Fortschritt soll auf einen Blick erkennbar sein. */\nfunction toneFor(status: ServiceRequest[\"status\"]): BadgeTone {\n  switch (status) {\n    case \"COMPLETED\":\n      return \"success\";\n    case \"CANCELLED\":\n      return \"error\";\n    case \"OFFERED\":\n    case \"ACCEPTED\":\n      return \"success\";\n    case \"ANALYZING\":\n      return \"ai\";\n    default:\n      return \"neutral\";\n  }\n}\n\nexport function RequestCard({ request, onPress }: Props) {\n  const title = request.title ?? request.description;\n\n  return (\n    <Card onPress={() => onPress(request)} accessibilityLabel={`Anfrage: ${title}`}>\n      <View style={styles.header}>\n        <Badge label={requestStatusLabels[request.status] ?? request.status} tone={toneFor(request.status)} />\n        {request.urgency === \"HIGH\" ? <Badge label={urgencyLabels[\"HIGH\"] as string} tone=\"warning\" /> : null}\n      <\/View>\n      <Text style={styles.title} numberOfLines={2}>\n        {title}\n      <\/Text>\n      <View style={styles.meta}>\n        {request.locationLabel ? <Text style={styles.metaText}>📍 {request.locationLabel}<\/Text> : null}\n        <Text style={styles.metaText}>🕐 {formatDate(request.createdAt)}<\/Text>\n      <\/View>\n    <\/Card>\n  );\n}\n\nexport function formatDate(iso: string): string {\n  const date = new Date(iso);\n  return date.toLocaleDateString(\"de-DE\", { day: \"2-digit\", month: \"2-digit\", year: \"numeric\" });\n}\n\nconst styles = StyleSheet.create({\n  header: { flexDirection: \"row\", gap: spacing.sm, marginBottom: spacing.md },\n  title: {\n    fontSize: typography.sizes.body,\n    fontWeight: typography.weights.semibold,\n    color: colors.text,\n    marginBottom: spacing.sm,\n  },\n  meta: { flexDirection: \"row\", gap: spacing.lg, flexWrap: \"wrap\" },\n  metaText: { fontSize: typography.sizes.caption, color: colors.textMuted },\n});\n"}, {"pfad": "apps/mobile/components/Screen.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 37, "bytes": 1081, "inhalt": "import { ScrollView, StyleSheet, View, type ViewStyle } from \"react-native\";\nimport { SafeAreaView } from \"react-native-safe-area-context\";\nimport { colors, spacing } from \"@jobflow/config\";\n\ninterface Props {\n  children: React.ReactNode;\n  scroll?: boolean;\n  style?: ViewStyle;\n}\n\n/** Grundgerüst jedes Screens: sicherer Bereich, Hintergrund, großzügige Abstände. */\nexport function Screen({ children, scroll = true, style }: Props) {\n  const content = <View style={[styles.content, style]}>{children}<\/View>;\n\n  return (\n    <SafeAreaView style={styles.safe} edges={[\"top\", \"left\", \"right\"]}>\n      {scroll ? (\n        <ScrollView\n          contentContainerStyle={styles.scroll}\n          keyboardShouldPersistTaps=\"handled\"\n          showsVerticalScrollIndicator={false}\n        >\n          {content}\n        <\/ScrollView>\n      ) : (\n        content\n      )}\n    <\/SafeAreaView>\n  );\n}\n\nconst styles = StyleSheet.create({\n  safe: { flex: 1, backgroundColor: colors.background },\n  scroll: { flexGrow: 1 },\n  content: { flex: 1, padding: spacing.lg, gap: spacing.lg },\n});\n"}, {"pfad": "apps/mobile/components/StatusTimeline.tsx", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 75, "bytes": 2869, "inhalt": "import { StyleSheet, Text, View } from \"react-native\";\nimport { colors, requestTimeline, spacing, typography } from \"@jobflow/config\";\nimport type { RequestStatus } from \"@jobflow/types\";\n\n/**\n * Der Fortschritt einer Anfrage als Zeitstrahl.\n *\n * Das ist kein Schmuck: Vertrauen entsteht daraus, dass der Kunde jederzeit\n * sieht, wo sein Anliegen steht - gerade wenn zwischen Anfrage und Termin\n * mehrere Tage liegen.\n */\nconst ORDER: RequestStatus[] = [\"OPEN\", \"MATCHING\", \"OFFERED\", \"ACCEPTED\", \"COMPLETED\"];\n\ninterface Props {\n  status: RequestStatus;\n}\n\nexport function StatusTimeline({ status }: Props) {\n  // DRAFT und ANALYZING liegen vor dem ersten Schritt, CANCELLED daneben.\n  const currentIndex = ORDER.indexOf(status);\n\n  return (\n    <View style={styles.wrapper} accessibilityRole=\"progressbar\">\n      {requestTimeline.map((step, index) => {\n        const done = currentIndex > index;\n        const active = currentIndex === index;\n        return (\n          <View key={step.status} style={styles.row}>\n            <View style={styles.markerColumn}>\n              <View style={[styles.marker, done ? styles.markerDone : active ? styles.markerActive : styles.markerOpen]}>\n                <Text style={[styles.markerText, done || active ? styles.markerTextOn : null]}>\n                  {done ? \"✓\" : active ? \"●\" : \"○\"}\n                <\/Text>\n              <\/View>\n              {index < requestTimeline.length - 1 ? (\n                <View style={[styles.connector, done ? styles.connectorDone : null]} />\n              ) : null}\n            <\/View>\n            <Text style={[styles.label, done || active ? styles.labelReached : null]}>{step.label}<\/Text>\n          <\/View>\n        );\n      })}\n      {status === \"CANCELLED\" ? <Text style={styles.cancelled}>Diese Anfrage wurde zurückgezogen.<\/Text> : null}\n    <\/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrapper: { gap: 0 },\n  row: { flexDirection: \"row\", gap: spacing.md },\n  markerColumn: { alignItems: \"center\", width: 28 },\n  marker: {\n    width: 24,\n    height: 24,\n    borderRadius: 12,\n    alignItems: \"center\",\n    justifyContent: \"center\",\n  },\n  markerDone: { backgroundColor: colors.success },\n  markerActive: { backgroundColor: colors.primary },\n  markerOpen: { backgroundColor: colors.surfaceMuted },\n  markerText: { fontSize: typography.sizes.caption, color: colors.textMuted },\n  markerTextOn: { color: colors.textInverted },\n  connector: { width: 2, flex: 1, minHeight: 20, backgroundColor: colors.border },\n  connectorDone: { backgroundColor: colors.success },\n  label: {\n    flex: 1,\n    fontSize: typography.sizes.small,\n    color: colors.textMuted,\n    paddingBottom: spacing.lg,\n  },\n  labelReached: { color: colors.text, fontWeight: typography.weights.medium },\n  cancelled: { fontSize: typography.sizes.small, color: colors.error, marginTop: spacing.sm },\n});\n"}, {"pfad": "apps/mobile/lib/api.ts", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 96, "bytes": 3051, "inhalt": "import Constants from \"expo-constants\";\nimport type { ApiResponse } from \"@jobflow/types\";\n\n/**\n * Der zentrale API-Client.\n *\n * Die Adresse steht in der Konfiguration, nicht im Quelltext - sonst lässt\n * sich die App nicht gegen verschiedene Umgebungen betreiben. Geheimnisse\n * gehören ohnehin nie in eine mobile App: alles, was in ihr steckt, kann\n * ausgelesen werden.\n */\nconst API_URL =\n  (Constants.expoConfig?.extra?.[\"apiUrl\"] as string | undefined) ??\n  process.env[\"EXPO_PUBLIC_API_URL\"] ??\n  \"http://localhost:4000\";\n\n/** Fehler mit dem Code aus der einheitlichen Antwortstruktur. */\nexport class ApiClientError extends Error {\n  readonly code: string;\n  readonly status: number;\n  readonly fields: Record<string, string>;\n\n  constructor(status: number, code: string, message: string, fields: Record<string, string> = {}) {\n    super(message);\n    this.name = \"ApiClientError\";\n    this.status = status;\n    this.code = code;\n    this.fields = fields;\n  }\n}\n\nlet authToken: string | null = null;\n\nexport function setAuthToken(token: string | null): void {\n  authToken = token;\n}\n\ninterface RequestOptions {\n  method?: \"GET\" | \"POST\" | \"PATCH\" | \"DELETE\";\n  body?: unknown;\n  signal?: AbortSignal;\n}\n\n/**\n * Führt einen API-Aufruf aus und packt die Hülle { success, data, error }\n * aus. Die Screens bekommen dadurch entweder die Nutzdaten oder eine\n * Ausnahme - und müssen nicht jedes Mal dasselbe prüfen.\n */\nexport async function apiCall<T>(path: string, options: RequestOptions = {}): Promise<T> {\n  const { method = \"GET\", body, signal } = options;\n\n  const headers: Record<string, string> = { accept: \"application/json\" };\n  if (body !== undefined) headers[\"content-type\"] = \"application/json\";\n  if (authToken !== null) headers[\"authorization\"] = `Bearer ${authToken}`;\n\n  let response: Response;\n  try {\n    response = await fetch(`${API_URL}${path}`, {\n      method,\n      headers,\n      ...(body === undefined ? {} : { body: JSON.stringify(body) }),\n      ...(signal ? { signal } : {}),\n    });\n  } catch (error) {\n    // Kein Netz, falsche Adresse, Server nicht erreichbar. Der Nutzer soll\n    // etwas Verständliches lesen, keinen fetch-Fehler.\n    throw new ApiClientError(0, \"NETWORK_ERROR\", \"Keine Verbindung zu JobFlow. Bist du online?\");\n  }\n\n  let payload: ApiResponse<T>;\n  try {\n    payload = (await response.json()) as ApiResponse<T>;\n  } catch {\n    throw new ApiClientError(response.status, \"INTERNAL_ERROR\", \"Unerwartete Antwort vom Server.\");\n  }\n\n  if (!payload.success) {\n    throw new ApiClientError(\n      response.status,\n      payload.error.code,\n      payload.error.message,\n      payload.error.fields ?? {},\n    );\n  }\n  return payload.data;\n}\n\nexport const api = {\n  get: <T>(path: string) => apiCall<T>(path),\n  post: <T>(path: string, body?: unknown) => apiCall<T>(path, { method: \"POST\", body: body ?? {} }),\n  patch: <T>(path: string, body: unknown) => apiCall<T>(path, { method: \"PATCH\", body }),\n  delete: <T>(path: string) => apiCall<T>(path, { method: \"DELETE\" }),\n};\n\nexport { API_URL };\n"}, {"pfad": "apps/mobile/lib/format.ts", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 36, "bytes": 1059, "inhalt": "/**\n * Anzeigeformate.\n *\n * Gerechnet wird überall in Cent - Gleitkommazahlen haben bei Geld nichts zu\n * suchen. Umgerechnet wird erst hier, unmittelbar vor der Anzeige.\n */\nexport function formatEuro(cents: number): string {\n  return `${(cents / 100).toFixed(2).replace(\".\", \",\")} €`;\n}\n\nexport function formatEuroShort(cents: number): string {\n  return `${Math.round(cents / 100)} €`;\n}\n\nexport function formatKm(km: number): string {\n  return km < 10 ? `${km.toFixed(1).replace(\".\", \",\")} km` : `${Math.round(km)} km`;\n}\n\nexport function formatMinutes(minutes: number): string {\n  return minutes < 60 ? `${Math.round(minutes)} Min.` : `${Math.round(minutes / 60)} Std.`;\n}\n\nexport function formatDate(iso: string): string {\n  return new Date(iso).toLocaleDateString(\"de-DE\", { day: \"2-digit\", month: \"2-digit\", year: \"numeric\" });\n}\n\nexport function formatDateTime(iso: string): string {\n  return new Date(iso).toLocaleString(\"de-DE\", {\n    weekday: \"long\",\n    day: \"numeric\",\n    month: \"long\",\n    hour: \"2-digit\",\n    minute: \"2-digit\",\n  });\n}\n"}, {"pfad": "apps/mobile/lib/session.ts", "bereich": "Mobile-App", "sprache": "typescript", "zeilen": 54, "bytes": 1677, "inhalt": "import { createContext, useContext } from \"react\";\nimport * as SecureStore from \"expo-secure-store\";\nimport type { AuthResult, User } from \"@jobflow/types\";\nimport { setAuthToken } from \"./api.js\";\n\n/**\n * Sitzungsverwaltung.\n *\n * Das Token liegt im sicheren Speicher des Geräts (Keychain bzw. Keystore),\n * nicht in AsyncStorage: dort wäre es auf einem entsperrten oder gerooteten\n * Gerät im Klartext lesbar.\n */\nconst TOKEN_KEY = \"jobflow.session.token\";\n\nexport interface SessionState {\n  user: User | null;\n  loading: boolean;\n  signIn(result: AuthResult): Promise<void>;\n  signOut(): Promise<void>;\n  refresh(): Promise<void>;\n}\n\nexport const SessionContext = createContext<SessionState | null>(null);\n\nexport function useSession(): SessionState {\n  const session = useContext(SessionContext);\n  if (session === null) {\n    throw new Error(\"useSession darf nur innerhalb des SessionProvider verwendet werden.\");\n  }\n  return session;\n}\n\nexport async function readStoredToken(): Promise<string | null> {\n  try {\n    return await SecureStore.getItemAsync(TOKEN_KEY);\n  } catch {\n    // Auf manchen Geräten ist der sichere Speicher nicht verfügbar. Dann\n    // muss sich der Nutzer eben neu anmelden - das ist besser, als das Token\n    // ersatzweise ungeschützt abzulegen.\n    return null;\n  }\n}\n\nexport async function storeToken(token: string | null): Promise<void> {\n  setAuthToken(token);\n  try {\n    if (token === null) await SecureStore.deleteItemAsync(TOKEN_KEY);\n    else await SecureStore.setItemAsync(TOKEN_KEY, token);\n  } catch {\n    // Siehe oben: nicht speichern zu können ist unschön, aber kein Grund,\n    // die Anmeldung scheitern zu lassen.\n  }\n}\n"}, {"pfad": "apps/mobile/metro.config.js", "bereich": "Mobile-App", "sprache": "javascript", "zeilen": 29, "bytes": 932, "inhalt": "/**\n * Metro-Konfiguration fuer das Monorepo.\n *\n * Ohne diese Einstellungen findet Metro die Pakete unter packages/ nicht:\n * pnpm legt Abhaengigkeiten als Symlinks ab, und Metro sucht standardmaessig\n * nur im node_modules der App.\n */\nconst path = require(\"node:path\");\nconst { getDefaultConfig } = require(\"expo/metro-config\");\n\nconst projectRoot = __dirname;\nconst workspaceRoot = path.resolve(projectRoot, \"../..\");\n\nconst config = getDefaultConfig(projectRoot);\n\n// Aenderungen an den geteilten Paketen sollen die App neu laden.\nconfig.watchFolders = [workspaceRoot];\n\n// Erst im eigenen node_modules suchen, dann im Wurzelverzeichnis.\nconfig.resolver.nodeModulesPaths = [\n  path.resolve(projectRoot, \"node_modules\"),\n  path.resolve(workspaceRoot, \"node_modules\"),\n];\n\n// pnpm-Symlinks nicht aufloesen - sonst liegt derselbe Code doppelt im Bundle.\nconfig.resolver.disableHierarchicalLookup = true;\n\nmodule.exports = config;\n"}, {"pfad": "apps/mobile/package.json", "bereich": "Mobile-App", "sprache": "json", "zeilen": 34, "bytes": 958, "inhalt": "{\n  \"name\": \"@jobflow/mobile\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"main\": \"expo-router/entry\",\n  \"description\": \"JobFlow für iOS und Android. Eine Codebasis, zwei Rollen: Kunde und Unternehmen.\",\n  \"scripts\": {\n    \"start\": \"expo start\",\n    \"android\": \"expo start --android\",\n    \"ios\": \"expo start --ios\",\n    \"typecheck\": \"tsc -p tsconfig.json --noEmit\"\n  },\n  \"dependencies\": {\n    \"@jobflow/config\": \"workspace:*\",\n    \"@jobflow/types\": \"workspace:*\",\n    \"@jobflow/validation\": \"workspace:*\",\n    \"expo\": \"^57.0.18\",\n    \"expo-constants\": \"^57.0.16\",\n    \"expo-linking\": \"^57.0.8\",\n    \"expo-router\": \"^57.0.17\",\n    \"expo-secure-store\": \"^57.0.2\",\n    \"expo-status-bar\": \"^57.0.1\",\n    \"react\": \"^19.2.3\",\n    \"react-dom\": \"^19.2.3\",\n    \"react-native\": \"0.87.1\",\n    \"react-native-safe-area-context\": \"^5.9.1\",\n    \"react-native-screens\": \"^4.27.0\"\n  },\n  \"devDependencies\": {\n    \"@types/react\": \"^19.2.0\",\n    \"typescript\": \"^5.9.3\"\n  }\n}\n"}, {"pfad": "apps/mobile/tsconfig.json", "bereich": "Mobile-App", "sprache": "json", "zeilen": 13, "bytes": 275, "inhalt": "{\n  \"extends\": \"expo/tsconfig.base\",\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"noUncheckedIndexedAccess\": true,\n    \"paths\": {\n      \"@/*\": [\"./*\"]\n    }\n  },\n  \"include\": [\"**/*.ts\", \"**/*.tsx\", \".expo/types/**/*.ts\", \"expo-env.d.ts\"],\n  \"exclude\": [\"node_modules\"]\n}\n"}, {"pfad": "apps/admin/README.md", "bereich": "Weitere Apps", "sprache": "markdown", "zeilen": 24, "bytes": 1068, "inhalt": "# apps/admin — noch nicht gebaut\n\nHier entsteht die Administration: Unternehmen prüfen, Meldungen bearbeiten,\nKategorien verwalten, Nutzer sperren.\n\n**Warum noch nicht:** Eine Admin-Oberfläche wird in dem Moment gebraucht, in\ndem echte Nutzer dazukommen — nicht vorher. Was sie können muss, hängt davon\nab, welche Fälle tatsächlich auftreten.\n\n**Was schon steht:** Das Datenmodell trägt die Administration bereits:\n\n- `users.blocked_at` — gesperrte Konten können sich nicht anmelden, und\n  bestehende Sessions verlieren sofort ihre Gültigkeit\n  (`AuthService.authenticate` prüft das bei jeder Anfrage).\n- `businesses.verified` / `verified_at` — die Unternehmensverifizierung.\n- `categories` — Kategorien sind Daten und lassen sich pflegen, ohne die\n  Anwendung neu auszuliefern.\n- `audit_log` — jede sicherheitsrelevante Aktion ist protokolliert.\n- `analytics_events` — der Funnel von der Anfrage bis zum Auftrag.\n\nEs fehlt die Oberfläche darauf, nicht das Fundament darunter.\n\nGeplant für Phase 5 (siehe `docs/product/entwicklungsplan.md`).\n"}, {"pfad": "apps/web/README.md", "bereich": "Weitere Apps", "sprache": "markdown", "zeilen": 16, "bytes": 736, "inhalt": "# apps/web — noch nicht gebaut\n\nHier entsteht das Web-Dashboard für Unternehmen (Next.js + TypeScript).\n\n**Warum noch nicht:** Ein Betrieb verwaltet seine Aufträge lieber am Computer\nals am Telefon — das Web-Dashboard ist also wichtig. Es ist aber erst dann\nsinnvoll, wenn feststeht, welche Ansichten ein Betrieb im Alltag wirklich\nbraucht. Das zeigt sich an der Nutzung der Mobile-App, nicht am Reissbrett.\n\n**Was schon steht:** Die Bausteine, die die Web-App verwenden wird, sind\nfertig — `@jobflow/types`, `@jobflow/validation` und `@jobflow/config` sind\nbewusst frei von React-Native-Abhängigkeiten und laufen unverändert in\nNext.js. Die API ist dieselbe.\n\nGeplant für Phase 5 (siehe `docs/product/entwicklungsplan.md`).\n"}, {"pfad": "docs/api/endpunkte.md", "bereich": "Dokumentation", "sprache": "markdown", "zeilen": 165, "bytes": 6382, "inhalt": "# API\n\nBasisadresse in der Entwicklung: `http://localhost:4000`\n\n## Antwortstruktur\n\nJede Antwort hat dieselbe Hülle — im Erfolgs- wie im Fehlerfall. Die\nFrontends müssen so nie pro Endpunkt raten, wie eine Antwort aussieht.\n\n```json\n{ \"success\": true, \"data\": { }, \"error\": null }\n```\n\n```json\n{\n  \"success\": false,\n  \"data\": null,\n  \"error\": {\n    \"code\": \"VALIDATION_FAILED\",\n    \"message\": \"Bitte prüfe deine Eingaben.\",\n    \"fields\": { \"password\": \"Bitte mindestens 10 Zeichen angeben.\" }\n  }\n}\n```\n\n`fields` ordnet Fehlermeldungen den Eingabefeldern zu — die App kann sie\ndirekt unter dem betroffenen Feld anzeigen.\n\n### Fehlercodes\n\n| Code | Status | Bedeutung |\n|---|---|---|\n| `VALIDATION_FAILED` | 422 | Eingaben unvollständig oder ungueltig |\n| `UNAUTHENTICATED` | 401 | Kein oder ungueltiges Token |\n| `FORBIDDEN` | 403 | Angemeldet, aber nicht berechtigt |\n| `NOT_FOUND` | 404 | Gibt es nicht — **oder gehört jemand anderem** |\n| `CONFLICT` | 409 | Zustand passt nicht (Angebot bereits angenommen o. ae.) |\n| `RATE_LIMITED` | 429 | Zu viele Anfragen, `Retry-After` beachten |\n| `AI_UNAVAILABLE` | 503 | Die Analyse ist gerade nicht möglich |\n| `INTERNAL_ERROR` | 500 | Fehler auf Serverseite |\n\n## Anmeldung\n\nNach `register` oder `login` gibt es ein Token. Es gehört in jeden weiteren\nAufruf:\n\n```\nAuthorization: Bearer <token>\n```\n\n| Methode | Pfad | Rolle | Zweck |\n|---|---|---|---|\n| POST | `/auth/register` | — | Konto anlegen (`CUSTOMER` oder `BUSINESS`) |\n| POST | `/auth/login` | — | Anmelden |\n| POST | `/auth/logout` | angemeldet | Diese Session beenden |\n| POST | `/auth/logout-all` | angemeldet | Auf allen Geräten abmelden |\n| GET | `/me` | angemeldet | Eigenes Konto |\n\nEin `BUSINESS`-Konto bekommt bei der Registrierung sofort ein — zunächst\nleeres — Unternehmensprofil. Sonst müsste jede spätere Abfrage den Sonderfall\n\"Konto ohne Unternehmen\" behandeln.\n\n## Kategorien\n\n| Methode | Pfad | Rolle | Zweck |\n|---|---|---|---|\n| GET | `/categories` | öffentlich | Alle aktiven Kategorien |\n| GET | `/categories/tree` | öffentlich | Als Baum, für die Startseite |\n\n## Anfragen\n\n| Methode | Pfad | Rolle | Zweck |\n|---|---|---|---|\n| POST | `/requests` | CUSTOMER | Anfrage anlegen |\n| GET | `/requests` | CUSTOMER | Eigene Anfragen (`?limit=&offset=`) |\n| GET | `/requests/:id` | Beteiligte | Anfrage lesen |\n| PATCH | `/requests/:id` | CUSTOMER | Ändern, solange keine Angebote vorliegen |\n| DELETE | `/requests/:id` | CUSTOMER | Zurückziehen |\n\n`GET /requests/:id` liefert die Anfrage an den Kunden **und** an jedes\nUnternehmen, dem sie vorgeschlagen wurde — vorher nicht.\n\n## KI\n\n| Methode | Pfad | Rolle | Zweck |\n|---|---|---|---|\n| POST | `/requests/:id/analyze` | CUSTOMER | Analysieren lassen |\n| GET | `/requests/:id/analysis` | Beteiligte | Jüngste Analyse mit Rückfragen |\n| POST | `/requests/:id/questions/:questionId` | CUSTOMER | Rückfrage beantworten |\n| POST | `/offers/suggest-text` | BUSINESS | Textvorschlag für ein Angebot |\n| POST | `/conversations/:id/suggest-reply` | Beteiligte | Antwortvorschlag |\n\nDie Vorschläge werden **zurückgegeben, nicht abgeschickt**. Sie tragen\n`isAiGenerated: true`, damit die Oberfläche sie kennzeichnen kann.\n\n## Unternehmen\n\n| Methode | Pfad | Rolle | Zweck |\n|---|---|---|---|\n| GET | `/businesses/me` | BUSINESS | Eigenes Profil |\n| PATCH | `/businesses/me` | Inhaber | Profil pflegen |\n| GET | `/businesses/me/statistics` | BUSINESS | Kennzahlen |\n| GET/POST | `/businesses/me/services` | BUSINESS | Leistungen |\n| DELETE | `/businesses/me/services/:id` | Inhaber | Leistung deaktivieren |\n| GET/POST | `/businesses/me/availability` | BUSINESS | Wochenplan |\n| GET | `/businesses/me/matches` | BUSINESS | Vorgeschlagene Anfragen |\n| GET | `/businesses/me/offers` | BUSINESS | Eigene Angebote |\n| GET | `/businesses/:id` | öffentlich | Öffentliches Profil |\n| GET | `/businesses/:id/reviews` | öffentlich | Bewertungen |\n| GET | `/businesses/:id/availability` | angemeldet | Freie Zeitfenster |\n\nEs gibt bewusst **keinen** Endpunkt, mit dem ein Unternehmen eine fremde\nUnternehmens-ID übergeben könnte. `/businesses/me` bezieht sich immer auf das\neigene — die ID kommt aus der Session, nicht aus der Anfrage.\n\n## Matching, Angebote, Termine, Aufträge\n\n| Methode | Pfad | Rolle | Zweck |\n|---|---|---|---|\n| POST | `/requests/:id/matches` | CUSTOMER | Anbieter suchen |\n| GET | `/requests/:id/matches` | CUSTOMER | Vorschläge mit Begründung |\n| POST | `/matches/:id/respond` | BUSINESS | Annehmen oder ablehnen |\n| POST | `/offers` | BUSINESS | Angebot abgeben |\n| GET | `/requests/:id/offers` | CUSTOMER | Angebote vergleichen |\n| GET | `/offers/:id` | Beteiligte | Angebot lesen |\n| POST | `/offers/:id/accept` | CUSTOMER | Annehmen → Auftrag entsteht |\n| POST | `/offers/:id/decline` | CUSTOMER | Ablehnen |\n| POST | `/offers/:id/withdraw` | BUSINESS | Zurückziehen |\n| POST | `/appointments` | Beteiligte | Termin buchen |\n| DELETE | `/appointments/:id` | Beteiligte | Absagen |\n| GET | `/jobs`, `/jobs/:id` | Beteiligte | Aufträge |\n| PATCH | `/jobs/:id/status` | siehe unten | Fortschritt melden |\n| POST | `/reviews` | CUSTOMER | Abgeschlossenen Auftrag bewerten |\n\n`POST /offers/:id/accept` ist der wichtigste Zustandswechsel der Plattform und\nlaeuft in **einer** Transaktion: Angebot annehmen, übrige Angebote ablehnen,\nAnfrage umstellen, Auftrag anlegen, Gespräch eröffnen. Entweder alles oder\nnichts.\n\n`PATCH /jobs/:id/status`: Den Fortschritt (`IN_PROGRESS`, `COMPLETED`) meldet\ndas ausführende Unternehmen — das ist seine Aussage, nicht die des Kunden.\nAbbrechen (`CANCELLED`) dürfen beide Seiten.\n\n## Chat\n\n| Methode | Pfad | Rolle | Zweck |\n|---|---|---|---|\n| GET | `/conversations` | angemeldet | Eigene Gespräche |\n| GET | `/conversations/:id/messages` | Beteiligte | Verlauf |\n| POST | `/conversations/:id/messages` | Beteiligte | Nachricht senden |\n\nNachrichten tragen `isAiGenerated`. Die Oberfläche muss das sichtbar machen —\nein KI-Text darf nicht aussehen, als hätte ihn ein Mensch geschrieben.\n\n## Rate Limiting\n\n| Bereich | Grenze |\n|---|---|\n| Registrierung, Anmeldung | 10 je 15 Minuten und IP-Bereich |\n| Schreibende Aufrufe | 60 je Minute und Nutzer |\n| KI-Aufrufe | 20 je Minute und Nutzer |\n| Lesende Aufrufe | 300 je Minute und Nutzer |\n\nBei 429 nennt der `Retry-After`-Header die Wartezeit in Sekunden.\n"}, {"pfad": "docs/architecture/uebersicht.md", "bereich": "Dokumentation", "sprache": "markdown", "zeilen": 144, "bytes": 6378, "inhalt": "# Architektur\n\n## Der Aufbau in einem Bild\n\n```\n        KUNDEN-APP            ANBIETER-APP\n        (React Native, eine Codebasis, zwei Oberflächen)\n              │                     │\n              └──────────┬──────────┘\n                         │  REST, Bearer-Token\n                         ▼\n                    services/api\n                (modularer Monolith)\n                         │\n    ┌────────────────────┼────────────────────┐\n    ▼                    ▼                    ▼\n  Auth              KI-Service            Matching\n  Sessions          (austauschbar)        (reine Funktion)\n    │                    │                    │\n    └────────────────────┼────────────────────┘\n                         ▼\n                   PostgreSQL\n                         │\n                   Object Storage (Fotos, später)\n```\n\n## Warum ein modularer Monolith\n\nAlles laeuft als eine Anwendung, ist innen aber nach Fachbereichen getrennt:\n`auth`, `requests`, `ai`, `matching`, `offers`, `appointments`, `jobs`,\n`conversations`, `reviews`.\n\nDie Regel dabei: **kein Modul greift auf die Tabellen eines anderen zu**,\nsondern nur auf dessen Service. Genau diese Trennung macht es später möglich,\neinen Bereich herauszulösen, wenn er wirklich eigene Ressourcen braucht.\n\nMicroservices von Anfang an wären hier der falsche Preis: man bezahlt sofort\nmit verteilten Transaktionen, Netzwerkfehlern und Betriebsaufwand — und kauft\nsich dafür eine Skalierbarkeit, die bei null Nutzern niemand braucht.\n\n## Die drei Entscheidungen, auf die es ankommt\n\n### 1. Die KI schreibt nie in die Datenbank\n\n```\nApp  →  API  →  KI-Service  →  Ergebnis  →  Validierung  →  Datenbank\n                                              ▲\n                                     dasselbe Schema wie\n                                   für Eingaben aus der App\n```\n\nEin Sprachmodell ist keine vertraünswürdige Quelle. Es kann Felder\nweglassen, Werte erfinden oder eine Kategorie nennen, die es nicht gibt. Das\nErgebnis geht deshalb durch `aiAnalysisResultSchema`, und ein unbekannter\nKategorie-Slug wird verworfen statt übernommen\n(`services/api/src/modules/ai/service.ts`).\n\nDer Provider steckt hinter einer Schnittstelle (`AiProvider`). Mitgeliefert\nist ein regelbasierter Provider, der denselben Vertrag erfüllt — damit lässt\nsich die gesamte Plattform ohne externen Dienst entwickeln und testen. Der\nWechsel auf ein Sprachmodell ist eine Zeile in der Konfiguration.\n\nEbenso wichtig: **die KI trifft keine verbindlichen Entscheidungen.** Sie\nschlägt einen Angebotstext vor — über Preis und Inhalt entscheidet das\nUnternehmen. Sie erkennt eine Kategorie — überschreibt aber nie die Wahl des\nKunden.\n\n### 2. Berechtigungen werden im Backend erzwungen, nicht in der App\n\nJede Abfrage, die fremde Daten liefern könnte, trägt die Prüfung in der\nSQL-Bedingung — nicht in einem `if` davor. Beispiel aus\n`RequestService.getForUser`:\n\n```sql\nWHERE r.id = $1\n  AND (\n    r.customer_id = $2\n    OR EXISTS (            -- oder ein Unternehmen, dem sie vorgeschlagen wurde\n      SELECT 1 FROM matches m\n      JOIN business_members bm ON bm.business_id = m.business_id\n      WHERE m.request_id = r.id AND bm.user_id = $2\n    )\n  )\n```\n\nFremde Objekte antworten mit **404, nicht 403**. Ein 403 würde bestätigen,\ndass es das Objekt gibt — damit ließen sich durch Durchprobieren gültige IDs\nfinden.\n\n### 3. Wichtige Regeln stehen im Schema, nicht nur im Code\n\nAnwendungslogik hat Fehler. Eine Datenbankzusicherung nicht.\n\n- `offers.total_cents` ist eine generierte Spalte — die Summe kann gar nicht\n  von den Positionen abweichen.\n- `offers_one_accepted_per_request` ist ein Teilindex — zu einer Anfrage kann\n  höchstens ein Angebot angenommen sein, auch bei gleichzeitigen Aufrufen.\n- `reviews.job_id` ist UNIQUE und verweist auf einen Auftrag — ohne echten,\n  abgeschlossenen Auftrag gibt es keine Bewertung. Das ist der einfachste\n  wirksame Schutz gegen erfundene Rezensionen.\n\n## Sessions statt reiner Tokens\n\nDas Token des Clients ist ein Zufallswert; die Datenbank speichert nur dessen\nHMAC. Wer die Datenbank liest, kann sich damit nicht anmelden.\n\nBewusst **kein JWT ohne Serverzustand**: eine Abmeldung oder Sperrung soll\nsofort wirken. Ein signiertes Token, das niemand zurückziehen kann, gilt bis\nzum Ablauf weiter — bei einem gesperrten Konto ist das nicht hinnehmbar.\n\n## Das Matching\n\nDie Bewertung ist eine reine Funktion ohne Datenbankzugriff\n(`modules/matching/engine.ts`). Die Datenbank übernimmt nur die Vorauswahl:\nKategorie, Einsatzradius, keine bereits abgelehnten Betriebe.\n\n```\nPassende Leistung   35        Ein Betrieb außerhalb seines Einsatzradius\nEntfernung          20        bekommt 0 Entfernungspunkte - er fährt\nVerfügbarkeit      15        nicht hin, egal wie gut er sonst passt.\nBewertung           10\nPreis               10        Wenige Bestbewertungen werden gedämpft:\nErfahrung            5        5,0 aus einer Bewertung soll 4,7 aus 200\nAntwortzeit          5        nicht überholen.\n──────────────────────\n                   100        Fehlende Angaben zählen neutral (0,5),\n                              nicht als Ausschluss - sonst hätten neue\n                              Betriebe nie eine Chance.\n```\n\nDie Gewichte sind ein **Startmodell, keine Wahrheit**. Welche Faktoren\ntatsächlich zu Aufträgen führen, zeigt sich erst im Betrieb — deshalb liegen\nsie an einer Stelle und getrennt von den Abfragen.\n\n## Was bewusst noch fehlt\n\n| Fehlt | Warum |\n|---|---|\n| Foto-Upload | Braucht Object Storage **und** Zugriffsschutz. Halb gebaut wäre er ein Sicherheitsproblem: Fotos zeigen Wohnungen. |\n| Zahlungen | Erst wenn Matching und Angebote nachweislich funktionieren. Kartendaten speichert JobFlow ohnehin nie selbst. |\n| Push-Nachrichten | Braucht Geräteregistrierung und einen Zustelldienst. |\n| Web- und Admin-App | Siehe `apps/web/README.md` und `apps/admin/README.md`. |\n| Mehrere Instanzen | Das Rate Limiting zählt im Arbeitsspeicher. Ab der zweiten Instanz gehört der Zähler in einen gemeinsamen Speicher. |\n"}, {"pfad": "docs/product/entwicklungsplan.md", "bereich": "Dokumentation", "sprache": "markdown", "zeilen": 97, "bytes": 3000, "inhalt": "# Entwicklungsplan\n\n## Was fertig ist\n\n### Phase 0 — Fundament ✅\n\n- Monorepo mit pnpm-Workspaces\n- PostgreSQL-Schema, zehn Migrationen mit Prüfsummenschutz\n- Seed-Daten: 6 Ober- und 22 Unterkategorien\n- Geteilte Typen, Validierung und Design-Tokens\n- Authentifizierung, Rollen, Sessions\n- 104 Tests, davon 22 gegen eine echte Datenbank\n\n### Phase 1 — Kunden ✅ (ohne Fotos)\n\n- Registrierung und Anmeldung\n- Startseite, Kategorien\n- Anfrage erstellen, ansehen, ändern, zurückziehen\n- KI-Analyse mit gezielten Rückfragen\n- „Meine Anfragen\"\n\n### Phase 2 — Unternehmen ✅\n\n- Unternehmensprofil, Leistungen, Verfügbarkeit\n- Dashboard mit Kennzahlen\n- Vorgeschlagene Anfragen öffnen\n\n### Phase 3 — Matching ✅\n\n- Matching-Engine mit den Gewichten aus dem Konzept\n- Nachvollziehbare Begründungen je Vorschlag\n- Verteilung der Anfragen an passende Betriebe\n\n### Phase 4 — Aufträge ✅ (Backend vollständig)\n\n- Angebote erstellen, annehmen, ablehnen, zurückziehen\n- Termine aus dem Wochenplan\n- Chat je Anfrage und Unternehmen\n- Auftragsstatus mit geprueften Übergängen\n- Bewertungen\n\n## Was als Nächstes kommt\n\n### Phase 4b — Fotos\n\nDer einzige Teil von Phase 1 bis 4, der noch fehlt. Er braucht Object Storage\n**und** Zugriffsschutz: Fotos zeigen Wohnungen und Häuser, und eine öffentlich\nerratbare URL wäre ein ernstes Datenschutzproblem. Das Schema ist vorbereitet\n(`request_photos.storage_key` — ein Schluessel, keine URL).\n\nKonkret:\n1. Object Storage anbinden, Upload über die API (nie direkt vom Client).\n2. Zugriff nur über die API mit derselben Berechtigungsprüfung wie bei der\n   Anfrage.\n3. Bildtyp und -größe serverseitig prüfen, nicht dem Client glauben.\n\n### Phase 5 — Business\n\n- Abonnements (**erst nachdem echte Nutzer die Zahlungsbereitschaft gezeigt\n  haben** — siehe `konzept.md`)\n- Web-Dashboard für Unternehmen (`apps/web`)\n- Administration (`apps/admin`)\n- Unternehmensverifizierung als Ablauf\n- Push-Nachrichten und E-Mail\n\n### Phase 6 — Skalierung\n\nErst, wenn echte Nutzerzahlen es rechtfertigen:\n\n- Rate Limiting in einen gemeinsamen Speicher (für mehrere Instanzen)\n- Caching der Kategorien\n- Suche\n- Lasttests\n- Monitoring\n\n### Phase 7 — weitere Branchen\n\nTechnisch bereits möglich: Kategorien sind Daten. Eine neue Branche ist eine\nZeile in `categories`, kein Umbau.\n\n## Der nächste sinnvolle Schritt\n\n**Echte Nutzer, eine Stadt, eine Branche.**\n\nDie Plattform kann den kompletten Weg von der Anfrage bis zur Bewertung. Was\nsie noch nicht kann, ist beantworten, ob Menschen sie benutzen wollen — und\ndiese Frage beantwortet kein weiteres Feature, sondern nur der Betrieb.\n\nKonkret wäre zu messen:\n- Wie viele Anfragen erreichen überhaupt ein Angebot?\n- Wie lange brauchen Betriebe wirklich zum Antworten?\n- Stimmen die Gewichte des Matchings, oder führen ganz andere Faktoren zu\n  Aufträgen?\n\nAuf diese Antworten sind die Gewichte, die Preise und die Rückfragen der KI\nbewusst so gebaut, dass sie sich ändern lassen.\n"}, {"pfad": "docs/product/konzept.md", "bereich": "Dokumentation", "sprache": "markdown", "zeilen": 127, "bytes": 4754, "inhalt": "# JobFlow — das Produkt\n\n> **Von der Anfrage zum Auftrag.**\n\n## Die Idee\n\nNicht: „Hier ist eine Liste von Handwerkern.\" Das gibt es bereits.\n\nSondern: „Sag uns einfach, was los ist. Wir kümmern uns um den Rest.\"\n\nDer Kunde beschreibt sein Problem in einem Satz. Die KI versteht es, fragt nur\ndas Nötige nach und macht daraus eine strukturierte Anfrage. JobFlow findet\npassende Anbieter, der Kunde vergleicht Angebote, wählt einen Termin — fertig.\n\n## Der Ablauf\n\n```\nKUNDE                                          UNTERNEHMEN\n\n\"Meine Heizung wird\n nicht mehr warm.\"\n      │\n      ▼\n   KI-Analyse\n   Kategorie: Heizung\n   Dringlichkeit: normal\n      │\n      ▼\n   2 Rückfragen\n   (nicht 30 Felder)\n      │\n      ▼\n   Matching  ─────────────────────────────►  Neue Anfrage\n   6 passende Betriebe                       + KI-Zusammenfassung\n                                             + 4,2 km entfernt\n                                                     │\n   3 Angebote  ◄─────────────────────────────  Angebot 120 €\n      │                                       (KI schlägt Text vor,\n      ▼                                        der Betrieb entscheidet)\n   Angebot annehmen  ─────────────────────►  Auftrag\n      │                                             │\n      ▼                                             ▼\n   Termin wählen                            Termin bestätigt\n      │                                             │\n      ▼                                             ▼\n   Auftrag laeuft  ◄──────── Chat ────────►  Auftrag abschließen\n      │\n      ▼\n   ⭐⭐⭐⭐⭐\n```\n\n## Was die KI darf — und was nicht\n\n| Die KI darf | Die KI darf nicht |\n|---|---|\n| Das Problem verstehen und einordnen | Die Kategorie des Kunden überschreiben |\n| Gezielt nachfragen, was fehlt | Ein 30-Felder-Formular erzeugen |\n| Einen Angebotstext vorschlagen | Über Preise entscheiden |\n| Eine Antwort im Chat vorschlagen | Sie eigenständig abschicken |\n| Aus „Wann können Sie kommen?\" eine Terminaktion machen | Den Termin verbindlich zusagen |\n\nUnd: KI-generierte Inhalte werden als solche gekennzeichnet. Sie dürfen nicht\nso aussehen, als wären sie garantiert richtig.\n\n## Die wichtigste Kennzahl\n\nDownloads sind nicht die Kennzahl. Wir wollen wissen, wo Nutzer abspringen:\n\n```\n10.000 Anfragen\n       ↓  request_created\n 8.700 Matches\n       ↓  match_generated\n 6.200 Angebote\n       ↓  offer_created\n 3.100 angenommen\n       ↓  offer_accepted\n 2.800 abgeschlossen\n       ↓  job_completed\n```\n\nDiese Ereignisse werden bereits geschrieben (`analytics_events`) — bewusst\nohne personenbezogene Freitexte. Wir messen, was passiert, nicht was Nutzer\nschreiben.\n\n**Wie viele Anfragen werden tatsächlich zu Aufträgen?** Dort entsteht der\nWert, und dort entscheidet sich, ob das Produkt funktioniert.\n\n## Geschäftsmodell\n\nFreemium für Unternehmen: kostenloses Profil mit begrenzten Anfragen, dazu\nkostenpflichtige Stufen mit mehr Anfragen, KI-Unterstützung, Kalender und\nStatistiken. Später möglicherweise eine Vermittlungsgebühr bei\nerfolgreichen Aufträgen.\n\n**Die genannten Preise sind Hypothesen.** Erst echte Nutzer zeigen, welche\nZahlungsbereitschaft vorhanden ist. Deshalb ist im Datenmodell noch kein\nAbonnement verdrahtet: eine falsch geratene Preisstruktur im Schema kostet\nspäter mehr als sie jetzt spart.\n\n## Drei Tests, die nicht vermischt werden dürfen\n\n| Test | Frage |\n|---|---|\n| **Produkt-Test** | Funktioniert der Ablauf? |\n| **Markt-Test** | Wollen Menschen das überhaupt? |\n| **Größen-Test** | Funktioniert das noch bei vielen Nutzern gleichzeitig? |\n\nDer Produkt-Test ist beantwortbar — der End-to-End-Test in\n`services/api/test/flow.test.ts` geht den kompletten Weg durch. Die anderen\nbeiden beantwortet keine Testsuite, sondern nur echter Betrieb.\n\n## Vertrauen\n\nBei einem Marktplatz ist das keine Nebensache:\n\n- **Unternehmen** können verifiziert werden (`businesses.verified`).\n- **Kunden** sehen den Preis vollständig, bevor sie annehmen — aufgeschlüsselt\n  nach Arbeit, Material und Anfahrt.\n- **Bewertungen** setzen einen abgeschlossenen Auftrag voraus. Ohne echten\n  Auftrag keine Bewertung — in der Datenbank erzwungen, nicht nur im Code.\n- **Der Auftragsstatus** ist jederzeit sichtbar. Vertrauen entsteht daraus,\n  dass der Kunde weiß, wo sein Anliegen steht.\n- **Standortdaten** werden nur so genau gespeichert, wie nötig: der Kunde gibt\n  „45127 Essen\" an, die vollständige Adresse erfährt erst der beauftragte\n  Betrieb.\n"}, {"pfad": "docs/vorschau/README.md", "bereich": "Dokumentation", "sprache": "markdown", "zeilen": 53, "bytes": 2103, "inhalt": "# Vorschau\n\n`jobflow-vorschau.html` ist ein klickbarer Prototyp der gesamten App — eine\neinzelne Datei, ohne Server, ohne Installation. Im Browser öffnen, fertig.\n\n```bash\n# macOS\nopen jobflow-vorschau.html\n# Linux\nxdg-open jobflow-vorschau.html\n```\n\n## Was darin echt ist\n\nZwei Teile sind nicht nachgebaut, sondern aus dem Backend übernommen:\n\n- **Die Regel-KI** (`services/api/src/modules/ai/rules-provider.ts`).\n  Beschreib etwas anderes als die Heizung — „Mein Waschbecken tropft\",\n  „Der Rasen muss gemäht werden\", „Notfall, Wasserschaden!\" — und Kategorie,\n  Rückfragen und Dringlichkeit ändern sich entsprechend. Erkennt sie nichts,\n  sagt sie das mit niedriger Sicherheit, statt zu raten.\n- **Die Matching-Engine** (`services/api/src/modules/matching/engine.ts`) mit\n  den Gewichten 35/20/15/10/10/5/5. Die Punktzahlen und die Begründungen unter\n  jedem Betrieb sind gerechnet, nicht hinterlegt.\n\nDie Steuerleiste rechts schreibt zu jeder Aktion den API-Aufruf mit, den die\nechte App an dieser Stelle absetzen würde — dieselben Endpunkte wie in\n[`docs/api/endpunkte.md`](../api/endpunkte.md).\n\n## Was daran Attrappe ist\n\nBeispieldaten statt Datenbank, zehn erfundene Betriebe, keine Anmeldung, keine\nFotos, keine Zahlungen. Der Prototyp zeigt **den Ablauf und die Gestaltung** —\ner ersetzt nicht den echten
