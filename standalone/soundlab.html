/* --------------------------------------------------------------- Zeichnen */

function currentRoute() {
  var hash = location.hash || "#/";
  if (hash.indexOf("#/instrument/") === 0) return { name: "#/instrument", arg: hash.slice("#/instrument/".length) };
  return { name: views[hash] ? hash : "#/", arg: null };
}

function render() {
  var route = currentRoute();
  state.route = route.name === "#/instrument" ? "#/instrument/" + route.arg : route.name;

  el("view").innerHTML = views[route.name](route.arg);

  el("nav").innerHTML = NAV.map(function (item) {
    var active = state.route === item.route || (item.route === "#/instrumente" && state.route.indexOf("#/instrument") === 0);
    return '<a class="navlink" href="' + item.route + '" data-route="' + item.route + '"' +
      (active ? ' aria-current="page"' : '') + '>' + esc(item.label) + '</a>';
  }).join("");

  el("tabbar").innerHTML = TABS.map(function (tab) {
    var active = state.route === tab.route || (tab.route === "#/instrumente" && state.route.indexOf("#/instrument") === 0);
    return '<button data-route="' + tab.route + '"' + (active ? ' aria-current="page"' : '') + '>' +
      svg(tab.icon, 18, tab.fill) + '<span>' + esc(tab.label) + '</span></button>';
  }).join("");

  document.querySelectorAll('[data-act="mode"]').forEach(function (btn) {
    var on = btn.getAttribute("data-mode") === state.mode;
    btn.className = "btn btn-sm " + (on ? "btn-primary" : "btn-quiet");
    btn.setAttribute("aria-selected", on);
  });

  el("playerName").textContent = state.song.name;
  el("metroBtn").setAttribute("data-on", state.metronome);
  updatePlayButton();
  renderProBar();
}

function renderProBar() {
  var bar = el("proBar");
  if (state.mode !== "pro") { bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  bar.innerHTML =
    '<label class="tiny muted row" style="gap:6px;flex-wrap:nowrap">Tempo' +
      '<input type="number" id="bpmInput" data-act="bpm-input" min="40" max="200" value="' + state.song.bpm + '" style="width:68px" class="num">BPM</label>' +
    '<div style="width:150px">' + slider({ id:"barTempo", name:"bpm", value: state.song.bpm, min:40, max:200, step:1, label:"Tempo fein" }) + '</div>' +
    '<label class="tiny muted row" style="gap:6px;flex-wrap:nowrap">Tonart' +
      '<select data-act="key-select" aria-label="Tonart">' + S.NOTE_NAMES.map(function (name, root) {
        return '<option value="' + root + '"' + (root === state.song.keyRoot ? " selected" : "") + '>' + name + '</option>';
      }).join("") + '</select></label>' +
    '<div style="width:150px" class="spread">' + slider({ id:"barMaster", name:"master", value: state.masterVolume, label:"Summe" }) + '</div>';
}

function updatePlayButton() {
  var playing = S.transport.playing;
  el("playBtn").innerHTML = svg(playing ? ICON.pause : ICON.play, 20, true);
  el("playBtn").setAttribute("aria-label", playing ? "Pause" : "Abspielen");
}

/* ------------------------------------------------------------- Aktionen - */

function setMode(mode) {
  state.mode = mode;
  if (mode === "pro") reach("studio");
  save();
  render();
}

function toggleTrack(id) {
  startAudio();
  var track = state.song.tracks[id];
  track.enabled = !track.enabled;
  if (track.enabled) {
    var count = S.TRACK_IDS.filter(function (t) { return state.song.tracks[t].enabled; }).length;
    if (count >= 2) reach("first-band");
  }
  syncEngine(); save(); render();
}

function applyWithBand() {
  var route = currentRoute();
  var slug = route.arg, inst = slug ? INSTRUMENTS[slug] : null;
  if (!inst || inst.track === "voice") { state.focusTrack = null; state.liveTrack = null; return; }
  if (state.withBand) {
    state.focusTrack = null;
    /* Beim Schlagzeug darf der Beat weiterlaufen - die Pads kommen obendrauf. */
    state.liveTrack = inst.track === "drums" ? null : inst.track;
  } else {
    state.focusTrack = inst.track;
    state.liveTrack = null;
  }
}

function saveProject(name) {
  var project = {
    id: "p-" + Date.now().toString(36),
    name: (name || state.song.name || "Ohne Titel").trim(),
    savedAt: new Date().toISOString(),
    song: JSON.parse(JSON.stringify(state.song))
  };
  project.song.name = project.name;
  state.song.name = project.name;
  state.projects.unshift(project);
  state.projects = state.projects.slice(0, 40);
  reach("first-song");
  save();
  state.saved = "„" + project.name + "“";
  render();
  setTimeout(function () { state.saved = null; if (el("view")) render(); }, 2600);
}

function applyColor(id) {
  startAudio();
  S.TRACK_IDS.forEach(function (track) {
    var t = state.song.tracks[track];
    if (id === "dry") { t.reverb = 0.04; t.delay = 0; t.eq = { low:0, mid:0, high:0 }; }
    else if (id === "room") { t.reverb = track === "drums" ? 0.22 : 0.45; t.delay = 0.05; }
    else if (id === "dream") { t.reverb = 0.35; t.delay = track === "drums" ? 0.1 : 0.4; }
    else if (id === "warm") { t.eq.low = 4.5; t.eq.high = -3; }
    else if (id === "bright") { t.eq.low = -1.5; t.eq.high = 5; }
    else if (id === "punch") { t.eq.low = 2; t.eq.mid = 1.5; }
  });
  if (id === "punch") S.engine.setCompressor(0.8);
  if (id === "dry") S.engine.setCompressor(0.15);
  if (id === "dream") S.engine.setDelayTime(60 / state.song.bpm * 0.75);
  syncEngine(); save(); render();
}

function snapToScale(midi) {
  var song = state.song;
  if (S.inScale(midi, song.keyRoot, song.scale)) return midi;
  for (var d = 1; d <= 6; d++) {
    if (S.inScale(midi - d, song.keyRoot, song.scale)) return midi - d;
    if (S.inScale(midi + d, song.keyRoot, song.scale)) return midi + d;
  }
  return midi;
}

function flash(node) {
  if (!node) return;
  node.setAttribute("data-hit", "true");
  setTimeout(function () { node.setAttribute("data-hit", "false"); }, 190);
}

function pressPianoKey(midi, node) {
  startAudio();
  var target = piano.easyPlay ? snapToScale(midi) : midi;
  S.playPiano({ track:"piano", midi:target, preset: state.song.tracks.piano.preset || "piano",
                velocity:0.85, duration: state.song.tracks.piano.preset === "soft" ? 2.2 : 1.6 });
  reach("first-note");
  if (node) {
    node.setAttribute("data-down", "true");
    setTimeout(function () { node.setAttribute("data-down", "false"); }, 220);
  }
  var melody = MELODIES.filter(function (m) { return m.id === piano.melodyId; })[0];
  if (melody) {
    var notes = melody.degrees.map(function (d) { return S.scaleDegree(d, state.song.keyRoot, state.song.scale, piano.octave); });
    if (target === notes[piano.melodyIndex]) {
      piano.melodyIndex = (piano.melodyIndex + 1) % notes.length;
      render();
    }
  }
}

function playMelody() {
  startAudio();
  var melody = MELODIES.filter(function (m) { return m.id === piano.melodyId; })[0];
  if (!melody) return;
  var ctx = S.engine.ensure();
  var notes = melody.degrees.map(function (d) { return S.scaleDegree(d, state.song.keyRoot, state.song.scale, piano.octave); });
  notes.forEach(function (midi, i) {
    S.playPiano({ track:"piano", midi:midi, preset: state.song.tracks.piano.preset || "piano",
                  time: ctx.currentTime + i * 0.42, duration:0.9 });
    setTimeout(function () { piano.melodyIndex = i; render(); }, i * 420);
  });
  setTimeout(function () { piano.melodyIndex = 0; render(); }, notes.length * 420);
}

function currentChords() {
  return [0, 4, 5, 3].map(function (d) {
    return S.chordForDegree(d, state.song.keyRoot, state.song.scale, 3);
  });
}

function strumNow(direction) {
  startAudio();
  var chord = currentChords()[guitar.selected];
  S.strumChord(S.chordNotes(chord, 0).concat(S.chordNotes(chord, 1).slice(0, 2)), {
    track:"guitar", direction:direction, velocity:0.85
  });
  reach("first-note");
}

function setAutoStrum(on) {
  guitar.autoStrum = on;
  if (guitar.unsub) { guitar.unsub(); guitar.unsub = null; }
  if (!on) { state.liveTrack = null; render(); return; }
  startAudio();
  state.liveTrack = "guitar";
  guitar.unsub = S.transport.subscribe(function (step, time) {
    var pattern = S.loopById(state.song.tracks.guitar.loopId) || S.loopById("guitar-strum");
    var stepInBar = step % 16;
    var chord = currentChords()[guitar.selected];
    pattern.notes.forEach(function (note) {
      if (note.step !== stepInBar) return;
      S.strumChord(S.chordNotes(chord, 0), {
        track:"guitar", time:time,
        velocity: (note.velocity === undefined ? 0.8 : note.velocity) * 0.9,
        direction: note.step % 8 >= 4 ? "up" : "down"
      });
    });
  });
  if (!S.transport.playing) S.transport.start();
  render();
}

function lessonDemo(id) {
  startAudio();
  var song = state.song;
  var ctx = S.engine.ensure();
  var now = ctx.currentTime + 0.05;
  var beat = 60 / song.bpm;
  var chord = S.chordForDegree(0, song.keyRoot, song.scale, 3);

  if (id === "beat") {
    [0,1,2,3].forEach(function (i) {
      S.playDrum(i % 2 === 0 ? "kick" : "snare", { time: now + i * beat });
      S.playDrum("hihat", { time: now + i * beat + beat / 2, velocity: 0.6 });
    });
  } else if (id === "chord") {
    S.playPiano({ track:"piano", midi: chord.root + 12, time: now, duration: 1 });
    S.chordNotes(chord, 1).forEach(function (m) {
      S.playPiano({ track:"piano", midi:m, time: now + beat * 1.2, duration: 2 });
    });
  } else if (id === "scale") {
    for (var i = 0; i < 8; i++) {
      S.playPiano({ track:"piano", midi: S.scaleDegree(i, song.keyRoot, song.scale, 4), time: now + i * beat / 2, duration: 0.5 });
    }
  } else if (id === "note") {
    S.chordNotes(chord, 1).forEach(function (m) { S.playPiano({ track:"piano", midi:m, time:now, duration:1.6 }); });
    S.playPiano({ track:"piano", midi: S.scaleDegree(4, song.keyRoot, song.scale, 4), time: now + beat * 1.4, duration: 0.8 });
    S.playPiano({ track:"piano", midi: S.scaleDegree(0, song.keyRoot, song.scale, 4), time: now + beat * 2.2, duration: 1.6 });
  } else if (id === "bass") {
    S.chordNotes(chord, 1).forEach(function (m) { S.playPiano({ track:"piano", midi:m, time:now, duration:2.4, velocity:0.5 }); });
    [0,1,2,3].forEach(function (i) {
      S.playBass({ track:"bass", midi: chord.root - 24, time: now + i * beat, duration: beat * 0.8 });
    });
  } else if (id === "melody") {
    [0,2,4,2,0].forEach(function (degree, i) {
      S.playPiano({ track:"piano", midi: S.scaleDegree(degree, song.keyRoot, song.scale, 4), time: now + i * beat * 0.6, duration: 0.7 });
    });
  }
  var card = document.querySelector('[data-lesson-card="' + id + '"]');
  if (card) { card.classList.add("on"); setTimeout(function () { card.classList.remove("on"); }, 2600); }
}

function beginRecording() {
  state.voiceError = null;
  startAudio();
  S.startRecording(state.song.bpm).then(function (handle) {
    recorder = handle;
    render();
  }).catch(function () {
    state.voiceError = "Das Mikrofon ist nicht erreichbar. Erlaube den Zugriff im Browser - ohne Mikrofon funktioniert alles andere weiterhin.";
    render();
  });
}

function finishRecording() {
  if (!recorder) return;
  var handle = recorder;
  recorder = null;
  handle.stop().then(function (result) {
    state.voice.buffer = result.buffer;
    state.voice.analysis = result.analysis;
    state.song.tracks.voice.enabled = true;
    syncEngine(); save(); reach("first-note");
    render();
  }).catch(function () {
    state.voiceError = "Die Aufnahme konnte nicht verarbeitet werden. Versuch es noch einmal.";
    render();
  });
  liveVoice = { level: 0, freq: null };
  render();
}

/* ------------------------------------------------------------ Ereignisse - */

document.addEventListener("click", function (event) {
  var routeEl = event.target.closest("[data-route]");
  if (routeEl && !event.target.closest("[data-act]")) {
    event.preventDefault();
    location.hash = routeEl.getAttribute("data-route");
    return;
  }

  var node = event.target.closest("[data-act]");
  if (!node) return;
  var act = node.getAttribute("data-act");
  var song = state.song;

  if (act === "mode") { setMode(node.getAttribute("data-mode")); return; }

  if (act === "drawer") {
    state.drawer = state.drawer === node.getAttribute("data-drawer") ? null : node.getAttribute("data-drawer");
    renderDrawer();
    return;
  }
  if (act === "close-drawer") { state.drawer = null; renderDrawer(); return; }

  if (act === "toggle-play") {
    startAudio();
    S.transport.toggle();
    render();
    return;
  }

  if (act === "toggle-track") { toggleTrack(node.getAttribute("data-track")); return; }
  if (act === "remove-track") {
    song.tracks[node.getAttribute("data-track")].enabled = false;
    syncEngine(); save(); render(); return;
  }
  if (act === "mute") {
    var t = song.tracks[node.getAttribute("data-track")];
    t.muted = !t.muted; syncEngine(); save(); render(); return;
  }
  if (act === "solo") {
    var s = song.tracks[node.getAttribute("data-track")];
    s.solo = !s.solo; syncEngine(); save(); render(); return;
  }
  if (act === "loop") return;

  if (act === "style") {
    var style = S.STYLES[node.getAttribute("data-style")];
    song.styleId = style.id;
    song.bpm = style.bpm;
    song.scale = style.scale;
    song.swing = style.id === "lofi" ? 0.2 : style.id === "hiphop" ? 0.12 : 0;
    S.TRACK_IDS.forEach(function (id) {
      if (id === "voice") return;
      song.tracks[id].loopId = style.defaults[S.TRACK_META[id].category];
    });
    song.percussion.loopId = style.defaults.percussion;
    syncEngine(); save(); render(); return;
  }

  if (act === "bpm") {
    song.bpm = Math.max(50, Math.min(200, song.bpm + Number(node.getAttribute("data-dir")) * 2));
    syncEngine(); save(); render(); return;
  }
  if (act === "key") {
    song.keyRoot = (song.keyRoot + (Number(node.getAttribute("data-dir")) > 0 ? 1 : 11)) % 12;
    save(); render(); return;
  }
  if (act === "key-pick") { song.keyRoot = Number(node.getAttribute("data-root")); save(); render(); return; }
  if (act === "scale") { song.scale = node.getAttribute("data-scale"); save(); render(); return; }
  if (act === "octave") {
    piano.octave = Math.max(2, Math.min(6, piano.octave + Number(node.getAttribute("data-dir"))));
    render(); return;
  }
  if (act === "piano-preset") { song.tracks.piano.preset = node.getAttribute("data-preset"); save(); render(); return; }
  if (act === "synth-preset") { song.tracks.synth.preset = node.getAttribute("data-preset"); save(); render(); return; }
  if (act === "easyplay") { piano.easyPlay = !piano.easyPlay; render(); return; }
  if (act === "notenames") { piano.showNames = !piano.showNames; render(); return; }
  if (act === "melody") {
    var id = node.getAttribute("data-melody");
    piano.melodyId = piano.melodyId === id ? null : id;
    piano.melodyIndex = 0;
    render(); return;
  }
  if (act === "play-melody") { playMelody(); return; }

  if (act === "beat") {
    song.tracks.drums.loopId = node.getAttribute("data-loop");
    reach("first-beat"); save(); render(); return;
  }
  if (act === "start-beat") {
    startAudio();
    if (!song.tracks.drums.enabled) { song.tracks.drums.enabled = true; syncEngine(); }
    reach("first-beat");
    S.transport.toggle();
    render(); return;
  }

  if (act === "with-band") {
    state.withBand = !state.withBand;
    if (state.withBand) {
      ["drums","bass","piano"].forEach(function (id) { song.tracks[id].enabled = true; });
      reach("first-band");
      syncEngine();
    }
    applyWithBand();
    save(); render(); return;
  }

  if (act === "autostrum") { setAutoStrum(!guitar.autoStrum); return; }
  if (act === "percussion") { song.percussion.enabled = !song.percussion.enabled; save(); render(); return; }

  if (act === "section") {
    var track = song.tracks[node.getAttribute("data-track")];
    var section = node.getAttribute("data-section");
    track.sections[section] = !track.sections[section];
    save(); render(); return;
  }
  if (act === "cell") {
    var cellTrack = song.tracks[node.getAttribute("data-track")];
    var bar = Number(node.getAttribute("data-bar"));
    var sec = S.sectionAtBar(song, bar);
    if (!cellTrack.enabled) cellTrack.enabled = true;
    cellTrack.sections[sec] = !cellTrack.sections[sec];
    syncEngine(); save(); render(); return;
  }

  if (act === "loop-cat") { state.loopCat = node.getAttribute("data-cat"); render(); return; }
  if (act === "loop-pick") {
    startAudio();
    var cat = node.getAttribute("data-cat"), loopId = node.getAttribute("data-loop");
    if (cat === "percussion") {
      var off = song.percussion.enabled && song.percussion.loopId === loopId;
      song.percussion = { loopId: loopId, enabled: !off };
    } else {
      var target = song.tracks[cat];
      var turningOff = target.enabled && target.loopId === loopId;
      target.loopId = loopId;
      target.enabled = !turningOff;
      if (!turningOff) reach("first-band");
    }
    syncEngine(); save(); render(); return;
  }

  if (act === "color") { applyColor(node.getAttribute("data-color")); return; }
  if (act === "lesson") { lessonDemo(node.getAttribute("data-lesson")); return; }

  if (act === "save-project") {
    var input = el("songName") || el("projectName");
    saveProject(input ? input.value : song.name);
    return;
  }
  if (act === "delete-project") {
    var pid = node.getAttribute("data-id");
    state.projects = state.projects.filter(function (p) { return p.id !== pid; });
    save(); render(); return;
  }
  if (act === "open-project" || act === "play-project") {
    var project = state.projects.filter(function (p) { return p.id === node.getAttribute("data-id"); })[0];
    if (!project) return;
    S.transport.stop();
    state.song = JSON.parse(JSON.stringify(project.song));
    syncEngine(); save(); render();
    if (act === "play-project") { startAudio(); S.transport.start(); render(); }
    return;
  }

  if (act === "record") { recorder ? finishRecording() : beginRecording(); return; }
  if (act === "target") { voiceTarget += Number(node.getAttribute("data-dir")); render(); return; }
  if (act === "metronome") { state.metronome = !state.metronome; el("metroBtn").setAttribute("data-on", state.metronome); render(); return; }
  if (act === "voice-preset") { state.voice.settings.preset = node.getAttribute("data-preset"); render(); return; }
  if (act === "play-recording") {
    if (!state.voice.buffer) return;
    startAudio();
    if (stopPlayback) stopPlayback();
    stopPlayback = S.playRecording(state.voice.buffer, state.voice.settings, function () { stopPlayback = null; });
    return;
  }
  if (act === "clear-recording") {
    if (stopPlayback) { stopPlayback(); stopPlayback = null; }
    state.voice.buffer = null;
    state.voice.analysis = null;
    song.tracks.voice.enabled = false;
    syncEngine(); save(); render(); return;
  }

  if (act === "sync-delay") {
    master.delayTime = 60 / song.bpm * 0.5;
    S.engine.setDelayTime(master.delayTime);
    render(); return;
  }
  if (act === "reset") {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    location.reload();
    return;
  }
});

/* Regler und Eingabefelder */
document.addEventListener("input", function (event) {
  var node = event.target;
  var song = state.song;

  if (node.getAttribute("data-act") === "slider") {
    var value = Number(node.value);
    var name = node.getAttribute("data-slider");
    var arg = node.getAttribute("data-arg");
    node.style.setProperty("--fill", ((value - Number(node.min)) / (Number(node.max) - Number(node.min))) * 100 + "%");

    if (name === "track-volume") { song.tracks[arg].volume = value; S.engine.setVolume(arg, value); }
    else if (name === "pan") { song.tracks[arg].pan = value; S.engine.setPan(arg, value); }
    else if (name === "reverb") { song.tracks[arg].reverb = value; S.engine.setSend(arg, "reverb", value); }
    else if (name === "delay") { song.tracks[arg].delay = value; S.engine.setSend(arg, "delay", value); }
    else if (name === "eq-high") { song.tracks[arg].eq.high = value; S.engine.setEq(arg, "high", value); }
    else if (name === "swing") { song.swing = value; S.transport.swing = value; }
    else if (name === "master") { state.masterVolume = value; S.engine.setMasterVolume(value); }
    else if (name === "compressor") { master.compressor = value; S.engine.setCompressor(value); }
    else if (name === "delaytime") { master.delayTime = value; S.engine.setDelayTime(value); }
    else if (name === "feedback") { master.feedback = value; S.engine.setDelayFeedback(value); }
    else if (name === "bpm") { song.bpm = Math.round(value); S.transport.setBpm(song.bpm); var input = el("bpmInput"); if (input) input.value = song.bpm; }
    else if (name === "voice-pitch") { state.voice.settings.pitch = Math.round(value); }
    else if (name === "voice-reverb") { state.voice.settings.reverb = value; }
    else if (name === "voice-echo") { state.voice.settings.echo = value; }
    else if (name === "voice-bright") { state.voice.settings.brightness = value; }

    var label = node.parentNode.querySelector(".slider-label .num");
    if (label) {
      if (name === "track-volume") label.textContent = String(Math.round(value * 100));
      else if (name === "swing" || name === "master" || name === "compressor" || name === "feedback" ||
               name === "reverb" || name === "delay" || name === "voice-reverb" || name === "voice-echo") {
        label.textContent = Math.round(value * 100) + " %";
      } else if (name === "delaytime") label.textContent = Math.round(value * 1000) + " ms";
      else if (name === "eq-high") label.textContent = (value > 0 ? "+" : "") + value.toFixed(0) + " dB";
      else if (name === "voice-pitch") label.textContent = (value > 0 ? "+" : "") + Math.round(value) + " Halbtöne";
      else if (name === "pan") label.textContent = value === 0 ? "Mitte" : (value < 0 ? Math.round(-value * 100) + " links" : Math.round(value * 100) + " rechts");
      else if (name === "voice-bright") label.textContent = value === 0 ? "neutral" : (value > 0 ? "hell" : "warm");
    }
    save();
    return;
  }

  if (node.getAttribute("data-act") === "name") { song.name = node.value; el("playerName").textContent = node.value; save(); return; }
  if (node.getAttribute("data-act") === "bpm-input") { song.bpm = Math.max(40, Math.min(200, Number(node.value) || 100)); S.transport.setBpm(song.bpm); save(); return; }
});

document.addEventListener("change", function (event) {
  var node = event.target;
  if (node.getAttribute("data-act") === "loop") {
    state.song.tracks[node.getAttribute("data-track")].loopId = node.value;
    save();
  }
  if (node.getAttribute("data-act") === "key-select") {
    state.song.keyRoot = Number(node.value);
    save(); render();
  }
});

/* Instrumente reagieren auf Berührung und Maus */
document.addEventListener("pointerdown", function (event) {
  var node = event.target.closest("[data-play]");
  if (!node) return;
  var kind = node.getAttribute("data-play");

  if (kind === "piano") { pressPianoKey(Number(node.getAttribute("data-midi")), node); return; }
  if (kind === "drum") {
    startAudio();
    S.playDrum(node.getAttribute("data-drum"), { velocity: 1 });
    reach("first-note");
    flash(node);
    return;
  }
  if (kind === "bass") {
    startAudio();
    S.playBass({ track:"bass", midi: Number(node.getAttribute("data-midi")), duration: 0.9, velocity: 0.95 });
    reach("first-note"); flash(node); return;
  }
  if (kind === "synth") {
    startAudio();
    var row = Number(node.getAttribute("data-row"));
    S.playSynth({ track:"synth", midi: Number(node.getAttribute("data-midi")),
                  preset: state.song.tracks.synth.preset || "pad",
                  duration: (state.song.tracks.synth.preset || "pad") === "pad" ? 2.4 : 0.8,
                  cutoff: 700 + (3 - row) * 1400, velocity: 0.85 });
    reach("first-note"); flash(node); return;
  }
  if (kind === "chord") {
    guitar.selected = Number(node.getAttribute("data-chord"));
    startAudio();
    S.strumChord(S.chordNotes(currentChords()[guitar.selected], 0), { track:"guitar", velocity:0.8 });
    reach("first-note");
    flash(node);
    document.querySelectorAll('[data-play="chord"]').forEach(function (b, i) {
      b.classList.toggle("on", i === guitar.selected);
    });
    return;
  }
  if (kind === "strum") { strumNow("down"); flash(node); return; }
});

/* Ueber das Feld ziehen */
document.addEventListener("pointerenter", function (event) {
  if (!event.target.closest) return;
  var node = event.target.closest("[data-play]");
  if (!node || event.buttons !== 1) return;
  var kind = node.getAttribute("data-play");
  if (kind === "synth") {
    S.playSynth({ track:"synth", midi: Number(node.getAttribute("data-midi")),
                  preset: state.song.tracks.synth.preset || "pad", duration: 0.8, velocity: 0.8 });
    flash(node);
  } else if (kind === "strum") {
    strumNow("up");
  }
}, true);

document.addEventListener("pointerup", function (event) {
  var node = event.target.closest && event.target.closest('[data-play="strum"]');
  if (node) strumNow("up");
});

/* Computertastatur: Klavier und Drumpads */
var held = {};
var WHITE_CODES = ["KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ","KeyK","KeyL","Semicolon"];
var WHITE_OFFSETS = [0,2,4,5,7,9,11];
var BLACK_CODES = { KeyW:1, KeyE:3, KeyT:6, KeyY:8, KeyU:10, KeyO:13, KeyP:15 };
var DRUM_CODES = { KeyZ:"kick", KeyX:"snare", KeyC:"hihat", KeyV:"tom", KeyB:"crash", KeyN:"clap" };

document.addEventListener("keydown", function (event) {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  var tag = (event.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;

  if (event.code === "Space") {
    event.preventDefault();
    startAudio(); S.transport.toggle(); render();
    return;
  }

  var route = currentRoute();
  var slug = route.arg;

  if (slug === "drums" && DRUM_CODES[event.code] && !held[event.code]) {
    held[event.code] = true;
    event.preventDefault();
    startAudio();
    S.playDrum(DRUM_CODES[event.code], { velocity: 1 });
    reach("first-note");
    flash(document.querySelector('[data-drum="' + DRUM_CODES[event.code] + '"]'));
    return;
  }

  if (slug !== "klavier") return;

  if (event.code === "ArrowLeft") { piano.octave = Math.max(2, piano.octave - 1); render(); return; }
  if (event.code === "ArrowRight") { piano.octave = Math.min(6, piano.octave + 1); render(); return; }

  var midi = null;
  var whiteIndex = WHITE_CODES.indexOf(event.code);
  if (whiteIndex >= 0) {
    midi = 12 * (piano.octave + 1 + Math.floor(whiteIndex / 7)) + WHITE_OFFSETS[whiteIndex % 7];
  } else if (BLACK_CODES[event.code] !== undefined) {
    midi = 12 * (piano.octave + 1) + BLACK_CODES[event.code];
  }
  if (midi === null || held[event.code]) return;
  held[event.code] = true;
  event.preventDefault();
  pressPianoKey(midi, document.querySelector('[data-play="piano"][data-midi="' + midi + '"]'));
});

document.addEventListener("keyup", function (event) { delete held[event.code]; });

function renderDrawer() {
  var existing = document.querySelector(".drawer");
  var scrim = document.querySelector(".scrim");
  if (existing) existing.remove();
  if (scrim) scrim.remove();
  if (!state.drawer) return;

  var body;
  if (state.drawer === "profile") {
    body = '<div class="card"><p class="eyebrow" style="margin-bottom:4px">Bisher entdeckt</p>' +
      '<p style="font-size:30px;font-weight:700" class="num">' + state.milestones.length +
      '<span class="muted" style="font-size:16px;font-weight:400"> / ' + LEVELS.length + '</span></p>' +
      '<p class="muted small" style="margin-top:4px">' + state.projects.length + ' gespeicherte Projekte</p></div>' +
      '<ul class="stack-sm" style="list-style:none;padding:0;margin:16px 0 0">' + LEVELS.map(function (level) {
        var done = state.milestones.indexOf(level.id) >= 0;
        return '<li class="inset row" style="gap:12px;opacity:' + (done ? 1 : .6) + '">' +
          '<span style="width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;' +
          (done ? 'background:color-mix(in srgb,var(--green) 75%,transparent);color:#07090f' : 'background:var(--surface-3);color:var(--muted)') + '">' +
          (done ? svg(ICON.check, 15) : level.level) + '</span>' +
          '<span><b class="small">' + esc(level.label) + '</b><span class="muted tiny" style="display:block">' + esc(level.hint) + '</span></span></li>';
      }).join("") + '</ul>' +
      '<p class="muted tiny" style="margin-top:14px">Das ist kein Wettbewerb. Die Liste zeigt nur, was du in SoundLab schon gefunden hast.</p>';
  } else {
    body = '<label style="display:block"><span class="eyebrow" style="display:block;margin-bottom:8px">Songname</span>' +
      '<input type="text" data-act="name" value="' + esc(state.song.name) + '" style="width:100%" aria-label="Songname"></label>' +
      '<div style="margin-top:20px">' + slider({ id:"drawerMaster", name:"master", value: state.masterVolume, label:"Gesamtlautstärke", display: Math.round(state.masterVolume * 100) + " %" }) + '</div>' +
      '<div style="margin-top:20px"><button class="btn btn-sm ' + (state.metronome ? "btn-primary" : "btn-quiet") + '" data-act="metronome">Metronom</button></div>' +
      '<div style="margin-top:20px"><span class="eyebrow" style="display:block;margin-bottom:8px">Modus</span>' +
        '<div class="seg"><button class="btn btn-sm ' + (state.mode === "easy" ? "btn-primary" : "btn-quiet") + '" data-act="mode" data-mode="easy">Easy Mode</button>' +
        '<button class="btn btn-sm ' + (state.mode === "pro" ? "btn-primary" : "btn-quiet") + '" data-act="mode" data-mode="pro">Pro Mode</button></div>' +
        '<p class="muted tiny" style="margin-top:8px">Easy zeigt wenige, große Bedienelemente. Pro blendet Timeline, Mischpult und Effekte ein.</p></div>' +
      '<div class="inset" style="margin-top:20px"><b class="small">Alles zurücksetzen</b>' +
        '<p class="muted tiny" style="margin:4px 0 12px">Löscht gespeicherte Projekte und den aktuellen Song aus diesem Browser.</p>' +
        '<button class="btn btn-sm btn-ghost" data-act="reset">' + svg(ICON.trash, 14) + 'Zurücksetzen</button></div>';
  }

  var scrimEl = document.createElement("button");
  scrimEl.className = "scrim";
  scrimEl.setAttribute("data-act", "close-drawer");
  scrimEl.setAttribute("aria-label", "Schließen");
  document.body.appendChild(scrimEl);

  var drawer = document.createElement("aside");
  drawer.className = "drawer";
  drawer.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:20px">' +
    '<h2 style="font-size:22px">' + (state.drawer === "profile" ? "Dein Profil" : "Einstellungen") + '</h2>' +
    '<button class="icon-btn" data-act="close-drawer" aria-label="Schließen">&times;</button></div>' + body;
  document.body.appendChild(drawer);
}

/* ------------------------------------------------- Laufende Anzeigen ----- */

var waveBuffer = new Uint8Array(256);
var waveBars = null;

function frame() {
  var playing = S.transport.playing;

  if (playing) {
    var progress = S.transport.progress();
    var total = S.songSeconds(state.song);
    var fill = el("progressFill");
    if (fill) fill.style.width = (progress * 100) + "%";
    var time = el("playerTime");
    if (time) time.textContent = S.formatTime(progress * total) + " / " + S.formatTime(total);

    if (!waveBars) {
      var wave = el("wave");
      if (wave && !wave.children.length) {
        var html = "";
        for (var i = 0; i < 48; i++) html += "<span></span>";
        wave.innerHTML = html;
      }
      waveBars = wave ? wave.children : null;
    }
    if (waveBars) {
      S.engine.waveform(waveBuffer);
      for (var b = 0; b < waveBars.length; b++) {
        var v = Math.abs(waveBuffer[Math.floor(b / waveBars.length * waveBuffer.length)] - 128) / 128;
        waveBars[b].style.height = Math.max(8, v * 100) + "%";
      }
    }

    document.querySelectorAll("[data-member]").forEach(function (node) {
      var level = S.engine.level(node.getAttribute("data-member"));
      node.style.transform = "translateY(" + (-level * 10) + "px)";
      var face = node.querySelector(".member-face");
      if (face) {
        face.style.boxShadow = level > 0.04
          ? "0 0 " + (16 + level * 44) + "px -6px color-mix(in srgb, var(--accent) 90%, transparent)"
          : "none";
      }
    });

    document.querySelectorAll("[data-level]").forEach(function (node) {
      var id = node.getAttribute("data-level");
      if (node.getAttribute("data-on") !== "true") return;
      node.style.transform = "scale(" + (1 + S.engine.level(id) * 0.12) + ")";
    });

    var cursor = S.transport.step % 16;
    document.querySelectorAll("[data-step]").forEach(function (node) {
      node.setAttribute("data-cursor", Number(node.getAttribute("data-step")) === cursor);
    });
  }

  if (recorder) {
    liveVoice = recorder.peek();
    var bar = el("liveLevel");
    if (bar) bar.style.width = Math.min(100, liveVoice.level * 320) + "%";
    var dot = el("tunerDot"), hint = el("tunerHint");
    if (dot && hint) {
      var targetMidi = S.scaleDegree(voiceTarget, state.song.keyRoot, state.song.scale, 4);
      if (liveVoice.freq) {
        var midi = S.freqToMidi(liveVoice.freq);
        var deviation = midi - targetMidi;
        var close = Math.abs(deviation) < 0.6;
        dot.style.left = "calc(50% + " + Math.max(-45, Math.min(45, deviation * 12)) + "%)";
        dot.style.background = "var(--accent)";
        dot.style.boxShadow = close ? "0 0 22px 2px color-mix(in srgb,var(--accent) 70%,transparent)" : "none";
        hint.textContent = close
          ? "Treffer: " + S.midiToName(Math.round(midi))
          : "Du bist bei " + S.midiToName(Math.round(midi)) + " - " + (deviation > 0 ? "etwas tiefer" : "etwas höher") + " wäre genau der Zielton.";
      } else {
        dot.style.left = "50%";
        dot.style.background = "var(--surface-3)";
        dot.style.boxShadow = "none";
        hint.textContent = "Sing oder summe einen Ton - der Punkt zeigt, wo du gerade bist.";
      }
    }
  }

  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------- Start ---- */

S.transport.subscribe(function (step, time) {
  S.scheduleSongStep(state.song, step, time, {
    voiceBuffer: state.voice.buffer,
    only: state.focusTrack,
    skip: state.liveTrack
  });
  if (state.metronome && step % 4 === 0) S.playClick(step % S.STEPS_PER_BAR === 0, time, 0.6);
});

S.transport.onState(function () { updatePlayButton(); });

window.addEventListener("hashchange", function () {
  state.withBand = false;
  state.focusTrack = null;
  state.liveTrack = null;
  if (guitar.unsub) { guitar.unsub(); guitar.unsub = null; }
  guitar.autoStrum = false;
  if (recorder) { recorder.cancel(); recorder = null; }
  state.voiceError = null;
  state.drawer = null;
  renderDrawer();
  render();
  window.scrollTo(0, 0);
});

load();
render();
frame();
})();
</script>
