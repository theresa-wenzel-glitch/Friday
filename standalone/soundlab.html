<title>SoundLab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/*
 * SoundLab - dunkles Studio, pro Instrument eine Akzentfarbe.
 * Alles Farbige läuft über --accent, damit eine Karte, ein Knopf oder eine
 * Klaviertaste nur diese eine Variable setzen muss.
 */
:root {
  --bg: #070912;
  --bg-soft: #0b0e1b;
  --surface: #131727;
  --surface-2: #1a1f33;
  --surface-3: #232941;
  --line: #262c44;
  --line-soft: #1e233a;
  --text: #eef1fb;
  --muted: #99a1c0;
  --muted-2: #6f7799;

  --violet: #8b5cf6;
  --orange: #f8853b;
  --blue: #4b86f7;
  --green: #35c98a;
  --pink: #ec5fa8;
  --cyan: #2fd0d8;

  --accent: var(--violet);

  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radius: 20px;
  --radius-sm: 12px;
  --bar-h: 76px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3 {
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.08;
  margin: 0;
  text-wrap: balance;
}

h1 { font-size: clamp(28px, 6vw, 44px); }
h2 { font-size: clamp(20px, 3.4vw, 27px); }
h3 { font-size: 17px; }
p { margin: 0; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}

.acc-drums { --accent: var(--orange); }
.acc-bass { --accent: var(--blue); }
.acc-piano { --accent: var(--violet); }
.acc-guitar { --accent: var(--green); }
.acc-voice { --accent: var(--pink); }
.acc-synth { --accent: var(--cyan); }

/* ------------------------------------------------------------- Struktur */

.shell { display: flex; flex-direction: column; min-height: 100%; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line-soft);
}

.topbar-row {
  max-width: 1180px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.logo-mark {
  width: 34px; height: 34px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--violet), var(--cyan));
  color: #07090f;
}

.logo-text {
  font-family: var(--display);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -0.03em;
}

.navrow {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 16px 8px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.navrow::-webkit-scrollbar { display: none; }

.navlink {
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  cursor: pointer;
  border: 1px solid transparent;
  background: none;
  transition: color .15s, background-color .15s;
}
.navlink:hover { color: var(--text); background: var(--surface-2); }
.navlink[aria-current="page"] {
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--line);
}

main {
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 16px calc(var(--bar-h) + 96px);
}

.stack { display: flex; flex-direction: column; gap: 34px; }
.stack-sm { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.spread { margin-left: auto; }

/* --------------------------------------------------------------- Flächen */

.card {
  position: relative;
  background: linear-gradient(165deg, var(--surface-2) 0%, var(--surface) 62%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  transition: transform .22s cubic-bezier(.22,1,.36,1), border-color .22s, box-shadow .22s;
}

a.card, button.card { display: block; text-align: left; cursor: pointer; width: 100%; }

a.card:hover, button.card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  box-shadow: 0 18px 40px -24px color-mix(in srgb, var(--accent) 70%, transparent);
}

.card.on {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent),
              0 14px 40px -22px color-mix(in srgb, var(--accent) 80%, transparent);
}

.halo::before {
  content: "";
  position: absolute; inset: -1px;
  border-radius: inherit;
  background: radial-gradient(120% 90% at 20% -10%, color-mix(in srgb, var(--accent) 24%, transparent) 0%, transparent 62%);
  pointer-events: none;
}
.halo > * { position: relative; }

.panel {
  background: var(--bg-soft);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 18px;
}

.inset {
  background: rgba(4, 6, 14, .55);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 14px;
}

.muted { color: var(--muted); }
.muted-2 { color: var(--muted-2); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.accent-text { color: var(--accent); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted-2);
}

/* --------------------------------------------------------------- Knöpfe */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 19px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  background: none;
  transition: transform .13s cubic-bezier(.22,1,.36,1), background-color .17s, border-color .17s, box-shadow .17s;
}
.btn:active { transform: scale(.965); }

.btn-primary {
  background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 92%, white 8%), color-mix(in srgb, var(--accent) 70%, #1b1f33 30%));
  color: #0a0c15;
  box-shadow: 0 12px 30px -16px color-mix(in srgb, var(--accent) 90%, transparent);
}

.btn-ghost { background: var(--surface-2); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-3); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

.btn-quiet { border-color: var(--line); color: var(--muted); }
.btn-quiet:hover { color: var(--text); background: var(--surface-2); }

.btn-sm { padding: 7px 13px; font-size: 13px; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  cursor: pointer;
  transition: background-color .16s, transform .13s, border-color .16s, color .16s;
}
.icon-btn:hover { background: var(--surface-3); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn[data-on="true"] {
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  color: color-mix(in srgb, var(--accent) 76%, white 24%);
}
.chip-quiet { background: var(--surface-2); border-color: var(--line); color: var(--muted); }

.seg {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--bg-soft);
  border: 1px solid var(--line-soft);
}

select, input[type="text"], input[type="number"] {
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 10px;
  font: inherit;
  font-size: 13.5px;
}

/* --------------------------------------------------------------- Regler */

.range { width: 100%; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 24px;
  background: transparent;
  cursor: pointer;
  margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 50%), var(--surface-3) var(--fill, 50%), var(--surface-3) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  margin-top: -6px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid color-mix(in srgb, var(--accent) 80%, #10131f);
  box-shadow: 0 2px 10px -2px rgba(0,0,0,.8);
}
input[type="range"]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--surface-3); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--accent); }
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  border: 3px solid color-mix(in srgb, var(--accent) 80%, #10131f);
}

.slider-label {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 3px;
}

.stepper {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: rgba(4,6,14,.55);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
}
.stepper output { min-width: 84px; text-align: center; font-weight: 700; font-size: 14px; }

/* ------------------------------------------------------------ Instrumente */

.keyboard-wrap { overflow-x: auto; padding-bottom: 6px; }
.keyboard {
  position: relative;
  min-width: 560px;
  height: 168px;
  user-select: none;
  touch-action: none;
}
.whites { position: absolute; inset: 0; display: flex; gap: 2px; }

.key {
  position: relative;
  border: none;
  cursor: pointer;
  padding: 0 0 9px;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  transition: transform .06s, filter .12s, box-shadow .12s;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--mono);
}

.key-white {
  flex: 1;
  background: linear-gradient(to bottom, #f6f7fb 0%, #dfe3ef 92%, #c3c8d9 100%);
  border-radius: 0 0 9px 9px;
  box-shadow: inset 0 -6px 10px -6px rgba(0,0,0,.45);
  color: #454b63;
}

.key-black {
  position: absolute;
  top: 0;
  height: 62%;
  background: linear-gradient(to bottom, #2a3048 0%, #10131f 88%, #05070d 100%);
  border-radius: 0 0 7px 7px;
  box-shadow: 0 6px 12px -4px rgba(0,0,0,.85);
  color: #b7bed8;
  z-index: 2;
}

.key[data-down="true"] {
  transform: translateY(2px) scaleY(.985);
  filter: brightness(1.08);
  box-shadow: 0 0 22px -2px color-mix(in srgb, var(--accent) 85%, transparent);
}
.key-white[data-down="true"] {
  background: linear-gradient(to bottom, color-mix(in srgb, var(--accent) 35%, #fff) 0%, color-mix(in srgb, var(--accent) 70%, #fff) 100%);
}
.key-black[data-down="true"] {
  background: linear-gradient(to bottom, color-mix(in srgb, var(--accent) 70%, #1a1f33) 0%, color-mix(in srgb, var(--accent) 45%, #05070d) 100%);
}
.key[data-dim="true"] { filter: saturate(.25) brightness(.62); }
.key-black[data-dim="true"] { opacity: .55; }

.key[data-hint="true"]::after {
  content: "";
  position: absolute;
  left: 50%; bottom: 16%;
  width: 10px; height: 10px;
  margin-left: -5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px 2px color-mix(in srgb, var(--accent) 70%, transparent);
  animation: hint 1.1s ease-in-out infinite;
}

.pad {
  position: relative;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: linear-gradient(160deg, var(--surface-2), var(--surface));
  cursor: pointer;
  overflow: hidden;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  padding: 18px;
  transition: transform .1s cubic-bezier(.22,1,.36,1), border-color .15s, box-shadow .18s;
}
.pad:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.pad[data-hit="true"] {
  transform: scale(.955);
  border-color: color-mix(in srgb, var(--accent) 80%, transparent);
  box-shadow: 0 0 34px -6px color-mix(in srgb, var(--accent) 85%, transparent),
              inset 0 0 40px -14px color-mix(in srgb, var(--accent) 90%, transparent);
}
.pad .ring {
  position: absolute; inset: 0;
  border-radius: inherit;
  border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
  opacity: 0;
  pointer-events: none;
}
.pad[data-hit="true"] .ring { animation: ring .5s cubic-bezier(.22,1,.36,1); }

.pad-head {
  position: absolute;
  right: 16px; top: 16px;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%);
  transition: background .12s;
}
.pad[data-hit="true"] .pad-head {
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 90%, white), color-mix(in srgb, var(--accent) 55%, transparent));
}

.pad-center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px 10px; }

.strum { width: 100%; padding: 34px 18px; }
.strings { position: absolute; left: 24px; right: 24px; top: 12px; bottom: 12px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.strings span { display: block; border-radius: 999px; background: color-mix(in srgb, var(--accent) 35%, transparent); opacity: .45; transition: opacity .14s; }
.pad[data-hit="true"] .strings span { opacity: .9; }

/* Sequencer-Raster */
.steps { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; }
.step {
  aspect-ratio: 1;
  max-height: 28px;
  border-radius: 6px;
  border: 1px solid var(--line-soft);
  background: var(--surface);
  transition: background-color .12s, transform .12s;
}
.step[data-on="true"] {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-color: color-mix(in srgb, var(--accent) 85%, transparent);
}
.step[data-cursor="true"] {
  transform: scaleY(1.22);
  box-shadow: 0 0 14px -2px color-mix(in srgb, var(--accent) 80%, transparent);
}

.seq-row { display: flex; align-items: center; gap: 12px; }
.seq-row .name { width: 62px; flex-shrink: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* Bühne */
.stage { position: relative; overflow: hidden; padding: 26px 16px; }
.aurora {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .38;
  pointer-events: none;
  animation: drift 18s ease-in-out infinite;
}
.members { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 22px; }
.member { display: flex; flex-direction: column; align-items: center; transition: transform .11s ease-out; }
.member-face {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 28px;
  background: color-mix(in srgb, var(--accent) 18%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
.member-name { margin-top: 7px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

/* Timeline im Pro Mode */
.timeline-scroll { overflow-x: auto; }
.timeline { min-width: 620px; }
.tl-row { display: flex; align-items: center; gap: 0; }
.tl-name { width: 96px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.tl-cells { flex: 1; display: grid; gap: 3px; }
.tl-cell {
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--line-soft);
  background: var(--surface);
  cursor: pointer;
  padding: 0;
}
.tl-cell[data-on="true"] {
  background: color-mix(in srgb, var(--accent) 62%, transparent);
  border-color: color-mix(in srgb, var(--accent) 75%, transparent);
}
.tl-cell[data-now="true"] { outline: 1px solid color-mix(in srgb, var(--pink) 60%, transparent); }

/* Spur-Zeile */
.track { display: flex; align-items: center; gap: 14px; }
.track-face {
  width: 52px; height: 52px;
  border-radius: 16px;
  display: grid; place-items: center;
  font-size: 24px;
  flex-shrink: 0;
  cursor: pointer;
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: transform .09s ease-out, background-color .16s, border-color .16s;
}
.track-face[data-on="true"] {
  background: color-mix(in srgb, var(--accent) 22%, var(--surface-2));
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
}

/* Player */
.player {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.player-inner { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }

.progress-wrap { position: relative; height: 22px; display: flex; align-items: center; margin-top: 5px; }
.wave { position: absolute; inset: 0; display: flex; align-items: center; gap: 2px; opacity: .45; }
.wave span { flex: 1; border-radius: 999px; background: var(--violet); height: 8%; transition: height .08s linear; }
.progress { position: relative; height: 5px; width: 100%; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--pink)); width: 0; }

.tabbar {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
  z-index: 39;
  display: none;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
}
.tabbar button {
  flex: 1;
  background: none;
  border: none;
  padding: 7px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted-2);
  cursor: pointer;
}
.tabbar button[aria-current="page"] { color: var(--text); }

/* Schublade */
.scrim { position: fixed; inset: 0; z-index: 44; background: rgba(4,6,14,.6); border: none; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  z-index: 45;
  width: min(380px, 100%);
  padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--bg-soft);
  border-left: 1px solid var(--line);
  animation: slide .28s cubic-bezier(.22,1,.36,1);
}

/* Messwerte */
.meter-val { font-family: var(--mono); font-size: 20px; font-weight: 700; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), var(--accent)); }

.tuner { position: relative; height: 40px; margin-top: 12px; }
.tuner .axis { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.tuner .center { position: absolute; top: 4px; bottom: 4px; left: 50%; width: 1px; background: var(--accent); }
.tuner .dot {
  position: absolute; top: 50%;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--surface-3);
  transform: translate(-50%, -50%);
  transition: left .1s, background-color .1s, box-shadow .1s;
}

.waveform { display: flex; align-items: center; gap: 2px; height: 86px; padding: 0 12px; overflow: hidden; }
.waveform span { flex: 1; min-width: 2px; border-radius: 999px; }

.lesson-visual { margin-top: 14px; }

@keyframes ring { 0% { opacity: .9; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.12); } }
@keyframes hint { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes drift { 0%, 100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(2%, -3%, 0) scale(1.06); } }
@keyframes slide { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pulsering {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
  70% { box-shadow: 0 0 0 16px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.fadeup { animation: fadeup .45s cubic-bezier(.22,1,.36,1) both; }
.pulse { animation: pulsering 1.6s ease-out infinite; }

@media (max-width: 720px) {

(function () {

  pentatonic: { label: "Pentatonik", steps: [0,2,4,7,9], hint: "Fünf Töne, die fast immer zusammenpassen." },
  blues: { label: "Blues", steps: [0,3,5,6,7,10], hint: "Rau und bluesig durch den zusätzlichen blue note." },
  dorian: { label: "Dorisch", steps: [0,2,3,5,7,9,10], hint: "Moll mit einem hellen Ton extra - klingt nach Funk." }

var MAJOR_Q = ["major","minor","minor","major","major","minor","dim"];
var MINOR_Q = ["minor","dim","major","minor","minor","major","major"];

/* ------------------------------------------------------------- Mischpult - */

var TRACK_IDS = ["drums","bass","piano","guitar","synth","voice"];

var engine = (function () {

function out(opts) { return opts.destination || engine.bus(opts.track); }

  var dur = o.duration || 1.4;

/* Karplus-Strong: ein Rauschimpuls kreist in einer sehr kurzen Verzögerung. */
function playPluck(o) {
  var ctx = engine.ensure();
  var t = o.time || ctx.currentTime;
  var vel = o.velocity === undefined ? 0.8 : o.velocity;

  var ctx = engine.ensure();
  var t = o.time || ctx.currentTime;
  var dur = o.duration || 0.5;

  var freq = midiToFreq(o.midi);

  var dur = o.duration || (preset === "pad" ? 2 : 0.6);
  var vel = o.velocity === undefined ? 0.8 : o.velocity;

    preset === "pluck" ? [["square",0,0.5],["sawtooth",-8,0.4]] :
    [["sawtooth",-9,0.45],["sawtooth",9,0.45],["triangle",0,0.35]];

    osc.connect(g); g.connect(filter);
    osc.start(t); osc.stop(t + dur + (preset === "pad" ? 2 : 0.6));
    if (!first) first = osc;
  });
  if (first) first.onended = function () { amp.disconnect(); filter.disconnect(); };
}

function playDrum(drum, o) {
  o = o || {};
  var ctx = engine.ensure();
  var t = o.time || ctx.currentTime;
  var vel = o.velocity === undefined ? 1 : o.velocity;
  var target = o.destination || engine.bus("drums");

  var amp = ctx.createGain();
  amp.connect(target);

  function hit(frequency, decay, type, drop) {
    var osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, t);
    if (drop) osc.frequency.exponentialRampToValueAtTime(Math.max(20, frequency - drop), t + decay * 0.8);
    osc.connect(amp); osc.start(t); osc.stop(t + decay + 0.05);
  }
  function noiseHit(type, frequency, decay, q) {
    var src = ctx.createBufferSource(); src.buffer = engine.noise();
    var f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = frequency; f.Q.value = q || 1;
    src.connect(f); f.connect(amp); src.start(t); src.stop(t + decay + 0.05);
  }

  if (drum === "kick") {
    amp.gain.setValueAtTime(vel * 1.1, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    hit(150, 0.45, "sine", 110);
    var click = ctx.createGain();
    click.gain.setValueAtTime(vel * 0.35, t);
    click.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    click.connect(target);
    var cs = ctx.createBufferSource(); cs.buffer = engine.noise();
    cs.connect(click); cs.start(t); cs.stop(t + 0.04);
  } else if (drum === "snare") {
    amp.gain.setValueAtTime(vel * 0.7, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    noiseHit("highpass", 1400, 0.22);
    var body = ctx.createGain();
    body.gain.setValueAtTime(vel * 0.4, t);
    body.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    body.connect(target);
    var osc = ctx.createOscillator(); osc.type = "triangle";
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(140, t + 0.1);
    osc.connect(body); osc.start(t); osc.stop(t + 0.14);
  } else if (drum === "hihat") {
    amp.gain.setValueAtTime(vel * 0.32, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    noiseHit("highpass", 8200, 0.07);
  } else if (drum === "openhat") {
    amp.gain.setValueAtTime(vel * 0.3, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    noiseHit("highpass", 7200, 0.36);
  } else if (drum === "tom") {
    amp.gain.setValueAtTime(vel * 0.8, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    hit(200, 0.4, "sine", 90);
  } else if (drum === "crash") {
    amp.gain.setValueAtTime(vel * 0.3, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    noiseHit("highpass", 5200, 1.4, 0.4);
    noiseHit("bandpass", 9000, 1.2, 0.6);
  } else if (drum === "clap") {
    amp.gain.setValueAtTime(0.0001, t);
    [0, 0.012, 0.026].forEach(function (offset, i) {
      amp.gain.setValueAtTime(vel * (0.5 - i * 0.1), t + offset);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + offset + 0.04);
    });
    amp.gain.setValueAtTime(vel * 0.4, t + 0.04);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    noiseHit("bandpass", 1600, 0.25, 1.4);
  }

  setTimeout(function () { amp.disconnect(); }, Math.max(200, (t - ctx.currentTime + 2) * 1000));
}

function playClick(accent, time, volume) {
  var ctx = engine.ensure();
  var t = time || ctx.currentTime;
  var amp = ctx.createGain();
  amp.gain.setValueAtTime((volume || 0.5) * (accent ? 0.5 : 0.28), t);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  amp.connect(ctx.destination);
  var osc = ctx.createOscillator();
  osc.type = "square";
  osc.frequency.value = accent ? 1600 : 1100;
  osc.connect(amp); osc.start(t); osc.stop(t + 0.06);
  osc.onended = function () { amp.disconnect(); };
}

/* Ein Akkord, leicht versetzt angeschlagen - wie ein echter Gitarrenschlag. */
function strumChord(notes, o) {
  o = o || {};
  var ctx = engine.ensure();
  var t = o.time || ctx.currentTime;
  var spread = o.spread === undefined ? 0.022 : o.spread;
  var ordered = o.direction === "up" ? notes.slice().reverse() : notes;
  ordered.forEach(function (midi, i) {
    playPluck({
      track: o.track || "guitar",
      midi: midi,
      time: t + i * spread,
      velocity: (o.velocity === undefined ? 0.8 : o.velocity) * (1 - i * 0.06),
      duration: o.duration || 2.4
    });
  });
}

var transport = (function () {
  var listeners = [], stateListeners = [];
  var timer = null, nextStepTime = 0, step = 0, startTime = 0;

  var t = {
    bpm: 100,
    swing: 0,
    playing: false,
    loopLength: 0,
    subscribe: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (l) { return l !== fn; }); }; },
    onState: function (fn) { stateListeners.push(fn); },
    get stepDuration() { return 60 / t.bpm / 4; },
    get step() { return t.loopLength > 0 ? step % t.loopLength : step; },
    progress: function () {
      if (!t.playing || t.loopLength === 0) return 0;
      var elapsed = engine.now() - startTime;
      var loopSeconds = t.loopLength * t.stepDuration;
      return (elapsed % loopSeconds) / loopSeconds;
    },
    setBpm: function (bpm) { t.bpm = Math.max(40, Math.min(200, Math.round(bpm))); },
    start: function () {
      engine.ensure();
      if (t.playing) return;
      t.playing = true;
      step = 0;
      nextStepTime = engine.now() + 0.06;
      startTime = nextStepTime;
      tick();
      timer = setInterval(tick, 25);
      stateListeners.forEach(function (fn) { fn(); });
    },
    stop: function () {
      if (timer) { clearInterval(timer); timer = null; }
      t.playing = false;
      step = 0;
      engine.panic();
      stateListeners.forEach(function (fn) { fn(); });
    },
    toggle: function () { if (t.playing) t.stop(); else t.start(); }
  };

  /* Töne werden ein Stück in der Zukunft geplant - so bleibt der Takt exakt,
     auch wenn die Oberfläche gerade zu tun hat. */
  function tick() {
    var now = engine.now();
    while (nextStepTime < now + 0.12) {
      var position = t.loopLength > 0 ? step % t.loopLength : step;
      var offset = step % 2 === 1 ? t.swing * t.stepDuration : 0;
      for (var i = 0; i < listeners.length; i++) listeners[i](position, nextStepTime + offset);
      nextStepTime += t.stepDuration;
      step += 1;
    }
  }

  return t;
})();

/* ---------------------------------------------------------- Arrangeur ---- */

function chordForBar(song, bar) {
  var progression = STYLES[song.styleId].progression;
  var section = sectionAtBar(song, bar);
  var barInSection = bar % BARS_PER_SECTION;
  var degree = progression[barInSection % progression.length];
  if (section === "chorus" && barInSection === 0) degree = 0;
  return chordForDegree(degree, song.keyRoot, song.scale, 3);
}

function noteFromChord(chord, tone, octave) {
  var notes = chordNotes(chord);
  var index = ((tone % notes.length) + notes.length) % notes.length;
  var wrap = Math.floor(tone / notes.length);
  return notes[index] + 12 * ((octave || 0) + wrap);
}

function playMelodyLoop(loop, trackId, song, chord, stepInBar, time, stepDuration) {
  loop.notes.forEach(function (note) {
    if (note.step !== stepInBar) return;
    var duration = Math.max(0.08, note.len * stepDuration);
    var velocity = note.velocity === undefined ? 0.8 : note.velocity;
    var octave = note.octave || 0;

    if (trackId === "bass") {
      playBass({ track:"bass", midi: noteFromChord(chord, note.tone, octave) - 24, time:time, duration:duration, velocity:velocity });
      return;
    }
    if (trackId === "guitar") {
      strumChord(chordNotes(chord, octave), {
        track:"guitar", time:time, velocity:velocity,
        duration: Math.max(0.5, duration),
        direction: note.step % 8 >= 4 ? "up" : "down"
      });
      return;
    }
    var extra = trackId === "synth" ? 1 : 0;
    var notes = loop.mode === "chord"
      ? chordNotes(chord, octave + extra)
      : [noteFromChord(chord, note.tone, octave + extra)];

    notes.forEach(function (midi, i) {
      if (trackId === "synth") {
        playSynth({ track:"synth", midi: midi + 12, time:time, duration:duration,
                    velocity: velocity * 0.9, preset: song.tracks.synth.preset || "pad" });
      } else {
        playPiano({ track:"piano", midi: midi + 12, time: time + i * 0.004, duration:duration,
                    velocity:velocity, preset: song.tracks.piano.preset || "piano" });
      }
    });
  });
}

function scheduleSongStep(song, step, time, extras) {
  extras = extras || {};
  var totalBars = songBars(song);
  var bar = Math.floor(step / STEPS_PER_BAR) % totalBars;
  var stepInBar = step % STEPS_PER_BAR;
  var section = sectionAtBar(song, bar);
  var chord = chordForBar(song, bar);
  var stepDuration = 60 / song.bpm / 4;

  TRACK_IDS.forEach(function (id) {
    var track = song.tracks[id];
    if (extras.only && id !== extras.only) return;
    if (extras.skip && id === extras.skip) return;
    if (!track.enabled) return;
    /* In der Einzelvorschau läuft die Spur durchgehend - wer ein Instrument
       übt, wartet nicht erst das Intro ab. */
    if (!extras.only && !track.sections[section]) return;

/* Autokorrelation: sucht die Periode, die sich im Signal am stärksten wiederholt. */
function detectPitch(buffer, sampleRate) {
  var size = buffer.length, rms = 0, i;
  for (i = 0; i < size; i++) rms += buffer[i] * buffer[i];
  rms = Math.sqrt(rms / size);
  if (rms < 0.01) return null;

  var start = 0, end = size - 1, threshold = 0.2;
  while (start < size / 2 && Math.abs(buffer[start]) < threshold) start++;
  while (end > size / 2 && Math.abs(buffer[end]) < threshold) end--;

  var trimmed = buffer.slice(start, end);
  var length = trimmed.length;
  if (length < 256) return null;

  var c = new Float32Array(length);
  for (var lag = 0; lag < length; lag++) {
    var sum = 0;
    for (i = 0; i < length - lag; i++) sum += trimmed[i] * trimmed[i + lag];
    c[lag] = sum;
  }
  var d = 0;
  while (d < length - 1 && c[d] > c[d + 1]) d++;
  var maxValue = -1, maxLag = -1;
  for (lag = d; lag < length; lag++) {
    if (c[lag] > maxValue) { maxValue = c[lag]; maxLag = lag; }
  }
  if (maxLag <= 0) return null;

  var y1 = c[maxLag - 1] || 0, y2 = c[maxLag], y3 = c[maxLag + 1] || 0;
  var a = (y1 + y3 - 2 * y2) / 2, b = (y3 - y1) / 2;
  var shift = a ? -b / (2 * a) : 0;
  var freq = sampleRate / (maxLag + shift);
  if (freq < 60 || freq > 1400) return null;
  return freq;
}

function analyseFrames(frames, duration, bpm) {
  var voiced = frames.filter(function (f) { return f.freq !== null && f.level > 0.02; });
  var midis = voiced.map(function (f) { return freqToMidi(f.freq); });
  var sorted = midis.slice().sort(function (a, b) { return a - b; });
  var med = sorted.length ? sorted[Math.floor(sorted.length / 2)] : null;

  var stability = 0;
  if (midis.length > 4 && med !== null) {
    var deviation = midis.reduce(function (s, m) { return s + Math.abs(m - med); }, 0) / midis.length;
    stability = Math.round(Math.max(0, Math.min(100, 100 - deviation * 22)));
  }

  var levels = frames.map(function (f) { return f.level; });
  var avg = levels.length ? levels.reduce(function (a, b) { return a + b; }, 0) / levels.length : 0;
  var levelDev = levels.length ? levels.reduce(function (s, l) { return s + Math.abs(l - avg); }, 0) / levels.length : 0;
  var loudness = Math.round(Math.max(0, Math.min(100, 100 - (levelDev / Math.max(0.02, avg)) * 45)));

  var beat = 60 / bpm, onsets = [];
  for (var i = 1; i < frames.length; i++) {
    var rise = frames[i].level - frames[i - 1].level;
    if (rise > 0.045 && frames[i].level > 0.05) {
      if (!onsets.length || frames[i].time - onsets[onsets.length - 1] > 0.12) onsets.push(frames[i].time);
    }
  }
  var timing = 0;
  if (onsets.length) {
    var offsets = onsets.map(function (t) {
      var nearest = Math.round(t / (beat / 2)) * (beat / 2);
      return Math.abs(t - nearest);
    });
    var avgOffset = offsets.reduce(function (a, b) { return a + b; }, 0) / offsets.length;
    timing = Math.round(Math.max(0, Math.min(100, 100 - (avgOffset / (beat / 4)) * 100)));
  }

  return {
    duration: duration,
    medianMidi: med,
    noteName: med === null ? null : midiToName(Math.round(med)),
    lowestMidi: midis.length ? Math.round(Math.min.apply(null, midis)) : null,
    highestMidi: midis.length ? Math.round(Math.max.apply(null, midis)) : null,
    stability: stability,
    loudness: loudness,
    timing: timing,
    frames: frames
  };
}

function startRecording(bpm) {
  var ctx = engine.ensure();
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
  }).then(function (stream) {
    var source = ctx.createMediaStreamSource(stream);
    var analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);

    var recorder = new MediaRecorder(stream);
    var chunks = [];
    recorder.ondataavailable = function (e) { if (e.data.size > 0) chunks.push(e.data); };
    recorder.start(100);

    var frames = [], startedAt = ctx.currentTime;
    var sample = new Float32Array(analyser.fftSize);
    var live = { level: 0, freq: null };

    var timer = setInterval(function () {
      analyser.getFloatTimeDomainData(sample);
      var sum = 0;
      for (var i = 0; i < sample.length; i++) sum += sample[i] * sample[i];
      var level = Math.sqrt(sum / sample.length);
      var freq = detectPitch(sample, ctx.sampleRate);
      live = { level: level, freq: freq };
      frames.push({ time: ctx.currentTime - startedAt, freq: freq, level: level });
    }, 50);

    function cleanup() {
      clearInterval(timer);
      stream.getTracks().forEach(function (t) { t.stop(); });
      source.disconnect();
    }

    return {
      peek: function () { return live; },
      cancel: function () { if (recorder.state !== "inactive") recorder.stop(); cleanup(); },
      stop: function () {
        return new Promise(function (resolve, reject) {
          recorder.onstop = function () {
            cleanup();
            var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
            blob.arrayBuffer().then(function (ab) {
              return ctx.decodeAudioData(ab);
            }).then(function (buffer) {
              resolve({ buffer: buffer, analysis: analyseFrames(frames, buffer.duration, bpm) });
            }).catch(reject);
          };
          if (recorder.state !== "inactive") recorder.stop();
        });
      }
    };
  });
}

function playRecording(buffer, settings, onEnded) {
  var ctx = engine.ensure();
  var shape = PRESET_SHAPE[settings.preset];

  var source = ctx.createBufferSource();
  source.buffer = buffer;
  source.playbackRate.value = Math.pow(2, settings.pitch / 12);

  var low = ctx.createBiquadFilter();
  low.type = "lowshelf"; low.frequency.value = 220; low.gain.value = shape.low;
  var high = ctx.createBiquadFilter();
  high.type = "highshelf"; high.frequency.value = 3400;
  high.gain.value = shape.high + settings.brightness * 8;

  source.connect(low); low.connect(high);
  var tail = high;
  if (shape.comp) {
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -24; comp.ratio.value = 4;
    comp.attack.value = 0.006; comp.release.value = 0.2;
    high.connect(comp);
    tail = comp;
  }
  var dry = ctx.createGain();
  tail.connect(dry);
  dry.connect(engine.bus("voice"));

  engine.setSend("voice", "reverb", Math.min(1, shape.reverb + settings.reverb));
  engine.setSend("voice", "delay", Math.min(1, shape.echo + settings.echo));

  source.onended = function () { dry.disconnect(); if (onEnded) onEnded(); };
  source.start();
  return function () { try { source.stop(); } catch (e) {} };
}

        '<div style="min-width:0;flex:1">' +

            '<span style="font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px">' + esc(meta.label) + '</span>' +
            (t.enabled ? '<span class="chip">an</span>' : '<span class="chip chip-quiet">aus</span>') +
          '</div>';

    if (t.enabled) {
      html += '<div class="row" style="margin-top:8px;gap:12px">' +
        '<div style="width:160px">' + slider({ id:"vol-" + id, name:"track-volume", arg:id, value:t.volume, max:1.2, label:"Lautstärke", display:String(Math.round(t.volume * 100)) }) + '</div>' +

          }).join("") + '</select>' : '') +

    } else {
      html += '<p class="muted tiny" style="margin-top:4px">' +

    }

    html += '</div><div class="row" style="gap:6px;flex-wrap:nowrap">' +
      '<button class="icon-btn sm" data-act="mute" data-track="' + id + '" data-on="' + t.muted + '" aria-label="' + esc(meta.label) + ' stumm" title="Stumm">' +
        svg(t.muted ? ICON.volumeOff : ICON.volume, 15) + '</button>' +
      (variant === "pro" ? '<button class="icon-btn sm" data-act="solo" data-track="' + id + '" data-on="' + t.solo + '" title="Solo" aria-label="' + esc(meta.label) + ' solo" style="font-size:12px;font-weight:700">S</button>' : "") +
      (t.enabled ? '<button class="icon-btn sm" data-act="remove-track" data-track="' + id + '" title="Aus der Band nehmen" aria-label="' + esc(meta.label) + ' entfernen">' + svg(ICON.trash, 15) + '</button>' : "") +
      '</div></div>';

    if (variant === "pro" && t.enabled) {
      html += '<div class="grid g4" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)">' +
        slider({ id:"pan-" + id, name:"pan", arg:id, value:t.pan, min:-1, max:1, label:"Panorama",
                 display: t.pan === 0 ? "Mitte" : (t.pan < 0 ? Math.round(-t.pan * 100) + " links" : Math.round(t.pan * 100) + " rechts") }) +
        slider({ id:"rev-" + id, name:"reverb", arg:id, value:t.reverb, label:"Reverb", display: Math.round(t.reverb * 100) + " %" }) +
        slider({ id:"del-" + id, name:"delay", arg:id, value:t.delay, label:"Delay", display: Math.round(t.delay * 100) + " %" }) +
        slider({ id:"eq-" + id, name:"eq-high", arg:id, value:t.eq.high, min:-12, max:12, step:0.5, label:"Höhen",
                 display: (t.eq.high > 0 ? "+" : "") + t.eq.high.toFixed(0) + " dB" }) +

    return html + '</div>';

function loopBrowser(category) {
  var cats = [
    { id:"drums", label:"Drums", emoji:"🥁", track:"drums" },
    { id:"bass", label:"Bass", emoji:"🎸", track:"bass" },
    { id:"piano", label:"Piano", emoji:"🎹", track:"piano" },
    { id:"guitar", label:"Guitar", emoji:"🎸", track:"guitar" },
    { id:"synth", label:"Synth", emoji:"🎛️", track:"synth" },
    { id:"percussion", label:"Percussion", emoji:"🪘", track:null }
  ];
  var entry = cats.filter(function (c) { return c.id === category; })[0] || cats[0];
  var activeId = entry.track ? state.song.tracks[entry.track].loopId : state.song.percussion.loopId;
  var activeOn = entry.track ? state.song.tracks[entry.track].enabled : state.song.percussion.enabled;

  var tabs = cats.map(function (c) {
    return '<button class="btn btn-sm ' + (c.id === category ? "btn-primary" : "btn-ghost") +
      '" data-act="loop-cat" data-cat="' + c.id + '">' + c.emoji + " " + esc(c.label) + '</button>';
  }).join("");

  var cards = S.loopsFor(category).map(function (loop) {
    var on = activeId === loop.id && activeOn;
    var cells = [];
    for (var i = 0; i < 16; i++) cells.push(false);
    if (loop.steps) {
      Object.keys(loop.steps).forEach(function (drum) {
        for (var i = 0; i < 16; i++) if (S.hitVelocity(loop.steps[drum].charAt(i)) > 0) cells[i] = true;
      });
    } else {
      loop.notes.forEach(function (note) { if (note.step < 16) cells[note.step] = true; });
    }
    return '<button class="card acc-' + (entry.track || "drums") + (on ? " on" : "") +
      '" data-act="loop-pick" data-cat="' + category + '" data-loop="' + loop.id + '">' +
      '<div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;gap:10px">' +
        '<span><b>' + esc(loop.label) + '</b><span class="muted tiny" style="display:block;margin-top:3px">' + esc(loop.hint) + '</span></span>' +
        '<span style="flex-shrink:0;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;' +
        (on ? 'background:color-mix(in srgb,var(--accent) 80%,transparent);color:#0a0c15' : 'background:var(--surface-3);color:var(--muted)') + '">' +
        svg(on ? ICON.check : ICON.plus, 15) + '</span></div>' +
      '<div class="steps" style="margin-top:12px">' +
        cells.map(function (c) { return '<span class="step" data-on="' + c + '"></span>'; }).join("") +
      '</div></button>';
  }).join("");

  return '<div class="row" style="margin-bottom:16px">' + tabs + '</div>' +
    '<div class="grid g3">' + cards + '</div>' +
    '<p class="muted small" style="margin-top:16px">Mehrere Loops laufen gleichzeitig. Sie teilen sich Tempo und Tonart des Songs - deshalb passt jede Kombination zusammen.</p>';
}

function easyTimeline() {
  var bar = Math.floor(S.transport.step / S.STEPS_PER_BAR) % S.songBars(state.song);
  var current = S.SECTIONS[Math.floor(bar / S.BARS_PER_SECTION)];
  return '<div class="grid g4">' + S.SECTIONS.map(function (section, i) {
    var active = S.transport.playing && current && current.id === section.id;
    var chips = S.TRACK_IDS.filter(function (id) { return state.song.tracks[id].enabled; }).map(function (id) {
      var on = state.song.tracks[id].sections[section.id];
      return '<button class="btn btn-sm acc-' + id + ' ' + (on ? "btn-primary" : "btn-quiet") +
        '" data-act="section" data-track="' + id + '" data-section="' + section.id + '">' +
        S.TRACK_META[id].emoji + " " + esc(S.TRACK_META[id].label) + '</button>';
    }).join("");
    return '<div class="card' + (active ? " on" : "") + '" data-section-card="' + section.id + '">' +
      '<div class="row" style="justify-content:space-between"><span class="eyebrow">Teil ' + (i + 1) + '</span>' +
      (active ? '<span class="chip">läuft</span>' : '') + '</div>' +
      '<h3 style="margin-top:6px">' + esc(section.label) + '</h3>' +
      '<p class="muted tiny" style="margin-top:4px;min-height:34px">' + esc(section.hint) + '</p>' +
      '<div class="row" style="gap:6px;margin-top:10px">' + (chips || '<span class="muted tiny">Noch keine Instrumente.</span>') + '</div>' +
      '</div>';
  }).join("") + '</div>';
}

function proTimeline() {
  var song = state.song, bars = S.songBars(song);
  var now = Math.floor(S.transport.step / S.STEPS_PER_BAR) % bars;
  var secondsPerBar = 4 * 60 / song.bpm;

  var ruler = "";
  for (var b = 0; b < bars; b++) {
    ruler += '<span class="tiny muted-2 num" style="opacity:' + (b % 2 === 0 ? 1 : .35) + '">' +
      (b % 2 === 0 ? S.formatTime(b * secondsPerBar) : "&middot;") + '</span>';
  }

  var sectionBar = S.SECTIONS.map(function (section) {
    var active = S.transport.playing && S.sectionAtBar(song, now) === section.id;
    return '<div class="tiny" style="text-align:center;font-weight:700;padding:6px 0;border-radius:9px;border:1px solid var(--line);background:' +
      (active ? "color-mix(in srgb, var(--violet) 32%, var(--surface-2))" : "var(--surface-2)") + '">' + esc(section.label) + '</div>';
  }).join("");

  var rows = S.TRACK_IDS.map(function (id) {
    var track = song.tracks[id];
    var cells = "";
    for (var bar = 0; bar < bars; bar++) {
      var section = S.sectionAtBar(song, bar);
      var on = track.enabled && track.sections[section];
      cells += '<button class="tl-cell" data-act="cell" data-track="' + id + '" data-bar="' + bar +
        '" data-on="' + on + '" data-now="' + (S.transport.playing && bar === now) + '"' +
        ' aria-label="' + esc(S.TRACK_META[id].label) + ', Takt ' + (bar + 1) + '"></button>';
    }
    return '<div class="tl-row acc-' + id + '" style="margin-bottom:5px">' +
      '<div class="tl-name" style="opacity:' + (track.enabled ? 1 : .45) + '">' + S.TRACK_META[id].emoji + " " + esc(S.TRACK_META[id].label) + '</div>' +
      '<div class="tl-cells" style="grid-template-columns:repeat(' + bars + ',1fr)">' + cells + '</div></div>';
  }).join("");

  return '<div class="panel timeline-scroll"><div class="timeline">' +
    '<div class="tl-row" style="margin-bottom:8px"><span class="tl-name eyebrow">Time</span>' +
      '<div class="tl-cells" style="grid-template-columns:repeat(' + bars + ',1fr)">' + ruler + '</div></div>' +
    '<div class="tl-row" style="margin-bottom:12px"><span class="tl-name eyebrow">Struktur</span>' +
      '<div class="tl-cells" style="grid-template-columns:repeat(' + S.SECTIONS.length + ',1fr)">' + sectionBar + '</div></div>' +
    rows +
    '</div><p class="muted tiny" style="margin-top:12px">Klicken schaltet einen Abschnitt für diese Spur an oder aus. Die hervorgehobene Spalte zeigt, wo gerade gespielt wird.</p></div>';
}

function meter(label, value, hint) {
  var v = Math.max(0, Math.min(100, Math.round(value)));
  return '<div class="inset"><div class="row" style="justify-content:space-between;align-items:baseline">' +
    '<span class="small" style="font-weight:700">' + esc(label) + '</span>' +
    '<span class="meter-val">' + v + '</span></div>' +
    '<div class="bar"><i style="width:' + v + '%"></i></div>' +
    (hint ? '<p class="muted tiny" style="margin-top:7px">' + esc(hint) + '</p>' : '') + '</div>';
}

function pianoPanel() {
  var song = state.song;
  var octaves = 2, keys = [], whiteIndex = 0;
  for (var o = 0; o < octaves; o++) {
    for (var s = 0; s < 12; s++) {
      var midi = 12 * (piano.octave + o + 1) + s;
      var white = !S.isBlack(midi);
      keys.push({ midi: midi, white: white, whiteIndex: white ? whiteIndex : whiteIndex - 1 });
      if (white) whiteIndex++;
    }
  }
  keys.push({ midi: 12 * (piano.octave + octaves + 1), white: true, whiteIndex: whiteIndex });
  var whiteCount = whiteIndex + 1;
  var keyWidth = 100 / whiteCount;

  var melody = MELODIES.filter(function (m) { return m.id === piano.melodyId; })[0];
  var melodyNotes = melody ? melody.degrees.map(function (d) { return S.scaleDegree(d, song.keyRoot, song.scale, piano.octave); }) : [];
  var nextNote = melody ? melodyNotes[piano.melodyIndex] : null;

  var whites = keys.filter(function (k) { return k.white; }).map(function (k) {
    return '<button class="key key-white" data-play="piano" data-midi="' + k.midi + '"' +
      ' data-dim="' + (piano.easyPlay && !S.inScale(k.midi, song.keyRoot, song.scale)) + '"' +
      ' data-hint="' + (nextNote === k.midi) + '" data-down="false" aria-label="' + S.midiToName(k.midi) + '">' +
      (piano.showNames ? S.midiToName(k.midi, false) : "") + '</button>';
  }).join("");

  var blacks = keys.filter(function (k) { return !k.white; }).map(function (k) {
    return '<button class="key key-black" data-play="piano" data-midi="' + k.midi + '"' +
      ' data-dim="' + (piano.easyPlay && !S.inScale(k.midi, song.keyRoot, song.scale)) + '"' +
      ' data-hint="' + (nextNote === k.midi) + '" data-down="false" aria-label="' + S.midiToName(k.midi) + '"' +
      ' style="left:calc(' + ((k.whiteIndex + 1) * keyWidth) + '% - ' + (keyWidth * 0.3) + '%);width:' + (keyWidth * 0.6) + '%"></button>';
  }).join("");

  var presets = [["piano","Piano"],["electric","E-Piano"],["soft","Soft"],["synth","Synth"]].map(function (p) {
    return '<button class="btn btn-sm ' + (song.tracks.piano.preset === p[0] ? "btn-primary" : "btn-quiet") +
      '" data-act="piano-preset" data-preset="' + p[0] + '">' + p[1] + '</button>';
  }).join("");

  var melodyButtons = MELODIES.map(function (m) {
    return '<button class="btn btn-sm ' + (piano.melodyId === m.id ? "btn-primary" : "btn-ghost") +
      '" data-act="melody" data-melody="' + m.id + '">' + esc(m.label) + '</button>';
  }).join("");

  return '<div class="acc-piano">' +
    '<div class="row" style="margin-bottom:16px;gap:14px">' +
      '<div class="row" style="gap:8px"><span class="eyebrow">Oktave</span>' + stepper({ act:"octave", value: piano.octave, label:"Oktave" }) + '</div>' +
      '<div class="seg">' + presets + '</div>' +
      '<div style="width:150px">' + slider({ id:"pianoVol", name:"track-volume", arg:"piano", value: song.tracks.piano.volume, max:1.2, label:"Lautstärke" }) + '</div>' +
    '</div>' +
    '<div class="keyboard-wrap"><div class="keyboard"><div class="whites">' + whites + '</div>' + blacks + '</div></div>' +
    '<div class="row" style="margin-top:16px;gap:18px">' +
      '<button class="btn btn-sm ' + (piano.easyPlay ? "btn-primary" : "btn-quiet") + '" data-act="easyplay" aria-pressed="' + piano.easyPlay + '">' +
        (piano.easyPlay ? svg(ICON.check, 14) : "") + 'Easy Play - nur passende Töne</button>' +
      '<button class="btn btn-sm ' + (piano.showNames ? "btn-primary" : "btn-quiet") + '" data-act="notenames" aria-pressed="' + piano.showNames + '">Notennamen</button>' +
      (state.mode === "pro" ? '<span class="chip chip-quiet">Tonleiter: ' + esc(S.SCALES[song.scale].label) + '</span>' : '') +
    '</div>' +
    '<div class="inset" style="margin-top:18px">' +
      '<div class="row" style="gap:10px"><span class="small" style="font-weight:700">' + svg(ICON.spark, 15) + ' Zeig mir eine einfache Melodie</span>' +
        melodyButtons +
        (melody ? '<button class="btn btn-sm btn-ghost" data-act="play-melody">' + svg(ICON.play, 13, true) + 'Vorspielen</button>' : '') +
      '</div>' +
      '<p class="muted small" style="margin-top:12px">' +
        (melody ? 'Die leuchtende Taste ist als Nächstes dran - Ton ' + (piano.melodyIndex + 1) + ' von ' + melodyNotes.length + '. Kein Zeitdruck, die Melodie wartet auf dich.'
                : 'Am Computer kannst du auch die Tasten A-L spielen, W/E/T/Z/U sind die schwarzen. Pfeiltasten wechseln die Oktave.') +
      '</p></div></div>';
}

function drumPanel() {
  var song = state.song;
  var beats = S.DRUM_LOOPS.filter(function (l) { return l.category === "drums"; });
  var selected = beats.filter(function (l) { return l.id === song.tracks.drums.loopId; })[0] || beats[0];
  var cursor = S.transport.playing ? S.transport.step % 16 : -1;

  var pads = PADS.map(function (pad) {
    return '<button class="pad" data-play="drum" data-drum="' + pad.id + '" data-hit="false">' +
      '<span class="ring"></span><span class="pad-head"></span>' +
      '<span style="position:relative;display:block;font-size:19px;font-weight:700">' + esc(pad.label) + '</span>' +
      '<span class="muted tiny" style="position:relative;display:block;margin-top:2px">' + esc(pad.hint) + '</span>' +
      '<span class="muted-2 tiny" style="position:relative;display:block;margin-top:12px;letter-spacing:.08em">TASTE ' + pad.key + '</span></button>';
  }).join("");

  var rows = Object.keys(selected.steps).map(function (drum) {
    var cells = "";
    for (var i = 0; i < 16; i++) {
      cells += '<span class="step" data-on="' + (S.hitVelocity(selected.steps[drum].charAt(i)) > 0) +
        '" data-cursor="' + (cursor === i) + '" data-step="' + i + '"></span>';
    }
    return '<div class="seq-row"><span class="name">' + esc(drum) + '</span><div class="steps" style="flex:1">' + cells + '</div></div>';
  }).join("");

  return '<div class="acc-drums"><div class="grid g3">' + pads + '</div>' +
    '<div class="panel" style="margin-top:22px">' +
      '<div class="row-between" style="margin-bottom:16px">' +
        '<div><p class="eyebrow" style="margin-bottom:4px">Beat auswählen</p>' +
          '<h3>' + esc(selected.label) + '</h3><p class="muted small">' + esc(selected.hint) + '</p></div>' +
        '<button class="btn btn-primary" data-act="start-beat">' + svg(S.transport.playing ? ICON.pause : ICON.play, 17, true) +
        (S.transport.playing ? "Stopp" : "Beat starten") + '</button></div>' +
      '<div class="row">' + beats.map(function (l) {
        return '<button class="btn btn-sm ' + (l.id === selected.id ? "btn-primary" : "btn-ghost") +
          '" data-act="beat" data-loop="' + l.id + '">' + esc(l.label) + '</button>';
      }).join("") + '</div>' +
      '<div class="stack-sm" style="margin-top:18px;gap:8px">' + rows + '</div>' +
      '<div class="grid g2" style="margin-top:18px">' +
        slider({ id:"drumVol", name:"track-volume", arg:"drums", value: song.tracks.drums.volume, max:1.2, label:"Lautstärke Drums" }) +
        slider({ id:"swing", name:"swing", value: song.swing, max:0.5, label:"Swing - wie locker der Beat schwingt", display: Math.round(song.swing * 100) + " %" }) +
      '</div></div></div>';
}

function guitarPanel() {
  var song = state.song;
  var chords = [0, 4, 5, 3].map(function (d) { return S.chordForDegree(d, song.keyRoot, song.scale, 3); });
  var roles = ["Zuhause", "Spannung", "Nachdenklich", "Weich"];

  var buttons = chords.map(function (chord, i) {
    return '<button class="pad pad-center' + (i === guitar.selected ? " on" : "") + '" data-play="chord" data-chord="' + i + '" data-hit="false">' +
      '<span class="ring"></span>' +
      '<span style="font-size:26px;font-weight:700">' + esc(chord.name) + '</span>' +
      '<span class="muted-2 tiny" style="margin-top:4px">' + roles[i] + '</span></button>';
  }).join("");

  var strings = "";
  for (var i = 0; i < 6; i++) strings += '<span style="height:' + (1 + i * 0.35) + 'px"></span>';

  return '<div class="acc-guitar"><div class="grid g4">' + buttons + '</div>' +
    '<button class="pad strum pad-center" data-play="strum" data-hit="false" style="margin-top:16px">' +
      '<span class="ring"></span><span class="strings">' + strings + '</span>' +
      '<span style="position:relative;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px">' + svg(ICON.wave, 19) + ' Strummen</span>' +
      '<span class="muted small" style="position:relative;margin-top:4px">Drücken und halten - runter und rauf, wie bei einer echten Gitarre.</span></button>' +
    '<div class="inset row" style="margin-top:18px;gap:18px">' +
      '<button class="btn btn-sm ' + (guitar.autoStrum ? "btn-primary" : "btn-ghost") + '" data-act="autostrum" aria-pressed="' + guitar.autoStrum + '">' +
        (guitar.autoStrum ? svg(ICON.check, 14) : svg(ICON.plus, 14)) + 'Auto-Strum - der Rhythmus kommt von allein</button>' +
      '<div style="width:170px">' + slider({ id:"guitarVol", name:"track-volume", arg:"guitar", value: song.tracks.guitar.volume, max:1.2, label:"Lautstärke Gitarre" }) + '</div>' +
    '</div>' +
    '<p class="muted small" style="margin-top:16px">Diese vier Akkorde passen immer zusammen. Wechsle alle vier Schläge einen Akkord weiter - schon klingt es nach einem Lied.</p></div>';
}

function bassPanel() {
  var song = state.song;
  var zones = [
    { id:"low", label:"Tief", hint:"Der Boden. Ruhig und schwer.", base:0 },
    { id:"mid", label:"Mitte", hint:"Die Bewegung dazwischen.", base:3 },
    { id:"high", label:"Hoch", hint:"Kleine Melodien im Bass.", base:6 }
  ];
  var body = zones.map(function (zone) {
    var pads = "";
    for (var i = 0; i < 6; i++) {
      var midi = S.scaleDegree(zone.base + i, song.keyRoot, song.scale, 2) - 12;
      pads += '<button class="pad pad-center" data-play="bass" data-midi="' + midi + '" data-hit="false">' +
        '<span class="ring"></span><span style="font-size:16px;font-weight:700">' + S.midiToName(midi, false) + '</span>' +
        '<span class="muted-2 tiny" style="margin-top:3px">' + (i === 0 ? "Grundton" : "Stufe " + (i + 1)) + '</span></button>';
    }
    return '<div><div class="row" style="justify-content:space-between;margin-bottom:8px">' +
      '<span class="eyebrow">' + zone.label + '</span><span class="muted-2 tiny">' + esc(zone.hint) + '</span></div>' +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(90px,1fr))">' + pads + '</div></div>';
  }).join("");

  return '<div class="acc-bass"><div class="stack-sm" style="gap:18px">' + body + '</div>' +
    '<div class="grid g2" style="margin-top:22px">' +
      slider({ id:"bassVol", name:"track-volume", arg:"bass", value: song.tracks.bass.volume, max:1.2, label:"Lautstärke Bass" }) +
      '<p class="muted small" style="align-self:center">Tipp: Bleib oft auf dem Grundton links. Ein einziger tiefer Ton pro Takt trägt einen ganzen Song.</p>' +
    '</div></div>';
}

function synthPanel() {
  var song = state.song;
  var presets = [["pad","Fläche"],["pluck","Pluck"],["lead","Lead"],["bell","Glocke"]].map(function (p) {
    return '<button class="btn btn-sm ' + (song.tracks.synth.preset === p[0] ? "btn-primary" : "btn-quiet") +
      '" data-act="synth-preset" data-preset="' + p[0] + '">' + p[1] + '</button>';
  }).join("");

  var rows = "";
  for (var row = 0; row < 3; row++) {
    var cells = "";
    for (var col = 0; col < 8; col++) {
      var midi = S.scaleDegree(col, song.keyRoot, song.scale, 4 + (2 - row));
      cells += '<button class="pad pad-center" data-play="synth" data-midi="' + midi + '" data-row="' + row + '" data-hit="false"' +
        ' style="padding:18px 4px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) ' + (6 + (3 - row) * 7) + '%,var(--surface-2)),var(--surface))">' +
        '<span class="ring"></span><span class="tiny" style="font-weight:700;opacity:.8">' + S.midiToName(midi, false) + '</span></button>';
    }
    rows += '<div class="grid" style="grid-template-columns:repeat(8,1fr);gap:8px">' + cells + '</div>';
  }

  return '<div class="acc-synth"><div class="row" style="margin-bottom:16px;gap:14px"><div class="seg">' + presets + '</div>' +
    '<div style="width:150px">' + slider({ id:"synthVol", name:"track-volume", arg:"synth", value: song.tracks.synth.volume, max:1.2, label:"Lautstärke" }) + '</div></div>' +
    '<div class="stack-sm" style="gap:8px">' + rows + '</div>' +
    '<p class="muted small" style="margin-top:16px">Untere Reihe klingt dunkel und weich, obere hell und offen. Halte die Maus gedrückt und fahre über das Feld.</p></div>';
}

function voicePanel() {
  var v = state.voice;
  var song = state.song;
  var targetMidi = S.scaleDegree(voiceTarget, song.keyRoot, song.scale, 4);
  var recording = recorder !== null;

  var head = '<div class="card halo acc-voice" style="text-align:center">' +
    '<p class="eyebrow" style="margin-bottom:8px">Entdecke deine Stimme</p>' +
    '<h2>' + (recording ? "Ich höre zu." : "Bereit, wenn du es bist.") + '</h2>' +
    '<p class="muted small" style="margin:8px auto 0;max-width:34em">Summen reicht völlig. Es gibt hier kein Richtig und kein Falsch - nur deine Stimme und ein paar hilfreiche Anzeigen.</p>' +
    '<button class="btn ' + (recording ? "btn-ghost pulse" : "btn-primary") + '" data-act="record" style="margin-top:22px;width:210px;height:60px">' +
      svg(recording ? ICON.stop : ICON.mic, 21, recording) + (recording ? "Aufnahme beenden" : "Aufnehmen") + '</button>' +
    '<div style="max-width:420px;margin:22px auto 0">' +
      '<div class="bar" style="height:12px"><i id="liveLevel" style="width:0%"></i></div>' +
      '<div class="inset" style="margin-top:18px;text-align:left">' +
        '<div class="row" style="justify-content:space-between"><span class="muted small">Zielton</span>' +
          '<span class="row" style="gap:4px;flex-wrap:nowrap">' +
            '<button class="icon-btn sm" data-act="target" data-dir="-1" aria-label="Zielton tiefer">' + svg(ICON.left, 13) + '</button>' +
            '<span class="num" style="width:48px;text-align:center;font-weight:700">' + S.midiToName(targetMidi) + '</span>' +
            '<button class="icon-btn sm" data-act="target" data-dir="1" aria-label="Zielton höher">' + svg(ICON.right, 13) + '</button>' +
          '</span></div>' +
        '<div class="tuner"><span class="axis"></span><span class="center"></span><span class="dot" id="tunerDot" style="left:50%"></span></div>' +
        '<p class="muted tiny" id="tunerHint">Sing oder summe einen Ton - der Punkt zeigt, wo du gerade bist.</p>' +
      '</div>' +
      '<div style="margin-top:18px;display:flex;justify-content:center">' +
        '<button class="btn btn-sm ' + (state.metronome ? "btn-primary" : "btn-quiet") + '" data-act="metronome">Metronom beim Aufnehmen mitlaufen lassen</button>' +
      '</div>' +
    '</div>' +
    (state.voiceError ? '<p class="small" style="margin-top:16px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent)">' + esc(state.voiceError) + '</p>' : '') +
    '</div>';

  if (!v.buffer || !v.analysis) return '<div class="stack-sm acc-voice" style="gap:22px">' + head + '</div>';

  var a = v.analysis;
  function encouragement(value) {
    if (value >= 80) return "Sitzt richtig gut.";
    if (value >= 60) return "Schon sehr solide.";
    if (value >= 35) return "Da ist schon was da - dranbleiben lohnt sich.";
    return "Ein Anfang. Beim nächsten Mal wird es ruhiger.";
  }

  var bars = a.frames.filter(function (_, i) { return i % 2 === 0; }).map(function (f) {
    return '<span style="height:' + Math.max(4, Math.min(100, f.level * 420)) + '%;background:' +
      (f.freq === null ? "var(--surface-3)" : "color-mix(in srgb,var(--accent) 75%,transparent)") + '"></span>';
  }).join("");

  var presets = S.VOICE_PRESETS.map(function (p) {
    return '<button class="card' + (v.settings.preset === p.id ? " on" : "") + '" data-act="voice-preset" data-preset="' + p.id + '" style="padding:14px">' +
      '<span style="font-size:20px">' + p.emoji + '</span>' +
      '<b style="display:block;margin-top:5px">' + esc(p.label) + '</b>' +
      '<span class="muted tiny" style="display:block;margin-top:3px">' + esc(p.description) + '</span></button>';
  }).join("");

  var proSliders = state.mode === "pro" ? '<div class="grid g2" style="margin-top:20px">' +
      slider({ id:"vPitch", name:"voice-pitch", value: v.settings.pitch, min:-7, max:7, step:1, label:"Pitch - tiefer / höher", display: (v.settings.pitch > 0 ? "+" : "") + v.settings.pitch + " Halbtöne" }) +
      slider({ id:"vRev", name:"voice-reverb", value: v.settings.reverb, label:"Reverb - trocken / räumlich", display: Math.round(v.settings.reverb * 100) + " %" }) +
      slider({ id:"vEcho", name:"voice-echo", value: v.settings.echo, label:"Echo", display: Math.round(v.settings.echo * 100) + " %" }) +
      slider({ id:"vBright", name:"voice-bright", value: v.settings.brightness, min:-1, max:1, label:"Brightness - warm / hell",
               display: v.settings.brightness === 0 ? "neutral" : (v.settings.brightness > 0 ? "hell" : "warm") }) +
    '</div>'
    : '<p class="muted small" style="margin-top:16px">Im Pro Mode kannst du Tonhöhe, Hall, Echo und Klangfarbe einzeln einstellen.</p>';

  return '<div class="stack-sm acc-voice" style="gap:22px">' + head +
    '<div class="card"><div class="row-between" style="margin-bottom:18px">' +
      '<div><p class="eyebrow" style="margin-bottom:4px">Deine Aufnahme</p>' +
        '<h3 style="font-size:20px">' + a.duration.toFixed(1) + ' Sekunden' + (a.noteName ? ' &middot; rund um ' + a.noteName : '') + '</h3></div>' +
      '<div class="row" style="gap:8px">' +
        '<button class="btn btn-primary" data-act="play-recording">' + svg(ICON.play, 17, true) + 'Anhören</button>' +
        '<button class="btn btn-ghost" data-act="clear-recording">' + svg(ICON.trash, 15) + 'Verwerfen</button></div></div>' +
      '<div class="inset waveform">' + bars + '</div>' +
      '<div class="grid g4" style="margin-top:18px">' +
        meter("Deine Tonhöhe", a.medianMidi ? 100 : 0,
          a.noteName ? "Am häufigsten lagst du bei " + a.noteName +
            (a.lowestMidi && a.highestMidi ? " (" + S.midiToName(a.lowestMidi) + " bis " + S.midiToName(a.highestMidi) + ")" : "") + "."
            : "Noch kein klarer Ton erkannt - sing etwas länger.") +
        meter("Timing", a.timing, encouragement(a.timing)) +
        meter("Stimmstabilität", a.stability, encouragement(a.stability)) +
        meter("Lautstärke", a.loudness, encouragement(a.loudness)) +
      '</div></div>' +
    '<div class="card"><p class="eyebrow" style="margin-bottom:12px">Klangfarbe</p>' +
      '<div class="grid g3">' + presets + '</div>' + proSliders + '</div></div>';
}

views["#/instrument"] = function (slug) {
  var inst = INSTRUMENTS[slug];
  if (!inst) return views["#/instrumente"]();
  var panel = slug === "klavier" ? pianoPanel() : slug === "drums" ? drumPanel() :
              slug === "gitarre" ? guitarPanel() : slug === "bass" ? bassPanel() :
              slug === "synth" ? synthPanel() : voicePanel();

  return '<div class="stack-sm acc-' + inst.accent + '" style="gap:20px">' +
    '<div class="row" style="gap:14px">' +
      '<a class="icon-btn" href="#/instrumente" data-route="#/instrumente" aria-label="Zurück">' + svg(ICON.left, 17) + '</a>' +
      '<div><h1 style="font-size:28px">' + inst.emoji + ' ' + esc(inst.title) + '</h1>' +
      '<p class="muted small" style="margin-top:4px">' + esc(inst.hint) + '</p></div></div>' +
    (slug === "stimme" ? "" : accompaniment(inst.track)) +
    (slug === "stimme" ? panel : '<div class="card" style="padding:22px">' + panel + '</div>') +
    '<div class="row"><a class="btn btn-ghost" href="#/band" data-route="#/band">Instrument zur Band hinzufügen</a>' +
      '<a class="btn btn-quiet" href="#/studio" data-route="#/studio">Daraus einen Song bauen</a></div></div>';
};

views["#/band"] = function () {
  var song = state.song;
  var count = S.TRACK_IDS.filter(function (id) { return song.tracks[id].enabled; }).length;
  return '<div class="stack">' +
    '<div class="row-between"><div><p class="eyebrow" style="margin-bottom:8px">Meine Band</p>' +
      '<h1>' + (count === 0 ? "Wer soll mitspielen?" : count === 1 ? "Ein Mitspieler ist da." : count + " Instrumente spielen zusammen.") + '</h1>' +
      '<p class="muted" style="margin-top:10px;max-width:40em">Schalte Instrumente an und aus. Alle halten automatisch dasselbe Tempo und dieselbe Tonart.</p></div>' +
      '<button class="btn btn-primary" data-act="toggle-play">' + svg(S.transport.playing ? ICON.pause : ICON.play, 17, true) +
      (S.transport.playing ? "Pause" : "Band spielen lassen") + '</button></div>' +
    stage() +
    '<div class="panel"><div class="row" style="gap:26px">' +
      '<div><p class="eyebrow" style="margin-bottom:8px">Tempo</p>' + stepper({ act:"bpm", value: song.bpm, unit:"BPM", label:"Tempo" }) + '</div>' +
      '<div><p class="eyebrow" style="margin-bottom:8px">Stil</p><div class="row" style="gap:6px">' + styleChips(song.styleId) + '</div></div>' +
      '<div class="spread"><p class="eyebrow" style="margin-bottom:8px">Percussion dazu</p>' +
        '<button class="btn btn-sm ' + (song.percussion.enabled ? "btn-primary" : "btn-ghost") + '" data-act="percussion">' +
        svg(song.percussion.enabled ? ICON.check : ICON.plus, 14) + 'Shaker &amp; Claps</button></div>' +
    '</div></div>' +
    trackList(state.mode === "pro" ? "pro" : "easy") +
    '<div class="row"><button class="btn btn-ghost" data-act="save-project">' + svg(ICON.save, 15) + 'Als Projekt speichern</button>' +
      '<a class="btn btn-quiet" href="#/studio" data-route="#/studio">Weiter zum Song Builder</a>' +
      (state.saved ? '<span class="chip">' + esc(state.saved) + ' gespeichert</span>' : '') + '</div></div>';
};

views["#/voice"] = function () {
  return '<div class="stack-sm" style="gap:20px">' +
    '<div><p class="eyebrow" style="margin-bottom:8px">Meine Stimme</p><h1>Entdecke deine Stimme.</h1>' +
    '<p class="muted" style="margin-top:10px;max-width:40em">Aufnehmen, anhören, verändern. Die Anzeigen helfen dir beim Zuhören - bewertet wird hier nichts.</p></div>' +
    voicePanel() +
    '<p class="muted small">Deine Aufnahme kannst du in <a href="#/band" data-route="#/band" style="text-decoration:underline">Meine Band</a> als eigene Spur mitlaufen lassen.</p></div>';
};

views["#/studio"] = function () {
